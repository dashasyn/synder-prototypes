<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIMS · Grunddaten Editor</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: #FAFAF7; color: #14130F; font-size: 14px; line-height: 1.5;
  display: flex; height: 100vh; overflow: hidden;
}

/* ── Sidebar ─────────────────────────────────────────────── */
.sidebar { width: 216px; background: #14130F; flex-shrink: 0; display: flex; flex-direction: column; height: 100vh; }
.s-logo { padding: 18px 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.07); display: flex; align-items: center; gap: 10px; }
.s-logo-mark { width: 32px; height: 32px; background: #F0D000; display: flex; align-items: center; justify-content: center; font-family: monospace; font-weight: 900; font-size: 17px; color: #14130F; flex-shrink: 0; }
.s-logo-text { font-size: 14px; font-weight: 700; letter-spacing: 0.02em; color: #fff; }
.s-logo-sub { font-size: 9px; color: #6B6759; font-family: monospace; letter-spacing: 0.1em; text-transform: uppercase; }
.s-section { padding: 12px 0 4px; }
.s-section-label { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.1em; color: #5a5a4a; padding: 0 16px 6px; font-weight: 600; }
.nav-item { display: flex; align-items: center; gap: 9px; padding: 9px 16px; cursor: pointer; color: #9a9888; font-size: 13px; transition: background 0.1s, color 0.1s; user-select: none; }
.nav-item:hover { background: rgba(255,255,255,0.04); color: #fff; }
.nav-item.active { background: #F0D000; color: #14130F; font-weight: 600; }
.nav-item .ico { font-size: 15px; width: 18px; text-align: center; flex-shrink: 0; }
.s-footer { margin-top: auto; padding: 12px 16px; border-top: 1px solid rgba(255,255,255,0.06); color: #4a4a3a; font-size: 11px; }

/* ── Main ─────────────────────────────────────────────────── */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.topbar { display: flex; align-items: center; height: 50px; padding: 0 24px; border-bottom: 1px solid #E2E0D8; background: #fff; flex-shrink: 0; }
.breadcrumb { display: flex; align-items: center; gap: 5px; font-size: 13px; }
.bc-link { color: #6B6759; cursor: pointer; background: none; border: none; font: inherit; padding: 0; }
.bc-link:hover { color: #14130F; text-decoration: underline; }
.bc-sep { color: #C0BEB4; }
.bc-current { color: #14130F; font-weight: 500; }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.save-msg { font-size: 12px; color: #15803D; padding: 3px 10px; background: #F0FDF4; border: 1px solid #86EFAC; border-radius: 4px; opacity: 0; transition: opacity 0.25s; pointer-events: none; }
.save-msg.visible { opacity: 1; }
.content { flex: 1; overflow-y: auto; padding: 24px; }

/* ── Buttons ──────────────────────────────────────────────── */
.btn { display: inline-flex; align-items: center; gap: 5px; padding: 7px 13px; border-radius: 4px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; font-family: inherit; transition: filter 0.1s; user-select: none; white-space: nowrap; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-primary { background: #F0D000; color: #14130F; }
.btn-primary:hover { filter: brightness(0.94); }
.btn-outline { background: #fff; color: #14130F; border: 1px solid #D0CEC4; }
.btn-outline:hover { background: #F7F6F2; }
.btn-ghost { background: transparent; color: #6B6759; padding: 5px 8px; }
.btn-ghost:hover { background: #F4F3EE; color: #14130F; }
.btn-danger-ghost { background: transparent; color: #DC2626; padding: 5px 8px; border: none; font-family: inherit; font-size: 13px; cursor: pointer; border-radius: 4px; }
.btn-danger-ghost:hover { background: #FEF2F2; }
.btn-sm { padding: 4px 9px; font-size: 12px; }

/* ── Page header ──────────────────────────────────────────── */
.ph { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 20px; }
.ph h1 { font-size: 20px; font-weight: 700; }
.ph-sub { font-size: 13px; color: #6B6759; margin-top: 2px; }
.ph-right { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-shrink: 0; padding-top: 2px; }

/* ── Chips ────────────────────────────────────────────────── */
.chips { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 500; border: 1px solid; }
.chip-default { background: #F4F3EE; color: #6B6759; border-color: #E2E0D8; }
.chip-green { background: #F0FDF4; color: #15803D; border-color: #86EFAC; }
.chip-amber { background: #FFFBEB; color: #B45309; border-color: #FCD34D; }

/* ── Search ───────────────────────────────────────────────── */
.search-row { display: flex; gap: 8px; margin-bottom: 16px; }
.search-input { padding: 7px 11px; border: 1px solid #D0CEC4; border-radius: 4px; font-size: 13px; font-family: inherit; background: #fff; outline: none; width: 280px; }
.search-input:focus { border-color: #B0A800; box-shadow: 0 0 0 2px rgba(240,208,0,0.18); }

/* ── Table ────────────────────────────────────────────────── */
.tbl-wrap { background: #fff; border: 1px solid #E2E0D8; border-radius: 6px; overflow: hidden; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; padding: 9px 14px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: #6B6759; background: #F7F6F2; border-bottom: 1px solid #E2E0D8; }
td { padding: 11px 14px; font-size: 13.5px; border-bottom: 1px solid #F0EEE8; vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr.row-link { cursor: pointer; }
tr.row-link:hover td { background: #FAFAF5; }

/* ── Badges ───────────────────────────────────────────────── */
.badge { display: inline-flex; align-items: center; padding: 2px 7px; border-radius: 3px; font-size: 11px; font-weight: 600; border: 1px solid; white-space: nowrap; }
.b-id { background: #F4F3EE; color: #6B6759; border-color: #E2E0D8; font-family: monospace; font-size: 11.5px; }
.b-done { background: #F0FDF4; color: #15803D; border-color: #86EFAC; }
.b-partial { background: #FFFBEB; color: #B45309; border-color: #FCD34D; }
.b-empty { background: #FEF2F2; color: #DC2626; border-color: #FECACA; }
.b-snd { background: #EFF6FF; color: #1D4ED8; border-color: #BFDBFE; }
.b-xfer { background: #F5F3FF; color: #6D28D9; border-color: #DDD6FE; }
.b-spc { background: #FFF7ED; color: #C2410C; border-color: #FDBA74; }
.future-name { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 3px; font-size: 11px; background: #EFF6FF; color: #1D4ED8; border: 1px solid #BFDBFE; margin-left: 6px; }

/* ── Progress ─────────────────────────────────────────────── */
.prog { display: flex; align-items: center; gap: 7px; }
.prog-bar { width: 64px; height: 5px; background: #E2E0D8; border-radius: 3px; overflow: hidden; }
.prog-fill { height: 100%; border-radius: 3px; }

/* ── Cards ────────────────────────────────────────────────── */
.card { background: #fff; border: 1px solid #E2E0D8; border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
.card-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; border-bottom: 1px solid #F0EEE8; }
.card-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: #6B6759; }
.card-body { padding: 16px 18px; }

/* ── Form fields ──────────────────────────────────────────── */
.frow { display: flex; align-items: center; gap: 14px; padding: 9px 0; }
.frow + .frow { border-top: 1px solid #F7F6F2; }
.frow.top { align-items: flex-start; }
.flabel { font-size: 13px; color: #14130F; font-weight: 500; width: 160px; flex-shrink: 0; }
.flabel-sm { font-size: 13px; color: #14130F; font-weight: 500; }
.fval { flex: 1; }
input[type=text], input[type=number], input[type=date], select {
  padding: 6px 10px; border: 1px solid #D0CEC4; border-radius: 4px;
  font-size: 13.5px; font-family: inherit; background: #fff; outline: none; color: #14130F;
}
input[type=text]:focus, input[type=number]:focus, input[type=date]:focus, select:focus {
  border-color: #B0A800; box-shadow: 0 0 0 2px rgba(240,208,0,0.18);
}
input[type=number] { width: 90px; }
input[type=date] { width: 148px; }
select { min-width: 200px; }

/* Name change subrows */
.nc-row { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid #F7F6F2; }
.nc-row:last-child { border-bottom: none; }
.nc-empty { padding: 10px 0; color: #9A9888; font-size: 13px; font-style: italic; }

/* Directions */
.dir-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.dir-card { border: 1px solid #E2E0D8; border-radius: 5px; padding: 12px 14px; }
.dir-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #6B6759; margin-bottom: 8px; }
.dir-name { font-size: 13px; font-weight: 500; margin-bottom: 10px; }
.dir-field { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.dir-field label { color: #6B6759; width: 70px; flex-shrink: 0; }
.dir-field select { min-width: 0; flex: 1; }

/* Trigger points */
.trigger-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
.trigger-card { display: flex; align-items: center; gap: 8px; background: #F7F6F2; border: 1px solid #E2E0D8; border-radius: 4px; padding: 9px 12px; }
.trigger-lbl { font-size: 12px; color: #6B6759; font-weight: 500; width: 65px; }
.trigger-unit { font-size: 12px; color: #9A9888; }

/* Multi-file list */
.mf-list { display: flex; flex-direction: column; gap: 5px; }
.mf-item { display: inline-flex; align-items: center; gap: 6px; padding: 4px 8px; background: #F4F3EE; border: 1px solid #E2E0D8; border-radius: 3px; font-size: 12px; font-family: monospace; max-width: 300px; }
.mf-item button { background: none; border: none; color: #9A9888; cursor: pointer; font-size: 15px; line-height: 1; padding: 0 2px; }
.mf-item button:hover { color: #DC2626; }
.mf-add { display: flex; gap: 6px; margin-top: 8px; align-items: center; }
.mf-add select { min-width: 0; flex: 1; max-width: 240px; font-size: 13px; }

/* Checklists */
.chklist { border: 1px solid #E2E0D8; border-radius: 4px; overflow: hidden; }
.chk-item { display: flex; align-items: center; gap: 9px; padding: 9px 12px; border-bottom: 1px solid #F4F3EE; cursor: pointer; }
.chk-item:last-child { border-bottom: none; }
.chk-item:hover { background: #FAFAF5; }
.chk-item input[type=checkbox] { width: 14px; height: 14px; cursor: pointer; accent-color: #D0B000; flex-shrink: 0; }
.chk-lbl { font-size: 13.5px; flex: 1; }
.chk-sub { font-size: 11px; color: #9A9888; font-family: monospace; }

/* Divider */
.divider { height: 1px; background: #F0EEE8; margin: 12px 0; }
.section-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: #6B6759; margin-bottom: 10px; }

/* Upload area */
.upload-area { border: 2px dashed #D0CEC4; border-radius: 6px; padding: 24px; text-align: center; cursor: pointer; transition: border-color 0.15s, background 0.15s; background: #fff; margin-bottom: 16px; }
.upload-area:hover { border-color: #F0D000; background: #FDFDE8; }
.upload-ico { font-size: 26px; color: #9A9888; }
.upload-text { font-size: 13px; color: #6B6759; margin-top: 6px; }
.upload-hint { font-size: 11px; color: #B0AFA0; margin-top: 3px; }

/* Filter tabs */
.ftabs { display: flex; border: 1px solid #E2E0D8; border-radius: 4px; overflow: hidden; margin-bottom: 16px; width: fit-content; }
.ftab { padding: 6px 13px; font-size: 12px; font-weight: 500; cursor: pointer; color: #6B6759; background: #fff; user-select: none; border-right: 1px solid #E2E0D8; }
.ftab:last-child { border-right: none; }
.ftab.active { background: #F0D000; color: #14130F; }
.ftab:hover:not(.active) { background: #F4F3EE; }

/* Inline edit row for display texts */
.txt-edit { display: flex; gap: 6px; margin-top: 12px; align-items: center; background: #F7F6F2; padding: 10px 12px; border-radius: 5px; border: 1px solid #E2E0D8; }
.txt-edit input { flex: 1; }
</style>
</head>
<body>

<nav class="sidebar">
  <div class="s-logo">
    <div class="s-logo-mark">P</div>
    <div>
      <div class="s-logo-text">PIMS</div>
      <div class="s-logo-sub">RailML Grunddaten</div>
    </div>
  </div>
  <div class="s-section">
    <div class="s-section-label">Configuration</div>
    <div class="nav-item" data-view="stations" onclick="navigate('stations')">
      <span class="ico">≡</span> Stations
    </div>
    <div class="nav-item" data-view="sounds" onclick="navigate('sounds')">
      <span class="ico">♪</span> Sound Library
    </div>
    <div class="nav-item" data-view="texts" onclick="navigate('texts')">
      <span class="ico">☰</span> Display Texts
    </div>
  </div>
  <div class="s-footer">
    <div style="font-family:monospace">v3.4.1 · BVG J/JK</div>
    <div style="margin-top:3px;color:#3a3a2a">DV export: 04:00 daily</div>
  </div>
</nav>

<div class="main">
  <div class="topbar">
    <div class="breadcrumb" id="breadcrumb"></div>
    <div class="topbar-right">
      <div class="save-msg" id="save-msg">✓ Changes saved</div>
    </div>
  </div>
  <div class="content" id="content"></div>
</div>

<script>
// ── State ──────────────────────────────────────────────────
const state = { view: 'stations', selectedId: null, soundFilter: 'all' };

// ── Data ───────────────────────────────────────────────────
const soundFiles = [
  { id:'SND-001', filename:'alexanderplatz.mp3',        type:'station-name', size:'52 KB', uploaded:'2025-11-02', usedBy:1 },
  { id:'SND-002', filename:'hauptbahnhof.mp3',          type:'station-name', size:'61 KB', uploaded:'2025-11-02', usedBy:1 },
  { id:'SND-003', filename:'potsdamer_platz.mp3',       type:'station-name', size:'58 KB', uploaded:'2025-11-02', usedBy:1 },
  { id:'SND-004', filename:'brandenburger_tor.mp3',     type:'station-name', size:'72 KB', uploaded:'2025-11-02', usedBy:1 },
  { id:'SND-005', filename:'friedrichstrasse.mp3',      type:'station-name', size:'68 KB', uploaded:'2025-11-02', usedBy:1 },
  { id:'SND-006', filename:'zoologischer_garten.mp3',   type:'station-name', size:'74 KB', uploaded:'2025-11-02', usedBy:1 },
  { id:'SND-007', filename:'nollendorfplatz.mp3',       type:'station-name', size:'55 KB', uploaded:'2025-11-10', usedBy:0 },
  { id:'SND-010', filename:'umstieg_u2_u5_u8.mp3',      type:'transfer',     size:'89 KB', uploaded:'2025-11-15', usedBy:1 },
  { id:'SND-011', filename:'umstieg_u1_u3.mp3',         type:'transfer',     size:'72 KB', uploaded:'2025-11-15', usedBy:2 },
  { id:'SND-012', filename:'umstieg_sbahn.mp3',         type:'transfer',     size:'68 KB', uploaded:'2025-11-15', usedBy:3 },
  { id:'SND-013', filename:'umstieg_regional.mp3',      type:'transfer',     size:'81 KB', uploaded:'2025-11-20', usedBy:1 },
  { id:'SND-020', filename:'weiterfahrt_verzoegert.mp3',type:'special',      size:'95 KB', uploaded:'2025-12-01', usedBy:3 },
  { id:'SND-021', filename:'naechste_station_gesperrt.mp3', type:'special',  size:'88 KB', uploaded:'2025-12-01', usedBy:2 },
  { id:'SND-022', filename:'bitte_zuruecktreten.mp3',   type:'special',      size:'67 KB', uploaded:'2025-12-01', usedBy:0 },
  { id:'SND-023', filename:'tuer_schliesst.mp3',        type:'special',      size:'44 KB', uploaded:'2025-12-01', usedBy:4 },
];

const specialAnnouncements = [
  { id:'SPC-001', fileId:'SND-020', label:'Weiterfahrt verzögert sich' },
  { id:'SPC-002', fileId:'SND-021', label:'Nächste Station gesperrt' },
  { id:'SPC-003', fileId:'SND-022', label:'Bitte zurücktreten' },
  { id:'SPC-004', fileId:'SND-023', label:'Tür schließt' },
];

const displayTexts = [
  { id:'TXT-001', text:'Nicht einsteigen', usedBy:2 },
  { id:'TXT-002', text:'Sonderfahrt',      usedBy:4 },
  { id:'TXT-003', text:'Winterzug',        usedBy:3 },
  { id:'TXT-004', text:'Außer Betrieb',    usedBy:1 },
  { id:'TXT-005', text:'Weiterfahrt',      usedBy:5 },
];

const stations = [
  { id:'BVG-100', name:'Alexanderplatz',
    nameChanges:[{date:'2026-09-01', newName:'Alexanderplatz (Umbau)'}],
    directions:[{name:'Richtung Ruhleben', exitSide:'left'},{name:'Richtung Pankow', exitSide:'right'}],
    stationNameFile:'SND-001', transferFiles:['SND-010','SND-012'],
    specialAnnouncements:['SPC-001','SPC-004'], triggerArrival:150, triggerDeparture:80,
    displayTexts:['TXT-002','TXT-005'] },
  { id:'BVG-101', name:'Brandenburger Tor',
    nameChanges:[],
    directions:[{name:'Richtung Ruhleben', exitSide:'right'},{name:'Richtung Pankow', exitSide:'left'}],
    stationNameFile:'SND-004', transferFiles:[],
    specialAnnouncements:['SPC-002'], triggerArrival:120, triggerDeparture:80,
    displayTexts:['TXT-001'] },
  { id:'BVG-102', name:'Bundestag',
    nameChanges:[],
    directions:[{name:'Richtung Ruhleben', exitSide:'left'},{name:'Richtung Pankow', exitSide:'left'}],
    stationNameFile:'', transferFiles:[],
    specialAnnouncements:[], triggerArrival:0, triggerDeparture:0,
    displayTexts:[] },
  { id:'BVG-103', name:'Hauptbahnhof',
    nameChanges:[],
    directions:[{name:'Richtung Ruhleben', exitSide:'right'},{name:'Richtung Pankow', exitSide:'right'}],
    stationNameFile:'SND-002', transferFiles:['SND-012','SND-013'],
    specialAnnouncements:['SPC-001'], triggerArrival:180, triggerDeparture:100,
    displayTexts:['TXT-002','TXT-003'] },
  { id:'BVG-104', name:'Friedrichstraße',
    nameChanges:[],
    directions:[{name:'Richtung Ruhleben', exitSide:'left'},{name:'Richtung Pankow', exitSide:'right'}],
    stationNameFile:'SND-005', transferFiles:['SND-011','SND-012'],
    specialAnnouncements:['SPC-001','SPC-002'], triggerArrival:150, triggerDeparture:80,
    displayTexts:['TXT-001','TXT-002'] },
  { id:'BVG-105', name:'Potsdamer Platz',
    nameChanges:[{date:'2027-01-15', newName:'Potsdamer Platz (ERP)'}],
    directions:[{name:'Richtung Ruhleben', exitSide:'right'},{name:'Richtung Pankow', exitSide:'left'}],
    stationNameFile:'SND-003', transferFiles:['SND-012'],
    specialAnnouncements:['SPC-003'], triggerArrival:130, triggerDeparture:80,
    displayTexts:['TXT-005'] },
  { id:'BVG-106', name:'Zoologischer Garten',
    nameChanges:[],
    directions:[{name:'Richtung Ruhleben', exitSide:'left'},{name:'Richtung Pankow', exitSide:'right'}],
    stationNameFile:'SND-006', transferFiles:['SND-011'],
    specialAnnouncements:['SPC-001','SPC-004'], triggerArrival:140, triggerDeparture:80,
    displayTexts:['TXT-002','TXT-003','TXT-005'] },
  { id:'BVG-107', name:'Kurfürstendamm',
    nameChanges:[],
    directions:[{name:'Richtung Ruhleben', exitSide:'left'},{name:'Richtung Pankow', exitSide:'right'}],
    stationNameFile:'', transferFiles:[],
    specialAnnouncements:[], triggerArrival:0, triggerDeparture:0,
    displayTexts:[] },
  { id:'BVG-108', name:'Wittenbergplatz',
    nameChanges:[],
    directions:[{name:'Richtung Ruhleben', exitSide:'right'},{name:'Richtung Pankow', exitSide:'left'}],
    stationNameFile:'', transferFiles:[],
    specialAnnouncements:['SPC-004'], triggerArrival:120, triggerDeparture:80,
    displayTexts:[] },
  { id:'BVG-109', name:'Nollendorfplatz',
    nameChanges:[],
    directions:[{name:'Richtung Ruhleben', exitSide:'left'},{name:'Richtung Pankow', exitSide:'right'}],
    stationNameFile:'', transferFiles:[],
    specialAnnouncements:[], triggerArrival:0, triggerDeparture:0,
    displayTexts:[] },
];

// ── Helpers ────────────────────────────────────────────────
function snd(id) { return soundFiles.find(f => f.id === id); }
function sndName(id) { const f = snd(id); return f ? f.filename : '—'; }
function getStation(id) { return stations.find(s => s.id === id); }

function completeness(s) {
  let score = 0;
  if (s.stationNameFile) score++;
  if (s.directions[0].exitSide && s.directions[1].exitSide) score++;
  if (s.triggerArrival > 0) score++;
  if (s.triggerDeparture > 0) score++;
  return Math.round((score / 4) * 100);
}

// ── Navigation ─────────────────────────────────────────────
function navigate(v, id) {
  state.view = v;
  state.selectedId = id || null;
  render();
}

function setSoundFilter(f) {
  state.soundFilter = f;
  navigate('sounds');
}

// ── Render ─────────────────────────────────────────────────
function render() {
  // Sidebar active state
  document.querySelectorAll('.nav-item').forEach(el => {
    const v = el.dataset.view;
    el.classList.toggle('active', v === state.view || (state.view === 'detail' && v === 'stations'));
  });

  // Breadcrumb
  const bc = document.getElementById('breadcrumb');
  if (state.view === 'stations') {
    bc.innerHTML = `<span class="bc-current">Stations</span>`;
  } else if (state.view === 'detail') {
    const s = getStation(state.selectedId);
    bc.innerHTML = `<button class="bc-link" onclick="navigate('stations')">Stations</button>
      <span class="bc-sep">/</span><span class="bc-current">${s.name}</span>`;
  } else if (state.view === 'sounds') {
    bc.innerHTML = `<span class="bc-current">Sound Library</span>`;
  } else if (state.view === 'texts') {
    bc.innerHTML = `<span class="bc-current">Display Texts</span>`;
  }

  // Content
  const c = document.getElementById('content');
  if      (state.view === 'stations') c.innerHTML = renderStations();
  else if (state.view === 'detail')   c.innerHTML = renderDetail();
  else if (state.view === 'sounds')   c.innerHTML = renderSounds();
  else if (state.view === 'texts')    c.innerHTML = renderTexts();
}

// ── Stations list ──────────────────────────────────────────
function renderStations() {
  const done    = stations.filter(s => completeness(s) === 100).length;
  const partial = stations.filter(s => { const p = completeness(s); return p > 0 && p < 100; }).length;
  const empty   = stations.filter(s => completeness(s) === 0).length;

  const rows = stations.map(s => {
    const pct = completeness(s);
    const fillColor = pct === 100 ? '#22C55E' : pct > 0 ? '#F59E0B' : '#EF4444';
    const badge = pct === 100
      ? `<span class="badge b-done">Complete</span>`
      : pct > 0
      ? `<span class="badge b-partial">Incomplete</span>`
      : `<span class="badge b-empty">Not started</span>`;
    const future = s.nameChanges.length > 0
      ? `<span class="future-name">→ ${s.nameChanges[0].newName} <span style="opacity:0.6;font-size:10px">${s.nameChanges[0].date}</span></span>`
      : '';
    return `<tr class="row-link" onclick="navigate('detail','${s.id}')">
      <td><span class="badge b-id">${s.id}</span></td>
      <td>${s.name}${future}</td>
      <td><div class="prog"><div class="prog-bar"><div class="prog-fill" style="width:${pct}%;background:${fillColor}"></div></div><span style="font-size:12px;color:#6B6759">${pct}%</span></div></td>
      <td>${badge}</td>
      <td style="color:#9A9888;font-size:12px">→</td>
    </tr>`;
  }).join('');

  return `<div class="ph">
    <div><h1>Stations</h1><div class="ph-sub">${stations.length} stations · BVG J/JK</div></div>
  </div>
  <div class="chips">
    <span class="chip chip-default">● ${stations.length} total</span>
    <span class="chip chip-green">✓ ${done} complete</span>
    <span class="chip chip-amber">⚠ ${partial} incomplete</span>
    <span class="chip" style="background:#FEF2F2;color:#DC2626;border-color:#FECACA">✕ ${empty} not started</span>
  </div>
  <div class="search-row">
    <input class="search-input" type="text" placeholder="Search stations…" oninput="filterTable(this.value)">
  </div>
  <div class="tbl-wrap"><table>
    <thead><tr><th>ID</th><th>Station name</th><th>Completeness</th><th>Status</th><th></th></tr></thead>
    <tbody id="station-rows">${rows}</tbody>
  </table></div>`;
}

function filterTable(q) {
  document.querySelectorAll('#station-rows tr').forEach(tr => {
    tr.style.display = tr.textContent.toLowerCase().includes(q.toLowerCase()) ? '' : 'none';
  });
}

// ── Station detail ─────────────────────────────────────────
function renderDetail() {
  const s = getStation(state.selectedId);

  // Name changes
  const ncRows = s.nameChanges.length > 0
    ? s.nameChanges.map((nc, i) => `
        <div class="nc-row">
          <input type="date" value="${nc.date}" id="nc-date-${i}" style="width:148px">
          <span style="color:#9A9888">→</span>
          <input type="text" value="${nc.newName}" id="nc-name-${i}" placeholder="New station name" style="flex:1">
          <button class="btn-danger-ghost btn-sm" onclick="removeNameChange('${s.id}',${i})">✕</button>
        </div>`).join('')
    : `<div class="nc-empty">No scheduled name changes</div>`;

  // Directions
  const dirCards = s.directions.map((d, i) => `
    <div class="dir-card">
      <div class="dir-label">Direction ${i + 1}</div>
      <div class="dir-name">${d.name}</div>
      <div class="dir-field">
        <label>Exit side</label>
        <select id="dir-exit-${i}">
          <option value="left"  ${d.exitSide === 'left'  ? 'selected' : ''}>Left</option>
          <option value="right" ${d.exitSide === 'right' ? 'selected' : ''}>Right</option>
          <option value="both"  ${d.exitSide === 'both'  ? 'selected' : ''}>Both</option>
        </select>
      </div>
    </div>`).join('');

  // Station name file dropdown
  const stnNameOpts = soundFiles
    .filter(f => f.type === 'station-name')
    .map(f => `<option value="${f.id}" ${s.stationNameFile === f.id ? 'selected' : ''}>${f.filename}</option>`)
    .join('');

  // Transfer files
  const xferRows = s.transferFiles.length > 0
    ? s.transferFiles.map((fid, i) =>
        `<div class="mf-item">♪ ${sndName(fid)}<button onclick="removeTransfer('${s.id}',${i})" title="Remove">×</button></div>`
      ).join('')
    : `<span style="color:#9A9888;font-size:13px;font-style:italic">None assigned</span>`;

  const xferOpts = soundFiles
    .filter(f => f.type === 'transfer')
    .map(f => `<option value="${f.id}">${f.filename}</option>`)
    .join('');

  // Special announcements checklist
  const spcChecks = specialAnnouncements.map(sa => `
    <label class="chk-item">
      <input type="checkbox" ${s.specialAnnouncements.includes(sa.id) ? 'checked' : ''} data-spc="${sa.id}">
      <span class="chk-lbl">${sa.label}</span>
      <span class="chk-sub">${sndName(sa.fileId)}</span>
    </label>`).join('');

  // Display texts checklist
  const txtChecks = displayTexts.map(t => `
    <label class="chk-item">
      <input type="checkbox" ${s.displayTexts.includes(t.id) ? 'checked' : ''} data-txt="${t.id}">
      <span class="chk-lbl">${t.text}</span>
    </label>`).join('');

  return `
  <div class="ph">
    <div>
      <h1>${s.name}</h1>
      <div style="display:flex;gap:8px;align-items:center;margin-top:5px">
        <span class="badge b-id">${s.id}</span>
        <span style="font-size:12px;color:#9A9888">Identifier · read-only</span>
      </div>
    </div>
    <div class="ph-right">
      <button class="btn btn-outline" onclick="navigate('stations')">← Back</button>
      <button class="btn btn-primary" onclick="saveStation('${s.id}')">Save changes</button>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><span class="card-title">Station Name</span></div>
    <div class="card-body">
      <div class="frow">
        <span class="flabel">Current name</span>
        <div class="fval">
          <input type="text" id="station-name-input" value="${s.name}" style="width:240px">
        </div>
      </div>
      <div class="frow top">
        <span class="flabel" style="padding-top:4px">Scheduled changes</span>
        <div class="fval">
          <div id="nc-list">${ncRows}</div>
          <button class="btn btn-ghost btn-sm" style="margin-top:8px" onclick="addNameChange('${s.id}')">+ Schedule name change</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-head">
      <span class="card-title">Platform Directions</span>
      <span style="font-size:12px;color:#9A9888">Exit side per direction of travel</span>
    </div>
    <div class="card-body"><div class="dir-grid">${dirCards}</div></div>
  </div>

  <div class="card">
    <div class="card-head"><span class="card-title">Announcements</span></div>
    <div class="card-body">
      <div class="frow">
        <span class="flabel">Station name file</span>
        <div class="fval" style="display:flex;gap:6px;align-items:center">
          <select id="stn-name-file">
            <option value="">— not assigned —</option>
            ${stnNameOpts}
          </select>
          ${s.stationNameFile ? `<button class="btn btn-ghost btn-sm" onclick="alert('▶ ' + '${sndName(s.stationNameFile)}')">▶ Preview</button>` : ''}
        </div>
      </div>
      <div class="frow top">
        <span class="flabel" style="padding-top:4px">Transfer announcements</span>
        <div class="fval">
          <div class="mf-list" id="xfer-list">${xferRows}</div>
          <div class="mf-add">
            <select id="xfer-add-sel"><option value="">Add file…</option>${xferOpts}</select>
            <button class="btn btn-ghost btn-sm" onclick="addTransfer('${s.id}')">+ Add</button>
          </div>
        </div>
      </div>
      <div class="frow top">
        <span class="flabel" style="padding-top:4px">Special announcements</span>
        <div class="fval">
          <div class="chklist">${spcChecks}</div>
          <div style="font-size:11px;color:#9A9888;margin-top:5px">Selectable by operator on vehicle</div>
        </div>
      </div>
      <div class="divider"></div>
      <div class="section-label">Trigger Points</div>
      <div class="trigger-grid">
        <div class="trigger-card">
          <span class="trigger-lbl">Arrival</span>
          <input type="number" id="trigger-arrival" value="${s.triggerArrival}" min="0" max="999">
          <span class="trigger-unit">m before station</span>
        </div>
        <div class="trigger-card">
          <span class="trigger-lbl">Departure</span>
          <input type="number" id="trigger-departure" value="${s.triggerDeparture}" min="0" max="999">
          <span class="trigger-unit">m after station</span>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-head">
      <span class="card-title">Display Texts</span>
      <span style="font-size:12px;color:#9A9888">Outside display · selectable on vehicle</span>
    </div>
    <div class="card-body">
      <div class="chklist">${txtChecks}</div>
      <div style="font-size:11px;color:#9A9888;margin-top:6px">
        Manage predefined texts in <button class="bc-link" onclick="navigate('texts')" style="font-size:11px;color:#1D4ED8">Display Texts library</button>
      </div>
    </div>
  </div>`;
}

// Station detail actions
function addNameChange(id) {
  getStation(id).nameChanges.push({ date: '', newName: '' });
  navigate('detail', id);
}

function removeNameChange(id, idx) {
  getStation(id).nameChanges.splice(idx, 1);
  navigate('detail', id);
}

function addTransfer(id) {
  const sel = document.getElementById('xfer-add-sel');
  const s = getStation(id);
  if (sel.value && !s.transferFiles.includes(sel.value)) {
    s.transferFiles.push(sel.value);
    navigate('detail', id);
  }
}

function removeTransfer(id, idx) {
  getStation(id).transferFiles.splice(idx, 1);
  navigate('detail', id);
}

function saveStation(id) {
  const s = getStation(id);

  // Name
  const ni = document.getElementById('station-name-input');
  if (ni) s.name = ni.value.trim() || s.name;

  // Name changes
  const ncDates = document.querySelectorAll('[id^="nc-date-"]');
  const ncNames = document.querySelectorAll('[id^="nc-name-"]');
  s.nameChanges = [];
  ncDates.forEach((el, i) => {
    const d = el.value, n = ncNames[i] ? ncNames[i].value : '';
    if (d || n) s.nameChanges.push({ date: d, newName: n });
  });

  // Station name file
  const snf = document.getElementById('stn-name-file');
  if (snf) s.stationNameFile = snf.value;

  // Directions
  document.querySelectorAll('[id^="dir-exit-"]').forEach((el, i) => {
    if (s.directions[i]) s.directions[i].exitSide = el.value;
  });

  // Trigger points
  const ta = document.getElementById('trigger-arrival');
  const td = document.getElementById('trigger-departure');
  if (ta) s.triggerArrival = parseInt(ta.value) || 0;
  if (td) s.triggerDeparture = parseInt(td.value) || 0;

  // Special announcements
  s.specialAnnouncements = [];
  document.querySelectorAll('[data-spc]').forEach(cb => { if (cb.checked) s.specialAnnouncements.push(cb.dataset.spc); });

  // Display texts
  s.displayTexts = [];
  document.querySelectorAll('[data-txt]').forEach(cb => { if (cb.checked) s.displayTexts.push(cb.dataset.txt); });

  // Update breadcrumb name
  document.querySelector('.bc-current').textContent = s.name;

  // Show save confirmation
  const msg = document.getElementById('save-msg');
  msg.classList.add('visible');
  setTimeout(() => msg.classList.remove('visible'), 2500);
}

// ── Sound library ──────────────────────────────────────────
function renderSounds() {
  const f = state.soundFilter;
  const filtered = f === 'all' ? soundFiles : soundFiles.filter(sf => sf.type === f);
  const typeLabel = { 'station-name':'Station name', 'transfer':'Transfer', 'special':'Special' };
  const typeCls   = { 'station-name':'b-snd', 'transfer':'b-xfer', 'special':'b-spc' };

  const rows = filtered.map(sf => `
    <tr>
      <td style="font-family:monospace;font-size:13px">${sf.filename}</td>
      <td><span class="badge ${typeCls[sf.type]}">${typeLabel[sf.type]}</span></td>
      <td style="color:#6B6759">${sf.size}</td>
      <td style="color:#6B6759">${sf.uploaded}</td>
      <td style="color:#6B6759">${sf.usedBy} station${sf.usedBy !== 1 ? 's' : ''}</td>
      <td>
        <button class="btn btn-ghost btn-sm" onclick="alert('▶ Playing: ${sf.filename}')">▶</button>
        ${sf.usedBy === 0 ? `<button class="btn-danger-ghost btn-sm" onclick="alert('Delete: ${sf.filename}')">✕</button>` : ''}
      </td>
    </tr>`).join('');

  const tabData = [
    { val:'all', label:'All' },
    { val:'station-name', label:'Station names' },
    { val:'transfer', label:'Transfer' },
    { val:'special', label:'Special' },
  ];
  const tabs = tabData.map(t =>
    `<div class="ftab ${f === t.val ? 'active' : ''}" onclick="setSoundFilter('${t.val}')">${t.label}</div>`
  ).join('');

  return `
  <div class="ph">
    <div><h1>Sound Library</h1><div class="ph-sub">${soundFiles.length} files</div></div>
    <div class="ph-right">
      <button class="btn btn-primary" onclick="alert('Upload dialog')">↑ Upload file</button>
    </div>
  </div>
  <div class="upload-area" onclick="alert('Click to upload or drop .mp3 / .wav files')">
    <div class="upload-ico">♪</div>
    <div class="upload-text">Drop audio files here, or click to browse</div>
    <div class="upload-hint">Supported: .mp3, .wav · Max 5 MB per file</div>
  </div>
  <div class="ftabs">${tabs}</div>
  <div class="tbl-wrap"><table>
    <thead><tr><th>Filename</th><th>Type</th><th>Size</th><th>Uploaded</th><th>Used by</th><th></th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

// ── Display texts ──────────────────────────────────────────
function renderTexts() {
  const rows = displayTexts.map((t, i) => `
    <tr>
      <td><span class="badge b-id">${t.id}</span></td>
      <td style="font-weight:500">${t.text}</td>
      <td style="color:#6B6759">${t.usedBy} station${t.usedBy !== 1 ? 's' : ''}</td>
      <td>
        <button class="btn btn-ghost btn-sm" onclick="editText(${i})">Edit</button>
        ${t.usedBy === 0 ? `<button class="btn-danger-ghost btn-sm" onclick="deleteText(${i})">✕</button>` : ''}
      </td>
    </tr>`).join('');

  return `
  <div class="ph">
    <div>
      <h1>Display Texts</h1>
      <div class="ph-sub">Predefined texts for outside vehicle display</div>
    </div>
    <div class="ph-right">
      <button class="btn btn-primary" onclick="addText()">+ Add text</button>
    </div>
  </div>
  <p style="font-size:13px;color:#6B6759;margin-bottom:16px;max-width:560px">
    These texts are selectable by the operator on the vehicle for the outside display.
    They are assigned to stations in the station detail view.
  </p>
  <div class="tbl-wrap"><table>
    <thead><tr><th>ID</th><th>Display text</th><th>Used by</th><th></th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

function addText() {
  const text = prompt('Enter new display text:');
  if (text && text.trim()) {
    const id = 'TXT-' + String(displayTexts.length + 1).padStart(3, '0');
    displayTexts.push({ id, text: text.trim(), usedBy: 0 });
    navigate('texts');
  }
}

function editText(i) {
  const text = prompt('Edit display text:', displayTexts[i].text);
  if (text && text.trim()) { displayTexts[i].text = text.trim(); navigate('texts'); }
}

function deleteText(i) {
  if (confirm(`Delete "${displayTexts[i].text}"?`)) { displayTexts.splice(i, 1); navigate('texts'); }
}

// ── Boot ───────────────────────────────────────────────────
navigate('stations');
</script>
</body>
</html>
