<!DOCTYPE html>
<html lang="be">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Генератар раскладу прыпынку</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</head>
<body>

<header class="app-header">
  <div class="app-logo">А</div>
  <h1>Генератар раскладу аўтобуснага прыпынку</h1>
</header>

<div class="app-body">

  <div class="controls">

    <div class="field">
      <label class="toggle-label">
        <input type="checkbox" id="show-stop-name" checked>
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
        <span class="toggle-text">Паказваць назву прыпынку</span>
      </label>
    </div>

    <div class="field" id="stop-name-field">
      <label for="stop-name">Назва прыпынку</label>
      <input type="text" id="stop-name" placeholder="напр. Пятра Глебкі" autocomplete="off">
    </div>

    <div class="field">
      <label>Файлы маршрутаў <span class="label-hint">.xlsx — адзін файл на маршрут</span></label>
      <div class="drop-zone" id="drop-zone">
        <div class="drop-icon">↑</div>
        <div class="drop-text">Перацягніце файлы сюды або націсніце для выбару</div>
      </div>
      <input type="file" id="file-input" accept=".xlsx" multiple style="display:none">
      <div id="file-list"></div>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" id="preview-btn" disabled>Прагледзець</button>
      <button class="btn btn-ghost" id="print-btn" disabled>Надрукаваць / PDF</button>
    </div>

    <div class="templates">
      <div class="templates-label">Спампаваць прыклады (3 маршруты):</div>
      <div class="template-btns">
        <button class="btn-tpl" id="dl-exact">↓ Маршрут 100 — дакладны расклад</button>
        <button class="btn-tpl" id="dl-interval">↓ Маршрут 21 — інтэрвал (аўтобус)</button>
        <button class="btn-tpl" id="dl-troll">↓ Маршрут Т10 — інтэрвал (тралейбус)</button>
      </div>
    </div>

  </div>

  <div id="preview"></div>

</div>

<script src="app.js"></script>
</body>
</html>
