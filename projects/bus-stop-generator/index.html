<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Генератор расписания остановки</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</head>
<body>

<header class="app-header">
  <div class="app-logo">А</div>
  <h1>Генератор расписания автобусной остановки</h1>
</header>

<div class="app-body">

  <div class="controls">

    <div class="field">
      <input type="checkbox" id="show-stop-name" checked style="display:none">
      <label class="toggle-label checked" for="show-stop-name">
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
        <span class="toggle-text">Показывать название остановки</span>
      </label>
    </div>

    <div class="field" id="stop-name-field">
      <label for="stop-name">Название остановки</label>
      <input type="text" id="stop-name" placeholder="напр. Петра Глебки" autocomplete="off">
    </div>

    <div class="field">
      <label>Файлы маршрутов <span class="label-hint">.xlsx — один файл на маршрут</span></label>
      <div class="drop-zone" id="drop-zone">
        <div class="drop-icon">↑</div>
        <div class="drop-text">Перетащите файлы сюда или нажмите для выбора</div>
      </div>
      <input type="file" id="file-input" accept=".xlsx" multiple style="display:none">
      <div id="file-list"></div>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" id="preview-btn" disabled>Предпросмотр</button>
      <button class="btn btn-ghost" id="print-btn" disabled>Напечатать / PDF</button>
    </div>

    <div class="templates">
      <div class="templates-label">Скачать примеры (3 маршрута):</div>
      <div class="template-btns">
        <button class="btn-tpl" id="dl-exact">↓ Маршрут 100 — точное расписание</button>
        <button class="btn-tpl" id="dl-interval">↓ Маршрут 21 — интервал (автобус)</button>
        <button class="btn-tpl" id="dl-troll">↓ Маршрут 10 — интервал (троллейбус)</button>
      </div>
    </div>

  </div>

  <div id="preview"></div>

</div>

<script src="app.js"></script>
</body>
</html>
