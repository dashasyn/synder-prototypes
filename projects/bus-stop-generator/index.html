<!DOCTYPE html>
<html lang="be">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Генератар раскладу прыпынку</title>
<link rel="stylesheet" href="style.css">
<style id="print-size"></style>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</head>
<body>

<header class="app-header">
  <div class="app-logo">А</div>
  <h1>Генератар раскладу прыпынку</h1>
</header>

<div class="app-body">

  <div class="controls">

    <div class="field">
      <label class="toggle-label" for="show-stop-name">
        <input type="checkbox" id="show-stop-name" class="toggle-input" checked>
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
        <span class="toggle-text">Паказваць назву прыпынку</span>
      </label>
    </div>

    <div class="field" id="stop-name-field">
      <label for="stop-name">Назва прыпынку</label>
      <input type="text" id="stop-name" placeholder="напр. Пятра Глебкі" autocomplete="off">
    </div>

    <div class="field">
      <span class="field-label" id="paper-label">Аркуш</span>
      <div class="segmented" role="radiogroup" aria-labelledby="paper-label">
        <button type="button" role="radio" class="seg" data-paper="A3" aria-checked="true">A3</button>
        <button type="button" role="radio" class="seg" data-paper="A2" aria-checked="false">A2</button>
        <button type="button" role="radio" class="seg" data-paper="custom" aria-checked="false">Свой памер</button>
      </div>
      <div class="custom-size" id="custom-size" hidden>
        <label>Шырыня, мм <input type="number" id="custom-w" min="200" max="1000" value="360"></label>
        <label>Вышыня, мм <input type="number" id="custom-h" min="200" max="1000" value="500"></label>
      </div>
      <div class="field-error" id="custom-error" hidden>Ад 200 да 1000 мм</div>
    </div>

    <div class="field">
      <span class="field-label">Файлы маршрутаў <span class="label-hint">.xlsx — адзін файл на маршрут</span></span>
      <button type="button" class="drop-zone" id="drop-zone">
        <span class="drop-icon">↑</span>
        <span class="drop-text">Перацягніце файлы сюды або націсніце, каб выбраць</span>
      </button>
      <input type="file" id="file-input" accept=".xlsx" multiple hidden>
      <div id="file-list"></div>
    </div>

    <button class="btn btn-primary" id="print-btn" disabled>Захаваць у PDF</button>
    <div class="btn-reason" id="print-reason">Дадайце хаця б адзін маршрут без памылак</div>

    <div class="templates">
      <button class="btn btn-ghost" id="load-sample">Паказаць прыклад (3 маршруты)</button>
      <div class="templates-label">Спампаваць шаблоны</div>
      <div class="template-btns">
        <button class="btn-tpl" data-sample="exact">↓ Маршрут 100 — дакладны расклад</button>
        <button class="btn-tpl" data-sample="interval">↓ Маршрут 21 — інтэрвал (аўтобус)</button>
        <button class="btn-tpl" data-sample="troll">↓ Маршрут 10 — інтэрвал (тралейбус)</button>
      </div>
    </div>

  </div>

  <div id="preview">
    <div class="preview-empty" id="preview-empty">Дадайце файлы маршрутаў — расклад з'явіцца тут</div>
    <div class="sheet-meta" id="sheet-meta" hidden></div>
    <div class="sheet-frame" id="sheet-frame" hidden>
      <div class="sheet" id="sheet"><div class="sheet-sign" id="sheet-sign"></div></div>
    </div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
