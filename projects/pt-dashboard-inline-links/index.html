<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — Per Transaction · Inline links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../ui-kit/synder-ui-kit.css">
<style>
/* Recreation of the developed Per Transaction dashboard, from Ignat's three
   screenshots (2026-10-06). Layout only on top of the kit; every text is ≥14px. */
body { margin: 0; background: var(--bg-surface); color: var(--text-primary); font-family: var(--font-family); }

/* ---- prototype variant switch (not product chrome) ---- */
.variant-switch{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--color-grey);
  color:var(--color-white);padding:8px 20px;flex-shrink:0;font-size:14px}
.variant-switch .vs-label{font-weight:500;letter-spacing:.01em;opacity:.75;font-size:14px;
  text-transform:uppercase}
.variant-switch .vs-opts{display:flex;gap:4px;background:rgba(255,255,255,.1);
  border-radius:6px;padding:3px}
.variant-switch button{background:none;border:none;color:rgba(255,255,255,.7);
  font-family:inherit;font-size:14px;padding:5px 12px;border-radius:4px;cursor:pointer;
  white-space:nowrap}
.variant-switch button:hover{color:var(--color-white)}
.variant-switch button.on{background:var(--color-white);color:var(--text-primary);font-weight:500}

/* ---- shell ---- */
.shell { display: flex; min-height: 100vh; }
.sidebar { position: static; height: auto; border-right: 1px solid var(--border-nav); }
.sidebar-logo { font-size: 18px; color: var(--color-primary); font-weight: 700; padding: 18px 16px; border-bottom: 1px solid var(--color-sidebar-divider); }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar { position: static; justify-content: flex-end; font-size: 14px; }
.syncs-left a { color: var(--text-link); text-decoration: none; }
.content { padding: 20px 24px 40px; }

/* ---- page head ---- */
.ph { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.ph h1 { font-size: 24px; font-weight: 400; line-height: 32px; margin: 0; }
.ph select { width: 140px; }

.alert .alert-body { flex: 1; }
.alert .alert-ico { flex-shrink: 0; width: 20px; height: 20px; }
.alert .btn { margin-left: auto; flex-shrink: 0; }

/* ---- KPI band ---- */
.kpi-band { background: var(--color-grey-10); border-radius: var(--radius-sm); padding: 12px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; margin-bottom: 20px; }
.kpi { background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: var(--radius-sm); padding: 12px 12px 14px; }
.kpi.bad  { background: var(--color-red-light); border-color: var(--color-status-red-bg); }
.kpi.good { background: var(--color-green-light); border-color: var(--color-status-green-bg); }
.kpi-t { font-weight: 500; font-size: 14px; line-height: 20px; display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.kpi-v { font-size: 16px; line-height: 24px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.kpi-v .lnk { font-size: 14px; }

/* ---- columns ---- */
.cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; align-items: start; padding: 0 12px; }   /* same tracks as the KPI band inside its 12px frame */
.col { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.panel { background: var(--color-grey-10); border-radius: var(--radius-sm); padding: 12px; }
.panel-t { font-weight: 500; font-size: 14px; line-height: 20px; display: flex; align-items: center; gap: 6px; }
.panel-big { font-size: 17px; line-height: 24px; margin: 2px 0 10px; }
.panel-big .help { vertical-align: -2px; margin-left: 4px; }
.panel-big .n { color: var(--text-link); }
.panel-t + .box, .panel-t + .items { margin-top: 10px; }
.box { background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: var(--radius-sm); padding: 6px; }
.box.scroll { max-height: 236px; overflow-y: auto; }

/* rows inside a box: label left, count + chevron right; whole row is the link */
.row { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 27px; padding: 3px 6px; border: none; background: none; border-radius: var(--radius-sm); font: inherit; font-size: 14px; color: var(--text-primary); text-align: left; cursor: pointer; }
.row:hover { background: var(--bg-subtle); }
.row.hot { background: var(--color-red-light); }
.row.hot:hover { background: var(--color-status-red-bg); }
.row .lbl { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; }
.row .lbl .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .cnt { color: var(--text-link); display: inline-flex; align-items: center; gap: 4px; }
.row:focus-visible, .lnk:focus-visible, .icon-btn:focus-visible { outline: 2px solid var(--border-focus); outline-offset: 1px; }

/* accounting / integration cards */
.items { display: flex; flex-direction: column; gap: 10px; }
.item { background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: var(--radius-sm); padding: 10px 12px; }
.item.bad { background: var(--color-red-light); border-color: var(--color-status-red-bg); }
.item-h { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.item-h .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }

.lnk { background: none; border: none; padding: 0; font: inherit; font-size: 14px; color: var(--text-link); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.lnk:hover { text-decoration: underline; }
.icon-btn { background: none; border: none; padding: 2px; border-radius: var(--radius-sm); cursor: pointer; color: var(--text-secondary); display: inline-flex; }
.icon-btn:hover { background: var(--bg-hover); }

.logo { width: 18px; height: 18px; flex-shrink: 0; display: block; }
.chev { width: 16px; height: 16px; flex-shrink: 0; }

/* help "?" — tooltip copy is not captured, the marker says so */
.help { position: relative; display: inline-flex; color: var(--color-grey-30); cursor: help; }
.help svg { width: 16px; height: 16px; }
.help .tooltip { font-size: 14px; line-height: 20px; white-space: nowrap; font-weight: 400; max-width: none; }
.help:hover .tooltip, .help:focus .tooltip { opacity: 1; }

/* row menu */
.menu-wrap { position: relative; display: inline-flex; }
.menu-wrap .dropdown-menu { left: auto; right: 0; }
.dropdown-item.muted { color: var(--text-secondary); cursor: default; }
.dropdown-item.muted:hover { background: none; }

/* prototype toast */
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--color-grey); color: var(--color-white); padding: 10px 16px; border-radius: var(--radius-sm); font-size: 14px; box-shadow: var(--shadow-elevated); opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 200; }
.toast.show { opacity: 1; }
.variant-switch .vs-sep{width:1px;height:20px;background:rgba(255,255,255,.2)}

/* ---- Var 1: collapsed issues block (from Var 1 – Rich, iter3), kit colours ---- */
.issues { background: var(--color-red-light); border: 1px solid var(--color-status-red-bg); border-radius: var(--radius-sm); margin-bottom: 20px; }
.issues-head { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 16px; background: none; border: none; font: inherit; font-size: 14px; color: var(--color-red); cursor: pointer; text-align: left; border-radius: var(--radius-sm); }
.issues-head:hover { background: rgba(204,41,41,.04); }
.issues-head .t { font-weight: 500; flex: 1; }
.issues-bar { display: flex; align-items: center; gap: 12px; padding-right: 12px; }
.issues-bar .issues-head { flex: 1; }
.tw { width: 16px; height: 16px; flex-shrink: 0; transition: transform .15s; }
[aria-expanded="true"] > .tw { transform: rotate(90deg); }
.issues-body { padding: 0 16px 6px 42px; }
/* Rich-style row: red title, quieter red description, bridge link on the right */
.issue { display: flex; align-items: center; gap: 16px; padding: 10px 0; border-top: 1px solid var(--color-status-red-bg); }
.issue-txt { flex: 1; min-width: 0; color: var(--color-red); font-size: 14px; line-height: 20px; }
.issue-title { font-weight: 500; }
.issue-desc { opacity: .8; }
.issue .lnk { flex-shrink: 0; }
/* ---- Var 2: always-visible action list (from dashboard-variants D) ---- */
.acts { margin-bottom: 20px; display: flex; flex-direction: column; gap: 16px; }
.acts-t { font-size: 16px; font-weight: 500; line-height: 24px; margin: 0 0 8px; }
.act-list { display: flex; flex-direction: column; gap: 8px; }
.act { display: flex; align-items: center; gap: 14px; padding: 12px 16px; background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: var(--radius-sm); }
.act.req { border-left: 3px solid var(--color-red); }
.act-body { flex: 1; min-width: 0; font-size: 14px; line-height: 20px; }
.act-title { font-weight: 500; }
.act-desc { color: var(--text-secondary); }
.act .btn { flex-shrink: 0; }
.hdr-lnk { margin-left: auto; font-weight: 400; }
.issues-foot { border-top: 1px solid var(--color-status-red-bg); padding: 10px 0 4px; }
.acts-h { display: flex; align-items: baseline; gap: 12px; margin: 0 0 8px; }
.acts-h .acts-t { margin: 0; }
.related .row .lbl { flex: none; }
.related .row .meta { flex: 1; min-width: 0; text-align: right; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-new { margin-left: auto; }
/* Var 6 dashboard tabs */
.dash-tabs { padding: 0; margin: 0 0 20px; }
.dash-tabs .tab { background: none; border-left: none; border-right: none; border-top: none; font-family: inherit; }
.cols[hidden] { display: none; }
.dt-empty { border: 1px dashed var(--border-strong); border-radius: var(--radius-sm); padding: 48px; text-align: center; color: var(--text-secondary); font-size: 14px; }
.dt-issues { }
.dt-head { display: flex; align-items: center; margin-bottom: 10px; font-size: 14px; }
.dt-h { font-weight: 500; flex: 1; }
.dt-list { border-top: 1px solid var(--border-default); }
.dt-issue { display: flex; align-items: center; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--border-default); }
.dt-txt { flex: 1; min-width: 0; font-size: 14px; line-height: 20px; color: var(--color-red); }
.dt-title { font-weight: 500; }
.dt-desc { opacity: .8; }
.dt-issue .lnk { flex-shrink: 0; }
.ph-right { display: flex; align-items: center; gap: 12px; }
.ph-right .btn .status { margin-left: 6px; }
/* Var 2 Troubleshooting block */
#p-trouble .panel-t .tp-count { margin-left: 4px; }
.tp-box { margin-top: 10px; padding: 0 12px; }
.tp-box.bad { background: var(--color-red-light); border-color: var(--color-status-red-bg); }
.tp-row { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px 0; border-top: 1px solid var(--color-status-red-bg); }
.tp-row:first-child { border-top: none; }
.tp-txt { width: 100%; min-width: 0; font-size: 14px; line-height: 20px; color: var(--color-red); }
.tp-title { font-weight: 500; }
.tp-desc { opacity: .8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tp-row .lnk { flex-shrink: 0; }
.tp-more { padding: 8px 0 10px; font-size: 14px; color: var(--color-red); border-top: 1px solid var(--color-status-red-bg); }
.tp-ok { padding: 10px 0; font-size: 14px; color: var(--color-green); }
.tp-go { margin-top: 10px; }
/* Var 4 expandable inline findings: severity on the row only, cards stay as they are */
.fchip { margin-left: auto; }
.panel-t .hdr-lnk + .fchip { margin-left: 8px; }
.xf { margin: 10px 0 0; border: 1px solid; border-radius: var(--radius-sm); background: var(--bg-surface); }
.xf + .xf { margin-top: 8px; }
.panel-t + .xf { margin-top: 10px; }
.xf.sev-info { border-color: var(--color-primary-20); background: var(--color-primary-5); }
.xf.sev-warn { border-color: var(--color-status-yellow-bg); background: var(--color-yellow-light); }
.xf.sev-danger { border-color: var(--color-status-red-bg); background: var(--color-red-light); }
.xf-h { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 12px; background: none; border: none; font: inherit; font-size: 14px; font-weight: 500; color: var(--text-primary); text-align: left; cursor: pointer; }
.xf-h:focus-visible { outline: 2px solid var(--border-focus); outline-offset: -2px; }
.xf-ico svg { width: 18px; height: 18px; display: block; }
.sev-info .xf-ico { color: var(--color-primary); }
.sev-warn .xf-ico { color: var(--color-yellow); }
.sev-danger .xf-ico { color: var(--color-red); }
.xf-t { flex: 1; min-width: 0; }
.xf-tw { color: var(--text-secondary); }
.xf-b { padding: 0 12px 12px 38px; font-size: 14px; line-height: 20px; }
.xf-b p { margin: 0 0 8px; }
.xf-l { font-weight: 500; color: var(--text-secondary); margin-bottom: 2px; }
.xf-b ul { margin: 0 0 10px; padding-left: 18px; }
.xf-btns { display: flex; gap: 8px; }
.panel > .xf:last-of-type { margin-bottom: 10px; }
.panel-big + .xf { margin-top: 0; }
.sidebar-item.active .nav-new { background: var(--color-status-green-bg); }
/* ---- Troubleshooting page (from production screenshots 2026-10-16) ---- */
.ts-head { margin-bottom: 16px; }
.ts-head h1 { font-size: 24px; font-weight: 400; line-height: 32px; margin: 0 0 2px; }
.ts-tabs { padding: 0; margin-bottom: 20px; }
.ts-tabs .tab { background: none; border-left: none; border-right: none; border-top: none; font-family: inherit; }
.ts-intro { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; font-size: 14px; color: var(--text-secondary); }
.ts-intro .btn { margin-left: auto; }
.ts-intro .lnk { color: var(--text-link); }
.fpanel { background: var(--color-grey-10); border-radius: var(--radius-sm); padding: 12px; margin-bottom: 16px; }
.frow { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: flex-start; margin-bottom: 12px; }
.ff { display: flex; flex-direction: column; gap: 4px; }
.ff > label { font-size: 14px; font-weight: 500; line-height: 20px; }
.ff .input, .ff .select { height: 32px; font-size: 14px; background-color: var(--bg-surface); }
.ff .hint { font-size: 14px; color: var(--text-secondary); }
.frange { display: flex; align-items: center; gap: 6px; }
.fbtns { display: flex; gap: 12px; }
.ts-table { margin-bottom: 0; }
.ts-table .msg { max-width: 640px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ts-table th .help { vertical-align: -3px; margin-left: 2px; }
.ts-table th.sortq { cursor: pointer; user-select: none; }
.ts-table td.empty { text-align: center; color: var(--text-secondary); }
.ts-table .intg { display: inline-flex; align-items: center; gap: 6px; }
.ts-table th.actions, .ts-table td.actions { text-align: left; }
.ts-pager { display: flex; justify-content: flex-end; align-items: center; gap: 16px; padding: 10px 0; font-size: 14px; }
.ts-pager select { width: auto; height: 28px; padding-top: 0; padding-bottom: 0; }
.ts-pager .page-btn svg { width: 20px; height: 20px; }
.ts-info { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-secondary); margin-bottom: 16px; }
.ts-info svg { width: 16px; height: 16px; flex-shrink: 0; }
.ts-card { background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: var(--radius-sm); padding: 16px; margin-bottom: 20px; }
.ts-card h2 { font-size: 20px; font-weight: 400; line-height: 28px; margin: 0 0 4px; display: flex; align-items: center; gap: 6px; }
.ts-card .sub { font-size: 14px; color: var(--text-secondary); margin: 0 0 12px; }
.ts-card .frow { margin: 12px 0 16px; align-items: center; }
.ts-card .select { width: 170px; height: 32px; font-size: 14px; }
.ts-card .select.sm { width: 90px; }
.legend { display: flex; gap: 16px; font-size: 14px; margin-bottom: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
.chart svg { width: 100%; height: auto; display: block; }
.chart text { font-size: 14px; fill: var(--text-secondary); font-family: var(--font-family); }
.chart-missing { height: 160px; border: 1px dashed var(--border-strong); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; color: var(--text-secondary); font-size: 14px; }
.issues-head:focus-visible { outline: 2px solid var(--border-focus); outline-offset: 1px; }
</style>
</head>
<body>

<div class="variant-switch">
  <span class="vs-label">State</span>
  <div class="vs-opts">
    <button id="vs-attention" class="on" onclick="setState('attention')">1 · Needs attention</button>
    <button id="vs-clear" onclick="setState('clear')">2 · All clear</button>
    <button id="vs-lost" onclick="setState('lost')">3 · Connection lost</button>
  </div>
</div>

<div class="shell">
  <aside class="sidebar">
    <div class="sidebar-logo">Synder</div>
    <nav>
      <a class="sidebar-item active" href="#" id="nav-dashboard" data-nav="dash">Dashboard</a>
      <a class="sidebar-item" href="#">Transactions</a>
      <a class="sidebar-item" href="#">Smart rules</a>
      <a class="sidebar-item" href="#">Invoicing</a>
      <a class="sidebar-item" href="#">Analytics</a>
      <a class="sidebar-item" href="#" id="nav-troubleshooting" data-nav="trouble">Troubleshooting <span class="status status-green nav-new">New</span></a>
      <a class="sidebar-item" href="#">Business Insights (A)</a>
      <a class="sidebar-item" href="#">Revenue recognition</a>
      <a class="sidebar-item" href="#">AI Hub</a>
      <a class="sidebar-item" href="#">What's New</a>
      <a class="sidebar-item" href="#">Settings</a>
    </nav>
  </aside>

  <div class="main">
    <div class="topbar"><span class="syncs-left">Syncs left: <a href="#" id="syncs-left">1000</a></span></div>
    <div class="content">
     <div id="page-dash">
      <div class="ph">
        <h1>Hi Dalia, your data is ready to review</h1>
        <div class="ph-right"><span id="hdr-extra"></span>
        <select class="select" id="period" aria-label="Period">
          <option>Last 30 days</option>
          <option disabled>[live copy not captured]</option>
        </select></div>
      </div>
      <div id="banner"></div>
      <div class="kpi-band" id="kpis"></div>
      <div id="actions"></div>
      <div id="dtabs"></div>
      <div id="dtab-body"></div>
      <div class="cols">
        <div class="col" id="col-left"></div>
        <div class="col" id="col-mid"></div>
        <div class="col" id="col-right"></div>
      </div>
     </div>
     <div id="page-trouble" hidden>
      <div class="ts-head">
        <h1>Troubleshooting</h1>
        <p class="page-subtitle">View how your data is flowing and catch problems early.</p>
      </div>
      <div class="tabs ts-tabs" role="tablist">
        <button type="button" class="tab" role="tab" id="tab-sync" data-tab="sync">Synchronization issues</button>
        <button type="button" class="tab" role="tab" id="tab-import" data-tab="import">Import activity log</button>
        <button type="button" class="tab" role="tab" id="tab-speed" data-tab="speed">Sync speed</button>
      </div>
      <div id="ts-body"></div>
     </div>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---- icons (SVG, so no icon font is needed) ---- */
var ICON = {
  help: '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="currentColor"/><path d="M6.2 6.1a1.9 1.9 0 0 1 3.7.5c0 1.3-1.9 1.6-1.9 2.7" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/><circle cx="8" cy="11.6" r=".9" fill="#fff"/></svg>',
  chev: '<svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  dots: '<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="4.5" cy="10" r="1.6" fill="currentColor"/><circle cx="10" cy="10" r="1.6" fill="currentColor"/><circle cx="15.5" cy="10" r="1.6" fill="currentColor"/></svg>',

/* ---- Var 1: every problem on the page, as one collapsed Rich-style list ----
   Built from the same state data as the panels, so the block can't
   disagree with the columns underneath it. Plain sentences, no status chips.
   Connection rows collapse into ONE message, the way production's banner does. */
function issuesFor(s) {
  var out = [];
  var lostInts = s.integrations.filter(function (it) { return it.chips.some(function (c) { return c[0] === 'Connection lost'; }); });
  if (s.accounting === 'lost' || lostInts.length) out.push({ id: 'conn',
    title: 'Connection lost',
    desc: 'One or more of your integrations have lost connection. Please reconnect to continue syncing.',   /* live copy, production banner */
    action: 'Organization settings', go: 'Organization settings' });
  s.integrations.forEach(function (it, i) {
    var off = it.chips.filter(function (c) { return / off$/.test(c[0]); }).map(function (c) { return c[0].replace(/ off$/, ''); });
    if (!off.length) return;
    out.push({ id: 'off' + i, title: off.join(' and ') + (off.length > 1 ? ' are' : ' is') + ' off',
      desc: it.src.name + ' doesn\u2019t ' + off.map(function (x) { return x.replace('Auto-', '').toLowerCase(); }).join(' or ') + ' new transactions automatically.',
      action: 'Integration settings', go: 'Integration settings · ' + it.src.name });
  });
  /* every failed-transaction status collapses into ONE message. The count is the
     Needs attention card's number, so the block and the card can't disagree. */
  var FAILED = ['Failed', 'Rollback failed', 'Synced with rule failed', 'Not parsed'];
  var hit = s.sync.filter(function (r) { return FAILED.indexOf(r[0]) >= 0; }).map(function (r) { return r[0]; });
  if (hit.length) out.push({ id: 'txn', title: fmt(s.attention) + ' transactions need attention',
    desc: hit.map(function (x, i) { return i ? x.toLowerCase() : x; }).join(', ') + '.',
    action: 'View sync issues', go: 'Sync issues' });
  (s.revrec || []).forEach(function (r) {
    if (r[0] !== 'Incomplete') return;
    out.push({ id: 'rr', title: 'Revenue recognition incomplete', desc: fmt(r[1]) + ' items in Revenue recognition are incomplete.',
      action: 'Revenue recognition', go: 'Revenue recognition · Incomplete' });
  });
  return out;
}
function renderIssues(s) {
  var list = issuesFor(s);
  if (!list.length) return '';
  var rows = list.map(function (is) {
    return '<div class="issue" data-issue="' + is.id + '"><div class="issue-txt"><div class="issue-title">' + esc(is.title) + '</div>'
      + '<div class="issue-desc">' + esc(is.desc) + '</div></div>'
      + '<button type="button" class="lnk"' + go(is.go) + '>' + esc(is.action) + ICON.chev + '</button></div>';
  }).join('');
  return '<div class="issues" id="issues"><div class="issues-bar"><button type="button" class="issues-head" aria-expanded="false" aria-controls="issues-body" id="issues-head">'
    + ICON.chev.replace('class="chev"', 'class="tw"') + '<span class="t">' + list.length + ' issues found</span></button>'
    + '<button type="button" class="btn btn-error btn-sm" id="go-trouble"' + go('Troubleshooting') + '>Go to Troubleshooting</button></div>'
    + '<div class="issues-body" id="issues-body" hidden>' + rows + '</div></div>';
}

/* ---- Var 2: the same problems as Var 1, phrased as actions and always
   visible, plus optional next steps. Same source data, so Var 1 and Var 2
   never disagree about what's wrong. */
function actionsFor(s) {
  var req = issuesFor(s).map(function (is) {
    if (is.id === 'conn') return { id: 'conn', title: 'Reconnect lost connections', desc: is.desc, btn: 'Reconnect', go: 'Organization settings' };
    if (is.id === 'txn')  return { id: 'txn',  title: 'Review ' + fmt(s.attention) + ' transactions that need attention', desc: is.desc, btn: 'View sync issues', go: is.go };
    if (is.id === 'rr')   return { id: 'rr',   title: 'Complete revenue recognition', desc: is.desc, btn: 'Open Revenue recognition', go: is.go };
    return { id: is.id, title: 'Turn on ' + is.title.replace(/ (are|is) off$/, ''), desc: is.desc, btn: 'Open settings', go: is.go };
  });
  var next = [];
  s.sync.forEach(function (r) {
    if (r[0] === 'Ready to sync') next.push({ id: 'ready', title: 'Sync ' + fmt(r[1]) + ' ready transactions', desc: 'Imported and waiting to sync to your books.',
      btn: 'Sync now', go: 'Sync ' + fmt(r[1]) + ' ready transactions' });
  });
  next.push({ id: 'recon', title: 'Run Transaction reconciliation', desc: 'Check this period against your bank before you close it.',
    btn: 'Open reconciliation', go: 'Transaction reconciliation' });
  return { req: req, next: next };
}
function renderActions(s) {
  var a = actionsFor(s);
  function list(items, kind) {
    return '<div class="act-list">' + items.map(function (x) {

        + '<button type="button" class="btn btn-sm ' + (kind === 'req' ? 'btn-primary' : 'btn-outlined') + '"' + go(x.go) + '>' + esc(x.btn) + '</button></div>';
    }).join('') + '</div>';
  }
  return '<div class="acts" id="acts">'
    + (a.req.length ? '<section id="acts-req"><div class="acts-h"><h2 class="acts-t">Required actions</h2>' + '' + '</div>' + list(a.req, 'req') + '</section>' : '')
    + '<section id="acts-next"><h2 class="acts-t">Next actions</h2>' + list(a.next, 'next') + '</section></div>';
}

/* ---- Var 4: expandable inline findings, after pt-dashboard-inline (zip, 2026-10-16).

   Import + Sync copy is the zip's (its "Re-run Integrity check" steps dropped: no Integrity
   check here). Transactions + RevRec findings are ours. Hosts with Connection lost get none. */
var XF = {
  imp: { host: 'import', sev: 'info', title: 'Import activity issues',
    what: 'Import activity shows repeated failures or stalled pulls for one or more sources.',
    why: 'Stalled imports mean books lag behind the channel \u2014 recon and reports miss recent sales.',
    how: ['Open the Import activity log and identify failing sources.', 'Reconnect or re-authorize the channel if credentials expired.'],
    fix: 'Open import activity log', go: 'Import activity log' },
  slow: { host: 'sync', sev: 'warn', title: 'Syncs running slower than usual',
    what: 'Recent syncs are taking longer than usual for this org.',
    why: 'Slow syncs delay books updates and can pile up failures if left unchecked.',
    how: ['Review Sync speed insights for bottlenecks.', 'Reduce backlog (failed / in-progress) before large re-syncs.'],
    fix: 'Review sync speed', go: 'Sync speed' },
  txn: { host: 'sync', sev: 'danger', title: null,
    what: null,
    why: 'These transactions are not in your books until they are fixed.',
    how: ['Open Synchronization issues to see them grouped by error.', 'Fix the cause, then sync them again.'],
    fix: 'View sync issues', go: 'Sync issues' },
  rr: { host: 'revrec', sev: 'warn', title: null,
    what: null,
    why: 'Revenue schedules can\u2019t post until these are complete.',
    how: ['Open Revenue recognition and filter by Incomplete.', 'Complete the missing details.'],
    fix: 'Open Revenue recognition', go: 'Revenue recognition · Incomplete' }
};
var ignored = {};
function findingsFor(s) {
  var out = { import: [], sync: [], revrec: [] };
  function add(id, over) { if (ignored[id]) return; var f = {}; for (var k in XF[id]) f[k] = XF[id][k]; for (var k2 in (over || {})) f[k2] = over[k2]; f.id = id; out[f.host].push(f); }
  if (s.attention) { add('imp'); add('slow'); }
  issuesFor(s).forEach(function (is) {
    if (is.id === 'txn') add('txn', { title: is.title, what: is.desc.replace(/\.$/, '') + ' transactions in this period.' });
    if (is.id === 'rr') add('rr', { title: is.title, what: is.desc });
  });
  return out;
}

var lastSeries = [];
function lineChart(series, w) {
  lastSeries = series;
  var W = w || 1100, H = 260, L = 44, R = 44, T = 12, B = 30;
  var max = 0; series.forEach(function (s) { s.v.forEach(function (v) { if (v > max) max = v; }); });
  max = Math.max(4, Math.ceil(max / 4) * 4);
  var days = []; for (var i = 6; i >= 0; i--) { var d = new Date(Date.UTC(2026, 9, 7) - i * 86400000); days.push(MON[d.getUTCMonth()] + ' ' + d.getUTCDate() + ', 26'); }
  function x(i) { return L + i * (W - L - R) / 6; }
  function y(v) { return T + (H - T - B) * (1 - v / max); }
  var g = '';
  for (var k = 0; k <= 4; k++) { var yy = y(max * k / 4); g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '" stroke="#DFE4EC"/><text x="' + (L - 8) + '" y="' + (yy + 5) + '" text-anchor="end">' + (max * k / 4) + '</text>'; }
  days.forEach(function (d, i) { g += '<text x="' + x(i) + '" y="' + (H - 6) + '" text-anchor="middle">' + d + '</text>'; });
  var paths = series.map(function (s) {
    var pts = s.v.map(function (v, i) { return [x(i), y(v)]; }), dd = 'M' + pts[0][0] + ',' + pts[0][1];
    for (var i = 1; i < pts.length; i++) { var p0 = pts[i - 1], p1 = pts[i], cx = (p0[0] + p1[0]) / 2; dd += ' C' + cx + ',' + p0[1] + ' ' + cx + ',' + p1[1] + ' ' + p1[0] + ',' + p1[1]; }

  }).join('');

  t.textContent = 'Prototype — would open: ' + msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2600);
}
function closeMenus(except) {
  document.querySelectorAll('.dropdown-menu.show').forEach(function (m) {
    if (m !== except) {
      m.classList.remove('show');
      var b = document.querySelector('[data-menu="' + m.id + '"]');
      if (b) b.setAttribute('aria-expanded', 'false');
    }
  });
}
function toggle(btn, panel) {
  var open = btn.getAttribute('aria-expanded') !== 'true';
  btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  panel.hidden = !open;
  return open;
}
document.addEventListener('click', function (e) {
  var head = e.target.closest('#issues-head');
  if (head) {
    toggle(head, document.getElementById('issues-body'));
    return;
  }
  var dt = e.target.closest('[data-dtab]');
  if (dt) { dtab = dt.getAttribute('data-dtab'); render(current); return; }
  var xh = e.target.closest('.xf-h');
  if (xh) { toggle(xh, xh.parentElement.querySelector('.xf-b')); return; }
  var ig = e.target.closest('[data-ignore]');
  if (ig) { ignored[ig.getAttribute('data-ignore')] = 1; render(current); return; }
  var menuBtn = e.target.closest('[data-menu]');
  if (menuBtn) {
    var m = document.getElementById(menuBtn.getAttribute('data-menu'));
    closeMenus(m);
    var open = m.classList.toggle('show');
    menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    return;
  }
  if (!e.target.closest('.dropdown-menu')) closeMenus(null);
  var nav = e.target.closest('[data-nav]');
  if (nav) { e.preventDefault(); openPage(nav.getAttribute('data-nav'), nav.getAttribute('data-nav') === 'trouble' ? 'sync' : null); return; }
  var tab = e.target.closest('.ts-tabs [data-tab]');
  if (tab) { tsTab = tab.getAttribute('data-tab'); renderTrouble(); writeHash(); return; }
  var ap = e.target.closest('[data-apply]');
  if (ap) { readFilters(ap.getAttribute('data-apply')); renderTrouble(); return; }
  var rs = e.target.closest('[data-reset]');
  if (rs) { var t = rs.getAttribute('data-reset'), keep = tsf; resetTsFilters(); var fresh = tsf[t]; tsf = keep; tsf[t] = fresh; tsPage[t] = 0; renderTrouble(); return; }
  var pg = e.target.closest('[data-page]');
  if (pg) {
    var parts = pg.getAttribute('data-page').split(':'), tb = parts[0], dir = parts[1];
    if (dir === 'first') tsPage[tb] = 0; else if (dir === 'prev') tsPage[tb]--; else if (dir === 'next') tsPage[tb]++; else tsPage[tb] = 1e6;
    renderTrouble(); return;
  }
  if (e.target.closest('#si-sort')) { qtyDesc = !qtyDesc; renderTrouble(); return; }
  var g = e.target.closest('[data-go]');
  if (g) {
    e.preventDefault();
    var dest = g.getAttribute('data-go');
    if (ROUTES[dest]) { openPage('trouble', ROUTES[dest]); return; }
    toast(dest); return;
  }
  var a = e.target.closest('a[href="#"]');
  if (a) { e.preventDefault(); toast(a.textContent.trim()); }
});
document.addEventListener('change', function (e) {
  var r = e.target.closest('[data-rpp]');
  if (r) { var t = r.getAttribute('data-rpp'); tsRpp[t] = +r.value; tsPage[t] = 0; renderTrouble(); }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && e.target.closest('.fpanel input')) {
    var t = e.target.closest('#si-filters') ? 'sync' : 'import'; readFilters(t); renderTrouble(); return;
  }
  if (e.key === 'Escape') {
    var open = document.querySelector('.dropdown-menu.show');
    if (open) { closeMenus(null); var b = document.querySelector('[data-menu="' + open.id + '"]'); if (b) b.focus(); }
  }
});

function parseHash() {
  var m = /^#(?:v(\d)-)?(\w+)(?:\/(sync|import|speed))?$/.exec(location.hash || '');
  var v = m && m[1] ? +m[1] : 0;
  return { v: v >= 1 && v <= 6 ? v : 0, k: m && STATES[m[2]] ? m[2] : 'attention', t: m && m[3] ? m[3] : null };
}
window.addEventListener('hashchange', function () {
  var h = parseHash();
  if (h.k !== current) { current = h.k; sync(); }
  if ((h.t ? 'trouble' : 'dash') !== page || (h.t && h.t !== tsTab)) openPage(h.t ? 'trouble' : 'dash', h.t);
});
var h0 = parseHash();
current = h0.k; sync();
if (h0.t) openPage('trouble', h0.t);
