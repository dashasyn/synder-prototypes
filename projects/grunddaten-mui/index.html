<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIMS · Grunddaten Editor — React + MUI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  /* Deliberately almost empty. Everything below the switcher is MUI's own
     output — if a component needs CSS here, it is being fought rather than
     used. Layout goes through sx / Stack / Box. */
  html, body, #root { height: 100%; margin: 0; }

  /* The prototype frame: not product chrome, so it gets the only CSS. */
  .variant-switch{display:flex;align-items:center;gap:12px;background:#1b1b1b;
    color:#fff;padding:8px 20px;flex-shrink:0;font:400 13px Roboto,sans-serif}
  .variant-switch .vs-label{font-weight:500;letter-spacing:.01em;opacity:.75;font-size:12px;
    text-transform:uppercase;white-space:nowrap}
  .variant-switch .vs-opts{display:flex;gap:4px;background:rgba(255,255,255,.1);
    border-radius:6px;padding:3px;flex-shrink:0}
  .variant-switch button{background:none;border:none;color:rgba(255,255,255,.7);
    font-family:inherit;font-size:13px;padding:5px 12px;border-radius:4px;cursor:pointer;
    white-space:nowrap}
  .variant-switch button:hover{color:#fff}
  .variant-switch button.on{background:#fff;color:#1b1b1b;font-weight:500}
  .variant-switch .vs-note{opacity:.6;font-size:12px;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@mui/material@5/umd/material-ui.production.min.js" crossorigin></script>
<script src="https://unpkg.com/htm@3/dist/htm.umd.js" crossorigin></script>
<script src="i18n.js"></script>
<script src="data.js"></script>
<script src="ui.js"></script>
<script src="views-stations.js"></script>
<script src="views-lines-texts.js"></script>
<script src="views-audio.js"></script>
<script src="views-music.js"></script>
<script src="app.js"></script>
</body>
</html>
