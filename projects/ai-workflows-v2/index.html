<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Workflows v2 — one flow</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link rel="stylesheet" href="../../ui-kit/synder-ui-kit.css">
<!-- Page layout only. Sections = production /aiAgents look: white box, 1px border, 4px radius, 16px padding, no shadow. -->
<style>
  .aw-page { display: flex; flex-direction: column; gap: 16px; }
  .synder-page-header + .aw-page, .synder-page-header + .box { margin-top: 24px; }
  .aw-h { margin: 0; font-size: 16px; line-height: 24px; font-weight: 700; color: var(--text-primary); }
  .aw-h3 { margin: 0 0 4px; font-size: 14px; line-height: 20px; font-weight: 700; color: var(--text-primary); }
  .aw-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .aw-steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .aw-steps .box { display: block; }
  .aw-list { margin: 0; padding-left: 18px; }
  .aw-list li + li { margin-top: 4px; }
  .aw-agent { background: var(--color-white); border: 1px solid var(--border-default); border-radius: var(--radius-sm); overflow: hidden; }
  .aw-agent-head { display: flex; align-items: center; gap: 16px; padding: 16px; cursor: pointer; }
  .aw-agent-text { flex: 1; min-width: 0; }
  .aw-agent-title { display: flex; align-items: center; gap: 8px; font-size: 16px; line-height: 24px; font-weight: 700; color: var(--text-primary); }
  .aw-agent > table { border-top: 1px solid var(--border-default); }
  .aw-sec-num { color: var(--text-secondary); font-weight: 400; }
  .aw-examples { display: flex; flex-wrap: wrap; gap: 8px; }
  .aw-perm-row { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 12px 0; border-top: 1px solid var(--border-default); width: 100%; }
  .aw-perm-row:first-child { border-top: 0; padding-top: 0; }
  .aw-perm-line { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .aw-sub { padding: 0 0 0 32px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  .aw-row { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  .aw-grid3 { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
  .aw-dl { display: grid; grid-template-columns: 130px 1fr; row-gap: 12px; column-gap: 16px; margin: 0; }
  .aw-dl dt { font-weight: 700; color: var(--text-primary); }
  .aw-dl dd { margin: 0; }
  .aw-timeline { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .aw-tl { padding: 12px 16px; border: 1px solid var(--border-default); border-radius: var(--radius-sm); }
  .aw-tl--now { border-color: var(--color-primary); }
  .aw-tl--done { background: var(--color-grey-5); }
  .aw-summary { display: flex; gap: 32px; flex-wrap: wrap; }
  .aw-num { font-size: 20px; line-height: 28px; color: var(--text-primary); }
  .aw-actions { display: flex; gap: 8px; }
  .aw-nowrap { white-space: nowrap; }
  .aw-hidden { display: none !important; }
</style>
</head>
<body>
<div class="variant-switch">
  <span class="vs-label">Start</span>
  <div class="vs-opts">
    <button id="vs-1" onclick="setVariant(1)">1 · First visit, nothing set up</button>
    <button id="vs-2" onclick="setVariant(2)">2 · With workflows running</button>
  </div>
</div>
<div class="synder-app">
  <header class="topbar topbar--app">
    <div class="topbar-org"><span class="sidebar-org-avatar">AC</span><span class="topbar-org-name">Acme Corp</span><span class="material-icons">expand_more</span></div>
    <div class="topbar-right">
      <div class="topbar-balance"><span>Balance:</span> <b>10,000</b><span class="topbar-meter"><span style="width:96%"></span></span></div>
      <a class="topbar-link">How it works?</a>
      <button class="topbar-icon" aria-label="Notifications"><span class="material-icons">notifications</span></button>
      <button class="topbar-icon" aria-label="Help"><span class="material-icons">help_outline</span><span class="material-icons topbar-caret">expand_more</span></button>
      <button class="topbar-icon" aria-label="Account"><span class="material-icons">person</span><span class="material-icons topbar-caret">expand_more</span></button>
    </div>
  </header>
  <div class="synder-layout">
    <nav class="sidebar sidebar--notch" aria-label="Main">
      <a class="sidebar-item"><span class="material-icons">dashboard</span><span>Dashboard</span></a>
      <a class="sidebar-item sidebar-item--group"><span class="material-icons">swap_horiz</span><span>Transactions</span><span class="material-icons sidebar-chevron">expand_more</span></a>
      <a class="sidebar-item"><span class="material-icons">inventory_2</span><span>Inventory sync</span></a>
      <a class="sidebar-item sidebar-item--group"><span class="material-icons">rule</span><span>Smart rules</span><span class="material-icons sidebar-chevron">expand_more</span></a>
      <a class="sidebar-item active" href="#/"><span class="material-icons">android</span><span>AI workflows</span></a>
      <a class="sidebar-item"><span class="material-icons">track_changes</span><span>AI Hub</span></a>
      <a class="sidebar-item"><span class="material-icons">settings</span><span>Settings</span></a>
    </nav>
    <main class="synder-page" id="page"></main>
  </div>
</div>

<div class="modal-bg" id="dlg" onclick="if(event.target===this)closeDlg()">
  <div class="modal" id="dlg-box" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
    <div class="synder-modal-header" id="dlg-title"></div>
    <div class="synder-modal-body" id="dlg-body"></div>
    <div class="synder-modal-footer"><button class="btn-outlined" onclick="closeDlg()">Cancel</button><button id="dlg-ok"></button></div>
  </div>
</div>
<div class="synder-toast-stack" id="toasts" aria-live="polite"></div>

<script>
/* ===== Catalog: labels are the backend catalog descriptions (CapabilityCatalog.groovy) ===== */
const SYNDER_READ = ['Connected integrations of the organization', 'Transactions Synder imported, by provider ids, date, status, company', 'Synder syncs by status, company and sync date', 'One sync with its linked accounting records', 'Up to 100 syncs with their linked accounting records', 'Sync settings of an integration', 'Import runs of an integration', 'Transaction reconciliations with their summaries and results', 'Report lines of earlier runs of this task'];
const SYNDER_WRITE = ['Start a Synder sync of transactions', 'Start a rollback of a Synder sync', 'Start a resync of a Synder sync', 'Start an import of an integration', 'Ignore, un-ignore, match and unmatch transaction reconciliation results', 'Start a transaction reconciliation of an integration'];
const CONN = {
  qbo: { name: 'Acme Corp QuickBooks', provider: 'QuickBooks Online', logo: 'quickbooks', read: ['Read-only QuickBooks Online queries', 'Accounts of this accounting company', 'Tax codes of this accounting company'],
         write: 'Create or update QuickBooks Online records, never delete', types: ['Payment', 'Deposit', 'Sales receipt', 'Invoice', 'Journal entry', 'Refund receipt', 'Credit memo', 'Transfer', 'Customer', 'Vendor'] },
  stripe: { name: 'Acme Stripe', provider: 'Stripe', logo: 'stripe', read: ['Read-only Stripe API list and get calls'] },
  shopify: { name: 'acme-store', provider: 'Shopify', logo: 'shopify', read: ['One Shopify order', 'Shopify orders in a date range', 'One Shopify refund', 'One Shopify payout', 'Balance transactions of a Shopify payout'] }
};
const SCHED = ['Daily', 'Weekly', 'At month end', 'First working day of the month', 'On request'];
const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
const EXAMPLES = [
  ['Failed syncs report', 'Every Monday, email me the syncs that failed last week with the error and the integration.'],
  ['Apply Stripe payments', 'Every day, find Stripe payments that have an invoice number and apply them to the open invoices in QuickBooks.'],
  ['Unmatched payouts', 'Every morning, list yesterday’s Shopify payouts that have no matching deposit in QuickBooks.']
];
const PRIVACY = 'Synder does not share your business information with AI. Your transactions, balances and customers stay in Synder. AI only reads the task description you write.';
const ME = 'jane.doe@example.com';
const logo = k => `<img class="integration-logo" src="../../ui-kit/logos/${CONN[k].logo}-square.svg" alt="">`;
const emptyPerms = () => ({ sread: [], swrite: [], email: '', conns: {} });

/* ===== Fake data ===== */
const DATA = {
  allowance: 5, requested: false,
  agents: [
    { id: 1, name: 'Bookkeeping assistant', status: 'Active',
      perms: { sread: [0, 2, 3], swrite: [], email: ME, conns: { stripe: { read: [0] }, qbo: { read: [0, 1], write: { types: [3, 0], ops: ['create', 'update'], max: '5,000.00', perRun: '' } } } } },
    { id: 2, name: 'Shopify checker', status: 'Active', perms: { sread: [0, 1], swrite: [], email: ME, conns: { shopify: { read: [3, 4] } } } }
  ],
  tasks: [
    { id: 1, agent: 1, name: 'Failed syncs report', text: EXAMPLES[0][1], state: 'active', sched: 'Weekly', day: 'Monday', hour: '06:00', dry: false, next: 'Nov 23, 2026, 06:00',
      runs: [
        { id: 13, started: 'Nov 16, 2026, 06:00', period: 'Nov 9 – Nov 15, 2026', kind: 'Run', status: 'Succeeded', res: { done: 3, skipped: 0, attention: 0, failed: 0 }, changes: null, emailed: true },
        { id: 12, started: 'Nov 9, 2026, 06:00', period: 'Nov 2 – Nov 8, 2026', kind: 'Dry run', status: 'Succeeded', res: { done: 2, skipped: 0, attention: 0, failed: 0 }, changes: null }
      ] },
    { id: 2, agent: 1, name: 'Apply Stripe payments', text: EXAMPLES[1][1], state: 'active', sched: 'Daily', day: 'Monday', hour: '06:00', dry: true, next: 'Nov 21, 2026, 06:00',
      runs: [ { id: 21, started: 'Nov 20, 2026, 09:12', period: 'Oct 21 – Nov 19, 2026', kind: 'Check', status: 'Succeeded', res: { done: 14, skipped: 3, attention: 1, failed: 0 }, changes: null } ] },
    { id: 3, agent: 2, name: 'Unmatched payouts', text: EXAMPLES[2][1], state: 'failed', sched: 'Daily', day: 'Monday', hour: '07:00', dry: true, next: null,
      reason: 'This task needs permissions the agent does not have: Read-only QuickBooks Online queries (quickbooks.query). It must look up deposits in QuickBooks to match them with payouts. Add them on the agent page, then save the task again.', missing: 'qbo', runs: [] },
    { id: 4, agent: 2, name: 'Month-end refunds summary', text: 'At month end, email me a summary of Shopify refunds by reason.', state: 'preparing', sched: 'At month end', day: 'Monday', hour: '06:00', dry: true, next: null, runs: [] },
    { id: 5, agent: 1, name: 'Deposit fee check', text: 'Every week, check that Stripe deposits in QuickBooks have the fee line.', state: 'support', sched: 'Weekly', day: 'Friday', hour: '09:00', dry: true, next: null, runs: [] }
  ]
};
const REPORT = {
  13: { lines: [['Done', 'Sync #48213 · Charge ch_3Q9x', 'Customer not found in QuickBooks'], ['Done', 'Sync #48207 · Refund re_1Lk2', 'Account is inactive'], ['Done', 'Sync #48190 · Payout po_7Hd1', 'Deposit already exists']], records: [] },
  21: { lines: [['Done', 'Payment pi_3QA1 · 1,204.35', 'Would apply to Invoice 1043'], ['Done', 'Payment pi_3QA4 · 89.00', 'Would apply to Invoice 1051'], ['Skipped', 'Payment pi_3QB0 · 12.00', 'No invoice number in the description'], ['Needs attention', 'Payment pi_3QB7 · 7,450.00', 'Above the largest amount the agent may write (5,000.00)']], records: [] },
  22: { lines: [['Done', 'Payment pi_3QC2 · 2,310.00', 'Applied to Invoice 1060'], ['Done', 'Payment pi_3QC5 · 640.50', 'Applied to Invoice 1062']],
        records: [['Payment', '1874', 'pi_3QC2', '2,310.00', 'Created'], ['Payment', '1875', 'pi_3QC5', '640.50', 'Created']] }
};

const params = new URLSearchParams(location.search);
let variant = params.get('state') === 'filled' ? 2 : 1;
let S;
function seed() { S = JSON.parse(JSON.stringify(DATA)); if (variant === 1) { S.agents = []; S.tasks = []; S.allowance = 1; } }
seed();
function setVariant(n) { variant = n; seed(); document.querySelectorAll('.variant-switch button').forEach((b, i) => b.classList.toggle('on', i + 1 === n)); if (location.hash && location.hash !== '#/') location.hash = '#/'; else render(); }

/* ===== Helpers ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const agentById = id => S.agents.find(a => a.id === +id);
const taskById = id => S.tasks.find(t => t.id === +id);
const tasksOf = id => S.tasks.filter(t => t.agent === +id);
const go = h => { location.hash = h; };
const STATE = {
  preparing: ['Preparing', 'status-blue'], support: ['Being finished', 'status-blue'], active: ['Active', 'status-green'],
  failed: ['Failed', 'status-red'], paused: ['Paused', 'status-grey'], review: ['Review requested', 'status-yellow']
};
const chip = (label, cls) => `<span class="status ${cls}">${esc(label)}</span>`;
const taskChip = t => { const s = STATE[agentById(t.agent).status === 'Disabled' && t.state === 'active' ? 'paused' : t.state]; return chip(s[0], s[1]); };
const RUNCHIP = { Succeeded: 'status-green', 'Succeeded with warnings': 'status-yellow', Failed: 'status-red', Running: 'status-blue' };
function schedText(t) {
  if (t.sched === 'On request') return 'On request';
  if (t.sched === 'Weekly') return `Weekly, ${t.day} at ${t.hour}`;
  return `${t.sched} at ${t.hour}`;
}
/* Honest go-live dates (today = Fri Nov 20, 2026) */
const FIRST = { Daily: ['Nov 21', 'Nov 22'], Weekly: { Monday: ['Nov 23', 'Nov 30'], Tuesday: ['Nov 24', 'Dec 1'], Wednesday: ['Nov 25', 'Dec 2'], Thursday: ['Nov 26', 'Dec 3'], Friday: ['Nov 27', 'Dec 4'], Saturday: ['Nov 21', 'Nov 28'], Sunday: ['Nov 22', 'Nov 29'] },
  'At month end': ['Dec 1', 'Jan 1'], 'First working day of the month': ['Dec 1', 'Jan 1'] };
function firstRuns(sched, day) { const f = FIRST[sched]; return f ? (Array.isArray(f) ? f : f[day]) : null; }
function goLiveText(sched, day, hour, dry, writes) {
  if (sched === 'On request') return 'The task runs only when you start it with Run now, for the days you choose.';
  const [a, b] = firstRuns(sched, day);
  if (!dry) return `The first run is on ${a} at ${hour}${writes ? ' and makes changes right away' : ''}.`;
  return `The first run on ${a} at ${hour} is a dry run: it shows what would happen and changes nothing. From the run on ${b}, the task ${writes ? 'makes changes' : 'runs'} on its own.`;
}
const agentWrites = a => a.perms.swrite.length || Object.values(a.perms.conns).some(c => c.write);
function lastRun(t) { const r = t.runs.find(x => x.kind !== 'Check'); if (!r) return 'Not run yet'; return `${r.started.split(',').slice(0, 2).join(',')} · ${r.status === 'Failed' ? 'Failed' : resText(r.res)}`; }
const resText = r => [r.done && `${r.done} done`, r.skipped && `${r.skipped} skipped`, r.attention && `${r.attention} need attention`, r.failed && `${r.failed} failed`].filter(Boolean).join(', ') || 'Nothing to do';
function nextText(t) {
  if (agentById(t.agent).status === 'Disabled' || t.state !== 'active') return '–';
  if (t.sched === 'On request') return 'With Run now';
  return t.next + (t.dry && !t.runs.some(r => r.kind === 'Dry run') ? ' · dry run' : '');
}
function permPlain(p) {
  const out = [];
  if (p.sread.length) out.push(['Read Synder data', p.sread.map(i => SYNDER_READ[i])]);
  if (p.swrite.length) out.push(['Make changes in Synder', p.swrite.map(i => SYNDER_WRITE[i])]);
  Object.entries(p.conns).forEach(([k, c]) => {
    if (c.read.length) out.push([`Read ${CONN[k].provider}`, c.read.map(i => CONN[k].read[i]), k]);
    if (c.write) out.push([`Create or update records in ${CONN[k].provider}`, [`${c.write.types.map(i => CONN[k].types[i]).join(', ')} · ${c.write.ops.join(' and ')}, never delete`, c.write.max && `Largest amount: ${c.write.max}`, c.write.perRun && `Records per run: ${c.write.perRun}`].filter(Boolean), k]);
  });
  if (p.email) out.push(['Send emails', [`One email per run to ${p.email}`]]);
  return out;
}
const permShort = p => permPlain(p).map(x => x[0]).join(' · ') || 'No permissions';
const crumbs = items => `<nav class="text-secondary" aria-label="Breadcrumb">${items.map(it => `<a class="link" href="${it[1]}">${esc(it[0])}</a>`).join(' / ')}</nav>`;
function toast(text) {
  const el = document.createElement('div'); el.className = 'synder-toast synder-toast-success';
  el.innerHTML = `<span class="material-icons">check_circle</span><span>${esc(text)}</span><button class="synder-toast-close" aria-label="Close"><span class="material-icons">close</span></button>`;
  el.querySelector('button').onclick = () => el.remove(); $('#toasts').appendChild(el); setTimeout(() => el.remove(), 5000);
}
let dlgFn = null;
function dialog({ title, body, ok, danger, wide, fn }) {
  $('#dlg-title').textContent = title; $('#dlg-body').innerHTML = body; $('#dlg-ok').textContent = ok;
  $('#dlg-ok').className = danger ? 'btn-error' : 'btn'; $('#dlg-box').className = 'modal ' + (wide ? 'modal-md' : 'modal-confirm');
  dlgFn = fn; $('#dlg').classList.add('show');
}
function closeDlg() { $('#dlg').classList.remove('show'); dlgFn = null; }
$('#dlg-ok').onclick = () => { const f = dlgFn; if (f && f() === false) return; closeDlg(); };
const rowAttrs = h => `class="row-clickable" tabindex="0" onclick="go('${h}')" onkeydown="if(event.key==='Enter')go('${h}')"`;

/* ===== Quota ===== */
const atLimit = () => S.tasks.length >= S.allowance;
function quotaLine() { return `<span class="text-secondary">Tasks: ${S.tasks.length} of ${S.allowance} used</span>`; }
function newWorkflow() { if (atLimit()) return requestMore(); go('#/new'); }
function requestMore() {
  if (S.requested) return dialog({ title: 'Request sent', body: 'Synder will contact you about more tasks.', ok: 'OK', fn: () => {} });
  dialog({ title: 'Request more tasks', ok: 'Request', body: `<p style="margin-top:0">Your plan includes ${S.allowance} AI workflow task${S.allowance === 1 ? '' : 's'}. Each additional task is $19.00 a month. Synder adds them after your request; nothing is charged before that.</p>
    <div class="form-field" style="width:160px"><label class="form-label" for="rq-n">Additional tasks</label><input class="input" id="rq-n" type="number" min="1" max="100" value="1"></div>`,
    fn: () => { S.requested = true; toast('Request sent. Synder will contact you.'); render(); } });
}

/* ===== Page: AI Workflows ===== */
function pageHome() {
  const st = params.get('state');
  const head = `<div class="synder-page-header"><div class="synder-page-header-text"><h1 class="synder-page-title">AI Workflows</h1>
      <p class="synder-page-subtitle">Describe a recurring bookkeeping job in plain words. Synder runs it on a schedule and reports every record it touched.</p></div>
    <div class="synder-page-actions">${S.tasks.length ? quotaLine() + `<button class="btn-text" onclick="requestMore()">Request more tasks</button>` : ''}<button class="btn" onclick="newWorkflow()">New workflow</button></div></div>`;
  if (st === 'loading') return head + `<div class="box box--white flex-col">${'<div class="skeleton" style="height:20px;margin:8px 0"></div>'.repeat(6)}</div>`;
  if (st === 'error') return head + `<div class="alert alert-error"><span class="material-icons">error_outline</span><span>[live copy not captured] <button class="btn-text" onclick="location.search=''">Retry</button></span></div>`;
  if (!S.agents.length) return head + `
    <section class="box box--white flex-col gap-16 aw-empty">
      <h2 class="aw-h">How AI Workflows work</h2>
      <div class="aw-steps">
        <div class="box box--grey"><div class="aw-h3">1. Describe the job</div><div class="text-secondary">In plain words: what to check and what to do.</div></div>
        <div class="box box--grey"><div class="aw-h3">2. Choose what it may use</div><div class="text-secondary">It can read and change only what you allow.</div></div>
        <div class="box box--grey"><div class="aw-h3">3. Check the report</div><div class="text-secondary">Every run lists the records it touched. The first run can be a dry run.</div></div>
      </div>
      <div><h3 class="aw-h3">Examples</h3><ul class="aw-list text-secondary">${EXAMPLES.map(e => `<li>“${esc(e[1])}”</li>`).join('')}</ul></div>
      <div><button class="btn" onclick="newWorkflow()">Create your first workflow</button></div>
    </section>`;
  return head + `<div class="aw-page">${S.agents.map(a => `
    <section class="aw-agent" data-agent="${a.id}">
      <div class="aw-agent-head" role="link" tabindex="0" onclick="go('#/agents/${a.id}')" onkeydown="if(event.key==='Enter')go('#/agents/${a.id}')">
        <div class="aw-agent-text"><div class="aw-agent-title"><span>${esc(a.name)}</span>${a.status === 'Disabled' ? chip('Disabled', 'status-grey') : ''}</div>
          <div class="text-secondary">Agent · ${esc(permShort(a.perms))}</div></div>
        <button class="btn-outlined aw-nowrap" onclick="event.stopPropagation();addTask(${a.id})">Add task</button>
        <span class="material-icons text-secondary" aria-hidden="true">chevron_right</span>
      </div>
      ${taskTable(tasksOf(a.id), true)}
    </section>`).join('')}</div>`;
}
function addTask(aid) { if (atLimit()) return requestMore(); go('#/new?agent=' + aid); }
function taskTable(ts, flush) {
  const t = `<table class="synder-table"><thead><tr><th>Task</th><th>Status</th><th>Schedule</th><th>Next run</th><th>Last run</th></tr></thead><tbody>
    ${ts.length ? ts.map(t => `<tr ${rowAttrs('#/tasks/' + t.id)} data-task="${t.id}"><td>${esc(t.name)}</td><td>${taskChip(t)}${t.state === 'failed' ? `<span class="cell-subtext">Needs a permission</span>` : ''}</td><td>${esc(schedText(t))}</td><td>${esc(nextText(t))}</td><td>${esc(lastRun(t))}</td></tr>`).join('')
      : `<tr><td class="table-empty" colspan="5">No tasks yet.</td></tr>`}</tbody></table>`;
  return flush ? t : `<div class="table-wrap">${t}</div>`;
}

/* ===== Page: New workflow (one page, 3 sections) ===== */
let F; // form state for permissions
function permEditor(p, idPrefix) {
  const group = (key, label, list, picked, extra = '') => {
    const on = picked.length > 0, all = picked.length === list.length;
    return `<div class="aw-perm-row" data-perm="${key}">
      <div class="aw-perm-line"><label class="synder-checkbox"><input type="checkbox" id="${idPrefix}${key}" ${on ? 'checked' : ''} onchange="permToggle('${key}', this.checked)"><span>${label}</span></label>
        ${list.length > 1 ? `<span class="text-secondary" id="${idPrefix}${key}-sum">${on ? (all ? 'All' : picked.length + ' of ' + list.length) : ''}</span><button type="button" class="btn-text ${on ? '' : 'aw-hidden'}" id="${idPrefix}${key}-more" onclick="$('#${idPrefix}${key}-sub').classList.toggle('aw-hidden')">Choose</button>` : ''}</div>
      ${list.length > 1 ? `<div class="aw-sub aw-hidden" id="${idPrefix}${key}-sub">${list.map((r, i) => `<label class="synder-checkbox"><input type="checkbox" name="${idPrefix}${key}" value="${i}" ${picked.includes(i) ? 'checked' : ''} onchange="permSub('${key}')"><span>${esc(r)}</span></label>`).join('')}</div>` : ''}

    fn: () => {
      const f = $('#rn-from').value, to = $('#rn-to').value;
      if (!!f !== !!to) { $('#rn-err').classList.remove('aw-hidden'); return false; }
      const dry = $('#rn-dry').checked, rid = Date.now() % 100000;
      const fmt = s => new Date(s + 'T00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      t.runs.unshift({ id: rid, started: 'Nov 20, 2026, 15:40', period: f ? `${fmt(f)} – ${fmt(to)}` : 'Oct 21 – Nov 19, 2026', kind: dry ? 'Dry run' : 'Run', status: 'Succeeded', res: { done: 2, skipped: 0, attention: 0, failed: 0 }, changes: !dry && agentWrites(agentById(t.agent)) ? '2 created' : null });
      REPORT[rid] = !dry && agentWrites(agentById(t.agent)) ? REPORT[22] : (REPORT[t.runs[1] && t.runs[1].id] || REPORT[13]);
      toast(dry ? 'Dry run finished' : 'Run finished'); go(`#/runs/${t.id}/${rid}`);
    } });
}

/* ===== Page: Run report ===== */
function pageRun(tid, rid) {
  const t = taskById(tid); if (!t) return notFound();
  const r = t.runs.find(x => x.id === +rid); if (!r) return notFound();
  const rep = REPORT[r.id] || { lines: [], records: [] };
  const dry = r.kind !== 'Run';
  const OUT = { Done: 'status-green', Skipped: 'status-grey', 'Needs attention': 'status-yellow', Failed: 'status-red' };
  return `<div class="aw-page">${crumbs([['AI Workflows', '#/'], [t.name, '#/tasks/' + t.id]])}
    <div class="synder-page-header"><div class="synder-page-header-text"><h1 class="synder-page-title">${dry ? r.kind + ' report' : 'Run report'} · ${esc(r.started)}</h1><p class="synder-page-subtitle">Period ${esc(r.period)}</p></div></div>
    ${dry ? `<div class="alert alert-info"><span class="material-icons">visibility</span><span>${r.kind === 'Check' ? 'Synder checked this task before it could run. Nothing was changed.' : 'This was a dry run: it shows what would happen and changed nothing.'}</span></div>` : ''}
    <section class="box box--white flex-col gap-16"><h2 class="aw-h">Summary</h2>
      <div class="aw-summary">${[['Done', r.res.done], ['Skipped', r.res.skipped], ['Need attention', r.res.attention], ['Failed', r.res.failed]].map(x => `<div><div class="aw-num">${x[1]}</div><div class="text-secondary">${x[0]}</div></div>`).join('')}
        ${!dry && r.changes ? `<div><div class="aw-num">${esc(r.changes)}</div><div class="text-secondary">In your accounting</div></div>` : ''}${r.emailed ? `<div><div class="aw-num">1</div><div class="text-secondary">Email sent</div></div>` : ''}</div>
    </section>
    <section class="box box--white flex-col gap-16"><h2 class="aw-h">What happened</h2>
      <div class="table-wrap"><table class="synder-table"><thead><tr><th>Outcome</th><th>Source record</th><th>Message</th></tr></thead><tbody>
        ${rep.lines.length ? rep.lines.map(l => `<tr><td>${chip(l[0], OUT[l[0]])}</td><td>${esc(l[1])}</td><td>${esc(l[2])}</td></tr>`).join('') : `<tr><td class="table-empty" colspan="3">Nothing to report for this run.</td></tr>`}</tbody></table></div>
    </section>
    ${!dry && rep.records.length ? `<section class="box box--white flex-col gap-16"><div class="aw-head"><h2 class="aw-h">Records in your accounting</h2><div class="aw-actions"><button class="btn-outlined" onclick="toast('CSV downloaded')">Download CSV</button><button class="btn-outlined btn-outlined-error" onclick="deleteRecords(${t.id}, ${r.id})">Delete selected</button></div></div>
      <div class="table-wrap"><table class="synder-table"><thead><tr><th class="col-check"><input class="checkbox" type="checkbox" aria-label="Select all" onchange="document.querySelectorAll('input[name=rec]').forEach(i=>i.checked=this.checked)"></th><th>Record</th><th>Record id</th><th>Source</th><th class="col-amount">Amount</th><th>By</th><th>Status</th></tr></thead><tbody>
        ${rep.records.map((x, i) => `<tr><td class="col-check"><input class="checkbox" type="checkbox" name="rec" value="${i}" aria-label="Select record"></td><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td class="col-amount">${x[3]}</td><td>Task</td><td>${chip(x[4], x[4] === 'Created' ? 'status-green' : 'status-grey')}</td></tr>`).join('')}</tbody></table></div>
      <div class="text-secondary">Only records this task created can be deleted. Updates are not rolled back.</div></section>` : ''}
  </div>`;
}
function deleteRecords(tid, rid) {
  const sel = [...document.querySelectorAll('input[name=rec]:checked')];
  if (!sel.length) return dialog({ title: 'Nothing selected', body: 'Select the records to delete first.', ok: 'OK', fn: () => {} });
  dialog({ title: `Delete ${sel.length} record${sel.length === 1 ? '' : 's'}?`, ok: 'Delete records', danger: true,
    body: `Delete ${sel.length} record${sel.length === 1 ? '' : 's'} this run created in your accounting? Records changed there since are kept. A later run may create them again.`,
    fn: () => { sel.forEach(i => { REPORT[rid].records[+i.value][4] = 'Deleted'; }); toast('Records deleted'); render(); } });
}

/* ===== Page: Agent / Edit agent ===== */
function pageAgent(id) {
  const a = agentById(id); if (!a) return notFound();
  return `<div class="aw-page">${crumbs([['AI Workflows', '#/']])}
    <div class="synder-page-header"><div class="synder-page-header-text"><h1 class="synder-page-title">${esc(a.name)} ${a.status === 'Disabled' ? chip('Disabled', 'status-grey') : chip('Active', 'status-green')}</h1><p class="synder-page-subtitle">Agent · its tasks share these permissions</p></div>
      <div class="synder-page-actions"><a class="btn-outlined" href="#/agents/${a.id}/edit">Edit agent</a>${a.status === 'Active' ? `<button class="btn-outlined btn-outlined-error" onclick="disableAgent(${a.id})">Disable agent</button>` : `<button class="btn-outlined" onclick="enableAgent(${a.id})">Enable agent</button>`}</div></div>
    <section class="box box--white flex-col gap-16"><div class="aw-head"><h2 class="aw-h">Tasks</h2><button class="btn" onclick="addTask(${a.id})">Add task</button></div>${taskTable(tasksOf(a.id))}</section>
    <section class="box box--white flex-col gap-16"><div class="aw-head"><h2 class="aw-h">Permissions</h2><a class="btn-outlined" href="#/agents/${a.id}/edit">Change permissions</a></div>${permView(a.perms)}</section></div>`;
}
function disableAgent(id) { dialog({ title: 'Disable agent?', ok: 'Disable agent', danger: true, body: 'Disable this agent and stop all its tasks?', fn: () => { agentById(id).status = 'Disabled'; tasksOf(id).forEach(t => { if (t.state === 'active') t.state = 'paused'; }); toast('Agent disabled. Its tasks no longer run.'); render(); } }); }
function enableAgent(id) { dialog({ title: 'Enable agent?', ok: 'Enable agent', body: 'Enable this agent? Its tasks stay paused until you resume them.', fn: () => { agentById(id).status = 'Active'; toast('Agent enabled. Its tasks stay paused until you resume them.'); render(); } }); }
function pageAgentEdit(id, q) {
  const a = agentById(id); if (!a) return notFound();
  PFX = 'p-';
  const ts = tasksOf(a.id);
  const html = `<div class="aw-page">${crumbs([['AI Workflows', '#/'], [a.name, '#/agents/' + a.id]])}
    <div class="synder-page-header"><div class="synder-page-header-text"><h1 class="synder-page-title">Edit agent</h1></div></div>
    ${ts.length ? `<div class="alert alert-info"><span class="material-icons">info_outline</span><span>Adding permissions is safe. Removing or narrowing one deletes all ${ts.length} task${ts.length === 1 ? '' : 's'} of this agent.</span></div>` : ''}
    <form class="aw-page" novalidate onsubmit="return saveAgent(event, ${a.id})">
      <section class="box box--white flex-col gap-16"><div class="form-field" style="width:480px"><label class="form-label form-label-required" for="ag-name">Agent name</label><input class="input" id="ag-name" value="${esc(a.name)}"><div class="form-error-msg aw-hidden" id="ag-name-err">Enter a name</div></div></section>
      <section class="box box--white flex-col gap-16"><h2 class="aw-h">Permissions</h2>${permEditor(a.perms, 'p-')}</section>
      <div class="aw-actions"><button class="btn" type="submit">Save agent</button><a class="btn-outlined" href="${q.get('return') ? '#/tasks/' + q.get('return') : '#/agents/' + a.id}">Cancel</a></div>
    </form></div>`;
  if (q.get('add')) setTimeout(() => { const k = q.get('add'); $('#p-' + k).checked = true; permToggle(k, true); const row = document.querySelector(`[data-perm="${k}"]`); row.scrollIntoView({ block: 'center' }); }, 0);
  return html;
}
function narrowed(o, n) {
  const sub = (x, y) => x.some(i => !y.includes(i));
  if (sub(o.sread, n.sread) || sub(o.swrite, n.swrite) || (o.email && !n.email)) return true;
  return Object.entries(o.conns).some(([k, c]) => { const m = n.conns[k]; if (!m) return true; if (sub(c.read, m.read)) return true; if (c.write && (!m.write || sub(c.write.types, m.write.types))) return true; return false; });
}
function saveAgent(e, id) {
  e.preventDefault();
  const a = agentById(id), name = $('#ag-name').value.trim();
  $('#ag-name-err').classList.toggle('aw-hidden', !!name); if (!name) return false;
  const p = readPerms(); if (!p) return false;
  const ret = new URLSearchParams(location.hash.split('?')[1] || '').get('return');
  const done = msg => { a.name = name; a.perms = p; toast(msg); go(ret && taskById(ret) ? '#/tasks/' + ret : '#/agents/' + id); };
  const ts = tasksOf(id);
  if (ts.length && narrowed(a.perms, p)) {
    dialog({ title: 'Delete the agent’s tasks?', danger: true, ok: `Save and delete ${ts.length} task${ts.length === 1 ? '' : 's'}`,
      body: `<p style="margin-top:0">Removing or narrowing a permission deletes all tasks of this agent. You can create the tasks again for the new permissions.</p><ul class="aw-list">${ts.map(t => `<li>${esc(t.name)}</li>`).join('')}</ul>`,
      fn: () => { S.tasks = S.tasks.filter(t => t.agent !== id); a.name = name; a.perms = p; toast(`Permissions saved; ${ts.length} task${ts.length === 1 ? '' : 's'} deleted`); go('#/agents/' + id); } });
    return false;
  }
  if (ret) { const t = taskById(ret); if (t && t.state === 'failed') { t.state = 'preparing'; done('Agent saved. AI is preparing the task again.'); return false; } }
  done('Agent saved'); return false;
}

function notFound() { return `<div class="box box--white flex-col gap-16"><h2 class="aw-h">Page not found</h2><div><a class="btn" href="#/">Back to AI Workflows</a></div></div>`; }

/* ===== Router ===== */
function render() {
  closeDlg();
  const h = location.hash.replace(/^#/, '') || '/';
  const [path, qs] = h.split('?'); const q = new URLSearchParams(qs || '');
  const m = path.split('/').filter(Boolean);
  let html;
  if (!m.length) html = pageHome();
  else if (m[0] === 'new') html = (atLimit() && !q.get('task')) ? pageHome() : pageNew(q);
  else if (m[0] === 'agents' && m[2] === 'edit') html = pageAgentEdit(+m[1], q);
  else if (m[0] === 'agents') html = pageAgent(+m[1]);
  else if (m[0] === 'tasks') html = pageTask(+m[1]);
  else if (m[0] === 'runs') html = pageRun(+m[1], +m[2]);
  else html = notFound();
  $('#page').innerHTML = html;
  if ($('#t-sched')) { if ($('#w-agent')) agentPick(); else schedFields(); }
  window.scrollTo(0, 0);
}
document.getElementById('vs-' + variant).classList.add('on');
window.addEventListener('hashchange', render);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDlg(); });
render();
</script>
</body>
</html>
