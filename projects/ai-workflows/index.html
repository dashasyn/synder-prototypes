<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Workflows — structure prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link rel="stylesheet" href="../../ui-kit/synder-ui-kit.css">
<!-- Page layout only (grids, gaps, section headings). Kit components are not restyled.
     Sections follow production /aiAgents: white box, 1px border, 4px radius, 16px padding, no shadow. -->
<style>
  .aw-page { display: flex; flex-direction: column; gap: 16px; }
  .aw-h { margin: 0; font-size: 16px; line-height: 24px; font-weight: 700; color: var(--text-primary); }
  .aw-h3 { margin: 0 0 8px; font-size: 14px; line-height: 20px; font-weight: 700; color: var(--text-primary); }
  .aw-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .aw-steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .aw-steps .box { display: block; }
  .aw-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .aw-cols ul { margin: 0; padding-left: 18px; }
  .aw-cols li + li { margin-top: 4px; }
  .aw-examples { margin: 0; padding-left: 18px; }
  .aw-examples li + li { margin-top: 4px; }
  .aw-agent { background: var(--color-white); border: 1px solid var(--border-default); border-radius: var(--radius-sm); overflow: hidden; }
  .aw-agent-head { display: flex; align-items: center; gap: 16px; padding: 16px; cursor: pointer; }
  .aw-agent > table { border-top: 1px solid var(--border-default); }
  .aw-int { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
  .aw-int-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%; }
  .aw-agent-title { display: flex; align-items: center; gap: 8px; font-size: 16px; line-height: 24px; font-weight: 700; color: var(--text-primary); }
  .aw-agent-text { flex: 1; min-width: 0; }
  .aw-grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; }
  .aw-dl { display: grid; grid-template-columns: 120px 1fr; row-gap: 12px; column-gap: 16px; margin: 0; }
  .aw-dl dt { font-weight: 700; color: var(--text-primary); }
  .aw-dl dd { margin: 0; }
  .aw-perm { display: grid; grid-template-columns: 200px 1fr; column-gap: 16px; row-gap: 14px; }
  .aw-perm ul { margin: 0; padding-left: 18px; }
  .aw-perm li + li { margin-top: 4px; }
  .aw-checks { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  .aw-sub { padding: 4px 0 4px 32px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  .aw-actions { display: flex; gap: 8px; }
  .aw-quota { display: flex; align-items: center; gap: 12px; color: var(--text-secondary); }
  .aw-row { display: flex; gap: 16px; align-items: flex-start; }
  .aw-nowrap { white-space: nowrap; }
  .synder-page-header + .box, .synder-page-header + .aw-page, .synder-page-header + .alert { margin-top: 24px; }
  .aw-hidden { display: none !important; }
</style>
</head>
<body>
<div class="variant-switch">
  <span class="vs-label">Start</span>
  <div class="vs-opts">
    <button id="vs-1" onclick="setVariant(1)">1 · First visit, no agents</button>
    <button id="vs-2" onclick="setVariant(2)">2 · With agents and tasks</button>
  </div>
</div>
<div class="synder-app">
  <header class="topbar topbar--app">
    <div class="topbar-org"><span class="sidebar-org-avatar">AC</span><span class="topbar-org-name">Acme Corp</span><span class="material-icons">expand_more</span></div>
    <div class="topbar-right">
      <div class="topbar-balance"><span>Balance:</span> <b>10,000</b><span class="topbar-meter"><span style="width:96%"></span></span></div>
      <a class="topbar-link">How it works?</a>
      <button class="topbar-icon" aria-label="Notifications"><span class="material-icons">notifications</span></button>
      <button class="topbar-icon" aria-label="Help"><span class="material-icons">help_outline</span><span class="material-icons topbar-caret">expand_more</span></button>
      <button class="topbar-icon" aria-label="Account"><span class="material-icons">person</span><span class="material-icons topbar-caret">expand_more</span></button>
    </div>
  </header>
  <div class="synder-layout">
    <nav class="sidebar sidebar--notch" aria-label="Main">
      <a class="sidebar-item"><span class="material-icons">dashboard</span><span>Dashboard</span></a>
      <a class="sidebar-item sidebar-item--group"><span class="material-icons">swap_horiz</span><span>Transactions</span><span class="material-icons sidebar-chevron">expand_more</span></a>
      <a class="sidebar-item"><span class="material-icons">inventory_2</span><span>Inventory sync</span></a>
      <a class="sidebar-item sidebar-item--group"><span class="material-icons">rule</span><span>Smart rules</span><span class="material-icons sidebar-chevron">expand_more</span></a>
      <a class="sidebar-item sidebar-item--group"><span class="material-icons">attach_money</span><span>Revenue recognition</span><span class="material-icons sidebar-chevron">expand_more</span></a>
      <a class="sidebar-item active" href="#/"><span class="material-icons">android</span><span>AI workflows</span></a>
      <a class="sidebar-item"><span class="material-icons">track_changes</span><span>AI Hub</span></a>
      <a class="sidebar-item"><span class="material-icons">stars</span><span>What's New</span></a>
      <a class="sidebar-item"><span class="material-icons">settings</span><span>Settings</span></a>
    </nav>
    <main class="synder-page" id="page"></main>
  </div>
</div>

<div class="modal-bg" id="dlg" onclick="if(event.target===this)closeDlg()">
  <div class="modal" id="dlg-box" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
    <div class="synder-modal-header" id="dlg-title"></div>
    <div class="synder-modal-body" id="dlg-body"></div>
    <div class="synder-modal-footer"><button class="btn-outlined" onclick="closeDlg()">Cancel</button><button id="dlg-ok"></button></div>
  </div>
</div>

<div id="sheet" class="aw-hidden">
  <div class="synder-side-sheet-bg" onclick="closeSheet()"></div>
  <aside class="synder-side-sheet synder-side-sheet--wide" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="synder-side-sheet-header"><span id="sheet-title"></span><button class="btn-icon" aria-label="Close" onclick="closeSheet()"><span class="material-icons">close</span></button></div>
    <div class="synder-side-sheet-body" id="sheet-body"></div>
  </aside>
</div>

<div class="synder-toast-stack" id="toasts" aria-live="polite"></div>

<script>
/* ---------- Catalog (captured from production 2026-11-19) ---------- */
const READ = [
  'Connected integrations of the organization',
  'Transactions Synder imported, by provider ids, date, status, company',
  'Synder syncs by status, company and sync date',
  'One sync with its linked accounting records',
  'Up to 100 syncs with their linked accounting records',
  'Sync settings of an integration',
  'Import runs of an integration',
  'Transaction reconciliations with their summaries and results',
  'Report lines of earlier runs of this task'
];
const WRITE = [
  'Start a Synder sync of transactions',
  'Start a rollback of a Synder sync',
  'Start a resync of a Synder sync',
  'Start an import of an integration',
  'Ignore, un-ignore, match and unmatch transaction reconciliation results',
  'Start a transaction reconciliation of an integration'
];
const CONNECTIONS = {
  stripe: { name: 'Synder test', provider: 'STRIPE', logo: 'stripe', alias: 'stripe_1', read: null, readNote: 'Read-only Stripe API list and get calls' },
  shopify: { name: 'acme-store', provider: 'SHOPIFY', logo: 'shopify', alias: 'shopify_1',
    read: ['One Shopify order', 'Shopify orders in a date range', 'One Shopify refund', 'One Shopify payout', 'Balance transactions of a Shopify payout'] }
};
const logo = k => `<img class="integration-logo" src="../../ui-kit/logos/${CONNECTIONS[k].logo}-square.svg" alt="">`;
const ALLOWANCE = 5;

/* ---------- Fake data ---------- */
const DATA = {
  agents: [
    { id: 1, name: 'Sync monitor', desc: 'Watches syncs and imports for errors', status: 'Active',
      read: [0, 2, 3, 6], write: [], email: 'jane.doe@example.com', integrations: [{ key: 'shopify', alias: 'shopify_1', read: [1, 2] }] },
    { id: 2, name: 'Stripe sync fixer for payouts, fees and refunds across all connected Stripe accounts', desc: 'Resyncs Stripe transactions that failed for a known reason', status: 'Active',
      read: [0, 2, 3], write: [2], email: '', integrations: [{ key: 'stripe', alias: 'stripe_1', read: [0] }, { key: 'shopify', alias: 'shopify_1', read: [3, 4] }] },
    { id: 3, name: 'Reconciliation reviewer', desc: '', status: 'Disabled', read: [7], write: [], email: '', integrations: [] }
  ],
  tasks: [
    { id: 1, agent: 1, name: 'Weekly sync error check', text: 'Find syncs that failed in the last 7 days and list them with the error message and the integration they came from. Email the list to the bookkeeper.',
      status: 'Active', sched: 'Weekly', day: 'Monday', mday: '1', hour: '06:00', next: 'Nov 23, 2026, 06:00', dry: true,
      runs: [
        { id: 'r3', date: 'Nov 16, 2026, 06:00', period: 'Nov 9 – Nov 15, 2026', type: 'Run', result: 'Done', records: 3 },
        { id: 'r2', date: 'Nov 9, 2026, 06:00', period: 'Nov 2 – Nov 8, 2026', type: 'Run', result: 'Done', records: 0 },
        { id: 'r1', date: 'Nov 5, 2026, 11:42', period: 'Oct 29 – Nov 4, 2026', type: 'Dry run', result: 'Done', records: 5 }
      ] },
    { id: 2, agent: 1, name: 'Unmatched payouts check', text: 'Every morning, look at yesterday’s Stripe payouts and list the ones that have no matching deposit in QuickBooks.',
      status: 'Being finished', sched: 'Daily', day: 'Monday', mday: '1', hour: '06:00', next: null, dry: true, runs: [] },
    { id: 3, agent: 2, name: 'Resync syncs with a missing customer', text: 'Every day, find Stripe syncs that failed with “Customer not found” and resync them after the customer was created in QuickBooks.',
      status: 'Dry run ready', sched: 'Daily', day: 'Monday', mday: '1', hour: '06:00', next: null, dry: true,
      runs: [ { id: 'r4', date: 'Nov 17, 2026, 09:10', period: 'Nov 16, 2026', type: 'Dry run', result: 'Done', records: 12 } ] },
    { id: 4, agent: 2, name: 'Month-end failed sync summary', text: 'At month end, email me the transactions that failed to sync and why.',
      status: 'Failed', sched: 'Monthly', day: 'Monday', mday: 'last', hour: '07:00', next: 'Nov 30, 2026, 07:00', dry: false,
      runs: [ { id: 'r5', date: 'Oct 31, 2026, 07:00', period: 'Oct 1 – Oct 31, 2026', type: 'Run', result: 'Failed', records: 0 } ] },
    { id: 5, agent: 3, name: 'Ignored reconciliation results review', text: 'Every Friday, list reconciliation results that were ignored this week.',
      status: 'Active', sched: 'Weekly', day: 'Friday', mday: '1', hour: '09:00', next: 'Nov 20, 2026, 09:00', dry: true,
      runs: [ { id: 'r6', date: 'Nov 13, 2026, 09:00', period: 'Nov 7 – Nov 13, 2026', type: 'Run', result: 'Done', records: 1 } ] }
  ]
};
const params = new URLSearchParams(location.search);
let variant = params.get('state') === 'filled' ? 2 : 1;
let agents, tasks;
function seed() { const d = JSON.parse(JSON.stringify(DATA)); agents = variant === 1 ? [] : d.agents; tasks = variant === 1 ? [] : d.tasks; }
seed();
function setVariant(n) {
  variant = n; seed();
  document.querySelectorAll('.variant-switch button').forEach((b, i) => b.classList.toggle('on', i + 1 === n));
  if (location.hash && location.hash !== '#/') location.hash = '#/'; else render();
}

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const agentById = id => agents.find(a => a.id === +id);
const taskById = id => tasks.find(t => t.id === +id);
const tasksOf = id => tasks.filter(t => t.agent === +id);
const used = () => tasks.length;
const CHIP = { 'Active': 'status-green', 'Being finished': 'status-blue', 'Dry run ready': 'status-yellow', 'Failed': 'status-red', 'Disabled': 'status-grey', 'Paused': 'status-grey', 'Agent disabled': 'status-grey', 'Done': 'status-green' };
const chip = s => `<span class="status ${CHIP[s] || 'status-grey'}">${esc(s)}</span>`;
const agentOff = t => agentById(t.agent).status === 'Disabled';
const effStatus = t => agentOff(t) ? 'Agent disabled' : t.status;
const nextRun = t => (agentOff(t) || t.status === 'Paused' || !t.next) ? '–' : t.next;
function schedText(t) {
  if (t.sched === 'On request') return 'On request';
  if (t.sched === 'Weekly') return `Weekly, ${t.day} at ${t.hour}`;
  if (t.sched === 'Monthly') return `Monthly, ${t.mday === 'last' ? 'last day' : 'day ' + t.mday} at ${t.hour}`;
  return `Daily at ${t.hour}`;
}
function lastText(t) {
  const r = t.runs[0];
  if (!r) return 'Not run yet';
  const d = r.date.split(',').slice(0, 2).join(',');
  return r.result === 'Failed' ? `${d} · Failed` : `${d} · ${r.records} record${r.records === 1 ? '' : 's'}`;
}
function permSummary(a) {
  const p = [];
  if (a.read.length) p.push('Reads Synder data');
  if (a.write.length) p.push('makes changes in Synder');
  if (a.email) p.push('sends emails');
  if (a.integrations.length) p.push('reads ' + a.integrations.map(i => CONNECTIONS[i.key].name).join(', '));
  if (!p.length) return 'No permissions';
  const s = p.join(', '); return s[0].toUpperCase() + s.slice(1);
}
const crumbs = items => `<nav class="crumbs text-secondary" aria-label="Breadcrumb">${items.map(it => `<a class="link" href="${it[1]}">${esc(it[0])}</a>`).join(' / ')}</nav>`;
function toast(text, kind = 'success') {
  const el = document.createElement('div');
  el.className = `synder-toast synder-toast-${kind}`;
  el.innerHTML = `<span class="material-icons">${kind === 'success' ? 'check_circle' : 'error'}</span><span>${esc(text)}</span><button class="synder-toast-close" aria-label="Close"><span class="material-icons">close</span></button>`;
  el.querySelector('button').onclick = () => el.remove();
  $('#toasts').appendChild(el); setTimeout(() => el.remove(), 5000);
}
let dlgFn = null;
function dialog({ title, body, ok, danger, wide, fn }) {
  $('#dlg-title').textContent = title; $('#dlg-body').innerHTML = body;
  $('#dlg-ok').textContent = ok; $('#dlg-ok').className = danger ? 'btn-error' : 'btn';
  $('#dlg-box').className = 'modal ' + (wide ? 'modal-md' : 'modal-confirm');
  dlgFn = fn; $('#dlg').classList.add('show');
}
function closeDlg() { $('#dlg').classList.remove('show'); dlgFn = null; }
$('#dlg-ok').onclick = () => { const f = dlgFn; closeDlg(); f && f(); };
function closeSheet() { $('#sheet').classList.add('aw-hidden'); }
const go = h => { location.hash = h; };
const rowAttrs = h => `class="row-clickable" tabindex="0" onclick="go('${h}')" onkeydown="if(event.key==='Enter')go('${h}')"`;

/* ---------- Page 1: AI Workflows ---------- */
const SUBTITLE = 'Hand a recurring bookkeeping job to an agent: describe it in your own words, and it runs on a schedule with only the permissions you give it.';
function taskTable(ts, emptyText, flush) {
  return `${flush ? '' : '<div class="table-wrap">'}<table class="synder-table">
    <thead><tr><th>Task</th><th>Status</th><th>Schedule</th><th>Next run</th><th>Last run</th></tr></thead>
    <tbody>${ts.length ? ts.map(t => `<tr ${rowAttrs('#/tasks/' + t.id)} data-task="${t.id}"><td>${esc(t.name)}</td><td>${chip(effStatus(t))}</td><td>${esc(schedText(t))}</td><td>${esc(nextRun(t))}</td><td>${esc(lastText(t))}</td></tr>`).join('')
      : `<tr><td class="table-empty" colspan="5">${emptyText}</td></tr>`}</tbody>
  </table>${flush ? '' : '</div>'}`;
}
function pageList() {
  const st = params.get('state');
  const header = `
    <div class="synder-page-header">
      <div class="synder-page-header-text">
        <h1 class="synder-page-title">AI Workflows</h1>
        <p class="synder-page-subtitle">${SUBTITLE}</p>
      </div>
      <div class="synder-page-actions">
        ${agents.length ? `<span class="aw-quota">Tasks: ${used()} of ${ALLOWANCE} used <button class="btn-text" onclick="requestMore()">Request more tasks</button></span>` : ''}
        <a class="btn" href="#/agents/new">New agent</a>
      </div>
    </div>`;
  if (st === 'loading') return header + `<div class="box box--white flex-col">${'<div class="skeleton" style="height:20px;margin:8px 0"></div>'.repeat(6)}</div>`;
  if (st === 'error') return header + `<div class="alert alert-error"><span class="material-icons">error_outline</span><span>[live copy not captured] <button class="btn-text" onclick="location.search=''">Retry</button></span></div>`;
  if (!agents.length) return header + `
    <section class="box box--white flex-col gap-16 aw-empty">
      <h2 class="aw-h">How AI Workflows work</h2>
      <div class="aw-steps">
        <div class="box box--grey"><div class="aw-h3">1. Create an agent</div><div class="text-secondary">Choose what it may read and change.</div></div>
        <div class="box box--grey"><div class="aw-h3">2. Describe a task</div><div class="text-secondary">In plain words: what to check and what to do.</div></div>
        <div class="box box--grey"><div class="aw-h3">3. Try it, then schedule it</div><div class="text-secondary">A dry run shows the result without changing anything.</div></div>
      </div>
      <div><h3 class="aw-h3">Examples</h3><ul class="aw-examples text-secondary">
        <li>\u201cEmail me the syncs that failed this week\u201d</li>
        <li>\u201cApply Stripe payments to open QuickBooks invoices\u201d</li>
        <li>\u201cAt month end, list payouts with no matching deposit\u201d</li></ul></div>
      <div><a class="btn" href="#/agents/new">Create your first agent</a></div>
    </section>`;

  return header + `<div class="aw-page">${agents.map(a => `
    <section class="aw-agent" data-agent="${a.id}">
      <div class="aw-agent-head" role="link" tabindex="0" aria-label="Open agent ${esc(a.name)}" onclick="go('#/agents/${a.id}')" onkeydown="if(event.key==='Enter')go('#/agents/${a.id}')">
        <div class="aw-agent-text">
          <div class="aw-agent-title"><span>${esc(a.name)}</span>${chip(a.status)}</div>
          <div class="text-secondary">${esc(permSummary(a))}${a.desc ? ` · ${esc(a.desc)}` : ''}</div>
        </div>
        <a class="btn-outlined aw-nowrap" href="#/agents/${a.id}/tasks/new" onclick="event.stopPropagation()">Add task</a>
        <span class="material-icons text-secondary" aria-hidden="true">chevron_right</span>
      </div>
      ${taskTable(tasksOf(a.id), 'No tasks yet. Describe in plain words what this agent should do.', true)}
    </section>`).join('')}</div>`;
}
function requestMore() { toast('[live copy not captured]'); }

/* ---------- Agent overview ---------- */
function permBlock(a) {
  const list = (ids, src) => ids.length ? `<ul>${ids.map(i => `<li>${esc(src[i])}</li>`).join('')}</ul>` : 'Not allowed';
  return `<div class="aw-perm">
    <div class="text-bold">Read data in Synder</div><div>${list(a.read, READ)}</div>
    <div class="text-bold">Make changes in Synder</div><div>${list(a.write, WRITE)}</div>
    <div class="text-bold">Send emails</div><div>${a.email ? `One email per run to ${esc(a.email)}` : 'Not allowed'}</div>
    <div class="text-bold">Integrations</div><div>${a.integrations.length ? a.integrations.map(i => { const c = CONNECTIONS[i.key];
      return `<div class="mb-16"><span class="integration-name">${logo(i.key)}${esc(c.name)}</span> <span class="text-secondary">· alias ${esc(i.alias)}</span>
        <ul>${c.read ? i.read.map(r => `<li>${esc(c.read[r])}</li>`).join('') : `<li>${esc(c.readNote)}</li>`}</ul></div>`; }).join('') : 'None'}</div>
  </div>`;
}
function pageAgent(id) {
  const a = agentById(id); if (!a) return notFound();
  return `<div class="aw-page">${crumbs([['AI Workflows', '#/']])}
    <div class="synder-page-header">
      <div class="synder-page-header-text">
        <h1 class="synder-page-title">${esc(a.name)} ${chip(a.status)}</h1>
        ${a.desc ? `<p class="synder-page-subtitle">${esc(a.desc)}</p>` : ''}
      </div>
      <div class="synder-page-actions">
        <a class="btn-outlined" href="#/agents/${a.id}/edit">Edit agent</a>
        ${a.status === 'Active' ? `<button class="btn-outlined btn-outlined-error" onclick="disableAgent(${a.id})">Disable agent</button>` : `<button class="btn-outlined" onclick="enableAgent(${a.id})">Enable agent</button>`}
      </div>
    </div>
    ${a.status === 'Disabled' ? `<div class="alert alert-warning"><span class="material-icons">pause_circle_outline</span><span>The agent is disabled. Its tasks don’t run until you enable it.</span></div>` : ''}
    <section class="box box--white flex-col gap-16">
      <div class="aw-head"><h2 class="aw-h">Tasks</h2><a class="btn" href="#/agents/${a.id}/tasks/new">Add task</a></div>
      ${taskTable(tasksOf(a.id), 'No tasks yet. Describe in plain words what this agent should do.')}
    </section>
    <section class="box box--white flex-col gap-16">
      <div class="aw-head"><h2 class="aw-h">Permissions</h2><a class="btn-outlined" href="#/agents/${a.id}/edit">Change permissions</a></div>
      ${permBlock(a)}
    </section></div>`;
}
function disableAgent(id) {
  const n = tasksOf(id).length;
  dialog({ title: 'Disable agent?', body: `Its ${n} task${n === 1 ? '' : 's'} stop running until you enable the agent again.`, ok: 'Disable agent', danger: true,
    fn: () => { agentById(id).status = 'Disabled'; toast('Agent disabled'); render(); } });
}
function enableAgent(id) { agentById(id).status = 'Active'; toast('Agent enabled'); render(); }

/* ---------- New / Edit agent ---------- */
function checkGroup(key, label, list, picked) {
  const on = picked.length > 0;
  return `<label class="synder-checkbox"><input type="checkbox" id="p-${key}" ${on ? 'checked' : ''} onchange="$('#p-${key}-sub').classList.toggle('aw-hidden', !this.checked)"><span>${label}</span></label>
    <div class="aw-sub ${on ? '' : 'aw-hidden'}" id="p-${key}-sub">
      <label class="synder-checkbox"><input type="checkbox" id="p-${key}-all" onchange="document.querySelectorAll('input[name=${key}]').forEach(i=>i.checked=this.checked)"><span class="text-bold">Select all</span></label>
      ${list.map((r, i) => `<label class="synder-checkbox"><input type="checkbox" name="${key}" value="${i}" ${picked.includes(i) ? 'checked' : ''}><span>${esc(r)}</span></label>`).join('')}
      <div class="form-error-msg aw-hidden" id="p-${key}-err">${key === 'read' ? 'Choose what the agent may read' : 'Choose what the agent may change'}</div>
    </div>`;
}
function intBlock(i) {
  const c = CONNECTIONS[i.key];
  const reads = c.read

  const q = new URLSearchParams(qs || '');
  if (q.get('return')) params.set('return', q.get('return')); else params.delete('return');
  const m = path.split('/').filter(Boolean);
  let html;
  if (!m.length) html = pageList();
  else if (m[0] === 'agents' && m[1] === 'new') html = pageAgentForm('new');
  else if (m[0] === 'agents' && m[2] === 'edit') html = pageAgentForm(m[1]);
  else if (m[0] === 'agents' && m[2] === 'tasks' && m[3] === 'new') html = pageTaskForm(+m[1], null, q.get('first'));
  else if (m[0] === 'agents' && m[2] === 'tasks' && m[4] === 'edit') html = pageTaskForm(+m[1], +m[3]);
  else if (m[0] === 'agents') html = pageAgent(m[1]);
  else if (m[0] === 'tasks') html = pageTask(m[1]);
  else html = notFound();
  $('#page').innerHTML = html;
  if ($('#t-sched')) schedFields();
  window.scrollTo(0, 0);
}
document.getElementById('vs-' + variant).classList.add('on');
window.addEventListener('hashchange', render);
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeSheet(); closeDlg(); } });
render();
</script>
</body>
</html>
