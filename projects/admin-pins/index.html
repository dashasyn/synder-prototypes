<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin sidebar — pinned pages and org switcher</title>
<link rel="stylesheet" href="../../ui-kit/synder-ui-kit.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
<style>
  /* Live admin shell from Ignat's 4 screenshots (2026-10-13): Administrative functions,
     Organizations list, Organization page, org switcher. Every text is ≥14px. */
  body{margin:0;height:100vh;display:flex;flex-direction:column;background:var(--color-white);font-size:14px;color:var(--text-primary)}
  .mi,.mf{font-weight:normal;font-style:normal;font-size:20px;line-height:1;display:inline-block;
    -webkit-font-smoothing:antialiased;font-feature-settings:'liga';text-transform:none;letter-spacing:normal;white-space:nowrap}
  .mi{font-family:'Material Icons Outlined'} .mf{font-family:'Material Icons'}
  .app{display:flex;flex:1;min-height:0}

  /* ---- sidebar: refreshed, after Stripe / Shopify (Ignat, 2026-10-13) ----
     no row dividers, rounded hover/active pills, grey outline icons, quiet section labels. White only. */
  .sb{--sb-bg:#fff;--sb-fg:#1A1B24;--sb-ic:#6B778C;--sb-muted:#6B778C;--sb-hover:#F2F4F7;--sb-on-bg:#E8F0FD;
    --sb-on-fg:#0053CC;--sb-border:#E9ECF1;--sb-card:#F5F8FD;
    width:240px;flex-shrink:0;border-right:1px solid var(--sb-border);display:flex;flex-direction:column;
    position:relative;background:var(--sb-bg);color:var(--sb-fg)}
  .sb-org{display:flex;align-items:center;gap:10px;margin:12px 10px 8px;padding:8px;border-radius:8px;flex-shrink:0;
    border:none;background:none;font:inherit;font-size:14px;font-weight:500;color:var(--sb-fg);cursor:pointer;text-align:left;
    width:calc(100% - 20px)}
  .sb-org:hover{background:var(--sb-hover)}
  .sb-org .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sb-org .mi{color:var(--sb-ic);font-size:20px}
  .av{width:28px;height:28px;border-radius:50%;flex-shrink:0;color:#fff;display:flex;align-items:center;
    justify-content:center;font-size:14px;font-weight:500;position:relative}
  .sb-org .av,.sw-head .av{border-radius:7px}
  .av .dot{position:absolute;top:-1px;right:-2px;width:9px;height:9px;border-radius:50%;background:#F0A33A;
    border:1.5px solid #fff}
  .sb-scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;padding:0 10px 10px}
  .sb-sec{display:flex;flex-direction:column;gap:2px;flex-shrink:0}
  .sb-sec + .sb-sec{margin-top:16px}
  .sb-sec.bottom{margin-top:auto;padding-top:16px}
  .sb-label{padding:4px 10px 6px;color:var(--sb-muted);font-size:14px;font-weight:500}
  .sb-item{display:flex;align-items:center;gap:12px;min-height:36px;padding:0 6px 0 10px;border-radius:8px;
    color:var(--sb-fg);font-size:14px;text-decoration:none;position:relative;flex-shrink:0;transition:background .12s}
  .sb-item:hover{background:var(--sb-hover)}
  .sb-item .mi{color:var(--sb-ic);font-size:20px;flex-shrink:0}
  .sb-item .lb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sb-item .chev{color:var(--sb-ic);font-size:20px}
  .sb-item.on{background:var(--sb-on-bg);color:var(--sb-on-fg);font-weight:500}
  .sb-item.on .mi{color:var(--sb-on-fg)}
  .sb-item:focus-visible,.sb-item a:focus-visible,.sb-org:focus-visible{outline:2px solid #0053CC;outline-offset:-2px}
  .sb-group{display:flex;align-items:center;gap:12px;min-height:36px;padding:0 6px 0 10px;border-radius:8px;width:100%;
    border:none;background:none;font:inherit;font-size:14px;color:var(--sb-fg);cursor:pointer;text-align:left}
  .sb-group:hover{background:var(--sb-hover)}
  .sb-group .mi{color:var(--sb-ic);font-size:20px;flex-shrink:0}
  .sb-group .lb{flex:1;min-width:0}
  .sb-group:focus-visible{outline:2px solid #0053CC;outline-offset:-2px}
  .sb-sub{padding-left:30px}
  .sb-sub .mi{font-size:18px}
  .sb-new{color:#1F8940;background:#E3F3E7;border-radius:10px;padding:0 8px;font-size:14px;line-height:20px;font-weight:400}
  /* pinned admin pages: unpin on hover */
  .sb-pin .unpin{display:none;align-items:center;justify-content:center;width:28px;height:28px;border:none;
    border-radius:6px;background:none;color:var(--sb-ic);cursor:pointer;padding:0;flex-shrink:0}
  .sb-pin:hover .unpin,.sb-pin:focus-within .unpin{display:inline-flex}
  .sb-pin .unpin:hover{background:var(--sb-on-bg);color:var(--sb-on-fg)}
  .sb-pin .unpin .mf{font-size:18px}
  .promo{margin-top:16px;background:var(--sb-card);border-radius:12px;padding:14px;position:relative;flex-shrink:0}
  .promo h4{font-size:14px;font-weight:500;margin:6px 0 6px;color:var(--sb-fg)}
  .promo p{margin:0 0 12px;line-height:20px;color:var(--sb-muted)}
  .promo .x{position:absolute;top:6px;right:6px;width:28px;height:28px;color:var(--sb-ic)}
  .promo .x:hover{background:var(--sb-hover)}
  .promo .btn{width:100%;border-radius:8px}
  .promo .ill{font-size:28px;color:#0053CC}

  /* ---- org switcher ---- */
  .sw{position:absolute;top:8px;left:10px;width:320px;background:#fff;color:var(--text-primary);border-radius:12px;z-index:20;
    box-shadow:0 12px 32px rgba(16,24,40,.16),0 2px 6px rgba(16,24,40,.08);border:1px solid #E9ECF1;
    display:flex;flex-direction:column;max-height:520px;overflow:hidden}
  .sw[hidden]{display:none}
  .sw-head{display:flex;align-items:center;gap:10px;padding:10px 8px 10px 14px;border-bottom:1px solid var(--border-default)}
  .sw-head .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
  .sw-search{padding:10px;position:relative}
  .sw-search .mi{position:absolute;left:20px;top:50%;transform:translateY(-50%);color:var(--text-secondary)}
  .sw-search input{padding-left:36px;font-size:14px;border-radius:8px;background:#F7F8FA}
  .sw-list{overflow-y:auto;padding:0 6px 8px}
  .sw-opt{display:flex;align-items:center;gap:12px;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:14px}
  .sw-opt .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sw-opt .av{width:24px;height:24px;border-radius:6px}
  .sw-opt.hl{background:#F2F4F7}
  .sw-opt mark{background:none;color:inherit;font-weight:500}
  .sw-empty{padding:8px;color:var(--text-secondary)}
  .sw-label{padding:4px 8px 6px;font-weight:500;color:var(--text-secondary)}


  /* ---- top bar + content ---- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .top{height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:flex-end;gap:28px;
    padding:0 24px;border-bottom:1px solid var(--border-default)}
  .top .more{font-style:italic;color:var(--text-link);text-decoration:none}
  .top .trial b{color:var(--color-primary);font-weight:500;font-size:16px}
  .top .how{color:var(--color-primary);text-decoration:none}
  .top .mi{color:var(--color-primary);font-size:24px}
  .content{flex:1;overflow:auto;padding:20px 12px 40px}
  h1{font-size:24px;font-weight:400;margin:0 0 8px}

  /* Administrative functions */
  .af-head{display:flex;align-items:baseline;gap:16px;margin-bottom:8px}
  .af-cap{display:flex;align-items:center;gap:6px;color:var(--color-red)}
  .af-cap .mi{font-size:18px}
  .af-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0 24px}
  .af-grp h2{font-size:18px;font-weight:700;margin:16px 0 4px}
  .af-grp:first-child h2{margin-top:4px}
  .af-row{display:flex;align-items:center;min-height:28px}
  .af-row a{color:var(--text-link);text-decoration:none}
  .af-row a:hover{text-decoration:underline}
  .pin{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;margin-left:2px;opacity:0;
    border:none;border-radius:4px;background:none;padding:0;cursor:pointer;color:var(--text-muted)}
  .pin .mi,.pin .mf{font-size:18px}
  .af-row:hover .pin,.pin:focus-visible,.pin[aria-pressed="true"]{opacity:1}
  .af-row:hover .pin,.pin:focus-visible{color:var(--text-secondary)}
  .pin:hover{background:var(--color-grey-5);color:var(--color-primary)!important}
  .pin[aria-pressed="true"]{color:var(--color-primary)}
  .pin[aria-disabled="true"]{cursor:not-allowed;color:var(--text-muted)!important;background:none!important}

  /* Organizations list */
  .flt{display:grid;grid-template-columns:repeat(6,1fr);gap:8px 20px;padding:4px 8px 16px;border-bottom:1px solid var(--border-default)}
  .flt label{display:block;margin-bottom:4px}
  .flt .apply{grid-column:1/-1}
  .orgs{overflow-x:auto;max-width:100%}
  .orgs .synder-table th,.orgs .synder-table td{white-space:normal;vertical-align:middle;padding-left:8px;padding-right:8px}
  .orgs .synder-table td{overflow-wrap:anywhere}
  .orgs .synder-table td.act{overflow-wrap:normal}
  .orgs .synder-table td:nth-child(1){min-width:130px} .orgs .synder-table td:nth-child(6){min-width:150px} .orgs .synder-table td:nth-child(7){min-width:170px}
  .orgs .synder-table td.multi{white-space:pre-line;line-height:20px}
  .orgs .synder-table th.num,.orgs .synder-table td.num{text-align:right}
  .orgs a{color:var(--text-link);text-decoration:none}
  .orgs a:hover{text-decoration:underline}
  .orgs td.act,.orgs th.act{text-align:right;white-space:nowrap;position:sticky;right:0;z-index:1;
    box-shadow:-1px 0 0 var(--border-default)}

  /* Organization page */
  .bar{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 16px}
  .bar .btn,.bar .btn-success,.bar .btn-error{height:32px;padding:0 12px}
  .org-wrap{display:grid;grid-template-columns:1fr 1fr;gap:32px}
  .org-top{display:flex;align-items:center;gap:12px;margin:0 0 12px}
  .org-top h1{margin:0}
  .org-status{display:inline-flex;align-items:center;gap:6px;border-radius:12px;padding:2px 10px;font-size:14px;line-height:20px}
  .org-status.sel{background:#E3F3E7;color:#1F8940}
  .org-status.not{background:var(--color-grey-5);color:var(--text-secondary);border:1px solid var(--border-default)}
  .org-status .mi{font-size:16px}
  .org-h2{font-size:22px;font-weight:400;margin:0 0 10px}
  .kv{width:100%;border-collapse:collapse}
  .kv th,.kv td{border:1px solid var(--border-default);padding:8px 10px;text-align:left;vertical-align:top;font-size:14px}
  .kv th{width:34%;font-weight:500;background:var(--color-grey-5)}
  .side h2{font-size:22px;font-weight:400;margin:0 0 10px}
  .side section{border-bottom:1px solid var(--border-default);padding-bottom:16px;margin-bottom:16px}
  .side ul{margin:0;padding-left:0;list-style:none;line-height:22px}

  .stub-note{color:var(--text-secondary);margin-top:8px}
  .sr{position:absolute;left:0;top:0;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="app">
  <nav class="sb" aria-label="Main" id="sb">
    <button class="sb-org" id="org-btn" aria-haspopup="listbox" aria-expanded="false" onclick="openSwitcher()">
      <span class="av" id="org-av"></span><span class="nm" id="org-nm"></span><span class="mi">expand_more</span>
    </button>
    <div class="sb-scroll" id="sb-items"></div>
    <div class="sw" id="sw" hidden role="dialog" aria-label="Switch organization">
      <div class="sw-head"><span class="av" id="sw-av"></span><span class="nm" id="sw-nm"></span>
        <button class="btn-icon" aria-label="Close" onclick="closeSwitcher(true)"><span class="mi">expand_less</span></button></div>
      <div class="sw-search"><span class="mi">search</span>
        <input type="search" id="sw-q" placeholder="Search all organizations" autocomplete="off"
          role="combobox" aria-controls="sw-list" aria-expanded="true" aria-autocomplete="list"></div>
      <div class="sw-list" id="sw-list" role="listbox" aria-label="Organizations"></div>
    </div>
  </nav>
  <div class="main">
    <div class="top">
      <a class="more" href="#">Add more syncs &gt;</a>
      <span class="trial">Trial syncs : <b>0</b></span>
      <a class="how" href="#">How it works?</a>
      <span class="mi">notifications</span>
      <span class="mi">help_outline</span>
      <span class="mi">person</span>
    </div>
    <main class="content" id="content"></main>
  </div>
</div>
<div class="sr" aria-live="polite" id="live"></div>

<script>
/* ---------- data ---------- */
// Administrative functions — groups, labels and order captured from the live page (2026-10-13).
var CATALOG = [
  { col: 0, title: 'Organizations', items: [
    ['organizations','Organizations','corporate_fare'], ['unsubscribed','Unsubscribed','unsubscribe'],
    ['clients','Clients','groups'], ['current-org','Current organization admin page','admin_panel_settings'],
    ['demo-data','Demo Data','dataset'] ]},
  { col: 0, title: 'Users and firms', items: [ ['users','Users','person'], ['firms','Firms','business_center'] ]},
  { col: 1, title: 'Syncs and transactions', items: [
    ['syncs-history','Syncs history','history'], ['sync-balance','Sync balance history (Beta)','account_balance'],
    ['payout-trace','Payout Trace','route'], ['linked-entity','Linked Entity Search','manage_search'],
    ['categorizations','Categorizations','category'] ]},
  { col: 2, title: 'Diagnostics and health', items: [
    ['org-health','Org Health Check','health_and_safety'], ['health-hub','Health Hub','monitor_heart'],
    ['shadow-recon','Shadow Reconciliation','compare_arrows'], ['live-flow','Live flow','stream'],
    ['o2c','Order to cash diagram BETA','account_tree'], ['jobs','Jobs Dashboard','work_history'] ]},
  { col: 2, title: 'Configuration and audit', items: [
    ['config-audit','Custom configurations audit logs','fact_check'], ['revrec-standalone','Revenue recognition standalone','price_check'],
    ['sync-credits','Sync Credits','toll'] ]},
  { col: 3, title: 'Smart rules administration', items: [ ['template-groups','Template groups','folder_copy'], ['action-builder','Action Builder','build'] ]},
  { col: 3, title: 'JS modifications', items: [ ['js-scripts','JS Scripts','code'], ['executions','Executions','play_circle'] ]},
  { col: 3, title: 'Outreach', items: [ ['contact','Contact them','contact_mail'], ['simple-email','Simple email','mail'] ]}
];
var PAGES = {};
CATALOG.forEach(function(g){ g.items.forEach(function(i){ PAGES[i[0]] = { key: i[0], label: i[1], icon: i[2] }; }); });
var PIN_CAP = 10, PIN_KEY = 'synder-admin-pins';

var COLORS = ['#D06C84','#C9C97E','#C7B497','#6FA38B','#A345B2','#D9476F','#5B8FD6','#E08A3C','#4FA3A5','#8A6BC2'];
function org(id, name, mine, dot, country, extra){
  return Object.assign({ id: id, name: name, mine: !!mine, dot: !!dot, country: country || 'US',
    industry: 'AUTOMOTIVE', gp: '0.00', rev: '0 - 250K', plan: '', providers: '', cc: '', syncs: 0,
    created: '2026-09-15 10:12:40 UTC', onb: 'true' }, extra || {});
}
// Admin's own orgs — names captured from the switcher; customer orgs — rows captured from the Organizations list.
var ORGS = [
  org('pt3','PT_3 (copy) (2140)', 1, 0, 'LT', { plan:'TRIAL (INSIGHTS)\nPRO (SYNC)', providers:'intuit(ACTIVE)\nstripe(ACTIVE)\nshopify(ACTIVE)', cc:'LT, US, DE', syncs: 412, created:'2026-08-02 14:20:11 UTC' }),
  org('rp11','11. REvRecPayment (88)', 1),
  org('bpt','Barbara Test Per Transaction (402)', 1, 1),
  org('bx','Barbara Xero test (601)', 1, 1),
  org('dst','DS taxes (copy) (713)', 1),
  org('nt','No txns (copy) (59)', 1),
  org('rre','RevRec + Excel + Sync (120)', 1),
  org('rro','RevRec - Oct 21st (copy) (77)', 1),
  org('rrs','RevRec Standalone - test (64)', 1),
  org('rrr','RevrRec Reconcile (copy) (31)', 1),
  org('sar','Summary Am Rec (318)', 1, 1),
  org('c1','Shopify txnrecon', 0, 0, 'RS', { gp:'9,795.77', plan:'TRIAL (INSIGHTS)\nPRO (SYNC) Yearly 2880.00000 USD', providers:'custom(ACTIVE)\nintuit(ACTIVE)\nshopify(ACTIVE)\nshopify(ACTIVE)\nshopify(ACTIVE)', cc:'RS, US, FR,', syncs:100, created:'2026-10-12 09:06:47 UTC' }),
  org('c2','SD-18428_Rules_UK(onboardcus)', 0, 0, 'PL', { gp:'44,379.70', plan:'TRIAL (INSIGHTS)\nTRIAL (SYNC)\nTRIAL_SMART_RULE (SYNC)', providers:'intuit(ACTIVE)\nstripe(ACTIVE)', cc:'GB, US', syncs:2, created:'2026-10-12 06:54:56 UTC' }),
  org('c3','test excel', 0, 0, 'US', { industry:'ENTERTAINMENT', created:'2026-10-09 18:33:28 UTC', onb:'false' }),
  org('c4','Xero Reconciliation (After)', 0, 0, 'RS', { plan:'TRIAL (INSIGHTS)\nPRO (SYNC) Yearly 2880.00000 USD', providers:'stripe(ACTIVE)\nxero(ACTIVE)', cc:'US', syncs:191, created:'2026-10-06 11:35:49 UTC' }),
  org('c5','Test', 0, 0, 'RS', { providers:'intuit(ACTIVE)\nstripe(WAITING_INITIALIZATION)', cc:'CA, US', created:'2026-09-30 17:57:43 UTC', onb:'false' }),
  org('c6','Intuit_onboarding', 0, 0, 'PL', { gp:'21,339.97', plan:'TRIAL (SYNC)\nTRIAL (DAILY_SUMMARY)\nTRIAL (INSIGHTS)', providers:'intuit(CONNECTION_LOST)\nstripe(ACTIVE)\nwoocommerce(ACTIVE)', cc:'US', created:'2026-09-30 12:56:24 UTC' }),
  // mock customer orgs
  org('c7','Acme Outdoor Supply', 0, 0, 'US', { industry:'RETAIL', gp:'182,410.00', rev:'1M - 5M', plan:'PRO (SYNC) Yearly 2880.00000 USD', providers:'intuit(ACTIVE)\nshopify(ACTIVE)', cc:'US', syncs:5480, created:'2025-03-11 08:14:02 UTC' }),
  org('c8','Bloom & Branch Florals', 0, 0, 'GB', { industry:'RETAIL', gp:'38,920.10', rev:'250K - 1M', plan:'MEDIUM (SYNC)', providers:'xero(ACTIVE)\nsquare(ACTIVE)', cc:'GB', syncs:1204, created:'2025-11-02 16:40:19 UTC' }),
  org('c9','Northwind SaaS Ltd', 0, 0, 'IE', { industry:'SOFTWARE', gp:'640,003.55', rev:'5M+', plan:'PRO (SYNC)\nPRO (REVREC)', providers:'netsuite(ACTIVE)\nstripe(ACTIVE)', cc:'IE, US', syncs:22018, created:'2024-06-21 09:00:00 UTC' }),
  org('c10','Shopify Plus Demo Store', 0, 0, 'CA', { industry:'RETAIL', gp:'12,004.00', plan:'TRIAL (SYNC)', providers:'intuit(ACTIVE)\nshopify(ACTIVE)', cc:'CA', syncs:48, created:'2026-10-10 13:22:51 UTC' }),
  org('c11','Stripe Connect Marketplace', 0, 0, 'US', { industry:'SERVICES', gp:'97,330.12', rev:'1M - 5M', plan:'SCALE (SYNC)', providers:'intuit(ACTIVE)\nstripe(ACTIVE)\nstripe(ACTIVE)', cc:'US', syncs:9930, created:'2025-01-08 07:51:33 UTC' }),
  org('c12','Tea Leaf Collective', 0, 0, 'AU', { industry:'FOOD & BEVERAGE', gp:'8,410.40', plan:'STARTER (SYNC)', providers:'xero(ACTIVE)\nwoocommerce(ACTIVE)', cc:'AU', syncs:310, created:'2026-05-19 22:03:10 UTC' })
];
ORGS.forEach(function(o, i){ o.color = COLORS[i % COLORS.length]; });
function byId(id){ for (var i = 0; i < ORGS.length; i++) if (ORGS[i].id === id) return ORGS[i]; }
function initials(n){ return n.replace(/[^A-Za-z0-9]/g, '').slice(0, 2).toUpperCase(); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]; }); }
function avatar(o){ return '<span style="background:' + o.color + '">' + esc(initials(o.name)) + (o.dot ? '<span class="dot"></span>' : '') + '</span>'; }

/* ---------- state ---------- */
var current = 'pt3', route = 'admin', promo = true;
var pins = (function(){
  try { var s = JSON.parse(localStorage.getItem(PIN_KEY)); if (Array.isArray(s)) return s.filter(function(k){ return PAGES[k]; }); } catch(e){}
  return ['organizations'];   // new admins start with Organizations pinned
})();
function savePins(){ try { localStorage.setItem(PIN_KEY, JSON.stringify(pins)); } catch(e){} }
function announce(t){ var l = document.getElementById('live'); l.textContent = ''; setTimeout(function(){ l.textContent = t; }, 30); }

function togglePin(key, fromPage){
  var i = pins.indexOf(key), next = pins[i + 1] || pins[i - 1];
  if (i >= 0) { pins.splice(i, 1); announce(PAGES[key].label + ' unpinned'); }
  else if (pins.length >= PIN_CAP) return;
  else { pins.push(key); announce(PAGES[key].label + ' pinned to the sidebar'); }
  savePins(); renderSidebar(); if (route === 'admin') renderContent(fromPage ? key : null);
  if (!fromPage) {   // unpinned from the sidebar: keep focus in the sidebar
    var t = next && document.querySelector('.sb-pin[data-pin="' + next + '"] .unpin');
    (t || document.getElementById('sb-admin')).focus();
  }
}

/* ---------- sidebar ---------- */
function renderOrg(){
  var o = byId(current);
  ['org-av','sw-av'].forEach(function(id){ var el = document.getElementById(id); el.style.background = o.color; el.innerHTML = esc(initials(o.name)) + (o.dot ? '<span class="dot"></span>' : ''); });
  document.getElementById('org-nm').textContent = o.name;
  document.getElementById('sw-nm').textContent = o.name;
  document.getElementById('org-btn').setAttribute('aria-label', 'Organization: ' + o.name + '. Switch organization');
}
function sbItem(r, icon, label, extra){
  var on = route === r;
  return '<a class="sb-item' + (on ? ' on' : '') + '" href="#' + r + '"' + (on ? ' aria-current="page"' : '') + '>'
       + '<span class="mi">' + icon + '</span><span class="lb">' + label + '</span>' + (extra || '') + '</a>';
}
var txOpen = false;
function renderSidebar(){
  var chev = '<span class="mi chev">expand_more</span>';

/* ---------- org switcher ---------- */
var hl = 0, shown = [];
function openSwitcher(){
  var sw = document.getElementById('sw'), q = document.getElementById('sw-q');
  sw.hidden = false; document.getElementById('org-btn').setAttribute('aria-expanded', 'true');
  q.value = ''; renderSwitch(); q.focus();
}
function closeSwitcher(refocus){
  document.getElementById('sw').hidden = true; document.getElementById('org-btn').setAttribute('aria-expanded', 'false');
  if (refocus) document.getElementById('org-btn').focus();
}
var RECENT_KEY = 'synder-admin-recent-orgs', RECENT_MAX = 8;
var recent = (function(){
  try { var r = JSON.parse(localStorage.getItem(RECENT_KEY)); if (Array.isArray(r)) return r.filter(byId); } catch(e){}
  return ['c4','c1','c6','c9','c11'];   // mock history so the section is populated on first open
})();
function renderSwitch(){
  var q = document.getElementById('sw-q').value.trim().toLowerCase();
  // empty query → Recently viewed only (support has no orgs of its own); typed query → every organization, by name
  var rec = q ? [] : recent.filter(function(id){ return id !== current; }).slice(0, RECENT_MAX).map(byId);
  var rest = q ? ORGS.filter(function(o){ return o.id !== current && o.name.toLowerCase().indexOf(q) >= 0; }) : [];
  shown = rec.concat(rest);
  hl = 0;
  function opt(o, i, pre){
    var nm = esc(o.name);
    if (q) { var at = o.name.toLowerCase().indexOf(q); nm = esc(o.name.slice(0, at)) + '<mark>' + esc(o.name.slice(at, at + q.length)) + '</mark>' + esc(o.name.slice(at + q.length)); }
    return '<div class="sw-opt' + (i === 0 ? ' hl' : '') + '" role="option" id="opt-' + pre + o.id + '" aria-selected="' + (i === 0) + '" data-id="' + o.id + '" onmousedown="event.preventDefault()" onclick="selectOrg(\'' + o.id + '\')" onmousemove="setHl(' + i + ')">'
         + avatar(o).replace('<span style', '<span class="av" style') + '<span class="nm">' + nm + '</span></div>';
  }
  var h = '';
  if (rec.length) h += '<div role="group" aria-labelledby="sw-rec-l" id="sw-recent"><div class="sw-label" id="sw-rec-l">Recently viewed</div>'
    + rec.map(function(o, i){ return opt(o, i, 'r-'); }).join('') + '</div>';
  h += rest.map(function(o, i){ return opt(o, rec.length + i, ''); }).join('');
  document.getElementById('sw-list').innerHTML = shown.length ? h
    : '<div class="sw-empty" id="sw-empty">' + (q ? 'No organizations found' : 'No recently viewed organizations') + '</div>';
  var first = document.querySelector('#sw-list .sw-opt');
  document.getElementById('sw-q').setAttribute('aria-activedescendant', first ? first.id : '');
}
function setHl(i){
  var opts = document.querySelectorAll('#sw-list .sw-opt');
  if (!opts.length) return;
  hl = (i + opts.length) % opts.length;
  opts.forEach(function(el, j){ el.classList.toggle('hl', j === hl); el.setAttribute('aria-selected', j === hl); });
  opts[hl].scrollIntoView({ block: 'nearest' });
  document.getElementById('sw-q').setAttribute('aria-activedescendant', opts[hl].id);
}
document.getElementById('sw-q').addEventListener('input', renderSwitch);
document.getElementById('sw-q').addEventListener('keydown', function(e){
  if (e.key === 'ArrowDown') { e.preventDefault(); setHl(hl + 1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); setHl(hl - 1); }
  else if (e.key === 'Enter') { e.preventDefault(); if (shown[hl]) selectOrg(shown[hl].id); }
  else if (e.key === 'Escape') { e.preventDefault(); closeSwitcher(true); }
});
document.addEventListener('mousedown', function(e){
  var sw = document.getElementById('sw');
  if (!sw.hidden && !sw.contains(e.target) && !document.getElementById('org-btn').contains(e.target)) closeSwitcher(false);
});

// Same result as the green "Select Organization" button: the admin sees the org as a normal user.
function selectOrg(id, dest){
  dest = dest || 'dashboard';   // row Select on the Organizations list lands on Transactions list (most used page)
  var prev = current;
  current = id; closeSwitcher(false); renderOrg();
  // the org being left is the most recently viewed one
  recent = [id, prev].concat(recent.filter(function(r){ return r !== id && r !== prev; })).slice(0, RECENT_MAX + 1);
  try { localStorage.setItem(RECENT_KEY, JSON.stringify(recent)); } catch(e){}
  announce('Switched to ' + byId(id).name);
  if (location.hash === '#' + dest) render(); else location.hash = dest;
  setTimeout(function(){ var h = document.querySelector('#content h1'); if (h) h.focus(); }, 0);
}

       + '</tr></thead><tbody>' + (rows.length ? rows.map(function(o){
         return '<tr data-id="' + o.id + '"><td><a href="#org/' + o.id + '">' + esc(o.name) + '</a></td><td>' + o.country + '</td><td>' + o.industry + '</td>'
              + '<td class="num">' + o.gp + '</td><td>' + o.rev + '</td><td class="multi">' + esc(o.plan) + '</td><td class="multi">' + esc(o.providers) + '</td>'
              + '<td>' + esc(o.cc) + '</td><td class="num">' + o.syncs + '</td><td>' + o.created + '</td><td>' + o.onb + '</td>'
              + '<td class="act"><button class="btn-outlined row-select" aria-label="Select ' + esc(o.name) + '" onclick="selectOrg(\'' + o.id + '\', \'tx/list\')">Select</button></td></tr>';
       }).join('') : '<tr><td colspan="12">No organizations found</td></tr>') + '</tbody></table></div>';
}

    ['Find in HubSpot', '<a href="#">' + esc(o.name) + '</a>'], ['Country', o.country], ['Onboarding finished', o.onb], ['Archived', 'false'],
    ['Inventory Enabled', 'false'], ['Demo allowed', 'true'], ['Potential Large Plus', 'false'], ['Dedicated server', '<a href="#">not assigned</a>'],
    ['Queues', '<a href="#">Show active queues</a>'], ['Cin7 integration', 'false']];

       + '<div class="bar">'
       // already selected: no button — the status chip next to the name carries the state
       + (sel ? '' : '<button class="btn btn-success" id="btn-select-org" onclick="selectOrg(\'' + o.id + '\')"><span class="mi" style="font-size:18px">check</span>Select Organization</button>')
       + '<button class="btn"><span class="mi" style="font-size:18px">edit</span>Edit Organization</button>'
       + '<button class="btn btn-error"><span class="mi" style="font-size:18px">archive</span>Archive</button>'
       + '<button class="btn btn-error"><span class="mi" style="font-size:18px">close</span>Delete Transactions</button>'
       + '<button class="btn btn-error"><span class="mi" style="font-size:18px">close</span>Delete Organization</button>'
       + '<button class="btn btn-success">Send Sync Purchase Event</button><button class="btn btn-success">Send Insights Purchase Event</button>'
       + '<button class="btn btn-success">Analyze integrations</button></div>'
       + '<div class="org-wrap"><div><h2 class="org-h2">Organization details</h2>'
       + '<table class="kv"><tbody>' + kv.map(function(r){ return '<tr><th>' + r[0] + '</th><td>' + r[1] + '</td></tr>'; }).join('') + '</tbody></table></div>'
       + '<div class="side"><section><h2>Firms</h2><ul><li><a href="#">My great firm</a></li><li>Partner tier: NONE</li><li>Relation: firm colleague</li></ul></section>'
       + '<section><h2>Users</h2><ul><li>▸ ignatiy.plotnikov@synder.com — manager</li><li>▸ andrew.shitsko@synder.com — manager</li></ul></section>'
       + '<section><h2>Companies</h2><ul>' + esc(o.providers || 'synder(ACTIVE)').split('\n').map(function(p){ return '<li>▸ ' + p + '</li>'; }).join('') + '</ul></section></div></div>';

var LABELS = { dashboard:'Dashboard', 'tx/list':'Transactions list', 'tx/import':'Import activity log', 'tx/recon':'Transaction reconciliation', 'smart-rules':'Smart rules', invoicing:'Invoicing', analytics:'Analytics',
  troubleshooting:'Troubleshooting', insights:'Business Insights (A)', revrec:'Revenue recognition', settings:'Settings', 'ai-hub':'AI Hub',
  'whats-new':'What\'s New', 'custom-dev':'Custom development' };
function pageStub(title){ return '<h1 tabindex="-1">' + esc(title) + '</h1>' + STUB; }

function renderContent(focusPin){
  var c = document.getElementById('content'), m;
  if (route === 'admin') c.innerHTML = pageAdmin();
  else if (route === 'p/organizations') c.innerHTML = pageOrgs();
  else if ((m = route.match(/^org\/(.+)$/))) c.innerHTML = pageOrg(m[1]);
  else if ((m = route.match(/^p\/(.+)$/)) && PAGES[m[1]]) c.innerHTML = pageStub(PAGES[m[1]].label);
  else if (route === 'dashboard') c.innerHTML = '<h1 tabindex="-1">Dashboard</h1><p class="stub-note">' + esc(byId(current).name) + ' · [live page not captured]</p>';
  else c.innerHTML = pageStub(LABELS[route] || 'Page');
  if (focusPin) { var b = c.querySelector('.pin[data-key="' + focusPin + '"]'); if (b) b.focus(); }
}
function render(){
  route = (location.hash || '#admin').slice(1) || 'admin';
  if (/^tx\//.test(route)) txOpen = true;   // landing on a Transactions subpage opens its group
  renderSidebar(); renderContent();
}
window.addEventListener('hashchange', function(){ render(); var h = document.querySelector('#content h1'); if (h) h.focus({ preventScroll: true }); });
renderOrg(); render();
</script>
