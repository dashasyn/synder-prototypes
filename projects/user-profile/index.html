<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>User profile</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">
<link rel="stylesheet" href="../../ui-kit/synder-ui-kit.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined">
<style>
  /* Every text is >= 14px. Shell = live chrome (sidebar, top bar) as captured on demo.synderapp.com 2026-10-14
     in "Per transaction test dasha" and "Summary_test". Desktop only (min 1280). */
  html,body{height:100%}
  input,select,textarea,button{font-family:inherit;font-size:14px}
  body{display:flex;flex-direction:column;min-width:1280px;font-size:14px;color:var(--text-primary);
    background:var(--color-white);overflow:hidden}

  /* demo control — deliberately not product chrome */
  .demo-bar{display:flex;align-items:center;gap:12px;background:var(--color-grey);color:var(--color-white);
    padding:8px 20px;flex-shrink:0;font-size:14px}
  .demo-bar .vs-label{font-weight:500;letter-spacing:.01em;opacity:.75;text-transform:uppercase;font-size:14px}
  .demo-bar .vs-opts{display:flex;gap:4px;background:rgba(255,255,255,.1);border-radius:6px;padding:3px}
  .demo-bar .vs-opts button{background:none;border:none;color:rgba(255,255,255,.7);font-size:14px;padding:5px 12px;
    border-radius:4px;cursor:pointer;white-space:nowrap}
  .demo-bar .vs-opts button:hover{color:var(--color-white)}
  .demo-bar .vs-opts button.on{background:var(--color-white);color:var(--text-primary);font-weight:500}
  .demo-bar .sep{width:1px;height:20px;background:rgba(255,255,255,.2)}
  .demo-bar .reset{margin-left:auto;background:rgba(255,255,255,.1);border:none;color:rgba(255,255,255,.85);
    font-size:14px;padding:4px 12px;border-radius:4px;cursor:pointer}

  .mi{font-family:'Material Icons Outlined';font-weight:normal;font-style:normal;font-size:20px;line-height:1;
    display:inline-block;-webkit-font-smoothing:antialiased;font-feature-settings:'liga';text-transform:none;
    letter-spacing:normal;white-space:nowrap;vertical-align:middle}

  /* live app shell */
  .app{flex:1;display:flex;min-height:0;background:var(--color-white);position:relative}
  .sb{width:230px;flex-shrink:0;border-right:1px solid var(--border-default);background:var(--color-grey-5);
    display:flex;flex-direction:column;overflow-y:auto;position:relative}
  .sb-org{display:flex;align-items:center;gap:10px;height:58px;padding:0 18px;flex-shrink:0;width:100%;
    border:none;border-bottom:1px solid var(--border-default);background:none;font:inherit;font-size:14px;
    font-weight:500;color:var(--text-primary);cursor:pointer;text-align:left}
  .sb-org:hover{background:var(--color-grey-10)}
  .sb-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:14px;flex-shrink:0}
  .sb-av.pt{background:#F5C6CB;color:#B23B4B} .sb-av.sm{background:#E6D3F0;color:#7B3FA0}
  .sb-org .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sb-org .mi{color:var(--text-secondary)}
  .sb-item{display:flex;align-items:center;gap:10px;min-height:42px;padding:0 18px;color:var(--text-primary);
    border-bottom:1px solid var(--border-default);font-size:14px;text-decoration:none;flex-shrink:0;cursor:pointer}
  .sb-item .mi{color:var(--color-primary);font-size:20px}
  .sb-item .chev{margin-left:auto;color:var(--color-primary)}
  .sb-item:hover{background:var(--color-grey-10)}
  .sb-beta{color:var(--color-primary);background:var(--color-primary-10);border-radius:4px;padding:0 5px;font-size:14px;line-height:20px}
  .sb-gap{height:42px;border-bottom:1px solid var(--border-default);flex-shrink:0}
  .org-menu{position:absolute;top:60px;left:8px;right:8px;z-index:50;background:var(--color-white);
    border:1px solid var(--border-default);border-radius:var(--radius-md);box-shadow:var(--shadow-dropdown);padding:4px 0}
  .org-menu button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px;border:none;background:none;
    font:inherit;font-size:14px;color:var(--text-primary);cursor:pointer;text-align:left}
  .org-menu button:hover{background:var(--bg-hover)}
  .org-menu button.cur{font-weight:500}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .top{height:58px;flex-shrink:0;display:flex;align-items:center;justify-content:flex-end;gap:24px;padding:0 24px;
    border-bottom:1px solid var(--border-default);position:relative}
  .syncs{color:var(--text-secondary);border-bottom:3px solid var(--color-primary);padding:6px 0;font-size:16px}
  .syncs b{color:var(--color-primary);font-weight:500;font-size:18px}
  .top .mi{color:var(--color-primary);font-size:26px}
  .top .how{color:var(--color-primary);font-size:16px}
  .icon-btn{background:none;border:none;padding:0;cursor:pointer;display:flex;align-items:center}
  .user-menu{position:absolute;right:16px;top:54px;z-index:50}
  .user-menu .dropdown-item{cursor:pointer}
  .content{flex:1;overflow:auto;position:relative;display:flex;flex-direction:column;padding:0;margin:0;max-width:none}
  .page{padding:20px 16px 40px;flex:1}

  /* page */
  h1.pt{font-size:28px;font-weight:400;margin:0 0 20px;color:var(--text-primary)}
  .tabs{padding:0}
  .tab{background:none;border-top:none;border-left:none;border-right:none;font-family:inherit}
  .tab .dot{width:8px;height:8px;border-radius:50%;background:var(--color-yellow);display:inline-block}
  .sec{max-width:560px;margin-top:8px}
  .sec h2{font-size:20px;font-weight:400;margin:0 0 4px}
  .sec .sub{color:var(--text-secondary);margin:0 0 16px}
  .card{border:1px solid var(--border-default);border-radius:var(--radius-sm);background:var(--color-white);padding:20px;margin-top:12px}
  .f{margin-bottom:16px}
  .f label,.f .lbl{display:block;font-weight:700;margin-bottom:4px}
  .f input{width:100%;height:36px}
  .f input[readonly]{background:var(--color-grey-5);color:var(--text-secondary);cursor:default}
  .f input[readonly]:hover{border-color:var(--border-default)}
  .f input[aria-invalid=true]{border-color:var(--border-error)}
  .err{color:var(--color-red);margin-top:4px}
  .pw{position:relative}
  .pw input{padding-right:40px}
  .pw .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;
    color:var(--text-secondary);padding:4px;display:flex}
  .row{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:40px}
  .row + .row{border-top:1px solid var(--border-default)}
  .row label{cursor:pointer;flex:1}
  .org-line{display:flex;align-items:center;gap:10px;font-weight:500;padding-bottom:12px;border-bottom:1px solid var(--border-default)}
  .actions{display:flex;align-items:center;gap:12px;margin-top:20px}
  .unsaved{color:var(--color-yellow);font-weight:500;display:inline-flex;align-items:center;gap:6px}
  .unsaved .mi{font-size:18px}
  .link{color:var(--color-primary);background:none;border:none;padding:0;cursor:pointer;font-size:14px;text-decoration:none}
  .link:hover{text-decoration:underline}
  .forgot{margin-top:16px;padding-top:16px;border-top:1px solid var(--border-default)}
  .muted{color:var(--text-secondary)}

  /* live footer (captured) */
  .foot{background:var(--color-grey-5);border-top:1px solid var(--border-default);padding:32px 32px 24px;display:flex;gap:140px;flex-shrink:0}
  .foot h4{font-size:18px;font-weight:400;margin:0 0 10px}
  .foot p{margin:0 0 10px}
  .foot a{color:var(--color-primary);text-decoration:none}

  /* toasts — live toast layout */
  #toasts{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:2000;display:flex;flex-direction:column;gap:8px;width:480px}
  .toast{position:relative;display:flex;align-items:flex-start;gap:12px;color:var(--color-white);border-radius:4px;
    padding:14px 40px 16px 16px;box-shadow:var(--shadow-modal);font-size:16px;line-height:24px}
  .toast.err{background:var(--color-red)} .toast.ok{background:var(--color-green)}
  .toast > .mi{font-size:24px}
  .toast-x{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--color-white);cursor:pointer;padding:2px}
  .modal-bg{z-index:1500}
  .modal{width:480px}
  .modal .synder-modal-body{color:var(--text-primary)}
</style>
</head>
<body>

<div class="demo-bar" id="demo-bar">
  <span class="vs-label">Demo</span>
  <span>User</span>
  <div class="vs-opts">
    <button id="pw-yes" class="on">Has a password</button>
    <button id="pw-no">Signed up with Google</button>
  </div>
  <span class="sep"></span>
  <span>Password check</span>
  <div class="vs-opts">
    <button id="srv-ok" class="on">Succeeds</button>
    <button id="srv-bad">Wrong current password</button>
  </div>
  <button class="reset" id="demo-reset">Reset</button>
</div>

<div class="app">
  <nav class="sb" aria-label="Main" id="sb"></nav>
  <div class="main">
    <div class="top" id="top"></div>
    <div class="content">
      <div class="page" id="screen"></div>
      <div class="foot">
        <div><h4>About</h4><p><a>Synder</a></p><p>v11.7.101</p><p>© 2026 All Rights Reserved.</p></div>
        <div><h4>Contact us</h4><p><b>Email:</b> <a>help@synder.com</a></p><p><b>Synder guides:</b> <a>Ask your question</a></p></div>
        <div><h4>Legal</h4><p><a>Privacy Policy</a></p><p><a>Terms of service</a></p></div>
      </div>
    </div>
  </div>
</div>
<div id="toasts" aria-live="assertive"></div>
<div id="modal-root"></div>

<script>
/* Copy provenance
   captured  shell (sidebar items per org type, top bar, user menu, footer), page title, tab names, "Personal details",
             "Sidebar sections", its description, org card + 3 switch labels, "Change password", "Notify about offers
             and services" (live label, kept as the switch's name), field set, the "set a new one" email idea —
             demo.synderapp.com/userProfile/index, 2026-10-14.
   proposed  sentence-case labels, "Save changes", unsaved line + tab dot, leave-tab modal, inline password errors,
             show/hide, "Forgot your password?" link, Google-user "Set a password" card, all toasts, email note. */
var ORGS = {
  pt: { id:'pt', name:'Per transaction test dasha', av:'PE' },
  sm: { id:'sm', name:'Summary_test', av:'SU' }
};
var USER = { email:'dasha.aibot@synder.com' };
var TABS = [ ['general','General'], ['notif','Notification'], ['ui','UI settings'], ['pw','Change password'] ];
var UI_KEYS = [ ['invoicing','Invoicing'], ['smartRules','Smart rules'], ['analytics','Analytics'] ];

function fresh(){
  return {
    org:'pt', tab:'general', hasPw:true, srvBad:false, orgMenu:false, userMenu:false, modal:null,
    saved: {
      general: { firstName:'Dasha', lastName:'', phone:'' },
      notif:   { marketing:false },
      ui:      { pt:{ invoicing:true, smartRules:true, analytics:true }, sm:{ invoicing:true, smartRules:true, analytics:true } }
    },
    draft: null, pwShow:{}, pwErr:{}, pwTried:false, sent:false
  };
}
var S = fresh();
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function resetDrafts(){
  S.draft = { general:clone(S.saved.general), notif:clone(S.saved.notif), ui:clone(S.saved.ui[S.org]),
              pw:{ cur:'', next:'', conf:'' } };
  S.pwErr = {}; S.pwTried = false;
}
resetDrafts();

function dirty(tab){
  var d = S.draft;
  if (tab === 'general') return JSON.stringify(d.general) !== JSON.stringify(S.saved.general);
  if (tab === 'notif') return d.notif.marketing !== S.saved.notif.marketing;
  if (tab === 'ui') return JSON.stringify(d.ui) !== JSON.stringify(S.saved.ui[S.org]);
  if (tab === 'pw') return !!(d.pw.cur || d.pw.next || d.pw.conf);
  return false;
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }

/* ---------- shell ---------- */
function renderShell(){
  var o = ORGS[S.org], pt = S.org === 'pt', ui = S.saved.ui[S.org];
  function it(icon, label, extra){ return '<div class="sb-item"><span class="mi">' + icon + '</span>' + label + (extra || '') + '</div>'; }
  var chev = '<span class="mi chev">expand_more</span>';
  var h = '<button class="sb-org" id="org-btn" aria-haspopup="menu" aria-expanded="' + S.orgMenu + '"><span class="sb-av ' + S.org + '">' + o.av + '</span>'
        + '<span class="nm">' + o.name + '</span><span class="mi">expand_more</span></button>';
  if (S.orgMenu) h += '<div class="org-menu" role="menu">' + ['pt','sm'].map(function(k){
      return '<button role="menuitem" data-org="' + k + '"' + (k === S.org ? ' class="cur"' : '') + '><span class="sb-av ' + k + '">' + ORGS[k].av + '</span>' + ORGS[k].name + '</button>'; }).join('') + '</div>';
  h += it('dashboard', 'Dashboard');
  if (pt) {
    h += it('swap_horiz', 'Transactions', chev) + it('storefront', 'Inventory sync <span class="sb-beta">Beta</span>');
    if (ui.smartRules) h += it('account_tree', 'Smart rules', chev);
    if (ui.invoicing) h += it('shopping_cart', 'Invoicing', chev);
    if (ui.analytics) h += it('trending_up', 'Analytics', chev);
    h += it('price_check', 'Revenue recognition', chev);
  } else {
    h += it('sync', 'Mapping', chev) + it('swap_horiz', 'Summaries', chev) + it('vertical_split', 'Reconciliation', chev)
       + it('shopping_cart', 'Products and services');
    if (ui.analytics) h += it('trending_up', 'Analytics', chev);
    h += it('event_note', 'Revenue recognition');
  }
  h += '<div class="sb-gap"></div>' + it('hub', 'AI Hub') + it('stars', 'What\'s New') + it('settings', 'Settings');
  var sb = document.getElementById('sb'); sb.innerHTML = h;
  document.getElementById('org-btn').onclick = function(){ S.orgMenu = !S.orgMenu; S.userMenu = false; renderShell(); };
  sb.querySelectorAll('[data-org]').forEach(function(b){ b.onclick = function(){ S.orgMenu = false; guard({ org:b.dataset.org }); }; });
  sb.querySelectorAll('.sb-item').forEach(function(b){ b.onclick = function(){ guard({ away:b.textContent.replace('expand_more','').trim() }); }; });

  var top = '<span class="syncs">' + (pt ? 'Syncs left : <b>1000</b>' : 'Balance : <b>0</b>') + '</span>'
          + '<span class="how">How it works?</span><span class="mi">notifications</span><span class="mi">help_outline</span>'
          + '<button class="icon-btn" id="user-btn" aria-label="User menu" aria-haspopup="menu"><span class="mi">person</span><span class="mi" style="font-size:20px">expand_more</span></button>';
  if (S.userMenu) top += '<div class="dropdown-menu show user-menu" role="menu">'
          + ['Organization settings','Activity log','User profile','List of organizations','Log out'].map(function(x){
              return '<div class="dropdown-item" role="menuitem" data-um="' + x + '">' + x + '</div>'; }).join('') + '</div>';
  var tp = document.getElementById('top'); tp.innerHTML = top;
  document.getElementById('user-btn').onclick = function(){ S.userMenu = !S.userMenu; S.orgMenu = false; renderShell(); };
  tp.querySelectorAll('[data-um]').forEach(function(b){ b.onclick = function(){ S.userMenu = false; renderShell();
    if (b.dataset.um !== 'User profile') guard({ away:b.dataset.um }); }; });
}

/* ---------- leaving with unsaved changes ---------- */
function guard(p){
  if (p.tab && p.tab === S.tab) return;
  if (dirty(S.tab)) { S.modal = { kind:'unsaved', pending:p }; renderModal(); return; }
  proceed(p);
}
function proceed(p){
  if (p.tab) { S.tab = p.tab; render(); return; }
  if (p.org && p.org !== S.org) { S.org = p.org; resetDrafts(); }
  render();
}
function discard(tab){
  var d = S.draft;
  if (tab === 'general') d.general = clone(S.saved.general);
  if (tab === 'notif') d.notif = clone(S.saved.notif);
  if (tab === 'ui') d.ui = clone(S.saved.ui[S.org]);
  if (tab === 'pw') { d.pw = { cur:'', next:'', conf:'' }; S.pwErr = {}; S.pwTried = false; }
}
var SEC_NAME = { general:'personal details', notif:'notification settings', ui:'sidebar sections', pw:'new password' };
function renderModal(){
  var root = document.getElementById('modal-root'), m = S.modal;
  if (!m) { root.innerHTML = ''; return; }
  var t = S.tab, isPw = t === 'pw';
  var title = isPw ? 'Discard the new password?' : 'Save changes to ' + SEC_NAME[t] + '?';
  var body = isPw ? 'The password stays the same until you click Change password.' : '';
  var foot = '<button class="btn btn-text" id="m-keep">Keep editing</button><button class="btn btn-outlined" id="m-discard">Discard</button>'
           + (isPw ? '' : '<button class="btn" id="m-save">Save</button>');
  root.innerHTML = '<div class="modal-bg show" id="modal-bg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">'
    + '<div class="synder-modal-header" id="m-title">' + title + '</div>'
    + (body ? '<div class="synder-modal-body">' + body + '</div>' : '')
    + '<div class="synder-modal-footer">' + foot + '</div></div></div>';
  var bg = document.getElementById('modal-bg');
  function close(){ S.modal = null; renderModal(); }
  bg.onclick = function(e){ if (e.target === bg) close(); };
  document.getElementById('m-keep').onclick = close;
  document.getElementById('m-discard').onclick = function(){ var p = m.pending; close(); discard(t); proceed(p); };
  var sv = document.getElementById('m-save');
  if (sv) sv.onclick = function(){ var p = m.pending; close(); save(t); proceed(p); };
  document.getElementById('m-keep').focus();
}
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') { if (S.modal) { S.modal = null; renderModal(); } else if (S.orgMenu || S.userMenu) { S.orgMenu = S.userMenu = false; renderShell(); } } });
document.addEventListener('click', function(e){
  if ((S.orgMenu && !e.target.closest('.org-menu') && !e.target.closest('#org-btn')) ||
      (S.userMenu && !e.target.closest('.user-menu') && !e.target.closest('#user-btn'))) { S.orgMenu = S.userMenu = false; renderShell(); }
});
window.addEventListener('beforeunload', function(e){ if (dirty(S.tab)) { e.preventDefault(); e.returnValue = ''; } });

/* ---------- toasts (no Undo) ---------- */
function toast(kind, msg){
  var box = document.getElementById('toasts'), el = document.createElement('div');
  el.className = 'toast ' + kind; el.setAttribute('role', kind === 'err' ? 'alert' : 'status');
  el.innerHTML = '<span class="mi">' + (kind === 'err' ? 'error' : 'check_circle') + '</span><div class="toast-msg">' + msg + '</div>'
    + '<button class="toast-x" aria-label="Close"><span class="mi">close</span></button>';
  el.querySelector('.toast-x').onclick = function(){ el.remove(); };
  box.appendChild(el);
  setTimeout(function(){ if (el.parentNode) el.remove(); }, 6000);
}

/* ---------- save ---------- */
function save(tab){
  if (tab === 'general') { S.saved.general = clone(S.draft.general); toast('ok', 'Personal details saved'); }
  if (tab === 'notif') { S.saved.notif = clone(S.draft.notif); toast('ok', 'Notification settings saved'); }
  if (tab === 'ui') { S.saved.ui[S.org] = clone(S.draft.ui); toast('ok', 'Sidebar updated for ' + ORGS[S.org].name); }
  render();
}
function pwErrors(){
  var p = S.draft.pw, e = {};
  if (S.hasPw && !p.cur) e.cur = 'Enter your current password';
  if (!p.next) e.next = 'Enter a new password';
  if (!p.conf) e.conf = 'Repeat the new password';
  else if (p.next && p.conf !== p.next) e.conf = 'Passwords don\'t match';
  return e;
}
function savePw(){
  S.pwTried = true; S.pwErr = pwErrors();
  if (Object.keys(S.pwErr).length) { render(); focusFirstErr(); return; }
  if (S.srvBad && S.hasPw) { S.pwErr = { cur:'Current password is incorrect' }; render(); focusFirstErr(); return; }
  S.draft.pw = { cur:'', next:'', conf:'' }; S.pwTried = false;
  toast('ok', 'Password changed'); render();
}
function focusFirstErr(){ var el = document.querySelector('#screen [aria-invalid=true]'); if (el) el.focus(); }

/* ---------- screen ---------- */
function actions(tab, label){
  var d = dirty(tab);
  return '<div class="actions"><button class="btn" id="save"' + (d ? '' : ' disabled') + '>' + label + '</button>'
    + (d ? '<span class="unsaved" id="unsaved"><span class="mi">edit</span>Unsaved changes</span><button class="btn btn-text" id="discard">Discard</button>' : '')
    + '</div>';
}
function field(id, label, val, opts){
  opts = opts || {};
  var err = S.pwErr[id];
  var input = '<input class="input" id="f-' + id + '" type="' + (opts.type || 'text') + '" value="' + esc(val) + '"'
    + (opts.readonly ? ' readonly aria-readonly="true"' : '') + (opts.ac ? ' autocomplete="' + opts.ac + '"' : '')
    + (err ? ' aria-invalid="true" aria-describedby="e-' + id + '"' : '') + '>';
  if (opts.pw) input = '<div class="pw">' + input.replace('type="text"', 'type="' + (S.pwShow[id] ? 'text' : 'password') + '"')
      + '<button class="eye" type="button" data-eye="' + id + '" aria-label="' + (S.pwShow[id] ? 'Hide' : 'Show') + ' password"><span class="mi">'
      + (S.pwShow[id] ? 'visibility_off' : 'visibility') + '</span></button></div>';
  return '<div class="f"><label for="f-' + id + '">' + label + '</label>' + input
    + (opts.note ? '<div class="muted" style="margin-top:4px">' + opts.note + '</div>' : '')
    + (err ? '<div class="err" id="e-' + id + '">' + err + '</div>' : '') + '</div>';
}
function sw(id, label, on){
  return '<div class="row"><label for="s-' + id + '">' + label + '</label><input type="checkbox" class="switch" role="switch" id="s-' + id + '"' + (on ? ' checked' : '') + '></div>';
}

function render(){
  renderShell();
  var t = S.tab, d = S.draft, h = '<h1 class="pt">User profile</h1><div class="tabs" role="tablist">';
  TABS.forEach(function(x){
    h += '<button class="tab' + (x[0] === t ? ' active' : '') + '" role="tab" aria-selected="' + (x[0] === t) + '" data-tab="' + x[0] + '">' + x[1]
      + (x[0] === t && dirty(t) ? '<span class="dot" title="Unsaved changes" aria-label="Unsaved changes"></span>' : '') + '</button>';
  });
  h += '</div><div class="sec" role="tabpanel">';
  if (t === 'general') {
    h += '<h2>Personal details</h2><div class="card">'
      + field('email', 'Email', USER.email, { readonly:true })
      + field('firstName', 'First name', d.general.firstName, { ac:'given-name' })
      + field('lastName', 'Last name', d.general.lastName, { ac:'family-name' })
      + field('phone', 'Phone', d.general.phone, { type:'tel', ac:'tel' })
      + actions('general', 'Save changes') + '</div>';
  } else if (t === 'notif') {
    h += '<h2>Notifications</h2><p class="sub">Emails we send to ' + USER.email + '</p><div class="card">'
      + sw('marketing', 'Notify about offers and services', d.notif.marketing)
      + actions('notif', 'Save changes') + '</div>';
  } else if (t === 'ui') {
    var o = ORGS[S.org];
    h += '<h2>Sidebar sections</h2><p class="sub">The sections you see in the left menu of the organization opened now. Only you see this change, and only in this organization.</p>'
      + '<div class="card"><div class="org-line" id="ui-org"><span class="sb-av ' + S.org + '">' + o.av + '</span>' + o.name + '</div>'
      + UI_KEYS.map(function(k){ return sw(k[0], k[1], d.ui[k[0]]); }).join('')
      + actions('ui', 'Save changes') + '</div>';
  } else {
    if (S.hasPw) {
      h += '<h2>Change password</h2><div class="card">'
        + field('cur', 'Current password', d.pw.cur, { pw:true, ac:'current-password' })
        + field('next', 'New password', d.pw.next, { pw:true, ac:'new-password' })
        + field('conf', 'Confirm new password', d.pw.conf, { pw:true, ac:'new-password' })
        + '<div class="actions"><button class="btn" id="save-pw"' + (dirty('pw') ? '' : ' disabled') + '>Change password</button>'
        + (dirty('pw') ? '<button class="btn btn-text" id="discard">Discard</button>' : '') + '</div>'
        + '<div class="forgot" id="forgot">' + (S.sent ? '<span id="sent-line">Reset link sent to ' + USER.email + '. </span><button class="link" id="send">Send again</button>'
            : 'Forgot your current password? <button class="link" id="send">Email me a reset link</button>') + '</div></div>';
    } else {
      h += '<h2>Set a password</h2><p class="sub">You sign in with Google. Set a password to also sign in with your email.</p><div class="card" id="setpw">'
        + (S.sent ? '<p style="margin:0 0 12px" id="sent-line">Link sent to ' + USER.email + '. It opens a page where you set the password.</p>' : '')
        + '<button class="btn' + (S.sent ? ' btn-outlined' : '') + '" id="send">' + (S.sent ? 'Send again' : 'Email me a link') + '</button></div>';
    }
  }
  h += '</div>';
  var sc = document.getElementById('screen'); sc.innerHTML = h;

  sc.querySelectorAll('[data-tab]').forEach(function(b){ b.onclick = function(){ guard({ tab:b.dataset.tab }); }; });
  function bindText(key, obj){ var el = document.getElementById('f-' + key); if (!el || el.readOnly) return;
    el.oninput = function(){ obj[key] = this.value; if (S.tab === 'pw' && S.pwTried) S.pwErr = pwErrors(); refresh(el); }; }
  if (t === 'general') ['firstName','lastName','phone'].forEach(function(k){ bindText(k, d.general); });
  if (t === 'pw') ['cur','next','conf'].forEach(function(k){ bindText(k, d.pw); });
  if (t === 'notif') document.getElementById('s-marketing').onchange = function(){ d.notif.marketing = this.checked; render(); document.getElementById('s-marketing').focus(); };
  if (t === 'ui') UI_KEYS.forEach(function(k){ document.getElementById('s-' + k[0]).onchange = function(){ d.ui[k[0]] = this.checked; render(); document.getElementById('s-' + k[0]).focus(); }; });
  sc.querySelectorAll('[data-eye]').forEach(function(b){ b.onclick = function(){ var id = b.dataset.eye; S.pwShow[id] = !S.pwShow[id]; render(); var el = document.getElementById('f-' + id); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }; });
  var s = document.getElementById('save'); if (s) s.onclick = function(){ save(t); };
  var sp = document.getElementById('save-pw'); if (sp) sp.onclick = savePw;
  var ds = document.getElementById('discard'); if (ds) ds.onclick = function(){ discard(t); render(); };
  var sn = document.getElementById('send'); if (sn) sn.onclick = function(){ S.sent = true; toast('ok', (S.hasPw ? 'Reset link' : 'Link') + ' sent to ' + USER.email); render(); };
}
/* re-render but keep the caret in the field being typed in */
function refresh(el){
  var id = el.id, pos = el.selectionStart; render();
  var n = document.getElementById(id); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch(e){} }
}

/* ---------- demo bar ---------- */
function setOpt(onId, offId){ document.getElementById(onId).classList.add('on'); document.getElementById(offId).classList.remove('on'); }
document.getElementById('pw-yes').onclick = function(){ S.hasPw = true; S.sent = false; setOpt('pw-yes','pw-no'); discard('pw'); render(); };
document.getElementById('pw-no').onclick = function(){ S.hasPw = false; S.sent = false; setOpt('pw-no','pw-yes'); discard('pw'); render(); };
document.getElementById('srv-ok').onclick = function(){ S.srvBad = false; setOpt('srv-ok','srv-bad'); };
document.getElementById('srv-bad').onclick = function(){ S.srvBad = true; setOpt('srv-bad','srv-ok'); };
document.getElementById('demo-reset').onclick = function(){ S = fresh(); resetDrafts(); setOpt('pw-yes','pw-no'); setOpt('srv-ok','srv-bad'); renderModal(); render(); };
render();
</script>
</body>
</html>
