<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITCS DatNet — Notifications</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, Helvetica, sans-serif; background: #fff; color: #2d3748; font-size: 13px; }

  /* ── Top nav (existing ITCS DatNet chrome) ── */
  .nav { background: #1a2535; color: #fff; height: 44px; display: flex; align-items: center; padding: 0 12px; position: sticky; top: 0; z-index: 1000; }
  .nav-logo { display: flex; align-items: center; gap: 8px; margin-right: 8px; font-weight: 700; font-size: 14px; color: #7ec8e3; }
  .nav-items { display: flex; height: 100%; }
  .nav-item { padding: 0 13px; height: 100%; display: flex; align-items: center; gap: 4px; font-size: 13px; color: #b8c5d3; cursor: pointer; white-space: nowrap; }
  .nav-item:hover { background: rgba(255,255,255,0.08); color: #fff; }
  .nav-item.active { background: rgba(255,255,255,0.12); color: #fff; }
  .nav-right { margin-left: auto; display: flex; align-items: center; gap: 14px; font-size: 13px; color: #b8c5d3; }
  .nav-bell-wrap { position: relative; cursor: pointer; width: 30px; height: 30px; border-radius: 4px; display: flex; align-items: center; justify-content: center; }
  .nav-bell-wrap:hover { background: rgba(255,255,255,0.10); }
  .nav-bell-wrap.pulse { animation: bellPulse .5s ease; }
  @keyframes bellPulse { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-12deg); } 75% { transform: rotate(12deg); } }
  .nav-bell-badge { position: absolute; top: -1px; right: -3px; background: #e53e3e; color: #fff; border-radius: 10px; padding: 1px 4px; font-size: 10px; font-weight: 700; min-width: 17px; text-align: center; line-height: 14px; border: 1.5px solid #1a2535; }
  .nav-bell-badge.hidden { display: none; }
  .nav-lang { padding: 2px 8px; border: 1px solid #4a5568; border-radius: 3px; font-size: 12px; cursor: pointer; }
  .nav-user { width: 26px; height: 26px; border-radius: 50%; background: #0053CC; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }

  /* ── Dimmed page behind ── */
  .layout { display: flex; min-height: calc(100vh - 44px); }
  .sidebar { width: 40px; background: #f8f9fc; border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 4px; flex-shrink: 0; }
  .sb-btn { width: 32px; height: 32px; border-radius: 4px; display: flex; align-items: center; justify-content: center; color: #a0aec0; font-size: 15px; }
  .sb-btn.active { background: #e8edf8; color: #0053CC; }
  .content { flex: 1; padding: 18px 24px; }
  .page-title { font-size: 20px; font-weight: 600; color: #1a202c; margin-bottom: 4px; }
  .page-sub { color: #718096; margin-bottom: 18px; }
  .skel-card { border: 1px solid #e2e8f0; border-radius: 4px; padding: 14px; margin-bottom: 10px; max-width: 900px; }
  .skel-line { height: 9px; background: #edf0f5; border-radius: 3px; margin-bottom: 8px; }
  .hint { display: inline-flex; align-items: center; gap: 8px; background: #e8edf8; color: #0053CC; border: 1px solid #c3d4f0; border-radius: 4px; padding: 8px 12px; margin-bottom: 18px; font-size: 13px; }

  /* ── Backdrop + sheet ── */
  .backdrop { position: fixed; inset: 0; background: rgba(15,23,42,.28); opacity: 0; pointer-events: none; transition: opacity .22s ease; z-index: 1400; }
  .backdrop.open { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; top: 0; right: 0; bottom: 0; width: 424px; background: #fff; box-shadow: -4px 0 24px rgba(15,23,42,.16); z-index: 1500; transform: translateX(100%); transition: transform .24s cubic-bezier(.4,0,.2,1); display: flex; flex-direction: column; overflow: hidden; }
  .sheet.open { transform: translateX(0); }

  /* panels slide inside the same sheet */
  .panes { flex: 1; position: relative; overflow: hidden; }
  .pane { position: absolute; inset: 0; display: flex; flex-direction: column; background: #fff; transition: transform .24s cubic-bezier(.4,0,.2,1); }
  .pane-detail { transform: translateX(100%); }
  .sheet.detail .pane-list { transform: translateX(-22%); }
  .sheet.detail .pane-detail { transform: translateX(0); }

  /* ── Sheet header ── */
  .sh-head { display: flex; align-items: center; gap: 8px; padding: 14px 14px 12px; border-bottom: 1px solid #edf0f5; flex-shrink: 0; }
  .sh-title { font-size: 15px; font-weight: 600; color: #1a202c; }
  .sh-icon-btn { margin-left: auto; width: 28px; height: 28px; border: none; background: none; border-radius: 4px; cursor: pointer; color: #718096; font-size: 15px; display: flex; align-items: center; justify-content: center; }
  .sh-icon-btn:hover { background: #f1f4f9; color: #2d3748; }
  .back-btn { display: flex; align-items: center; gap: 7px; border: none; background: none; cursor: pointer; font-size: 13px; color: #0053CC; font-family: inherit; padding: 3px 6px 3px 0; border-radius: 4px; }
  .back-btn:hover { text-decoration: underline; }

  /* ── Tabs ── */
  .tabs { display: flex; padding: 0 14px; border-bottom: 1px solid #edf0f5; flex-shrink: 0; gap: 4px; }
  .tab { border: none; background: none; font-family: inherit; font-size: 13px; color: #718096; padding: 9px 10px 8px; cursor: pointer; border-bottom: 2px solid transparent; display: flex; align-items: center; gap: 6px; }
  .tab:hover { color: #2d3748; }
  .tab.active { color: #0053CC; border-bottom-color: #0053CC; font-weight: 600; }
  .tab-count { background: #edf0f5; color: #4a5568; border-radius: 9px; font-size: 11px; padding: 1px 6px; font-weight: 600; }
  .tab.active .tab-count { background: #e8edf8; color: #0053CC; }

  .sh-actions { display: flex; align-items: center; padding: 7px 14px; border-bottom: 1px solid #edf0f5; flex-shrink: 0; min-height: 36px; }
  .link-btn { border: none; background: none; font-family: inherit; font-size: 12px; color: #0053CC; cursor: pointer; padding: 2px 0; }
  .link-btn:hover { text-decoration: underline; }
  .link-btn:disabled { color: #a0aec0; cursor: default; text-decoration: none; }
  .sh-actions .muted { margin-left: auto; font-size: 11px; color: #a0aec0; }

  /* ── List ── */
  .list { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
  .day-sep { position: sticky; top: 0; background: #fafbfd; border-bottom: 1px solid #edf0f5; padding: 5px 14px; font-size: 11px; font-weight: 700; color: #8494a8; text-transform: uppercase; letter-spacing: .4px; z-index: 2; }

  .row { position: relative; display: flex; gap: 9px; padding: 11px 34px 11px 14px; border-bottom: 1px solid #f2f4f8; cursor: pointer; }
  .row::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--sev); }
  .row:hover { background: #f7f9fc; }
  .row.unread { background: #f5f8ff; }
  .row.unread:hover { background: #eef4ff; }
  .row.new-arrival { animation: slideIn .4s ease; }
  @keyframes slideIn { from { background: #fff4d6; } to { background: #f5f8ff; } }

  .row-dot { width: 7px; height: 7px; border-radius: 50%; background: #0053CC; flex-shrink: 0; margin-top: 5px; }
  .row.read .row-dot { background: transparent; }
  .row-sev { flex-shrink: 0; width: 15px; margin-top: 2px; display: flex; }
  .row-body { min-width: 0; flex: 1; }
  .row-text { color: #1a202c; line-height: 1.42; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .row.read .row-text { color: #5a6b80; }
  /* nowrap + right-aligned time: the meta line must never wrap to a second row */
  .row-meta { display: flex; align-items: center; gap: 6px; margin-top: 5px; font-size: 11px; color: #8494a8; flex-wrap: nowrap; overflow: hidden; }
  .row-meta .row-time { margin-left: auto; padding-left: 6px; flex-shrink: 0; }
  .row-meta .chip { overflow: hidden; text-overflow: ellipsis; }
  .chip { border-radius: 3px; padding: 1px 6px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .chip-critical { background: #fde8e8; color: #c22; }
  .chip-warning  { background: #fdf0d5; color: #96650a; }
  .chip-info     { background: #e8edf8; color: #0053CC; }
  .chip-delta    { background: #fde8e8; color: #c22; }
  .dot-sep { color: #cbd5e0; }
  .row-x { position: absolute; top: 8px; right: 6px; width: 22px; height: 22px; border: none; background: none; border-radius: 4px; color: #a0aec0; cursor: pointer; font-size: 14px; line-height: 1; opacity: 0; transition: opacity .12s; display: flex; align-items: center; justify-content: center; }
  .row:hover .row-x { opacity: 1; }
  .row-x:hover { background: #fde8e8; color: #c22; }

  .empty { padding: 56px 30px; text-align: center; color: #8494a8; }
  .empty-ico { font-size: 30px; margin-bottom: 10px; }
  .empty-title { font-size: 14px; font-weight: 600; color: #4a5568; margin-bottom: 4px; }

  /* ── Detail pane ── */
  .detail-body { flex: 1; overflow-y: auto; padding: 16px 16px 20px; }
  .d-chips { display: flex; align-items: center; gap: 7px; margin-bottom: 10px; flex-wrap: wrap; }
  .d-chips .chip svg { vertical-align: -2px; margin-right: 2px; }
  .d-time { font-size: 11px; color: #8494a8; }
  .d-text { font-size: 14px; line-height: 1.55; color: #1a202c; margin-bottom: 16px; }
  .d-cta { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #0053CC; text-decoration: none; border: 1px solid #c3d4f0; background: #f5f8ff; border-radius: 3px; padding: 6px 12px; margin-bottom: 18px; cursor: pointer; font-family: inherit; }
  .d-cta:hover { background: #e8edf8; }
  .d-sec-title { font-size: 11px; font-weight: 700; color: #8494a8; text-transform: uppercase; letter-spacing: .4px; padding-bottom: 6px; border-bottom: 1px solid #edf0f5; margin-bottom: 2px; }
  .d-field { display: grid; grid-template-columns: 132px 1fr; gap: 10px; padding: 7px 0; border-bottom: 1px solid #f5f7fa; }
  .d-field dt { color: #8494a8; font-size: 12px; }
  .d-field dd { color: #2d3748; font-size: 12px; word-break: break-word; }
  .detail-foot { border-top: 1px solid #edf0f5; padding: 10px 16px; display: flex; gap: 8px; flex-shrink: 0; }
  .btn { font-family: inherit; font-size: 13px; padding: 6px 14px; border-radius: 3px; cursor: pointer; }
  .btn-ghost { background: #fff; border: 1px solid #cbd5e0; color: #4a5568; }
  .btn-ghost:hover { background: #f7fafc; }
  .btn-danger { background: #fff; border: 1px solid #f5c2c2; color: #c22; }
  .btn-danger:hover { background: #fde8e8; }

  /* ── Toast ── */
  .toast { position: absolute; left: 14px; right: 14px; bottom: 14px; background: #1a2535; color: #fff; border-radius: 4px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; font-size: 12px; box-shadow: 0 4px 14px rgba(15,23,42,.28); transform: translateY(150%); transition: transform .2s ease; z-index: 30; }
  .toast.show { transform: translateY(0); }
  .toast .link-btn { color: #7ec8e3; margin-left: auto; font-size: 12px; font-weight: 700; }

  /* demo controls */
  .demo { position: fixed; left: 14px; bottom: 14px; background: #fff; border: 1px solid #e2e8f0; border-radius: 4px; padding: 9px 11px; font-size: 11px; color: #718096; box-shadow: 0 2px 10px rgba(15,23,42,.08); z-index: 1600; }
  .demo b { color: #4a5568; display: block; margin-bottom: 5px; font-size: 11px; }
  .demo button { font-family: inherit; font-size: 11px; padding: 4px 9px; border: 1px solid #cbd5e0; background: #fff; border-radius: 3px; cursor: pointer; color: #4a5568; }
  .demo button:hover { background: #f7fafc; }
</style>
</head>
<body>

<div class="nav">
  <div class="nav-logo">◈ ITCS DatNet</div>
  <div class="nav-items">
    <div class="nav-item active">Dispatcher board</div>
    <div class="nav-item">Trains</div>
    <div class="nav-item">Stations</div>
    <div class="nav-item">Announcements</div>
    <div class="nav-item">Reports</div>
  </div>
  <div class="nav-right">
    <div class="nav-bell-wrap" id="bell" title="Notifications">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span class="nav-bell-badge hidden" id="badge">0</span>
    </div>
    <div class="nav-lang">EN</div>
    <div class="nav-user">DS</div>
  </div>
</div>

<div class="layout">
  <div class="sidebar">
    <div class="sb-btn active">▤</div>
    <div class="sb-btn">◎</div>
    <div class="sb-btn">◫</div>
    <div class="sb-btn">⚙</div>
  </div>
  <div class="content">
    <div class="page-title">Dispatcher board</div>
    <div class="page-sub">Tel Aviv control centre · shift 12:00–20:00</div>
    <div class="hint">↗ Click the bell in the top bar to open notifications</div>
    <div class="skel-card"><div class="skel-line" style="width:32%"></div><div class="skel-line" style="width:78%"></div><div class="skel-line" style="width:60%"></div></div>
    <div class="skel-card"><div class="skel-line" style="width:26%"></div><div class="skel-line" style="width:88%"></div><div class="skel-line" style="width:54%"></div></div>
    <div class="skel-card"><div class="skel-line" style="width:38%"></div><div class="skel-line" style="width:70%"></div></div>
  </div>
</div>

<div class="demo">
  <b>Prototype controls</b>
  <button id="btn-incoming">Simulate incoming</button>
  <button id="btn-reset">Reset data</button>
</div>

<div class="backdrop" id="backdrop"></div>

<div class="sheet" id="sheet">
  <div class="panes">
    <!-- ── LIST PANE ── -->
    <div class="pane pane-list">
      <div class="sh-head">
        <div class="sh-title">Notifications</div>
        <button class="sh-icon-btn" id="close-1" title="Close">✕</button>
      </div>
      <div class="tabs">
        <button class="tab active" data-tab="unread">Unread <span class="tab-count" id="c-unread">0</span></button>
        <button class="tab" data-tab="all">All <span class="tab-count" id="c-all">0</span></button>
      </div>
      <div class="sh-actions">
        <button class="link-btn" id="mark-all">Mark all as read</button>
        <span class="muted" id="live-note">Updates automatically</span>
      </div>
      <div class="list" id="list"></div>
    </div>

    <!-- ── DETAIL PANE ── -->
    <div class="pane pane-detail">
      <div class="sh-head">
        <button class="back-btn" id="back">‹ Notifications</button>
        <button class="sh-icon-btn" id="close-2" title="Close">✕</button>
      </div>
      <div class="detail-body" id="detail-body"></div>
      <div class="detail-foot">
        <button class="btn btn-danger" id="d-delete">Delete</button>
        <button class="btn btn-ghost" id="d-unread">Mark as unread</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"><span id="toast-msg"></span><button class="link-btn" id="toast-undo">Undo</button></div>
</div>

<script>
/* ────────────── Data ──────────────
   Fields mirror the 14 columns of the current table. Empty values are simply
   omitted from the detail view instead of being rendered as "-".            */
/* Inline SVG rather than emoji — emoji fonts are unreliable on ops workstations
   and read as informal in a control-centre UI. */
const SEV_ICON = {
  critical: `<svg viewBox="0 0 20 20" width="15" height="15" fill="#e53e3e"><circle cx="10" cy="10" r="9"/><rect x="9" y="5" width="2" height="7" fill="#fff" rx="1"/><circle cx="10" cy="14.6" r="1.2" fill="#fff"/></svg>`,
  warning:  `<svg viewBox="0 0 20 20" width="15" height="15" fill="#e9a13b"><path d="M10 1.6 19 17.6H1z"/><rect x="9" y="7" width="2" height="5.4" fill="#fff" rx="1"/><circle cx="10" cy="15" r="1.1" fill="#fff"/></svg>`,

};
const SEV_COLOR = { critical: '#e53e3e', warning: '#e9a13b', info: '#0053CC' };
const SEV_LABEL = { critical: 'Critical', warning: 'Warning', info: 'Info' };

function n(o) { return Object.assign({ read: true, severity: 'info', module: 'OPS' }, o); }

      text: 'RB/11 1174 Train 74 from Ashdod to Tel Aviv has been cancelled. Passengers are advised to use the following service at 11:38.',
      f: { line: 'RB/11', train: '1174', from: 'ASH', to: 'TLV', destination: 'Tel Aviv', event: 'Cancellation' } }),
  n({ id: 17, ts: '2026-08-04T09:33', severity: 'info', module: 'OPS', type: 'Announcement',
      text: 'Ticket office at Modi\'in Central opens at 06:00 from Sunday, one hour earlier than before.',
      f: { station: 'Modi\'in Central' } }),

  // ── 2–3 Aug 2026 ──
  n({ id: 18, ts: '2026-08-03T19:12', severity: 'warning', module: 'ARAMIS', type: 'Significant delay',
      text: 'IC/21 2160 Train 60 to Haifa is expected to be delayed by 16 minutes at Netanya.',
      f: { line: 'IC/21', train: '2160', delta: '+16', from: 'BS', to: 'HFA', station: 'Netanya', destination: 'Haifa' } }),
  n({ id: 19, ts: '2026-08-03T15:40', severity: 'warning', module: 'ARAMIS', type: 'Unreported schedule deviation',
      text: 'RB/17 1716 Train 16 departed from Ashkelon 9 minutes later than scheduled. No corresponding delay forecast was received.',
      f: { line: 'RB/17', train: '1716', delta: '+9', from: 'ASH', to: 'TLV', station: 'Ashkelon', event: 'Departure' } }),
  n({ id: 20, ts: '2026-08-03T10:18', severity: 'info', module: 'OPS', type: 'Announcement',
      text: 'Planned engineering work on the Jerusalem line next weekend. Replacement buses will operate between Jerusalem and Beit Shemesh.',
      f: { line: 'RE/45', from: 'JLM', to: 'TLV' } }),
  n({ id: 21, ts: '2026-08-02T13:30', severity: 'info', module: 'OPS', type: 'Weekend timetable update',
      text: 'Updated weekend timetable published for 1–2 August. Please check journey planners before travel.',
      f: {} }),
  n({ id: 22, ts: '2026-08-02T11:05', severity: 'warning', module: 'ARAMIS', type: 'Platform changed',
      text: 'RE/45 4506 Train 06 to Tel Aviv: The platform at Beit Shemesh has changed from Platform 1 to Platform 2.',
      f: { line: 'RE/45', train: '4506', from: 'JLM', to: 'TLV', station: 'Beit Shemesh', destination: 'Tel Aviv', platform: '1', actualPlatform: '2' } }),
  n({ id: 23, ts: '2026-08-02T08:47', severity: 'critical', module: 'ARAMIS', type: 'Feed interruption',
      text: 'The ARAMIS real-time feed was unavailable for 11 minutes. Position data for 148 trains was not updated during this period.',
      f: { count: '148', event: 'Feed timeout' } }),

  // ── 1 Aug 2026 ──
  n({ id: 24, ts: '2026-08-01T17:23', severity: 'warning', module: 'ARAMIS', type: 'Significant delay',
      text: 'IC/32 3222 Train 22 to Nahariya is expected to be delayed by 12 minutes at Akko.',
      f: { line: 'IC/32', train: '3222', delta: '+12', from: 'TLV', to: 'NHR', station: 'Akko', destination: 'Nahariya' } }),
  n({ id: 25, ts: '2026-08-01T14:51', severity: 'warning', module: 'ARAMIS', type: 'Cancelled service',
      text: 'RB/17 1728 Train 28 from Tel Aviv to Ashkelon has been cancelled due to a rolling stock fault.',
      f: { line: 'RB/17', train: '1728', from: 'TLV', to: 'ASH', destination: 'Ashkelon', event: 'Cancellation' } }),
  n({ id: 26, ts: '2026-08-01T09:09', severity: 'info', module: 'OPS', type: 'Station facilities notice',
      text: 'New bicycle parking available at Be\'er Sheva North from Monday.',
      f: { station: 'Be\'er Sheva North' } }),
];

const INCOMING = [
  { severity: 'warning', module: 'ARAMIS', type: 'Significant delay',
    text: 'IC/32 3228 Train 28 to Haifa is expected to be delayed by 18 minutes at Binyamina.',
    f: { line: 'IC/32', train: '3228', delta: '+18', from: 'TLV', to: 'HFA', station: 'Binyamina', destination: 'Haifa' } },
  { severity: 'warning', module: 'ARAMIS', type: 'Platform changed',
    text: 'RE/45 4520 Train 20 to Jerusalem: The platform at Beit Shemesh has changed from Platform 2 to Platform 4.',
    f: { line: 'RE/45', train: '4520', from: 'TLV', to: 'JLM', station: 'Beit Shemesh', destination: 'Jerusalem', platform: '2', actualPlatform: '4' } },
  { severity: 'critical', module: 'ARAMIS', type: 'ARAMIS data mapping issue',
    text: 'Some ARAMIS real-time updates could not be matched to timetable data or known stations. Affected messages in the last 15 minutes: 8.',
    f: { count: '8', event: 'Mapping failure' } },
];

/* ────────────── State ────────────── */
let items = [];
let tab = 'unread';
let openId = null;
let pendingDelete = null;   // { item, index } — restored by Undo
let toastTimer = null;
let incomingIdx = 0;
let nextId = 1000;

function resetData() {
  items = SEED.map(o => Object.assign({}, o, { f: Object.assign({}, o.f) }));
  sortItems();
}
function sortItems() { items.sort((a, b) => b.ts.localeCompare(a.ts)); }   // newest first

/* ────────────── Formatting ────────────── */
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const TODAY = '2026-08-05';                                  // "now" for this prototype
const YESTERDAY = '2026-08-04';

function dayKey(ts) { return ts.slice(0, 10); }
function dayLabel(key) {
  if (key === TODAY) return 'Today';
  if (key === YESTERDAY) return 'Yesterday';
  const [y, m, d] = key.split('-');
  return `${Number(d)} ${MONTHS[Number(m) - 1]} ${y}`;
}
function timeOf(ts) { return ts.slice(11, 16); }
function fullStamp(ts) {
  const [y, m, d] = dayKey(ts).split('-');
  return `${Number(d)} ${MONTHS[Number(m) - 1]} ${y}, ${timeOf(ts)}`;
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

/* ────────────── Render: list ────────────── */
const $list = document.getElementById('list');

function visibleItems() { return tab === 'unread' ? items.filter(i => !i.read) : items; }

function renderList(newId) {
  const vis = visibleItems();
  document.getElementById('c-unread').textContent = items.filter(i => !i.read).length;
  document.getElementById('c-all').textContent = items.length;
  document.getElementById('mark-all').disabled = !items.some(i => !i.read);

  if (!vis.length) {
    $list.innerHTML = tab === 'unread'
      ? `<div class="empty"><div class="empty-ico">✓</div><div class="empty-title">You're all caught up</div><div>No unread notifications.</div></div>`
      : `<div class="empty"><div class="empty-ico">🔔</div><div class="empty-title">No notifications</div><div>Nothing has been reported yet.</div></div>`;
    return;
  }

  let html = '', lastDay = null;
  for (const it of vis) {
    const k = dayKey(it.ts);
    if (k !== lastDay) { html += `<div class="day-sep">${dayLabel(k)}</div>`; lastDay = k; }
    const delta = it.f.delta ? `<span class="chip chip-delta">${esc(it.f.delta)} min</span>` : '';
    html += `
      <div class="row ${it.read ? 'read' : 'unread'} ${it.id === newId ? 'new-arrival' : ''}"
           style="--sev:${SEV_COLOR[it.severity]}" data-id="${it.id}">
        <div class="row-dot"></div>
        <div class="row-sev">${SEV_ICON[it.severity]}</div>
        <div class="row-body">
          <div class="row-text">${esc(it.text)}</div>
          <div class="row-meta">
            <span class="chip chip-${it.severity}">${esc(it.type)}</span>
            ${delta}
            <span class="row-time">${timeOf(it.ts)}</span>
          </div>
        </div>
        <button class="row-x" data-del="${it.id}" title="Delete">✕</button>
      </div>`;
  }
  $list.innerHTML = html;
}

/* ────────────── Render: detail ────────────── */
/* Only non-empty fields are rendered — no "-" placeholders. */
const FIELD_ORDER = [
  ['line', 'Line'], ['train', 'Train number'], ['from', 'From'], ['to', 'To'],
  ['delta', 'Delay (min)'], ['station', 'Station'], ['destination', 'Destination'],
  ['platform', 'Scheduled platform'], ['actualPlatform', 'Actual platform'],
  ['event', 'Event'], ['count', 'Affected messages'],
];

function renderDetail(it) {
  const rows = FIELD_ORDER
    .filter(([k]) => it.f[k] !== undefined && it.f[k] !== '' && it.f[k] !== null)
    .map(([k, label]) => `<div class="d-field"><dt>${label}</dt><dd>${esc(it.f[k])}</dd></div>`)
    .join('');

  const cta = it.f.train
    ? `<button class="d-cta">View train ${esc(it.f.train)} on the board →</button>`
    : (it.f.station ? `<button class="d-cta">Open ${esc(it.f.station)} →</button>` : '');

  document.getElementById('detail-body').innerHTML = `
    <div class="d-chips">
      <span class="chip chip-${it.severity}">${SEV_ICON[it.severity]} ${SEV_LABEL[it.severity]}</span>
      <span class="chip chip-info">${esc(it.type)}</span>
      <span class="d-time">${esc(it.module)} · ${fullStamp(it.ts)}</span>
    </div>
    <div class="d-text">${esc(it.text)}</div>
    ${cta}
    <div class="d-sec-title">Details</div>
    <dl>${rows || '<div class="d-field"><dt>—</dt><dd>No additional fields for this notification type.</dd></div>'}</dl>`;
}

/* ────────────── Sheet open/close, navigation ────────────── */
const $sheet = document.getElementById('sheet');
const $backdrop = document.getElementById('backdrop');

function openSheet() { $sheet.classList.add('open'); $backdrop.classList.add('open'); renderList(); }
function closeSheet() { $sheet.classList.remove('open', 'detail'); $backdrop.classList.remove('open'); openId = null; hideToast(); }
function openDetail(id) {
  const it = items.find(i => i.id === id);
  if (!it) return;
  openId = id;
  it.read = true;                          // opening the detail marks it read
  renderDetail(it);
  $sheet.classList.add('detail');
  renderList();
  updateBadge();
}
function backToList() { $sheet.classList.remove('detail'); openId = null; }

/* ────────────── Delete + undo (per user) ────────────── */
function deleteItem(id) {
  const idx = items.findIndex(i => i.id === id);
  if (idx === -1) return;
  pendingDelete = { item: items[idx], index: idx };
  items.splice(idx, 1);
  if (openId === id) backToList();
  renderList();
  updateBadge();
  showToast('Notification deleted');
}
function undoDelete() {
  if (!pendingDelete) return;
  items.splice(pendingDelete.index, 0, pendingDelete.item);
  pendingDelete = null;
  sortItems();
  renderList();
  updateBadge();
  hideToast();
}
const $toast = document.getElementById('toast');
function showToast(msg) {
  document.getElementById('toast-msg').textContent = msg;
  $toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $toast.classList.remove('show'); pendingDelete = null; }, 5000);
}
function hideToast() { $toast.classList.remove('show'); clearTimeout(toastTimer); }

/* ────────────── Badge ────────────── */
function updateBadge() {
  const c = items.filter(i => !i.read).length;
  const $b = document.getElementById('badge');
  $b.textContent = c > 99 ? '99+' : c;
  $b.classList.toggle('hidden', c === 0);
}

/* ────────────── Live arrival ────────────── */
function simulateIncoming() {
  const tpl = INCOMING[incomingIdx % INCOMING.length];
  incomingIdx++;
  const it = n(Object.assign({}, tpl, {
    id: nextId++, read: false, ts: TODAY + 'T' + '14:0' + (incomingIdx % 10),
    f: Object.assign({}, tpl.f),
  }));
  items.unshift(it);
  sortItems();
  updateBadge();
  document.getElementById('bell').classList.add('pulse');
  setTimeout(() => document.getElementById('bell').classList.remove('pulse'), 500);
  if ($sheet.classList.contains('open')) { renderList(it.id); $list.scrollTop = 0; }
}

/* ────────────── Events ────────────── */
document.getElementById('bell').addEventListener('click', () => {
  $sheet.classList.contains('open') ? closeSheet() : openSheet();
});
$backdrop.addEventListener('click', closeSheet);
document.getElementById('close-1').addEventListener('click', closeSheet);
document.getElementById('close-2').addEventListener('click', closeSheet);
document.getElementById('back').addEventListener('click', backToList);

document.querySelectorAll('.tab').forEach($t => $t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  $t.classList.add('active');
  tab = $t.dataset.tab;
  renderList();
  $list.scrollTop = 0;
}));

document.getElementById('mark-all').addEventListener('click', () => {
  items.forEach(i => i.read = true);
  renderList();
  updateBadge();
});

$list.addEventListener('click', e => {
  const $del = e.target.closest('[data-del]');
  if ($del) { e.stopPropagation(); deleteItem(Number($del.dataset.del)); return; }
  const $row = e.target.closest('.row');
  if ($row) openDetail(Number($row.dataset.id));
});

document.getElementById('d-delete').addEventListener('click', () => { if (openId !== null) deleteItem(openId); });
document.getElementById('d-unread').addEventListener('click', () => {
  const it = items.find(i => i.id === openId);
  if (!it) return;
  it.read = false;
  backToList();
  renderList();
  updateBadge();
});
document.getElementById('toast-undo').addEventListener('click', undoDelete);
document.getElementById('btn-incoming').addEventListener('click', simulateIncoming);
document.getElementById('btn-reset').addEventListener('click', () => {
  resetData(); incomingIdx = 0; renderList(); updateBadge(); backToList();
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape' || !$sheet.classList.contains('open')) return;
  $sheet.classList.contains('detail') ? backToList() : closeSheet();
});

/* ────────────── Boot ────────────── */
resetData();
updateBadge();
renderList();
</script>
</body>
</html>
