<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIMS · Meldung bearbeiten — ELA-Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  /* ════════════════════════════════════════════════════════════
     Material Design 2 — same element set as the other ETC
     prototypes. Layout follows Ignat's screenshot 1:1:
     meta row › Daisy › ELA (Source · Prompt · Tonfall) ›
     Meldungen (DE | EN + audio) › Stations (Planned only).
     ════════════════════════════════════════════════════════════ */
  :root {
    --primary: #1976d2;
    --primary-dark: #1565c0;
    --nav: #1a2b52;
    --ink: rgba(0,0,0,.87);
    --ink-2: rgba(0,0,0,.6);
    --ink-3: rgba(0,0,0,.38);
    --divider: rgba(0,0,0,.12);
    --fill: #f5f5f5;
    --fill-hover: #ececec;
    --ok: #1e7b34;
    --warn: #8a5a00;
    --err: #c62828;
    --elev1: 0 1px 2px rgba(0,0,0,.10), 0 1px 3px rgba(0,0,0,.10);
    --elev2: 0 2px 4px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.10);
    --elev8: 0 8px 10px rgba(0,0,0,.14), 0 3px 14px rgba(0,0,0,.12);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #eceff1; color: var(--ink);
    font-size: 14px; line-height: 1.4; padding-bottom: 48px;
    -webkit-font-smoothing: antialiased;
  }

  /* ── the panel, as in the screenshot ── */
  .stage { display: flex; justify-content: center; padding: 20px 16px 24px; }
  .panel { background: #fff; box-shadow: var(--elev2); border-radius: 4px; width: 100%; max-width: 900px; padding: 22px 26px 26px; }
  .panel-h { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 14px; }
  .panel-t { font-size: 21px; font-weight: 400; }
  .panel-h .right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 30px; font-size: 13px; margin-bottom: 4px; }
  .meta b { font-weight: 500; color: var(--ink); }
  .meta span { color: var(--ink-2); }
  .meta .v { color: var(--ink); }

  .sec-t { font-size: 19px; font-weight: 400; margin: 26px 0 12px; }
  .sub-t { font-size: 15px; font-weight: 500; margin: 22px 0 10px; }

  /* ── language switcher ── */
  .lang-sw { display: inline-flex; border: 1px solid var(--divider); border-radius: 4px; overflow: hidden; }
  .lang-sw button { font-family: inherit; font-size: 12px; font-weight: 500; letter-spacing: .06em; padding: 6px 11px; background: #fff; border: none; cursor: pointer; color: var(--ink-2); }
  .lang-sw button + button { border-left: 1px solid var(--divider); }
  .lang-sw button.on { background: rgba(25,118,210,.12); color: var(--primary); }

  /* ── buttons (MD2) ── */
  .mbtn { height: 36px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 16px; border: none; border-radius: 4px; background: none; font-family: inherit; font-size: 14px; font-weight: 500; letter-spacing: .0892em; text-transform: uppercase; cursor: pointer; white-space: nowrap; }
  .mbtn:disabled { color: var(--ink-3) !important; background: rgba(0,0,0,.06) !important; box-shadow: none !important; border-color: transparent !important; cursor: default; }
  .mbtn-contained { background: var(--primary); color: #fff; box-shadow: var(--elev1); }
  .mbtn-contained:hover { background: var(--primary-dark); box-shadow: var(--elev2); }
  .mbtn-outlined { border: 1px solid var(--divider); color: var(--primary); background: #fff; }
  .mbtn-outlined:hover { background: rgba(25,118,210,.05); }
  .mbtn-text { color: var(--primary); }
  .mbtn-text:hover { background: rgba(25,118,210,.06); }
  .mbtn-dense { height: 32px; padding: 0 12px; font-size: 13px; }

  /* ── filled text field (MD2) ── */
  .tf { position: relative; background: var(--fill); border-radius: 4px 4px 0 0; border-bottom: 1px solid rgba(0,0,0,.42); padding: 21px 12px 5px; }
  .tf:hover { background: var(--fill-hover); }
  .tf:focus-within { border-bottom: 2px solid var(--primary); padding-bottom: 4px; }
  .tf > label { position: absolute; top: 5px; left: 12px; right: 12px; font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tf:focus-within > label { color: var(--primary); }
  .tf input, .tf select, .tf textarea { width: 100%; border: none; background: transparent; font-family: inherit; font-size: 14px; color: var(--ink); padding: 0; }
  .tf input, .tf select { height: 22px; line-height: 22px; }
  .tf textarea { resize: vertical; line-height: 1.5; }
  .tf input:focus, .tf select:focus, .tf textarea:focus { outline: none; }
  .tf select { appearance: none; -webkit-appearance: none; padding-right: 22px; cursor: pointer; }
  .tf.sel::after { content: ''; position: absolute; right: 12px; bottom: 13px; border-left: 4.5px solid transparent; border-right: 4.5px solid transparent; border-top: 5px solid var(--ink-2); pointer-events: none; }
  /* read-only field: no bottom rule, no hover — it is not an input */
  .tf.ro { background: var(--fill); border-bottom: 1px solid transparent; }
  .tf.ro:hover { background: var(--fill); }
  .tf.ro textarea, .tf.ro input { color: var(--ink-2); cursor: default; }
  .counter { font-size: 12px; color: var(--ink-2); padding: 5px 0 0 2px; }
  .hint { font-size: 12px; color: var(--ink-2); padding: 5px 0 0 2px; line-height: 1.5; }

  .row { display: flex; gap: 16px; align-items: flex-start; }
  .row > .grow { flex: 1; min-width: 0; }
  .w-interval { width: 128px; flex-shrink: 0; }
  .w-source { width: 340px; }

  /* ── ELA message boxes ── */
  .msgs { display: flex; gap: 16px; align-items: flex-start; }
  .msgs > .box { flex: 1; min-width: 0; }
  .mbox { background: var(--fill); border-radius: 4px 4px 0 0; border-bottom: 1px solid transparent; padding: 20px 12px 8px; position: relative; }
  .mbox > label { position: absolute; top: 5px; left: 12px; font-size: 12px; color: var(--ink-2); }
  /* auto-grown in JS — a reviewer must see the whole announcement, not scroll it */
  .mbox textarea { width: 100%; border: none; background: transparent; font-family: inherit; font-size: 14px; line-height: 1.55; color: var(--ink); padding: 0; resize: none; overflow: hidden; min-height: 66px; }
  .mbox textarea:focus { outline: none; }
  .mbox.focused { border-bottom: 2px solid var(--primary); padding-bottom: 7px; }
  .mbox.warn { box-shadow: inset 0 0 0 1px #f5b400; }
  .skel { height: 66px; border-radius: 3px; background: linear-gradient(90deg,#e9e9e9 25%,#dedede 37%,#e9e9e9 63%); background-size: 400% 100%; animation: sh 1.3s ease infinite; }
  @keyframes sh { 0% { background-position: 100% 50% } 100% { background-position: 0 50% } }

  /* ── the state line: caption, never a control ── */
  .state { font-size: 12px; line-height: 1.5; padding: 6px 2px 0; display: flex; align-items: flex-start; gap: 6px; color: var(--ink-2); }
  .state.g { color: var(--ok); }
  .state.b { color: var(--primary); }
  .state.a { color: var(--warn); }
  .state.r { color: var(--err); }
  .state svg { flex-shrink: 0; margin-top: 2px; }
  .state .sep { color: var(--ink-3); }

  .audio-acts { display: flex; align-items: center; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .wave { display: flex; align-items: flex-end; gap: 2px; height: 18px; width: 190px; }
  .wave i { flex: 1; background: rgba(25,118,210,.3); border-radius: 1px; }
  .wave.playing i { background: var(--primary); }
  .bar { width: 190px; height: 4px; border-radius: 2px; background: rgba(0,0,0,.1); overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--primary); }

  .divider { height: 1px; background: var(--divider); margin: 26px 0 0; }
  .foot { display: flex; align-items: center; gap: 8px; margin-top: 20px; }
  .foot .right { margin-left: auto; display: flex; gap: 8px; }

  .chip { display: inline-flex; align-items: center; height: 21px; border-radius: 11px; padding: 0 9px; font-size: 11.5px; font-weight: 500; }
  .c-grey { background: rgba(0,0,0,.07); color: var(--ink-2); }
  .c-blue { background: rgba(25,118,210,.12); color: #1565c0; }
  .c-amber { background: #fff4e0; color: var(--warn); }
  .link { color: var(--primary); cursor: pointer; background: none; border: none; font-family: inherit; font-size: inherit; padding: 0; text-decoration: underline; }

  /* ── version history drawer ── */
  .backdrop { position: fixed; inset: 0 0 48px 0; background: rgba(0,0,0,.32); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 1400; }
  .backdrop.open { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 48px; width: 500px; background: #fff; box-shadow: var(--elev8); z-index: 1500; transform: translateX(100%); transition: transform .25s cubic-bezier(.4,0,.2,1); display: flex; flex-direction: column; }
  .drawer.open { transform: translateX(0); }
  .dr-h { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-bottom: 1px solid var(--divider); }
  .dr-t { font-size: 18px; font-weight: 500; }
  .dr-b { flex: 1; overflow-y: auto; padding: 16px; }
  .icon-btn { width: 36px; height: 36px; border-radius: 50%; border: none; background: none; color: var(--ink-2); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; margin-left: auto; }
  .icon-btn:hover { background: rgba(0,0,0,.06); }
  .vrow { border: 1px solid var(--divider); border-radius: 4px; padding: 11px 12px; margin-bottom: 10px; }
  .vrow.cur { border-color: var(--primary); background: rgba(25,118,210,.04); }
  .vrow-h { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 12px; color: var(--ink-2); }
  .vrow-h .right { margin-left: auto; }
  .vrow-t { font-size: 13px; line-height: 1.5; }

  /* ── presenter bar ── */
  .presenter { position: fixed; left: 0; right: 0; bottom: 0; height: 48px; background: #263238; display: flex; align-items: center; gap: 8px; padding: 0 12px; z-index: 1700; }
  .presenter .lb { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.5); }
  .pbtn { font-family: inherit; font-size: 12.5px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; padding: 7px 12px; background: none; border: 1px solid rgba(255,255,255,.22); border-radius: 4px; color: rgba(255,255,255,.8); cursor: pointer; }
  .pbtn:hover { background: rgba(255,255,255,.08); color: #fff; }
  .pbtn.on { background: var(--primary); border-color: var(--primary); color: #fff; }
  .presenter .cap { margin-left: auto; font-size: 12.5px; color: rgba(255,255,255,.6); text-align: right; max-width: 46%; line-height: 1.35; }

  .toast { position: fixed; left: 24px; bottom: 62px; background: #323232; color: #fff; border-radius: 4px; padding: 13px 16px; font-size: 14px; z-index: 1800; box-shadow: var(--elev8); transform: translateY(180%); transition: transform .2s cubic-bezier(.4,0,.2,1); max-width: 520px; }
  .toast.show { transform: translateY(0); }
  @media (max-width: 760px) { .msgs { flex-direction: column; } .row { flex-wrap: wrap; } }
</style>
</head>
<body>

<div class="stage">
  <div class="panel">

    <div class="panel-h">
      <div>
        <div class="panel-t" id="tTitle">Meldung bearbeiten</div>
      </div>
      <div class="right">
        <div class="lang-sw">
          <button id="uiDe" class="on" onclick="setUi('de')">DE</button>
          <button id="uiEn" onclick="setUi('en')">EN</button>
        </div>
      </div>
    </div>

    <!-- meta row — Stationen mirrors Planned, no Gleis, no Actual -->
    <div class="meta" id="metaRow"></div>

    <!-- ══════════ Daisy ══════════ -->
    <div class="sec-t" id="tDaisy">Daisy</div>
    <div class="row">
      <div class="grow">
        <div class="tf ro">
          <label id="tDaisyLbl">DAISY</label>
          <textarea id="daisy" rows="2" readonly></textarea>
        </div>
        <div class="counter"><span id="daisyCount">0</span> / 160</div>
      </div>
      <div class="tf sel w-interval">
        <label id="tInterval1">Interval</label>
        <select id="intDaisy"><option>5 min</option><option>10 min</option><option>15 min</option></select>
      </div>
    </div>

    <!-- ══════════ ELA ══════════ -->
    <div class="sec-t">ELA</div>

    <div class="tf sel w-source">
      <label id="tSource">Source</label>
      <select id="source" onchange="onSource(this.value)">
        <option value="standard">Standard</option>
        <option value="library">Library</option>
        <option value="voice">Voice recording</option>
      </select>
    </div>
    <div class="hint" id="sourceHint"></div>

    <!-- Standard: prompt + zusatz + tonfall -->
    <div id="blkStandard">
      <div style="margin-top:16px">
        <div class="tf ro">
          <label id="tPrompt">Prompt</label>
          <textarea id="prompt" rows="2" readonly></textarea>
        </div>
        <div class="hint" id="tPromptHint"></div>
      </div>

      <div style="margin-top:16px">
        <div class="tf">
          <label id="tZusatz">Zusatz (optional)</label>
          <input id="zusatz" list="zusatzList" autocomplete="off">
          <datalist id="zusatzList"></datalist>
        </div>
        <div class="hint" id="tZusatzHint"></div>
      </div>

      <div class="row" style="margin-top:16px;align-items:flex-end">
        <div class="tf sel grow">
          <label id="tTonfall">Tonfall</label>
          <select id="tonfall" onchange="onTonfall(this.value)"></select>
        </div>
        <button class="mbtn mbtn-outlined" id="btnGen" onclick="generate()">GENERATE</button>
      </div>
      <div class="hint" id="tTonfallHint"></div>
    </div>

    <!-- Library -->
    <div id="blkLibrary" style="display:none;margin-top:16px">
      <div class="tf sel">
        <label id="tLibrary">Gespeicherte Meldung</label>
        <select id="library" onchange="onLibrary(this.value)"></select>
      </div>
      <div class="hint" id="tLibraryHint"></div>
    </div>

    <!-- Voice recording -->
    <div id="blkVoice" style="display:none;margin-top:16px">
      <div class="row" style="align-items:flex-end">
        <div class="tf sel grow">
          <label id="tRec">Aufnahme</label>
          <select id="rec" onchange="onRec(this.value)"></select>
        </div>
        <button class="mbtn mbtn-outlined" id="btnUpload" onclick="toast(t('uploadStub'))">UPLOAD</button>
      </div>
      <div class="hint" id="tRecHint"></div>
    </div>

    <!-- ══════════ Meldungen ══════════ -->
    <div class="sub-t" id="tMeldungen">Meldungen</div>
    <div class="row">
      <div class="grow">
        <div class="msgs">
          <div class="box">
            <div class="mbox" id="mbox-de">
              <label>ELA (DE)</label>
              <textarea id="ta-de" rows="3"
                oninput="onEdit('de',this.value)"
                onfocus="focusBox('de',1)" onblur="focusBox('de',0)"></textarea>
            </div>
            <div class="state" id="state-de"></div>
          </div>
          <div class="box">
            <div class="mbox" id="mbox-en">
              <label>ELA (EN)</label>
              <textarea id="ta-en" rows="3"
                oninput="onEdit('en',this.value)"
                onfocus="focusBox('en',1)" onblur="focusBox('en',0)"></textarea>
            </div>
            <div class="state" id="state-en"></div>
          </div>
        </div>
      </div>
      <div class="tf sel w-interval">
        <label id="tInterval2">Interval</label>
        <select id="intEla"><option>5 min</option><option>10 min</option><option>15 min</option></select>
      </div>
    </div>

    <div class="audio-acts" id="audioActs"></div>
    <div class="state" id="state-audio"></div>

    <!-- ══════════ Stations ══════════ -->
    <div class="sec-t" id="tStations">Stations</div>
    <div class="sub-t" style="margin-top:0" id="tPlanned">Planned</div>
    <div class="row">
      <div class="tf sel grow">
        <label id="tVon">Station von</label>
        <select id="stVon" onchange="onStation()">
          <option>Ernst-Reuter-Platz (Rp)</option>
          <option>Zoologischer Garten (Zo)</option>
          <option>Wittenbergplatz (Wt)</option>
          <option>Bülowstraße (Bs)</option>
        </select>
      </div>
      <div class="tf sel grow">
        <label id="tBis">Station bis</label>
        <select id="stBis" onchange="onStation()">
          <option>Nollendorfplatz (No)</option>
          <option>Gleisdreieck (Gu)</option>
          <option>Wittenbergplatz (Wt)</option>
        </select>
      </div>
    </div>

    <div class="divider"></div>
    <div class="foot">
      <div class="state" id="state-save"></div>
      <div class="right">
        <button class="mbtn mbtn-text" onclick="openHist('de')" id="btnHist">VERLAUF</button>
        <button class="mbtn mbtn-text" id="btnCancel">ABBRECHEN</button>
        <button class="mbtn mbtn-contained" id="btnSave" onclick="save()">SPEICHERN</button>
      </div>
    </div>

  </div>
</div>

<div class="backdrop" id="backdrop" onclick="closeHist()"></div>
<div class="drawer" id="drawer">
  <div class="dr-h">
    <div class="dr-t" id="drTitle">Verlauf</div>
    <button class="icon-btn" onclick="closeHist()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="dr-b" id="drBody"></div>
</div>

<div class="presenter">
  <span class="lb">Demo</span>
  <button class="pbtn" id="pTyp" onclick="toggleTyp()">Typ: Erstmeldung</button>
  <button class="pbtn" id="pFail" onclick="toggleFail()">Fehler: aus</button>
  <button class="pbtn" onclick="resetAll()">Zurücksetzen</button>
  <div class="cap" id="pCap"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ════════════════════════════════════════════════════════════
   i18n — interface language, independent of the message languages
   ════════════════════════════════════════════════════════════ */
const I18N = {
  title:      { de: 'Meldung bearbeiten',      en: 'Edit message' },
  daisy:      { de: 'Daisy',                   en: 'Daisy' },
  interval:   { de: 'Intervall',               en: 'Interval' },
  source:     { de: 'Quelle',                  en: 'Source' },
  prompt:     { de: 'Prompt',                  en: 'Prompt' },
  zusatz:     { de: 'Zusatz (optional)',       en: 'Extra note (optional)' },
  tonfall:    { de: 'Tonfall',                 en: 'Tone of voice' },
  meldungen:  { de: 'Meldungen',               en: 'Messages' },
  stations:   { de: 'Stationen',               en: 'Stations' },
  planned:    { de: 'Geplant',                 en: 'Planned' },
  von:        { de: 'Station von',             en: 'Station from' },
  bis:        { de: 'Station bis',             en: 'Station to' },
  library:    { de: 'Gespeicherte Meldung',    en: 'Saved message' },
  rec:        { de: 'Aufnahme',                en: 'Recording' },
  mitteil:    { de: 'Mitteilungen',            en: 'Notices' },
  typ:        { de: 'Typ',                     en: 'Type' },
  stationen:  { de: 'Stationen',               en: 'Stations' },
  linie:      { de: 'Linie',                   en: 'Line' },
  grund:      { de: 'Grund',                   en: 'Reason' },
  erst:       { de: 'Erstmeldung',             en: 'First notice' },
  haupt:      { de: 'Hauptmeldung',            en: 'Main notice' },
  ortspunkt:  { de: 'Ortspunkt',               en: 'Location point' },
  generate:   { de: 'GENERIEREN',              en: 'GENERATE' },
  genAudio:   { de: 'AUDIO ERZEUGEN',          en: 'GENERATE AUDIO' },
  listen:     { de: 'ANHÖREN',                 en: 'LISTEN GENERATED' },
  stop:       { de: 'STOP',                    en: 'STOP' },
  upload:     { de: 'HOCHLADEN',               en: 'UPLOAD' },
  hist:       { de: 'VERLAUF',                 en: 'HISTORY' },
  cancel:     { de: 'ABBRECHEN',               en: 'CANCEL' },
  save:       { de: 'SPEICHERN',               en: 'SAVE' },
  histTitle:  { de: 'Verlauf — ELA',           en: 'History — ELA' },
  restore:    { de: 'Wiederherstellen',        en: 'Restore' },
  current:    { de: 'Aktuelle Fassung',        en: 'Current version' },
  noVers:     { de: 'Keine früheren Fassungen.', en: 'No earlier versions.' },

  promptHint: { de: 'Aus dem Ereignis zusammengesetzt. Nicht editierbar — so kann keine Linie oder Uhrzeit erfunden werden.',
                en: 'Assembled from the event. Not editable — so no line or time can be invented.' },
  zusatzHint: { de: 'Ein Satz, der nicht aus dem Ereignis kommt (z. B. „Viel Spaß beim Konzert!“). Vorschläge sind zweisprachig hinterlegt; freier Text wird nur ins Deutsche übernommen.',
                en: 'One sentence that does not come from the event (e.g. "Enjoy the concert!"). Suggestions are stored bilingually; free text is applied to German only.' },
  tonfallHint:{ de: 'Ein Feld, das Wortwahl und Stimme zusammen bestimmt. Standard ist Neutral.',
                en: 'One field that sets wording and voice together. The default is Neutral.' },
  srcStd:     { de: 'Text wird aus dem Prompt generiert und ist danach frei bearbeitbar.',
                en: 'Text is generated from the prompt and is freely editable afterwards.' },
  srcLib:     { de: 'Bereits freigegebene Meldung aus der Bibliothek übernehmen — keine Generierung.',
                en: 'Reuse an already approved message from the library — no generation.' },
  srcVoice:   { de: 'Menschlich eingesprochene Datei. Kein generierter Text, keine Sprachsynthese.',
                en: 'Human-recorded file. No generated text, no speech synthesis.' },
  libHint:    { de: 'Text und Audio kommen aus der Bibliothek. Bearbeiten erzeugt eine eigene Fassung.',
                en: 'Text and audio come from the library. Editing creates a separate version.' },
  recHint:    { de: 'Die Datei enthält beide Sprachen. Der Text unten dient nur als Mitschrift für die Anzeige im System.',
                en: 'The file contains both languages. The text below is only a transcript for display inside the system.' },

/* ════════════════════════════════════════════════════════════
   State
   ════════════════════════════════════════════════════════════ */
const S = {
  ui: 'de',
  typ: 'erst',
  source: 'standard',
  tonfall: 'neutral',
  zusatz: '',
  zusatzTranslated: true,
  failMode: false,
  msg: {
    de: { text: '', state: 'none', tone: null, versions: [] },
    en: { text: '', state: 'none', tone: null, versions: [] }
  },
  enOutdated: false,
  audio: { state: 'none', forKey: null, dur: 0, listened: false, at: null, pct: 0 },
  playing: false,
  focus: { de: false, en: false }
};

const stamp = () => { const d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); };
const estDur = txt => { if (!txt) return 0;
  return Math.round((txt.trim().split(/\s+/).filter(Boolean).length / 2.4 + 0.8) * 10) / 10; };
const fmtDur = s => s <= 0 ? '0:00'
  : Math.floor(s / 60) + ':' + String(Math.round(s % 60)).padStart(2, '0');
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const audioKey = () => [S.msg.de.text, S.msg.en.text, S.tonfall, S.source].join('␀');

/* ════════════════════════════════════════════════════════════
   Prompt — read-only, assembled from the event
   ════════════════════════════════════════════════════════════ */
function buildPrompt() {
  const von = document.getElementById('stVon').value;
  const bis = document.getElementById('stBis').value;
  const grund = S.typ === 'erst'
    ? (S.ui === 'de' ? 'Störung (Details noch offen)' : 'disruption (details still open)')
    : (S.ui === 'de' ? 'Notarzteinsatz' : 'emergency medical services');
  const parts = S.ui === 'de'
    ? ['Linie U2', 'Kein Halt Stadtmitte', 'Grund: ' + grund, 'Abschnitt: ' + von + ' – ' + bis]
    : ['Line U2', 'No stop at Stadtmitte', 'Reason: ' + grund, 'Section: ' + von + ' – ' + bis];
  if (S.typ === 'haupt') parts.push(S.ui === 'de'
    ? 'Alternative: Buslinie M41' : 'Alternative: bus route M41',
    S.ui === 'de' ? 'Voraussichtlich bis 23:30 Uhr' : 'Expected until 23:30');
  if (S.zusatz.trim()) parts.push((S.ui === 'de' ? 'Zusatz: ' : 'Extra: ') + S.zusatz.trim());
  return parts.join('. ') + '.';
}

/* ════════════════════════════════════════════════════════════
   Generate
   ════════════════════════════════════════════════════════════ */
let genTimer = null;
function generate() {
  if (S.msg.de.state === 'edited' || S.msg.en.state === 'edited') {
    if (!confirm(t('regenWarn'))) return;
  }
  ['de','en'].forEach(l => { S.msg[l].state = 'loading'; });
  render();
  clearTimeout(genTimer);
  genTimer = setTimeout(() => {
    if (S.failMode) {
      ['de','en'].forEach(l => { S.msg[l].state = 'error'; });
      render();
      return;
    }
    const base = TEXTS[S.typ][S.tonfall];
    const z = S.zusatz.trim();
    const known = ZUSATZ.find(x => x.de === z || x.en === z);
    S.zusatzTranslated = !z || !!known;
    ['de','en'].forEach(l => {
      const m = S.msg[l];
      if (m.text) m.versions.push({ text: m.text, tone: m.tone, at: stamp(), state: m.state });
      let txt = base[l];
      if (z) {
        if (known) txt += ' ' + known[l];
        else if (l === 'de') txt += ' ' + z;
      }
      m.text = txt; m.state = 'generated'; m.tone = S.tonfall;
    });
    S.enOutdated = false;
    if (S.audio.state === 'ready') S.audio.state = 'stale';
    render();
  }, 1000);
}

/* Grow both boxes to their content and keep them the same height, so DE and EN
   sit side by side as one comparable pair. */
function autoGrow() {
  const tas = ['de','en'].map(l => document.getElementById('ta-' + l));
  tas.forEach(ta => { ta.style.height = 'auto'; });
  const h = Math.max(66, ...tas.map(ta => ta.scrollHeight));
  tas.forEach(ta => { ta.style.height = h + 'px'; });
}

function onEdit(lang, val) {
  const m = S.msg[lang];
  if (m.text === val) return;
  m.text = val;
  m.state = val ? 'edited' : 'none';
  if (lang === 'de') S.enOutdated = !!S.msg.en.text;
  if (lang === 'en') S.enOutdated = false;
  autoGrow();
  renderStates(); renderAudio(); renderSave();
}

function onSource(v) {
  S.source = v;
  if (v === 'standard') { document.getElementById('library').value = ''; document.getElementById('rec').value = ''; }
  render();
}
function onTonfall(v) { S.tonfall = v; }
function onStation() { render(); }

function onLibrary(id) {
  const item = LIBRARY.find(x => x.id === id);
  if (!item || !item.id) { ['de','en'].forEach(l => { S.msg[l].text = ''; S.msg[l].state = 'none'; }); render(); return; }
  ['de','en'].forEach(l => {
    const m = S.msg[l];
    if (m.text) m.versions.push({ text: m.text, tone: m.tone, at: stamp(), state: m.state });
    m.text = l === 'de' ? item.tde : item.ten; m.state = 'library'; m.tone = null;
  });
  S.enOutdated = false; S.zusatzTranslated = true;
  S.audio.state = 'ready'; S.audio.forKey = audioKey();
  S.audio.dur = estDur(item.tde) + estDur(item.ten) + 0.8;
  S.audio.at = stamp(); S.audio.listened = false;
  render();
}

function onRec(id) {
  const r = RECS.find(x => x.id === id);
  if (!r || !r.id) { ['de','en'].forEach(l => { S.msg[l].text = ''; S.msg[l].state = 'none'; }); S.audio.state = 'none'; render(); return; }
  ['de','en'].forEach(l => {
    S.msg[l].text = l === 'de' ? r.tde : r.ten; S.msg[l].state = 'rec'; S.msg[l].tone = null;
  });
  S.enOutdated = false; S.zusatzTranslated = true;
  S.audio.state = 'ready'; S.audio.forKey = audioKey(); S.audio.dur = r.dur;
  S.audio.at = stamp(); S.audio.listened = false;
  render();
}

/* ════════════════════════════════════════════════════════════
   Audio — ONE file containing DE + EN
   ════════════════════════════════════════════════════════════ */
function makeAudio() {
  if (!S.msg.de.text && !S.msg.en.text) return;
  S.audio.state = 'rendering'; S.audio.pct = 0;
  render();
  const iv = setInterval(() => {
    S.audio.pct = Math.min(100, S.audio.pct + 12);
    const bar = document.getElementById('abar');
    if (bar) bar.style.width = S.audio.pct + '%';
    if (S.audio.pct >= 100) {
      clearInterval(iv);
      if (S.failMode) { S.audio.state = 'error'; }
      else {
        S.audio.state = 'ready';
        S.audio.forKey = audioKey();
        S.audio.dur = estDur(S.msg.de.text) + estDur(S.msg.en.text) + 0.8;
        S.audio.at = stamp(); S.audio.listened = false;
      }
      render();
    }
  }, 120);
}

/* Plays DE then EN back to back — that is what one combined file is. */
let playTimer = null;
function play() {
  stopPlay();
  S.playing = true; S.audio.listened = true;
  render();
  try {
    const synth = window.speechSynthesis;
    // getVoices() is empty where no voice is installed — then simulate instead
    if (synth && typeof SpeechSynthesisUtterance === 'function' && synth.getVoices().length) {
      [['de','de-DE'], ['en','en-GB']].forEach(([l, code]) => {
        if (!S.msg[l].text) return;
        const u = new SpeechSynthesisUtterance(S.msg[l].text);
        u.lang = code; u.rate = 0.98;
        if (l === 'en') { u.onend = endPlay; u.onerror = endPlay; }
        synth.speak(u);
      });
    }
  } catch (e) { /* fall through to the timer */ }
  /* Safety net: onend never arrives in some environments (no voice installed,
     muted output, synth error). Without this the button stays on STOP for
     good and the message can never be replayed. */
  playTimer = setTimeout(endPlay, Math.max(1500, S.audio.dur * 1000 + 1500));
}
function endPlay() {
  clearTimeout(playTimer);
  if (!S.playing) return;
  S.playing = false;
  render();
}
function stopPlay() {
  clearTimeout(playTimer);
  try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {}
  S.playing = false;
}

function save() {
  toast(t('saved'));
}

/* ── the state line: one caption per box, no controls ── */
function renderStates() {
  ['de','en'].forEach(l => {
    const m = S.msg[l], el = document.getElementById('state-' + l);
    const box = document.getElementById('mbox-' + l);
    let cls = '', icon = ICON.dot, txt = t('stNone'), extra = '';

    if (m.state === 'loading')      { cls = 'b'; icon = ICON.dot;  txt = t('stLoading'); }
    else if (m.state === 'error')   { cls = 'r'; icon = ICON.warn; txt = t('stFail'); }
    else if (m.state === 'generated') {
      cls = 'g'; icon = ICON.ok;
      txt = t('stGen');
      const tn = TONES.find(x => x.id === m.tone);
      if (tn) extra = '<span class="sep">·</span> ' + tn[S.ui];
    }
    else if (m.state === 'edited')  { cls = 'b'; icon = ICON.pen;  txt = t('stEdited'); }
    else if (m.state === 'library') { cls = 'g'; icon = ICON.ok;   txt = t('stLib'); }
    else if (m.state === 'rec')     { cls = '';  icon = ICON.dot;  txt = t('stRec'); }
    else if (m.state === 'eventChanged') { cls = 'a'; icon = ICON.warn; txt = t('stEventOld'); }

    let warned = m.state === 'eventChanged';
    // EN-specific warnings win, because they are what a reader must act on
    if (l === 'en' && m.text && !warned) {
      if (S.enOutdated)            { cls = 'a'; icon = ICON.warn; txt = t('stTransOld'); extra = ''; warned = true; }
      else if (!S.zusatzTranslated){ cls = 'a'; icon = ICON.warn; txt = t('stZusatzDe'); extra = ''; warned = true; }
    }
    box.classList.toggle('warn', warned);
    el.className = 'state ' + cls;
    el.innerHTML = icon + '<span>' + txt + extra + '</span>';
  });
}

function renderAudio() {
  const a = S.audio;
  let st = a.state;
  if (st === 'ready' && a.forKey !== audioKey()) st = 'stale';
  const hasText = !!(S.msg.de.text || S.msg.en.text);

  const acts = document.getElementById('audioActs');
  let html = '<button class="mbtn mbtn-outlined" onclick="makeAudio()"'
    + (!hasText || st === 'rendering' || S.source === 'voice' ? ' disabled' : '') + '>'
    + t('genAudio') + '</button>'
    + '<button class="mbtn mbtn-text" onclick="' + (S.playing ? 'stopPlay();render()' : 'play()') + '"'
    + (st !== 'ready' && st !== 'stale' ? ' disabled' : '') + '>'
    + (S.playing ? '■ ' + t('stop') : ICON.play + ' ' + t('listen')) + '</button>';
  if (st === 'rendering') html += '<div class="bar"><i id="abar" style="width:' + a.pct + '%"></i></div>';
  if (st === 'ready' || st === 'stale') {
    html += '<div class="wave' + (S.playing ? ' playing' : '') + '">'
      + Array.from({ length: 30 }, (_, i) =>
        '<i style="height:' + (20 + Math.round(Math.sin(i * 1.6) * 13 + Math.cos(i * .7) * 6)) + '%"></i>').join('')
      + '</div>';
  }
  acts.innerHTML = html;

  const el = document.getElementById('state-audio');
  let cls = '', icon = ICON.dot, txt = t('aNone');
  if (st === 'rendering')   { cls = 'b'; txt = t('aRender'); }
  else if (st === 'error')  { cls = 'r'; icon = ICON.warn; txt = t('aFail'); }
  else if (st === 'stale')  { cls = 'a'; icon = ICON.warn; txt = t('aStale'); }
  else if (st === 'ready')  {
    cls = 'g'; icon = ICON.ok;
    txt = t('aReady') + ' ' + a.at + ' <span class="sep">·</span> ' + fmtDur(a.dur)
        + ' <span class="sep">·</span> ' + t('aOneFile')
        + (a.listened ? ' <span class="sep">·</span> ' + t('aListened') : '');
  }
  el.className = 'state ' + cls;
  el.innerHTML = icon + '<span>' + txt + '</span>';
}

function renderSave() {
  const a = S.audio;
  let st = a.state;
  if (st === 'ready' && a.forKey !== audioKey()) st = 'stale';
  const el = document.getElementById('state-save');
  let cls = 'g', icon = ICON.ok, txt = t('saveOk');
  if (st === 'stale')            { cls = 'a'; icon = ICON.warn; txt = t('saveStale'); }
  else if (st === 'none' || st === 'error') { cls = 'a'; icon = ICON.warn; txt = t('saveNoAudio'); }
  else if (!a.listened)          { cls = 'a'; icon = ICON.warn; txt = t('saveUnheard'); }
  el.className = 'state ' + cls;
  el.innerHTML = icon + '<span>' + txt + '</span>';
}

function focusBox(l, on) {
  S.focus[l] = !!on;
  document.getElementById('mbox-' + l).classList.toggle('focused', !!on);
}

/* ── history ── */
function openHist(l) {
  const m = S.msg[l];
  document.getElementById('drTitle').textContent = t('histTitle') + ' (' + l.toUpperCase() + ')';
  const cur = '<div class="vrow cur"><div class="vrow-h"><b>' + t('current') + '</b>'
    + '<span class="right">' + fmtDur(estDur(m.text)) + '</span></div>'
    + '<div class="vrow-t">' + esc(m.text || '—') + '</div></div>';
  const olds = m.versions.slice().reverse().map((v, i) => {
    const idx = m.versions.length - 1 - i;
    return '<div class="vrow"><div class="vrow-h"><span>' + v.at + '</span>'
      + '<span class="right"><button class="link" onclick="restore(\'' + l + '\',' + idx + ')">'
      + t('restore') + '</button></span></div><div class="vrow-t">' + esc(v.text) + '</div></div>';
  }).join('');
  document.getElementById('drBody').innerHTML = cur + (olds ||
    '<div style="font-size:13px;color:var(--ink-2)">' + t('noVers') + '</div>');
  document.getElementById('drawer').classList.add('open');
  document.getElementById('backdrop').classList.add('open');
}
function closeHist() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('backdrop').classList.remove('open');
}
function restore(l, idx) {
  const m = S.msg[l], v = m.versions[idx];
  if (!v) return;
  m.versions.push({ text: m.text, tone: m.tone, at: stamp(), state: m.state });
  m.text = v.text; m.tone = v.tone; m.state = v.state === 'loading' ? 'edited' : v.state;
  if (l === 'de') S.enOutdated = !!S.msg.en.text;
  closeHist(); render();
}

/* ── presenter ── */
function setUi(l) { S.ui = l; render(); }
function toggleTyp() {
  S.typ = S.typ === 'erst' ? 'haupt' : 'erst';
  /* The event changed, the human did not — do not call this an edit, or
     regenerating would ask "overwrite your changes?" about text nobody touched. */
  ['de','en'].forEach(l => { if (S.msg[l].text) S.msg[l].state = 'eventChanged'; });
  render();
}
function toggleFail() { S.failMode = !S.failMode; render(); }
function resetAll() {
  stopPlay();
  S.typ = 'erst'; S.source = 'standard'; S.tonfall = 'neutral'; S.zusatz = '';
  S.zusatzTranslated = true; S.enOutdated = false;
  S.msg = { de: { text: '', state: 'none', tone: null, versions: [] },
            en: { text: '', state: 'none', tone: null, versions: [] } };
  S.audio = { state: 'none', forKey: null, dur: 0, listened: false, at: null, pct: 0 };
  document.getElementById('source').value = 'standard';
  document.getElementById('library').value = '';
  document.getElementById('rec').value = '';
  render();
}

let tt = null;
function toast(m) {
  const el = document.getElementById('toast');
  el.textContent = m; el.classList.add('show');
  clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 3800);
}

document.getElementById('zusatz').addEventListener('input', e => {
  S.zusatz = e.target.value;
  document.getElementById('prompt').value = buildPrompt();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeHist(); });

render();
</script>
</body>
</html>
