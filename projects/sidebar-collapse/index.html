<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sidebar collapse — rail + sections, top toggle</title>
<link rel="stylesheet" href="../../ui-kit/synder-ui-kit.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
<style>
  /* Live admin shell from Ignat's 4 screenshots (2026-10-13): Administrative functions,
     Organizations list, Organization page, org switcher. Every text is ≥14px. */
  body{margin:0;height:100vh;display:flex;flex-direction:column;background:var(--color-white);font-size:14px;color:var(--text-primary)}
  .mi,.mf{font-weight:normal;font-style:normal;font-size:20px;line-height:1;display:inline-block;
    -webkit-font-smoothing:antialiased;font-feature-settings:'liga';text-transform:none;letter-spacing:normal;white-space:nowrap}
  .mi{font-family:'Material Icons Outlined'} .mf{font-family:'Material Icons'}
  .app{display:flex;flex:1;min-height:0}

  /* ---- sidebar: refreshed, after Stripe / Shopify (Ignat, 2026-10-13) ----
     no row dividers, rounded hover/active pills, grey outline icons, quiet section labels. White only. */
  .sb{--sb-bg:#fff;--sb-fg:#1A1B24;--sb-ic:#6B778C;--sb-muted:#6B778C;--sb-hover:#F2F4F7;--sb-on-bg:#E8F0FD;
    --sb-on-fg:#0053CC;--sb-border:#E9ECF1;--sb-card:#F5F8FD;
    width:240px;flex-shrink:0;border-right:1px solid var(--sb-border);display:flex;flex-direction:column;
    position:relative;background:var(--sb-bg);color:var(--sb-fg)}
  .sb-org{display:flex;align-items:center;gap:10px;margin:12px 10px 8px;padding:8px;border-radius:8px;flex-shrink:0;
    border:none;background:none;font:inherit;font-size:14px;font-weight:400;color:var(--sb-fg);cursor:pointer;text-align:left;
    width:calc(100% - 20px)}
  .sb-org:hover{background:var(--sb-hover)}
  .sb-org .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sb-org .mi{color:var(--sb-ic);font-size:20px}
  .av{width:28px;height:28px;border-radius:50%;flex-shrink:0;color:#fff;display:flex;align-items:center;
    justify-content:center;font-size:14px;font-weight:400;position:relative}
  .sb-org .av,.sw-head .av{border-radius:7px}
  .av .dot{position:absolute;top:-1px;right:-2px;width:9px;height:9px;border-radius:50%;background:#F0A33A;
    border:1.5px solid #fff}
  .sb-scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;padding:0 10px 10px}
  .sb-sec{display:flex;flex-direction:column;gap:2px;flex-shrink:0}
  .sb-sec + .sb-sec{margin-top:16px}
  .sb-sec.bottom{margin-top:auto;padding-top:16px}
  .sb-admin-end{border-bottom:3px solid var(--sb-border);padding-bottom:12px}
  .sb-label{padding:4px 10px 6px;color:var(--sb-muted);font-size:14px;font-weight:400}
  .sb-item{display:flex;align-items:center;gap:12px;min-height:36px;padding:0 6px 0 10px;border-radius:8px;
    color:var(--sb-fg);font-size:14px;text-decoration:none;position:relative;flex-shrink:0;transition:background .12s}
  .sb-item:hover{background:var(--sb-hover)}
  .sb-item .mi{color:var(--sb-ic);font-size:20px;flex-shrink:0}
  .sb-item .lb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sb-item .chev{color:var(--sb-ic);font-size:20px}
  .sb-item.on{background:var(--sb-on-bg);color:var(--sb-on-fg)}
  .sb-item.on .mi{color:var(--sb-on-fg)}
  .sb-item:focus-visible,.sb-item a:focus-visible,.sb-org:focus-visible{outline:2px solid #0053CC;outline-offset:-2px}
  .sb-group{display:flex;align-items:center;gap:12px;min-height:36px;padding:0 6px 0 10px;border-radius:8px;width:100%;
    border:none;background:none;font:inherit;font-size:14px;color:var(--sb-fg);cursor:pointer;text-align:left}
  .sb-group:hover{background:var(--sb-hover)}
  .sb-group .mi{color:var(--sb-ic);font-size:20px;flex-shrink:0}
  .sb-group .lb{flex:1;min-width:0}
  .sb-group:focus-visible{outline:2px solid #0053CC;outline-offset:-2px}
  .sb-sub{padding-left:30px}
  .sb-sub .mi{font-size:18px}
  .sb-new{color:#1F8940;background:#E3F3E7;border-radius:10px;padding:0 8px;font-size:14px;line-height:20px;font-weight:400}
  /* pinned admin pages: unpin on hover */
  /* the whole pinned row navigates (icon + padding + label); only Unpin is a separate target */
  .sb-item.sb-pin{padding-left:0}
  .sb-pin-link{display:flex;align-items:center;gap:12px;flex:1;min-width:0;align-self:stretch;padding-left:10px;color:inherit;text-decoration:none}
  .sb-pin .unpin{display:none;align-items:center;justify-content:center;width:28px;height:28px;border:none;
    border-radius:6px;background:none;color:var(--sb-ic);cursor:pointer;padding:0;flex-shrink:0}
  .sb-pin:hover .unpin,.sb-pin:focus-within .unpin{display:inline-flex}
  .sb-pin .unpin:hover{background:var(--sb-on-bg);color:var(--sb-on-fg)}
  .sb-pin .unpin .mf{font-size:18px}
  .promo{margin-top:16px;background:var(--sb-card);border-radius:12px;padding:14px;position:relative;flex-shrink:0}
  .promo h4{font-size:14px;font-weight:400;margin:6px 0 6px;color:var(--sb-fg)}
  .promo p{margin:0 0 12px;line-height:20px;color:var(--sb-muted)}
  .promo .x{position:absolute;top:6px;right:6px;width:28px;height:28px;color:var(--sb-ic)}
  .promo .x:hover{background:var(--sb-hover)}
  .promo .ill{font-size:28px;color:#0053CC}

  /* ---- org switcher ---- */
  .sw{position:absolute;top:8px;left:10px;width:320px;background:#fff;color:var(--text-primary);border-radius:12px;z-index:20;
    box-shadow:0 12px 32px rgba(16,24,40,.16),0 2px 6px rgba(16,24,40,.08);border:1px solid #E9ECF1;
    display:flex;flex-direction:column;max-height:520px;overflow:hidden}
  .sw[hidden]{display:none}
  .sw-head{display:flex;align-items:center;gap:10px;padding:10px 8px 10px 14px;border-bottom:1px solid var(--border-default)}
  .sw-head .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:400}
  .sw-search{padding:10px;position:relative}
  .sw-search .mi{position:absolute;left:20px;top:50%;transform:translateY(-50%);color:var(--text-secondary)}
  .sw-search input{padding-left:36px;font-size:14px;border-radius:8px;background:#F7F8FA}
  .sw-list{overflow-y:auto;padding:0 6px 8px}
  .sw-opt{display:flex;align-items:center;gap:12px;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:14px}
  .sw-opt .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sw-opt .av{width:24px;height:24px;border-radius:6px}
  .sw-opt.hl{background:#F2F4F7}
  .sw-opt mark{background:none;color:inherit;font-weight:700}
  .sw-spin{display:inline-block;width:16px;height:16px;border:2px solid var(--border-default);border-top-color:var(--color-primary);
    border-radius:50%;animation:swspin .7s linear infinite;vertical-align:-3px;margin-right:8px}
  @keyframes swspin{to{transform:rotate(360deg)}}
  .row-selected-lbl{color:var(--text-secondary);padding:0 16px;display:inline-block}
  .sw-empty{padding:8px;color:var(--text-secondary)}
  #sw-all{border-top:1px solid var(--border-default);margin-top:6px;padding-top:6px}
  .sw-label{padding:4px 8px 6px;font-weight:400;color:var(--text-secondary)}


  /* ---- top bar + content ---- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .top{height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:flex-end;gap:28px;
    padding:0 24px;border-bottom:1px solid var(--border-default)}
  .top .more{font-style:italic;color:var(--text-link);text-decoration:none}
  .top .trial b{color:var(--color-primary);font-weight:400;font-size:16px}
  .top .how{color:var(--color-primary);text-decoration:none}
  .top .mi{color:var(--color-primary);font-size:24px}
  #content{overflow:auto}   /* kit .content gives flex + 24px padding */
  h1:focus,h2:focus{outline:none}
  h1{font-size:24px;font-weight:400;margin:0 0 8px}

  /* Administrative functions */
  .af-head{display:flex;align-items:baseline;gap:16px;margin-bottom:8px}
  .af-cap{display:flex;align-items:center;gap:6px;color:var(--color-red)}
  .af-cap .mi{font-size:18px}
  .af-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0 24px}
  .af-grp h2{font-size:18px;font-weight:700;margin:16px 0 4px}
  .af-grp:first-child h2{margin-top:4px}
  .af-row{display:flex;align-items:center;min-height:28px}
  .af-row a{color:var(--text-link);text-decoration:none}
  .af-row a:hover{text-decoration:underline}
  .pin{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;margin-left:2px;opacity:0;
    border:none;border-radius:4px;background:none;padding:0;cursor:pointer;color:var(--text-muted)}
  .pin .mi,.pin .mf{font-size:18px}
  .af-row:hover .pin,.pin:focus-visible,.pin[aria-pressed="true"]{opacity:1}
  .pin{color:var(--color-primary)}   /* blue in both states: outlined = not pinned, filled = pinned */
  .pin:hover{background:var(--color-primary-5)}
  .pin[aria-disabled="true"]{cursor:not-allowed;color:var(--text-muted)!important;background:none!important}

  /* Organizations list */
  .flt{display:grid;grid-template-columns:repeat(6,1fr);gap:8px 20px;padding:4px 8px 16px;border-bottom:1px solid var(--border-default)}
  .flt label{display:block;margin-bottom:4px}
  .flt .apply{grid-column:1/-1}
  .orgs{overflow-x:auto;max-width:100%}
  .orgs .synder-table th,.orgs .synder-table td{white-space:normal;vertical-align:middle;padding-left:8px;padding-right:8px}
  .orgs .synder-table td{overflow-wrap:anywhere}
  .orgs .synder-table td.act{overflow-wrap:normal}
  .orgs .synder-table td:nth-child(1){min-width:130px} .orgs .synder-table td:nth-child(6){min-width:150px} .orgs .synder-table td:nth-child(7){min-width:170px}
  .orgs .synder-table td.multi{white-space:pre-line;line-height:20px}
  .orgs .synder-table th.num,.orgs .synder-table td.num{text-align:right}
  .orgs a{color:var(--text-link);text-decoration:none}
  .orgs a:hover{text-decoration:underline}
  .orgs td.act,.orgs th.act{text-align:right;white-space:nowrap;position:sticky;right:0;z-index:1;
    box-shadow:-1px 0 0 var(--border-default)}

  /* Organization page */
  .bar{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 16px}
  .bar .btn,.bar .btn-success,.bar .btn-error{height:32px;padding:0 12px}
  .org-wrap{display:grid;grid-template-columns:1fr 1fr;gap:32px}
  .org-top{display:flex;align-items:center;gap:12px;margin:0 0 12px}
  .org-top h1{margin:0}
  .org-status{display:inline-flex;align-items:center;gap:6px;border-radius:12px;padding:2px 10px;font-size:14px;line-height:20px}
  .org-status.sel{background:#E3F3E7;color:#1F8940}
  .org-status.not{background:var(--color-grey-5);color:var(--text-secondary);border:1px solid var(--border-default)}
  .org-status .mi{font-size:16px}
  .org-h2{font-size:22px;font-weight:400;margin:0 0 10px}
  .kv{width:100%;border-collapse:collapse}
  .kv th,.kv td{border:1px solid var(--border-default);padding:8px 10px;text-align:left;vertical-align:top;font-size:14px}
  .kv th{width:34%;font-weight:400;background:var(--color-grey-5)}
  .side h2{font-size:22px;font-weight:400;margin:0 0 10px}
  .side section{border-bottom:1px solid var(--border-default);padding-bottom:16px;margin-bottom:16px}
  .side ul{margin:0;padding-left:0;list-style:none;line-height:22px}

  /* confirmation toast — top centre, green, no actions (same pattern as the AI Hub prototype) */
  #toasts{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:1100;display:flex;flex-direction:column;gap:8px}
  .toast{display:flex;align-items:center;gap:10px;background:var(--color-green);color:#fff;border-radius:4px;padding:12px 16px;
    box-shadow:0 8px 24px rgba(0,0,0,.2);font-size:16px;line-height:24px;max-width:520px;transition:opacity .2s}
  .toast .mi{font-size:20px}
  .toast.out{opacity:0}
  .stub-note{color:var(--text-secondary);margin-top:8px}
  .sr{position:absolute;left:0;top:0;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

  /* ===== condensed (2026-11-22): Shopify / Jira / Stripe density. 32px rows, icons on top-level rows only ===== */
  .sb{width:230px;transition:width .2s cubic-bezier(.2,0,0,1)}   /* 230px so every label fits on one row (Ignat, 2026-11-23) */
  .sb-item .lb,.sb-group .lb{white-space:normal;overflow:visible;text-overflow:clip;line-height:18px;padding:7px 0}   /* long labels wrap, as in production */
  .sb-in{display:flex;flex-direction:column;flex:1;min-height:0;background:var(--sb-bg)}
  .sb-org{margin:8px 8px 4px;padding:6px;width:calc(100% - 16px);gap:8px}
  .sb-org .av,.sw-head .av{width:24px;height:24px;border-radius:6px}
  .sb-scroll{padding:0 8px 8px}
  .sb-sec{gap:1px}
  .sb-sec + .sb-sec{margin-top:10px}
  .sb-sec.bottom{padding-top:10px}
  .sb-item,.sb-group{min-height:32px;gap:10px;padding:0 6px 0 8px;border-radius:6px}
  .sb-item .mi,.sb-group .mi{font-size:18px}
  .sb-item .chev,.sb-group .chev{font-size:18px;margin-left:auto}
  .sb-group .lb{flex:1}
  .sb-sub{padding-left:36px}                              /* sub-rows: text only, aligned with the parent label */
  .sb-item.sb-pin{padding-left:0} .sb-pin .sb-pin-link{padding-left:36px;gap:0}
  .sb-admin-end{padding-bottom:8px}
  .promo{margin-top:12px;padding:12px}
  .sb-group.on-parent{color:var(--sb-on-fg);font-weight:400} .sb-group.on-parent .mi{color:var(--sb-on-fg)}
  .sb-admin-row{display:flex;align-items:center}
  .sb-admin-row .sb-item{flex:1;min-width:0}
  .sb-admin-row .sb-fold{margin-left:0;width:24px}
  .sb-admin-row .sb-item{padding-right:0}
  .sb-fold{width:28px;height:28px;border:none;background:none;border-radius:6px;color:var(--sb-ic);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
  .sb-fold:hover{background:var(--sb-hover)}
  .sb-collapse{display:flex;align-items:center;gap:10px;min-height:32px;margin:4px 8px 8px;padding:0 8px;border:none;background:none;border-radius:6px;
    font:inherit;font-size:14px;color:var(--sb-muted);cursor:pointer;flex-shrink:0}
  .sb-collapse:hover{background:var(--sb-hover);color:var(--sb-fg)}
  .sb-collapse .mi{font-size:18px}
  .sb-collapse:focus-visible,.sb-fold:focus-visible{outline:2px solid #0053CC;outline-offset:-2px}

  /* prototype switch: kit .variant-switch, no local styling */

  /* merged: Shopify / Jira panel toggle next to the org switcher */
  .sb-head{display:flex;align-items:center;gap:2px;padding-right:8px}
  .sb-head .sb-org{flex:1;min-width:0;margin-right:0;width:auto}
  .sb-toggle{width:32px;height:32px;min-height:32px;margin:0;padding:0;justify-content:center;flex-shrink:0;color:var(--sb-ic)}
  body.rail .sb-head{flex-direction:column;padding:0;gap:2px}
  body.rail .sb-head .sb-org{width:calc(100% - 12px)}
  body.rail .sb-toggle{margin-bottom:4px}
  /* edge: round button straddling the sidebar's right border, at the bottom (Ignat, 2026-11-23) */
  body.m-edge .sb-collapse{position:absolute;top:auto;bottom:20px;right:-14px;width:28px;height:28px;min-height:28px;margin:0;padding:0;z-index:25;
    justify-content:center;border-radius:50%;background:#fff;border:1px solid var(--sb-border);box-shadow:0 1px 3px rgba(16,24,40,.12);color:var(--sb-ic)}
  body.m-edge .sb-collapse:hover{background:var(--sb-hover);color:var(--sb-fg)}
  body.m-edge .sb-collapse .mi{font-size:18px}
  body.m-edge.rail .sb-collapse{justify-content:center;padding:0}
  /* A + C · hover chevron (Ignat's sketch 2026-11-23): org chevron only on hover, collapse button in the page's top bar */
  body.m-hover .sb-head{padding-right:0}
  body.m-hover .sb-head .sb-org{margin-right:8px;position:relative}
  body.m-hover .sb-org > .mi{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:var(--sb-hover);border-radius:4px;opacity:0;pointer-events:none}
  body.m-hover .sb-org:hover > .mi,body.m-hover .sb-org:focus-visible > .mi,body.m-hover .sb-org[aria-expanded="true"] > .mi{opacity:1}
  body.m-hover .sb-org[aria-expanded="true"]{background:var(--sb-hover)}
  body.m-hover .top{padding-left:12px}
  .bar-toggle{margin:0 auto 0 0;color:#6B778C}
  .bar-toggle:hover{background:#F2F4F7;color:#1A1B24}
  /* org selector (2026-11-23): search on top, firm row + search fixed, list scrolls, accountant footer */
  .sw{top:48px;left:8px;width:320px;max-height:min(560px,calc(100vh - 120px))}
  .sw-head{display:none}
  .sw-search{padding:8px;flex-shrink:0}
  .sw-search .mi{left:18px}
  .sw-firm{padding:0 6px;flex-shrink:0}
  .sw-firm:empty{display:none}
  .sw-firm .sw-label{padding-top:10px}
  .sw-list{flex:1;min-height:0}
  .sw-opt .ck{margin-left:auto;color:var(--text-primary);font-size:20px}
  .sw-opt.cur{background:#F7F8FA}
  .sw-opt.cur.hl,.sw-opt.hl{background:#F2F4F7}
  .sw-foot{flex-shrink:0}
  .sw-add{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px;border:none;border-top:1px solid var(--border-default);background:none;
    font:inherit;font-size:14px;color:var(--text-primary);cursor:pointer;text-align:left}
  .sw-add:hover{background:#F2F4F7}
  .sw-add:focus-visible{outline:2px solid #0053CC;outline-offset:-2px}
  .sw-add .mi{font-size:20px}
  .sw-promo{background:#E8F0FD;border-top:1px solid var(--border-default);padding:14px}
  .sw-promo p{margin:0 0 10px;color:var(--text-primary)}
  /* ===== UI kit tokens (Ignat 2026-11-23: "check that UI-kit is applied") — no local colours, radius 4, weights 400, 4px grid ===== */
  .sb{--sb-fg:var(--text-primary);--sb-ic:var(--color-grey-50);--sb-muted:var(--text-secondary);--sb-hover:var(--bg-hover);
    --sb-on-bg:var(--bg-active);--sb-on-fg:var(--color-primary);--sb-border:var(--border-default)}
  .sb-org,.sb-item,.sb-group,.sb-fold,.sb-collapse,.sb-pin .unpin,#fly,#fly .fly-h,#fly .fly-i,.sw,.sw-opt,.sw-search input,.sw-promo .btn,.sw-add{border-radius:var(--radius-sm)}
  .sb-org .av,.sw-opt .av,.sw-head .av{border-radius:var(--radius-full);background:var(--color-primary)!important}
  .sb-item .lb,.sb-group .lb{line-height:20px;padding:4px 0}
  .sb-org,.sb-org .nm,.sb-item.on,.sb-group.on-parent,#fly .fly-i.on,.sw-label{font-weight:400}
  #fly{--sb-fg:var(--text-primary);--sb-hover:var(--bg-hover);--sb-on-bg:var(--bg-active);--sb-on-fg:var(--color-primary);--sb-border:var(--border-default)}
  #fly .fly-h{font-weight:700}   /* group name heads the flyout (Ignat 2026-11-23) */
  #fly a.fly-h:hover,#fly .fly-i:hover{background:var(--bg-hover)} #fly .fly-i.on:hover{background:var(--bg-active)}
  .sw,#fly{box-shadow:var(--shadow-menu);border-color:var(--border-default)}
  .sw-opt.hl,.sw-opt.cur.hl,.sw-add:hover{background:var(--bg-hover)} .sw-opt.cur{background:var(--bg-row-selected)}
  .sw-search input{background:var(--bg-surface)}
  .sw-promo{background:var(--bg-subtle);border-top-color:var(--border-default)}
  .bar-toggle{color:var(--color-grey-50)} .bar-toggle:hover{background:var(--bg-hover);color:var(--text-primary)}
  body.m-edge .sb-collapse{width:32px;height:32px;min-height:32px;right:-16px;border-radius:var(--radius-full);border-color:var(--border-default);box-shadow:none}
  /* A · icon rail */
  body.rail .sb{width:50px}
  /* smooth open/close (Ignat 2026-11-23, Shopify-like): the panel width animates while its contents keep their final
     layout and are clipped, so nothing re-wraps mid-animation; icons sit at x=25 in both states, labels fade in */
  .sb-in{overflow:hidden}
  body:not(.rail) .sb-in > .sb-head,body:not(.rail) .sb-in > .sb-scroll{min-width:230px}
  body.rail .sb-in > .sb-head,body.rail .sb-in > .sb-scroll{width:50px;min-width:50px;max-width:50px}
  body.rail .sb-in > .sb-collapse{width:34px;align-self:flex-start}
  .sb .lb,.sb .chev,.sb .sidebar-badge,.sb .sb-org .nm,.sb .sb-sub,.sb .sb-pin,.sb .sb-fold{transition:opacity .16s ease .06s}

function toggleCollapse(){

  // instead of jumping, labels fade. Icons stay at the same x in both states.
  var sb = document.getElementById('sb'), EASE = 'cubic-bezier(.2,0,0,1)', D = 200;
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var subs = function(){ return [].slice.call(document.querySelectorAll('#sb .sb-subs, #sb #sb-pins:not([hidden])')); };
  hideFly(true);

    st.collapsed = true; saveSt();

    sb.classList.add('sb-hiding');
    subs().forEach(function(el){ el.style.overflow = 'hidden'; el.animate([{ height: el.offsetHeight + 'px' }, { height: '0px' }], { duration: D, easing: EASE, fill: 'forwards' }); });

  requestAnimationFrame(function(){ requestAnimationFrame(function(){ sb.classList.remove('sb-reveal'); }); });
  document.getElementById('sb-collapse').focus();
}

  var kv = [['Name', esc(o.name)], ['MRR (is recalculated once a day)', '220 USD'], ['Subscription billing history', '<a href="#">Subscription billing history</a>'],
    ['Provider billing', 'NONE'], ['Products', 'SYNC, INSIGHTS'], ['Products &amp; Subscriptions', '<b>INSIGHTS:</b> [TRIAL]; <b>SYNC:</b> [PRO, ASSISTED_SETUP];'],
    ['Find in HubSpot', '<a href="#">' + esc(o.name) + '</a>'], ['Country', o.country], ['Onboarding finished', o.onb], ['Archived', 'false'],
    ['Inventory Enabled', 'false'], ['Demo allowed', 'true'], ['Potential Large Plus', 'false'], ['Dedicated server', '<a href="#">not assigned</a>'],
    ['Queues', '<a href="#">Show active queues</a>'], ['Cin7 integration', 'false']];
  var sel = o.id === current;
  return '<div class="org-top"><h1 tabindex="-1" id="org-title">' + esc(o.name) + '</h1>'
       + '<span class="org-status ' + (sel ? 'sel' : 'not') + '" id="org-status">' + (sel ? '<span class="mi">check_circle</span>Selected' : 'Not selected') + '</span></div>'
       + '<div class="bar">'
       // already selected: no button — the status chip next to the name carries the state
       + (sel ? '' : '<button class="btn btn-success" id="btn-select-org" onclick="selectOrg(\'' + o.id + '\', \'stay\')"><span class="mi" style="font-size:18px">check</span>Select Organization</button>')
       + '<button class="btn"><span class="mi" style="font-size:18px">edit</span>Edit Organization</button>'
       + '<button class="btn btn-error"><span class="mi" style="font-size:18px">archive</span>Archive</button>'
       + '<button class="btn btn-error"><span class="mi" style="font-size:18px">close</span>Delete Transactions</button>'
       + '<button class="btn btn-error"><span class="mi" style="font-size:18px">close</span>Delete Organization</button>'
       + '<button class="btn btn-success">Send Sync Purchase Event</button><button class="btn btn-success">Send Insights Purchase Event</button>'
       + '<button class="btn btn-success">Analyze integrations</button></div>'
       + '<div class="org-wrap"><div><h2 class="org-h2">Organization details</h2>'
       + '<table class="kv"><tbody>' + kv.map(function(r){ return '<tr><th>' + r[0] + '</th><td>' + r[1] + '</td></tr>'; }).join('') + '</tbody></table></div>'
       + '<div class="side"><section><h2>Firms</h2><ul><li><a href="#">My great firm</a></li><li>Partner tier: NONE</li><li>Relation: firm colleague</li></ul></section>'
       + '<section><h2>Users</h2><ul><li>▸ ignatiy.plotnikov@synder.com — manager</li><li>▸ andrew.shitsko@synder.com — manager</li></ul></section>'
       + '<section><h2>Companies</h2><ul>' + esc(o.providers || 'synder(ACTIVE)').split('\n').map(function(p){ return '<li>▸ ' + p + '</li>'; }).join('') + '</ul></section></div></div>';
}
function pageStub(title){ return '<h1 tabindex="-1">' + esc(title) + '</h1>' + STUB; }

function renderContent(focusPin){
  var c = document.getElementById('content'), m;
  if (route === 'admin') c.innerHTML = pageAdmin();
  else if (route === 'p/organizations') c.innerHTML = pageOrgs();
  else if ((m = route.match(/^org\/(.+)$/))) c.innerHTML = pageOrg(m[1]);
  else if ((m = route.match(/^p\/(.+)$/)) && PAGES[m[1]]) c.innerHTML = pageStub(PAGES[m[1]].label);
  else if (route === 'dashboard') c.innerHTML = '<h1 tabindex="-1">Dashboard</h1><p class="stub-note">' + esc(byId(current).name) + ' · [live page not captured]</p>';
  else c.innerHTML = pageStub(LABELS[route] || 'Page');
  if (focusPin) { var b = c.querySelector('.pin[data-key="' + focusPin + '"]'); if (b) b.focus(); }
}
function render(){
  route = (location.hash || (view === 'admin' ? '#admin' : '#dashboard')).slice(1) || 'dashboard';
  if (route === 'p/current-org') { location.replace('#org/' + current); return; }
  var g = groupOf(route);
  if (g && !st.open[g]) { st.open[g] = true; saveSt(); }   // landing on a sub-page opens its group
  renderSidebar(); renderContent();
}
window.addEventListener('hashchange', function(){ render(); var h = document.querySelector('#content h1'); if (h) h.focus({ preventScroll: true }); });
applyMode();
setView((function(){ try { return sessionStorage.getItem('sb-condensed-view') || 'admin'; } catch(e){ return 'admin'; } })());
</script>
