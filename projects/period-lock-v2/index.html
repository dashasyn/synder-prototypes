<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  /* Every text is >= 14px. Shell = v1 (live chrome from projects/stripe-invoice-date); tables = kit table.synder-table;
     statuses = kit .status. Desktop only (min 1280). */
  html,body{height:100%}
  input,select,textarea,button{font-family:inherit;font-size:14px}
  body{display:flex;flex-direction:column;min-width:1280px;font-size:14px;color:var(--text-primary);
    background:var(--color-white);overflow:hidden}

  /* demo control — deliberately not product chrome (AGENTS.md variant-switch bar) */
  .demo-bar{position:relative;z-index:1300;display:flex;align-items:center;gap:12px;background:var(--color-grey);color:var(--color-white);
    padding:8px 20px;flex-shrink:0;font-size:14px;flex-wrap:wrap}
  .demo-bar .vs-label{font-weight:500;letter-spacing:.01em;opacity:.75;text-transform:uppercase;font-size:14px}
  .demo-bar label{opacity:.85;font-size:14px}
  .demo-bar input[type=date]{width:150px;height:28px;padding:2px 8px;border:none;border-radius:4px;font-size:14px}
  .demo-bar .sep{width:1px;height:20px;background:rgba(255,255,255,.2)}
  .demo-bar .vs-opts{display:flex;gap:4px;background:rgba(255,255,255,.1);border-radius:6px;padding:3px}
  .demo-bar button{background:none;border:none;color:rgba(255,255,255,.75);font-family:inherit;
    font-size:14px;padding:4px 12px;border-radius:4px;cursor:pointer;white-space:nowrap}
  .demo-bar button:hover{color:var(--color-white)}
  .demo-bar button.on{background:var(--color-white);color:var(--text-primary);font-weight:500}
  .demo-bar .plain{background:rgba(255,255,255,.1)}

  .mi{font-family:'Material Icons Outlined';font-weight:normal;font-style:normal;font-size:20px;line-height:1;
    display:inline-block;-webkit-font-smoothing:antialiased;font-feature-settings:'liga';text-transform:none;
    letter-spacing:normal;white-space:nowrap;vertical-align:middle}

  /* live app shell (v1) */
  .app{flex:1;display:flex;min-height:0;background:var(--color-white);position:relative}
  .sb{width:208px;flex-shrink:0;border-right:1px solid var(--border-default);background:var(--color-white);
    display:flex;flex-direction:column;overflow-y:auto;position:relative}
  .sb-org{display:flex;align-items:center;gap:10px;height:56px;padding:0 14px;flex-shrink:0;width:100%;
    border:none;border-bottom:1px solid var(--border-default);background:none;font:inherit;font-size:14px;
    font-weight:500;color:var(--text-primary);cursor:pointer;text-align:left}
  .sb-org:hover{background:var(--color-grey-5)}
  .sb-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
  .sb-av.pt{background:#F5C6CB;color:#B23B4B} .sb-av.sm{background:var(--color-status-green-bg);color:var(--color-green)}
  .sb-org .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sb-org .mi{color:var(--text-secondary)}
  .sb-item{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 14px;color:var(--text-primary);
    border-bottom:1px solid var(--border-default);font-size:14px;text-decoration:none;flex-shrink:0}
  .sb-item .mi{color:var(--color-primary);font-size:20px}
  .sb-item .chev{margin-left:auto;color:var(--text-secondary)}
  a.sb-item:hover{background:var(--color-grey-5)}
  .sb-item.on{background:var(--color-primary);color:var(--color-white)} .sb-item.on .mi{color:var(--color-white)}
  .sb-beta{color:var(--color-primary);border:1px solid var(--color-primary-50);border-radius:4px;padding:0 4px;font-size:14px;line-height:18px}
  .sb-gap{height:40px;border-bottom:1px solid var(--border-default);flex-shrink:0}
  .sb-open{background:var(--color-grey-5)}
  .sb-sub{display:flex;align-items:center;gap:10px;min-height:38px;padding:0 14px 0 34px;color:var(--text-primary);
    text-decoration:none;font-size:14px;flex-shrink:0}
  .sb-sub .mi{font-size:18px;color:var(--color-primary)}
  a.sb-sub:hover{background:var(--color-grey-5)}
  .sb-sub.on{background:var(--color-primary);color:var(--color-white)} .sb-sub.on .mi{color:var(--color-white)}
  .sb-new{background:var(--color-status-green-bg);color:var(--color-green);border-radius:4px;padding:0 4px}
  .org-menu{position:absolute;top:58px;left:8px;right:8px;z-index:50;background:var(--color-white);
    border:1px solid var(--border-default);border-radius:var(--radius-md);box-shadow:var(--shadow-dropdown);padding:4px 0}
  .org-menu button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px;border:none;background:none;
    font:inherit;font-size:14px;color:var(--text-primary);cursor:pointer;text-align:left}
  .org-menu button:hover{background:var(--bg-hover)}
  .org-menu .sub{color:var(--text-secondary)}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .top{height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:flex-end;gap:24px;padding:0 24px;
    border-bottom:1px solid var(--border-default);position:relative}
  .syncs{color:var(--text-secondary);border-bottom:3px solid var(--color-primary);padding:6px 0}
  .syncs b{color:var(--color-primary);font-weight:500;font-size:16px}
  .top .mi{color:var(--color-primary);font-size:24px}
  .top .how{color:var(--color-primary)}
  .icon-btn{background:none;border:none;padding:0;cursor:pointer;display:flex}
  .user-menu{position:absolute;right:16px;top:52px;z-index:50}
  .user-menu .dropdown-item{border:none;background:none;width:100%;font-family:inherit;text-align:left}
  .content{flex:1;overflow:auto;padding:16px 24px 32px;position:relative}

  /* page pieces */
  .page-header{margin-bottom:16px}
  .title-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .narrow{max-width:960px}
  .ilogo{width:24px;height:24px;border-radius:4px;color:#fff;font-weight:700;font-size:14px;display:inline-flex;
    align-items:center;justify-content:center;flex-shrink:0}
  .integ{display:inline-flex;align-items:center;gap:8px}
  .chips{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
  .status .mi{font-size:16px;margin-right:2px}
  a.status{text-decoration:none;cursor:pointer}
  a.status:hover{filter:brightness(.96)}
  .lock-chip{gap:2px}
  .muted{color:var(--text-secondary)}
  .err{color:var(--color-red);font-size:14px;margin-top:4px}
  .table-wrap{margin-bottom:8px}
  .synder-table td.num,.synder-table th.num{text-align:right}
  .synder-table tr.total td{font-weight:500}
  .back{display:inline-block;margin-bottom:12px}
  .back-btn{display:inline-flex;align-items:center;gap:4px;background:var(--color-grey-5);border:1px solid var(--border-default);
    border-radius:4px;padding:6px 12px;font-family:inherit;font-size:14px;color:var(--text-primary);margin-bottom:20px;cursor:pointer;text-decoration:none}
  .back-btn .mi{font-size:18px}

  /* organization settings */
  .os-card{background:var(--color-white);border:1px solid var(--border-default);border-radius:var(--radius-md);padding:20px 24px;margin-bottom:16px}
  .os-card > h2{font-size:20px;font-weight:500;margin:0 0 12px;line-height:28px}
  .os-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:12px}
  .os-head h2{font-size:20px;font-weight:500;margin:0;line-height:28px}
  .kv{display:grid;grid-template-columns:200px 1fr;column-gap:16px}
  .kv > div{padding:10px 0;border-bottom:1px solid var(--border-default)}
  .kv > div:nth-last-child(-n+2){border-bottom:none}
  .kv .k{color:var(--text-secondary)}
  .irow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border-default)}
  .irow:last-of-type{border-bottom:none}
  .irow .tz{margin-left:auto;color:var(--text-secondary)}
  .ofields{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;max-width:720px;margin-bottom:16px}
  .ofields label{display:block;color:var(--text-secondary);margin-bottom:4px}
  .ofields input,.ofields select{width:100%}
  .nrow{display:flex;align-items:center;gap:16px;padding:8px 0}
  .nrow .nl{width:240px}
  .tabs{padding:0}
  .tabs .tab{border:none;background:none;font-family:inherit;border-bottom:2px solid transparent}
  .tabs .tab.active{border-bottom-color:var(--color-primary)}

  /* period lock section */
  #period-lock{scroll-margin-top:16px;transition:box-shadow .3s}
  #period-lock.flash{box-shadow:0 0 0 2px var(--color-primary)}
  .pl-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 0}
  .pl-line .k{width:160px;color:var(--text-secondary);flex-shrink:0}
  .pl-big{font-size:16px;font-weight:500}
  .pl-sub{font-size:16px;font-weight:500;margin:20px 0 8px}
  .alert{flex-wrap:wrap}
  .alert .grow{flex:1;min-width:0}
  .alert .btn{flex-shrink:0}
  .alert.mismatch{margin:12px 0 0}
  #sheet-mismatch{align-items:flex-start;row-gap:8px}
  #sheet-mismatch .grow{flex-basis:calc(100% - 40px)}
  #sheet-mismatch .btn{margin-left:28px}

  /* side sheet (DESIGN_RULES: 480px, from the right, #000 40%) */
  .sheet-bg{position:fixed;inset:0;top:var(--demo-h,0px);z-index:1200;background:rgba(0,0,0,.4);display:flex;justify-content:flex-end}
  .sheet{width:480px;height:100%;background:var(--color-white);display:flex;flex-direction:column;box-shadow:var(--shadow-modal);
    animation:slidein .18s ease-out}
  @keyframes slidein{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
  .sheet-h{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--border-default)}
  .sheet-h .t{font-size:20px;font-weight:500}
  .sheet-b{flex:1;overflow:auto;padding:20px 24px}
  .sheet-f{border-top:1px solid var(--border-default);padding:12px 24px;display:flex;align-items:center;gap:8px}
  .sheet-f .res{margin-right:auto;min-width:0}
  .sheet-f .res.warn{color:var(--color-yellow);font-weight:500}
  .grp{margin-bottom:24px}
  .grp-t{font-weight:500;margin-bottom:8px}
  .opt{display:flex;align-items:flex-start;gap:10px;padding:8px 0;cursor:pointer}
  .opt.dis{cursor:not-allowed;color:var(--text-secondary)}
  .opt input{margin-top:2px;flex-shrink:0}
  .opt .ol{display:flex;flex-direction:column;gap:2px}
  .nest{margin:4px 0 4px 28px}
  .nest label.fl{display:block;margin-bottom:4px}
  .nest input[type=date]{width:200px}
  .chk{display:flex;align-items:center;gap:8px;margin-top:12px;cursor:pointer}
  .chk input[type=number]{width:64px;text-align:center}
  .switch-row{display:flex;align-items:center;justify-content:space-between;padding:4px 0 16px;border-bottom:1px solid var(--border-default);margin-bottom:20px}
  .switch-row .grp-t{margin:0}
  input[aria-invalid=true]{border-color:var(--border-error)}

  /* transactions */
  .tx-bar{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
  .tx-bar .search{width:200px}
  .tx-bar .stsel{width:200px}
  .tx-green{background:var(--color-green)} .tx-green:hover{background:var(--color-success-hover)}
  .clear-x{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 4px 0 8px;border-radius:12px;background:var(--color-grey-10);font-size:14px}
  .clear-x button{border:none;background:none;cursor:pointer;display:flex;padding:0;color:var(--text-secondary)}
  .clear-x .mi{font-size:18px}
  .st-col{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:8px 0}
  .bulk-bar{display:flex;align-items:center;gap:12px;min-height:44px;padding:4px 0 12px;flex-wrap:wrap}
  .bulk-bar .cnt{font-weight:500}
  .menu-fixed{position:fixed;z-index:900;display:block;min-width:260px}
  .menu-fixed .dropdown-item{border:none;background:none;width:100%;font-family:inherit;text-align:left}
  .menu-fixed .dropdown-item.off{color:var(--text-muted);cursor:not-allowed;flex-direction:column;align-items:flex-start;gap:2px}
  .menu-fixed .dropdown-item.off:hover{background:none}
  .menu-fixed .why-row{cursor:default}
  .menu-fixed .why-row:hover{background:none}

  /* sync info */
  .stub{max-width:1100px}
  .set-card{background:var(--color-white);border-radius:var(--radius-sm);box-shadow:var(--shadow-card);overflow:hidden}
  .set-body{padding:20px}
  .set-title{font-size:16px;font-weight:500;color:var(--text-primary);padding:16px 0 4px}
  .sd-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:4px}
  .sd-title{font-size:20px;font-weight:500;color:var(--text-primary)}
  .sd-actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .sd-sub{color:var(--text-secondary);margin-bottom:16px}
  .lock-why{display:inline-flex;align-items:center;gap:4px}
  .lock-why .mi{font-size:18px;color:var(--text-secondary)}
  .qb{display:inline-flex;width:20px;height:20px;border-radius:50%;background:#2CA01C;color:#fff;font-weight:700;
    align-items:center;justify-content:center;vertical-align:-4px;font-size:14px}
  .hl{background:var(--color-status-yellow-bg);padding:0 3px;border-radius:2px}
  tr.log-detail td{height:auto;padding:10px 12px 12px 52px}
  .dl-grid{display:flex;flex-wrap:wrap;gap:6px 24px}

  /* filters, dashboard, summaries */
  .filters{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end;background:var(--color-grey-5);padding:16px;border-radius:4px;margin-bottom:16px}
  .filters .fl{font-weight:500;margin-bottom:6px}
  .filters select,.filters input{width:180px}
  .filters .dr{display:flex;gap:6px} .filters .dr input{width:150px}
  .amount-big{font-size:20px;font-weight:500}
  .sum-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px}
  .sum-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
  .held-block{border:1px solid var(--border-default);border-radius:var(--radius-md);margin-bottom:16px}
  .held-block .alert{margin:0;border-radius:var(--radius-md) var(--radius-md) 0 0}
  .held-block .hb-body{padding:0 16px 8px}

  /* toasts (live error-toast layout, v1) — no Undo */
  #toasts{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:2000;display:flex;flex-direction:column;gap:8px;width:520px}
  .toast{position:relative;display:flex;align-items:flex-start;gap:12px;color:var(--color-white);border-radius:4px;
    padding:14px 40px 16px 16px;box-shadow:var(--shadow-modal);overflow:hidden;font-size:16px;line-height:24px}
  .toast.err{background:var(--color-red)} .toast.ok{background:var(--color-green)}
  .toast > .mi{font-size:24px}
  .toast-x{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--color-white);cursor:pointer;padding:2px}
  .modal-bg{z-index:1500}
  .modal .synder-modal-body{color:var(--text-primary)}
  .modal .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
  .modal .form-row label{display:block;font-weight:500;margin-bottom:4px}
  .modal .form-row input{width:100%}
</style>
</head>

<script>
/* Copy provenance
   captured   shell, sidebar, top bar, user menu, Transactions list chrome, Sync details labels + Sync log paragraph,
              Summaries list chrome, Dashboard issues table, Activity Log page (all via v1 / projects/stripe-invoice-date);
              Organization settings sections + strings from .synder-state/settings-rework/inventory.json (live capture).
   proposed   all period-lock copy (section, sheet, chips, held queue, reasons, modals, toasts, history).
   uncaptured shown as [live copy not captured]. */
var MARK = '[live copy not captured]';
var TODAY_DEFAULT = '2026-10-06', BOOKS_DEFAULT = '2026-09-30', ME = 'Viacheslav Tarabarov';

var INTEG = {
  stripe:  { id:'stripe',  name:'Stripe Test (sandbox)', src:'Stripe',  logo:'S', color:'#635BFF', tz:'Europe/Belgrade' },
  shopify: { id:'shopify', name:'Changolivia (Shopify)', src:'Shopify', logo:'C', color:'#96BF48', tz:'Europe/Belgrade' },
  paypal:  { id:'paypal',  name:'PayPal (sandbox)',      src:'PayPal',  logo:'P', color:'#003087', tz:'Europe/Belgrade' }
};
var ORGS = {
  pt: { name:'Buddy QA (PT)', av:'PT', books:'Buddy QA (PT) (QuickBooks Online)', mode:'Per Transaction' },
  sm: { name:'Green Leaf (SM)', av:'SM', books:'Green Leaf (SM) (QuickBooks Online)', mode:'Summary mode' }
};

/* ---------- dates ---------- */
var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function pd(iso){ var p = iso.split('-').map(Number); return { y:p[0], m:p[1], d:p[2] }; }
function isoOf(t){ return t.toISOString().slice(0,10); }
function addDays(iso, n){ var p = pd(iso); return isoOf(new Date(Date.UTC(p.y, p.m-1, p.d+n))); }
function nextDay(iso){ return addDays(iso, 1); }
function fmt(iso){ if(!iso) return ''; var p = pd(iso); return MON[p.m-1] + ' ' + p.d + ', ' + p.y; }
function fmtMD(iso){ var p = pd(iso); return MON[p.m-1] + ' ' + p.d; }
function range(a, b){ return pd(a).y === pd(b).y ? fmtMD(a) + ' – ' + fmt(b) : fmt(a) + ' – ' + fmt(b); }
function arrow(a, b){ return pd(a).y === pd(b).y ? fmtMD(a) + ' → ' + fmt(b) : fmt(a) + ' → ' + fmt(b); }
function validIso(v){ return /^\d{4}-\d{2}-\d{2}$/.test(v || ''); }
function maxIso(a, b){ return !a ? b : (!b ? a : (a > b ? a : b)); }
/* move forward every month: on day N, lock through the end of the previous month */
function lastRun(today, day){ var t = pd(today);
  return t.d >= day ? isoOf(new Date(Date.UTC(t.y, t.m-1, day))) : isoOf(new Date(Date.UTC(t.y, t.m-2, day))); }
function lockFromRun(run){ var p = pd(run); return isoOf(new Date(Date.UTC(p.y, p.m-1, 0))); }
function nowHM(){ var d = new Date(); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }

/* ---------- state ---------- */
function initialLock(){ return { on:true, source:'qbo', synderDate:'2026-09-30', auto:false, day:5, late:'hold', qboLast:'2026-09-30' }; }
var S = {
  org:'pt', route:'settings', hash:'settings', today:TODAY_DEFAULT, role:'admin',
  books:{ date:BOOKS_DEFAULT, checked:'Oct 6, 2026 09:12' },
  lock:{ pt:initialLock(), sm:initialLock() },
  draft:null, modal:null, menu:null, orgMenu:false, userMenu:false, allowNav:false,
  txTab:'all', txFilter:{ status:'All statuses', q:'' }, sel:{}, smSel:{},
  bulk:{ from:'2026-09-15', to:'2026-10-05' },
  act:{ type:'All', action:'All', initiator:'All', q:'' },
  logOpen:{}, dashTab:'sync-issues', userTab:'users', smHeld:'held', smHeldOpen:true, adjSeq:1002
};
var HISTORY = {
  pt: [
    { ts:'Oct 5, 2026 16:38', who:ME, change:'Late transactions: Post → Hold' },
    { ts:'Oct 1, 2026 06:00', who:'System', change:'Aug 31 → Sep 30, 2026' },
    { ts:'Sep 28, 2026 13:00', who:'Maya Chen', change:'Source: Set in Synder → QuickBooks closing date' },
    { ts:'Sep 5, 2026 00:00', who:'System', change:'Jul 31 → Aug 31, 2026' },
    { ts:'Aug 5, 2026 00:00', who:'System', change:'Jun 30 → Jul 31, 2026' },
    { ts:'Jul 2, 2026 11:20', who:'Maya Chen', change:'Period lock on · Locked through Jun 30, 2026' }
  ],
  sm: [
    { ts:'Oct 5, 2026 16:40', who:ME, change:'Late transactions: Post → Hold' },
    { ts:'Oct 1, 2026 06:00', who:'System', change:'Aug 31 → Sep 30, 2026' },
    { ts:'Sep 12, 2026 10:05', who:'Maya Chen', change:'Period lock on · Locked through Aug 31, 2026' }
  ]

function openEdit(prefill){
  if (S.role !== 'admin') return;
  var c = S.lock[S.org];
  S.draft = { on:c.on, source:c.source, synderDate:c.synderDate || lockThrough(S.org) || '', auto:c.auto, day:String(c.day), late:c.late };
  if (!S.books.date && S.draft.source === 'qbo') S.draft.source = 'synder';
  if (prefill) for (var k in prefill) S.draft[k] = prefill[k];
  renderSheet();
}
function draftLock(d){ return d.on ? lockThrough(S.org, { on:true, source:d.source, synderDate:d.synderDate, auto:d.auto, day:d.day, qboLast:S.lock[S.org].qboLast }) : null; }
function isDirty(){
  var d = S.draft, c = S.lock[S.org]; if (!d) return false;
  if (!d.on && !c.on) return false;
  if (d.on !== c.on || d.source !== c.source || d.late !== c.late) return true;
  if (d.source === 'synder') {
    if (d.synderDate !== c.synderDate || d.auto !== c.auto) return true;
    if (d.auto && String(d.day) !== String(c.day)) return true;
  }
  return false;
}
function errors(d){
  var e = {};
  if (!d.on) return e;
  if (d.source === 'qbo' && !S.books.date) e.source = 'No closing date in QuickBooks';
  if (d.source === 'synder') {
    if (!validIso(d.synderDate)) e.synderDate = 'Required';
    else if (d.synderDate > S.today) e.synderDate = "Can't lock a future date";
    if (d.auto && !dayValid(d.day)) e.day = 'Enter a day from 1 to 28';
  }
  return e;
}
function setDraft(k, v){ if (!S.draft || S.draft[k] === v) return; S.draft[k] = v; renderSheet(); }

/* save: moving the lock earlier or turning it off always names the reopened range */
function attemptSave(after){
  var d = S.draft; if (!d || !isDirty() || Object.keys(errors(d)).length) return;
  var org = S.org, cur = lockThrough(org), nl = draftLock(d);
  function doIt(){ applySave(); if (after) after(); }
  if (cur && !nl) {
    S.modal = { kind:'confirm', title:'Unlock everything through ' + fmt(cur) + '?', ok:'Turn off', danger:true, onOk:doIt }; renderModal(); return;
  }
  if (cur && nl && nl < cur) {
    S.modal = { kind:'confirm', title:'Unlock ' + range(nextDay(nl), cur) + '?', ok:'Unlock', danger:true, onOk:doIt }; renderModal(); return;
  }
  doIt();
}
function applySave(){
  var d = S.draft, org = S.org, c = S.lock[org], before = lockThrough(org), ch = [];
  var next = { on:d.on, source:d.source, synderDate:d.synderDate, auto:d.auto, day:dayValid(d.day) ? +d.day : c.day, late:d.late, qboLast:c.qboLast };
  var after = lockThrough(org, next);
  if (!c.on && next.on) ch.push('Period lock on · Locked through ' + fmt(after));
  else if (c.on && !next.on) ch.push('Period lock off · Unlocked through ' + fmt(before));
  else {
    if (before !== after) ch.push(arrow(before, after));
    if (c.source !== next.source) ch.push('Source: ' + srcName(c.source) + ' → ' + srcName(next.source));
    if (next.source === 'synder' && (c.auto !== next.auto || (next.auto && c.day !== next.day)))
      ch.push('Move forward every month: ' + (next.auto ? 'on day ' + next.day : 'off'));
    if (c.late !== next.late) ch.push('Late transactions: ' + lateShort(c.late) + ' → ' + lateShort(next.late));
  }
  S.lock[org] = next;
  ch.reverse().forEach(function(x){ addHistory(org, ME, x); });
  S.draft = null; renderSheet();
  toast('ok', next.on ? 'Period lock saved' : 'Period lock turned off');
  render();
}

/* ---------- toasts (no Undo) ---------- */
var toastSeq = 0;
function toast(kind, msg){
  var box = document.getElementById('toasts'), el = document.createElement('div');
  el.className = 'toast ' + kind; el.id = 'toast-' + (++toastSeq); el.setAttribute('role', kind === 'err' ? 'alert' : 'status');
  el.innerHTML = '<span class="mi">' + (kind === 'err' ? 'error' : 'check_circle') + '</span><div class="toast-msg">' + msg + '</div>'
    + '<button class="toast-x" aria-label="Close" data-c="toastClose"><span class="mi">close</span></button>';
  box.appendChild(el);
  setTimeout(function(){ if (el.parentNode) el.remove(); }, 8000);

/* ---------- held queue (PT) ---------- */
function postHeld(ids){
  var fo = firstOpen('pt'), n = 0;
  ids.forEach(function(id){
    var t = txn(id); if (!t || t.status !== 'held') return;
    if (isLocked('pt', t.date)) { t.redated = [t.date, fo]; t.date = fo; t.time = '00:00'; }
    t.status = 'synced'; n++;
    SI[id].logs = [{ type:LOGTYPE[t.type] || t.type, info:SI[id].srcId, redate:!!t.redated, open:true }];
  });
  S.sel = {};
  toast('ok', n + ' transaction' + (n === 1 ? '' : 's') + ' posted on ' + fmt(fo));
  render();
}
function skipHeld(ids){
  var n = ids.length, t0 = txn(ids[0]);
  S.modal = { kind:'confirm', title:n === 1 ? 'Skip ' + t0.info + '?' : 'Skip ' + n + ' transactions?', ok:n === 1 ? 'Skip' : 'Skip ' + n,
    onOk:function(){ ids.forEach(function(id){ txn(id).status = 'skipped'; }); S.sel = {};
      toast('ok', n + ' transaction' + (n === 1 ? '' : 's') + ' skipped'); render(); } };
  renderModal();
}
function selIds(){ return Object.keys(S.sel).filter(function(k){ return S.sel[k] && txn(k) && txn(k).status === 'held'; }); }

/* ---------- held late data (SM) ---------- */
function smPost(){
  var fo = firstOpen('sm'), by = {};
  SM_HELD.forEach(function(h){ (by[h.integ] = by[h.integ] || []).push(h); });
  var made = [];
  ['stripe','shopify','paypal'].forEach(function(ig){
    var rows = by[ig]; if (!rows) return;
    var sales = 0, refunds = 0; rows.forEach(function(r){ if (r.amt >= 0) sales += r.amt; else refunds -= r.amt; });
    var net = sales - refunds, no = 'JE-ADJ-' + S.adjSeq++, lines = [];
    if (sales) lines.push(['Sales · Online', '', money(sales)]);
    if (refunds) lines.push(['Refunds', money(refunds), '']);
    lines.push([INTEG[ig].name + ' clearing', net >= 0 ? money(net) : '', net < 0 ? money(-net) : '']);
    var ds = rows.map(function(r){ return r.date; }).sort();
    SUMS.unshift({ id:'adj' + no.slice(-4), adj:no, date:fo, range:fmtMD(fo) + ' - ' + fmt(fo), integ:ig, amount:money(net) + ' USD', status:'synced',
      late:range(ds[0], ds[ds.length-1]) + ' · ' + rows.length + ' transaction' + (rows.length === 1 ? '' : 's'), lines:lines, tot:money(sales || refunds) });
    made.push(no);
  });
  SUMS.sort(function(a, b){ return a.date < b.date ? 1 : a.date > b.date ? -1 : (a.adj ? -1 : 0) - (b.adj ? -1 : 0); });
  S.smHeld = 'posted';
  toast('ok', made.length + ' adjustment JEs posted on ' + fmt(fo));
  render();
}
function smSkip(){
  S.modal = { kind:'confirm', title:'Skip ' + SM_HELD.length + ' transactions?', ok:'Skip ' + SM_HELD.length,
    onOk:function(){ S.smHeld = 'skipped'; toast('ok', SM_HELD.length + ' transactions skipped'); render(); } };
  renderModal();
}

/* ---------- rollback / resync ---------- */
function rollbackTxn(id){
  var t = txn(id); if (isLocked('pt', t.date)) return;
  S.modal = { kind:'confirm', title:'Roll back ' + t.info + '?', ok:'Roll back',
              onOk:function(){ t.status = 'rollback'; toast('ok', 'Rollback started'); render(); } };
  renderModal();
}
function resyncTxn(id){ var t = txn(id); if (isLocked('pt', t.date)) return; t.status = 'inprogress'; toast('ok', 'Resync started'); render(); }
function rollbackSum(id){
  var s = sum(id); if (isLocked('sm', s.date)) return;
  S.modal = { kind:'confirm', title:'Roll back summary ' + (s.adj || s.range) + '?', ok:'Roll back',
              onOk:function(){ s.status = 'rollback'; toast('ok', 'Rollback started'); render(); } };
  renderModal();
}
function resyncSum(id){ var s = sum(id); if (isLocked('sm', s.date)) return; s.status = 'inprogress'; toast('ok', 'Resync started'); render(); }
function bulkCalc(org){
  var f = S.bulk.from, to = S.bulk.to, valid = validIso(f) && validIso(to) && f <= to, n = 0, m = 0, ids = [];
  var list = org === 'pt' ? TXNS : SUMS;
  if (valid) list.forEach(function(t){
    if (t.status !== 'synced' || t.date < f || t.date > to) return;
    n++; if (isLocked(org, t.date)) m++; else ids.push(t.id);

  return { valid:valid, n:n, m:m, ids:ids };
}
function openBulk(org){

}

/* ---------- floating menus ---------- */
function openMenu(kind, id, btn){
  if (S.menu && S.menu.id === id && S.menu.kind === kind) { S.menu = null; renderMenu(); return; }
  var r = btn.getBoundingClientRect();
  S.menu = { kind:kind, id:id, x:r.right, y:r.bottom + 4, left:r.left };

}
function renderMenu(){
  var root = document.getElementById('menu-root'), m = S.menu;
  if (!m) { root.innerHTML = ''; return; }
  var items = '';
  function item(c, a, label, id){ items += '<button class="dropdown-item" role="menuitem" data-c="' + c + '" data-a="' + (a || '') + '"' + (id ? ' id="' + id + '"' : '') + '>' + label + '</button>'; }
  function off(label){ items += '<div class="dropdown-item off" role="menuitem" aria-disabled="true" data-off="' + label + '">' + label + '</div>'; }
  function guarded(org, date, list){
    var lk = isLocked(org, date);
    list.forEach(function(x){ if (lk) off(x[0]); else item(x[1], x[2], x[0]); });
    if (lk) items += '<div class="dropdown-divider"></div><div class="dropdown-item why-row" id="menu-why">' + whyOff(org) + '</div>';
  }

      item('skipOne', t.id, 'Skip');
    } else if (t.status === 'synced') guarded('pt', t.date, [['Rollback','rollbackTxn',t.id],['Resync','resyncTxn',t.id],['Delete','mark','']]);
  } else if (m.kind === 'sum') {
    var s = sum(m.id);
    item('goSum', s.id, 'Open summary');
    if (s.status === 'synced') guarded('sm', s.date, [['Rollback','rollbackSum',s.id],['Resync','resyncSum',s.id],['Delete','mark','']]);
  } else if (m.kind === 'actions') {
    item('mark', '', 'Sync', 'act-sync'); item('bulk', m.id, 'Rollback', 'act-rollback'); item('mark', '', 'Cancel', 'act-cancel'); item('mark', '', 'Archive', 'act-archive');
  }
  root.innerHTML = '<div class="dropdown-menu menu-fixed" role="menu" id="' + (m.kind === 'actions' ? 'actions-menu' : 'row-menu') + '">' + items + '</div>';
  var el = root.firstChild, w = el.offsetWidth, h = el.offsetHeight;
  el.style.left = (m.kind === 'actions' ? m.left : Math.max(8, m.x - w)) + 'px';
  el.style.top = (m.y + h > window.innerHeight - 8 ? Math.max(8, m.y - h - 40) : m.y) + 'px';
}

    + '<div class="chips" style="margin-top:8px">' + integCell(s.integ) + stChip(s.status) + sumChip(s) + '</div>'
    + (s.late ? '<div style="margin-top:8px" id="sd-late"><span class="muted">Late data:</span> ' + s.late + '</div>' : '') + '</div>'
    + '<div style="text-align:right"><div class="muted">Amount</div><div class="amount-big">' + s.amount + '</div></div></div>'
    + '<div class="sum-actions" id="sd-actions">' + actions + '</div>'
    + '<h2 style="font-size:16px;font-weight:500;margin-bottom:8px">' + (s.adj ? 'Journal entry lines' : 'Summary lines') + '</h2>'
    + '<div class="table-wrap"><table class="synder-table" id="sum-lines"><thead><tr><th>Account</th><th class="num">Debit</th><th class="num">Credit</th></tr></thead><tbody>' + lines + '</tbody></table></div></div>';
}

/* ---------- render ---------- */
var rendering = false, renderAgain = false;
function render(){
  if (rendering) { renderAgain = true; return; }
  rendering = true;
  try { doRender(); } finally { rendering = false; }
  if (renderAgain) { renderAgain = false; render(); }
}
function doRender(){
  var h = curHash(), r = routeOf(h);
  var known = ['settings','transactions','sync-info','dashboard','activity','summaries','summary-detail'];
  if (known.indexOf(r) < 0) { history.replaceState(null, '', '#settings'); h = 'settings'; r = 'settings'; }
  if (S.hash !== h) {
    if (r === 'transactions' && param(h, 'tab')) S.txTab = param(h, 'tab') === 'held' ? 'held' : 'all';
    if (r === 'activity' && param(h, 'type')) S.act = { type:param(h, 'type'), action:'All', initiator:'All', q:'' };
  }
  S.hash = h; S.route = r;
  if (r === 'summaries' || r === 'summary-detail') S.org = 'sm';
  if (r === 'transactions' || r === 'sync-info') S.org = 'pt';
  renderShell();
  var el = document.getElementById('screen'), html = '', wire = null;
  switch (r) {
    case 'settings': html = screenSettings(); break;
    case 'transactions': html = screenTransactions(); wire = wireTransactions; break;
    case 'sync-info': html = screenSyncInfo(); break;
    case 'dashboard': html = screenDashboard(); break;
    case 'activity': html = screenActivity(); wire = wireActivity; break;
    case 'summaries': html = screenSummaries(); break;
    case 'summary-detail': html = screenSummaryDetail(); break;
  }
  el.innerHTML = html;
  if (wire) wire();
  if (S.menu && S.menu.kind !== 'actions') renderMenu();
  document.getElementById('demo-today').value = S.today;
  document.getElementById('demo-books').value = S.books.date || '';
  document.getElementById('role-admin').className = S.role === 'admin' ? 'on' : '';
  document.getElementById('role-member').className = S.role === 'member' ? 'on' : '';
  if (S.draft) renderSheet();
}

/* demo: the books' closing date — the lock follows it when the source is QuickBooks */
function setBooks(v){
  var prev = S.books.date;
  if (v === prev) return;
  ['pt','sm'].forEach(function(org){
    var c = S.lock[org];
    if (c.on && c.source === 'qbo' && v) {
      var before = lockThrough(org);
      if (before !== v) HISTORY[org].unshift({ ts:fmt(S.today) + ' 09:12', who:'System', change:arrow(before, v) });
    }
    if (v) c.qboLast = v;
  });
  S.books.date = v || null; S.books.checked = fmt(S.today) + ' 09:12';
  render();
}
document.getElementById('demo-today').onchange = function(){ if (validIso(this.value)) { S.today = this.value; render(); } };
document.getElementById('demo-books').onchange = function(){ if (validIso(this.value)) setBooks(this.value); };
function syncDemoH(){ document.documentElement.style.setProperty('--demo-h', document.getElementById('demo-bar').offsetHeight + 'px'); }
window.addEventListener('resize', syncDemoH); syncDemoH();
if (!location.hash) history.replaceState(null, '', '#settings');
render(); afterRender(curHash());
</script>
