<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TxnRecon setup — Finalist 1 vs Variant D</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --blue: #2563EB; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: Roboto, Arial, sans-serif;
    background: #fff;
    color: #1A1B24;
    display: flex; flex-direction: column; min-height: 100vh;
  }
  /* Same dark proto bar as variants-abcd — distinct from product UI */
  .proto-bar {
    background: #111827;
    color: #F9FAFB;
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    flex: 0 0 auto;
    z-index: 100;
  }
  .proto-bar .brand {
    font-weight: 600;
    font-size: 13px;
    letter-spacing: .02em;
    opacity: .9;
    white-space: nowrap;
  }
  .proto-tabs {
    display: flex;
    gap: 4px;
    flex: 1;
    flex-wrap: wrap;
  }
  .proto-tab {
    background: transparent;
    border: 1px solid transparent;
    color: #9CA3AF;
    padding: 7px 14px;
    border-radius: 8px;
    font: inherit;
    font-weight: 500;
    font-size: 13px;
    cursor: pointer;
    transition: .15s;
  }
  .proto-tab:hover { color: #fff; background: rgba(255,255,255,.06); }
  .proto-tab.active {
    background: var(--blue);
    color: #fff;
    border-color: var(--blue);
  }
  .proto-tab .badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    background: rgba(255,255,255,.2);
    padding: 1px 6px;
    border-radius: 4px;
    margin-left: 6px;
    vertical-align: middle;
  }
  .proto-tab.active .badge { background: rgba(255,255,255,.25); }
  .stage { flex: 1; min-height: 0; position: relative; background: #fff; }
  .stage iframe {
    position: absolute; inset: 0; width: 100%; height: 100%;
    border: 0; background: #fff;
  }
  .stage iframe.hidden { display: none; }
</style>
</head>
<body>
  <div class="proto-bar">
    <div class="brand">Synder · TxnRecon setup</div>
    <div class="proto-tabs" role="tablist" aria-label="Prototype variants">
      <button type="button" class="proto-tab active" role="tab" aria-selected="true" data-pane="f1">
        Finalist 1 · Automatic retrieval<span class="badge">Sketch</span>
      </button>
      <button type="button" class="proto-tab" role="tab" aria-selected="false" data-pane="vd">
        Variant D · Overlay + dual import
      </button>
    </div>
  </div>
  <div class="stage">
    <iframe id="pane-f1" title="Finalist 1 sketch" src="./finalist-1-sketch.html"></iframe>
    <iframe id="pane-vd" class="hidden" title="Variant D" src="./variants-abcd.html?solo=D"></iframe>
  </div>
<script>
  var tabs = document.querySelectorAll('.proto-tab');
  function show(id) {
    tabs.forEach(function(t){
      var on = t.getAttribute('data-pane') === id;
      t.classList.toggle('active', on);
      t.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    document.getElementById('pane-f1').classList.toggle('hidden', id !== 'f1');
    document.getElementById('pane-vd').classList.toggle('hidden', id !== 'vd');
    try { history.replaceState(null, '', '#' + id); } catch (e) {}
  }
  tabs.forEach(function(t){
    t.addEventListener('click', function(){ show(t.getAttribute('data-pane')); });
  });
  var hash = (location.hash || '').replace(/^#/, '');
  if (hash === 'vd' || hash === 'f1') show(hash);
</script>
</body>
</html>
