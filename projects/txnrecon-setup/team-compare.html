<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TxnRecon setup — Finalist 1 vs Variant D</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://dashasyn.github.io/synder-prototypes/ui-kit/synder-ui-kit.css">
<style>
  html, body { height: 100%; margin: 0; }
  body {
    font-family: Roboto, Arial, sans-serif;
    background: var(--color-white, #fff);
    color: var(--text-primary, #1A1B24);
    display: flex; flex-direction: column; min-height: 100vh;
  }
  .switcher {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 16px;
    padding: 10px 20px;
    background: var(--color-white, #fff);
    border-bottom: 1px solid var(--color-grey-20, #DFE4EC);
    z-index: 20;
  }
  .switcher .label {
    font-size: 14px; font-weight: 500; color: var(--color-grey-50, #6B778C);
    white-space: nowrap;
  }
  .switcher .tabs {
    display: flex; gap: 0; border-bottom: 2px solid var(--color-grey-20, #DFE4EC);
  }
  .switcher .tab {
    appearance: none; border: 0; background: transparent; cursor: pointer;
    font-family: inherit; font-size: 14px; font-weight: 500; line-height: 20px;
    letter-spacing: 0.15px; color: var(--color-grey-50, #6B778C);
    padding: 10px 16px 12px; margin-bottom: -2px;
    border-bottom: 2px solid transparent;
  }
  .switcher .tab:hover { color: var(--color-primary, #0053CC); background: var(--color-primary-5, #F2F6FC); }
  .switcher .tab.active {
    color: var(--color-primary, #0053CC);
    border-bottom-color: var(--color-primary, #0053CC);
  }
  .switcher .note {
    margin-left: auto; font-size: 14px; color: var(--color-grey-50, #6B778C);
  }
  .stage { flex: 1; min-height: 0; position: relative; background: #fff; }
  .stage iframe {
    position: absolute; inset: 0; width: 100%; height: 100%;
    border: 0; background: #fff;
  }
  .stage iframe.hidden { display: none; }
</style>
</head>
<body>
  <div class="switcher" role="tablist" aria-label="Prototype variants">
    <span class="label">Team review</span>
    <div class="tabs">
      <button type="button" class="tab active" role="tab" aria-selected="true" data-pane="f1">Finalist 1 — Automatic retrieval</button>
      <button type="button" class="tab" role="tab" aria-selected="false" data-pane="vd">Variant D — Overlay + dual import</button>
    </div>
    <span class="note">Switcher stays up top · same session</span>
  </div>
  <div class="stage">
    <iframe id="pane-f1" title="Finalist 1 sketch" src="./finalist-1-sketch.html"></iframe>
    <iframe id="pane-vd" class="hidden" title="Variant D" src="./variants-abcd.html?solo=D"></iframe>
  </div>
<script>
  var tabs = document.querySelectorAll('.switcher .tab');
  function show(id) {
    tabs.forEach(function(t){
      var on = t.getAttribute('data-pane') === id;
      t.classList.toggle('active', on);
      t.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    document.getElementById('pane-f1').classList.toggle('hidden', id !== 'f1');
    document.getElementById('pane-vd').classList.toggle('hidden', id !== 'vd');
    try { history.replaceState(null, '', '#' + id); } catch (e) {}
  }
  tabs.forEach(function(t){
    t.addEventListener('click', function(){ show(t.getAttribute('data-pane')); });
  });
  var hash = (location.hash || '').replace(/^#/, '');
  if (hash === 'vd' || hash === 'f1') show(hash);
</script>
</body>
</html>
