<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stripe invoice date — settings</title>
<link rel="stylesheet" href="../../ui-kit/synder-ui-kit.css">
<style>
  body{margin:0;display:flex;flex-direction:column;min-height:100vh;background:var(--color-grey-5);
    font-size:14px}

  /* switcher — deliberately not product chrome */
  .variant-switch{display:flex;align-items:center;gap:12px;background:var(--color-grey);
    color:var(--color-white);padding:8px 16px;flex-shrink:0;font-size:14px;flex-wrap:wrap;column-gap:8px;row-gap:6px}
  .variant-switch .vs-label{font-weight:500;letter-spacing:.01em;opacity:.75;font-size:14px;
    text-transform:uppercase}
  .variant-switch .vs-opts{display:flex;gap:4px;background:rgba(255,255,255,.1);
    border-radius:6px;padding:3px;flex-wrap:wrap}
  .variant-switch button{background:none;border:none;color:rgba(255,255,255,.7);
    font-family:inherit;font-size:14px;padding:5px 9px;border-radius:4px;cursor:pointer;
    white-space:nowrap}
  .variant-switch .vs-opts[hidden]{display:none}
  .variant-switch button:hover{color:var(--color-white)}
  .variant-switch button.on{background:var(--color-white);color:var(--text-primary);font-weight:500}
  .variant-switch button:disabled{opacity:.3;cursor:not-allowed}
  .vs-sep{width:1px;height:22px;background:rgba(255,255,255,.2)}

  .stage{flex:1;padding:24px;display:flex;justify-content:center}
  .screen{width:100%;max-width:1060px}

  .ctx{color:var(--text-secondary);margin:0 0 12px}
  .marker{color:var(--color-grey-50);font-style:italic;margin:0 0 12px}

  .set-card{background:var(--color-white);border-radius:var(--radius-sm);
    box-shadow:var(--shadow-card);overflow:hidden}
  .set-tabs{display:flex;border-bottom:1px solid var(--border-default);padding:0 12px;
    overflow-x:auto}
  .set-tab{padding:14px 10px;font-size:14px;color:var(--text-secondary);white-space:nowrap;
    border:none;border-bottom:2px solid transparent;background:none;font-family:inherit;cursor:default}
  .set-tab.link{cursor:pointer}
  .set-tab.link:hover{color:var(--color-primary)}
  .set-tab.on{color:var(--color-primary);border-bottom-color:var(--color-primary);font-weight:500}
  .set-body{padding:4px 20px 8px}
  .set-title{font-size:16px;font-weight:500;color:var(--text-primary);padding:16px 0 4px}

  .row{display:flex;align-items:flex-start;gap:24px;padding:16px 0;
    border-bottom:1px solid var(--border-default)}
  .row:last-child{border-bottom:none}
  .row-main{flex:1;min-width:0}
  .row-label{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text-primary);
    font-weight:500;flex-wrap:wrap}
  .row-help{font-size:14px;color:var(--text-secondary);line-height:20px;margin-top:4px}
  .row-ctl{flex-shrink:0;padding-top:2px}
  .row-ctl select{width:260px}
  .row.is-new{background:var(--color-primary-5);margin:0 -20px;padding-left:17px;
    padding-right:20px;border-left:3px solid var(--color-primary)}
  .lock-note{margin-top:8px;font-size:14px;color:var(--text-primary)}

  /* sync details */
  .back{display:inline-block;margin-bottom:12px}
  .sd-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:4px}
  .sd-title{font-size:20px;font-weight:500;color:var(--text-primary)}
  .sd-sub{color:var(--text-secondary);margin-bottom:16px}
  .kv{display:grid;grid-template-columns:200px 1fr;column-gap:16px}
  .kv > div{padding:10px 0;border-bottom:1px solid var(--border-default)}
  .kv .k{color:var(--text-secondary)}
  .kv .k.is-new,.kv .v.is-new{background:var(--color-primary-5)}
  .kv .k.is-new{border-left:3px solid var(--color-primary);padding-left:8px;margin-left:-11px}
  .v-note{color:var(--text-secondary)}

  .table-block{margin-top:24px}
  th.is-new,td.is-new{background:var(--color-primary-5)}
  tr.row-built td{background:var(--color-primary-5)}
  tr.row-built td:first-child{box-shadow:inset 3px 0 0 var(--color-primary)}
</style>
</head>
<body>

<div class="variant-switch">
  <span class="vs-label">Screen</span>
  <div class="vs-opts">
    <button id="sc-1" class="on" onclick="setScreen(1)">1 · Invoices</button>
    <button id="sc-2" onclick="setScreen(2)">2 · Sales</button>
    <button id="sc-3" onclick="setScreen(3)">3 · Summary</button>
    <button id="sc-4" onclick="setScreen(4)">4 · RevRec</button>
    <button id="sc-5" onclick="setScreen(5)">5 · Details</button>
  </div>
  <span class="vs-label" id="grp-label" style="margin-left:12px">Org</span>
  <div class="vs-opts" id="grp-org">
    <button id="st-pro" onclick="setState('pro')">Pro+ existing</button>
    <button id="st-new" onclick="setState('new')">Pro+ new</button>
    <button id="st-below" onclick="setState('below')">Below Pro</button>
    <button id="st-rrinv" onclick="setState('rrinv')">RevRec · invoice</button>
    <button id="st-rrpay" onclick="setState('rrpay')">RevRec · payment</button>
  </div>
  <div class="vs-opts" id="grp-ex" hidden>
    <button id="ex-issued" onclick="setExample('issued')">A · Synced on issued</button>
    <button id="ex-created" onclick="setExample('created')">B · Synced on created</button>
  </div>
</div>

<div class="stage">
  <div class="screen" id="screen"></div>
</div>

<div class="modal-bg" id="confirm">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="dlg-title" style="max-width:480px">
    <div class="synder-modal-header" id="dlg-title">Change schedule start date?</div>
    <div class="synder-modal-body" id="dlg-body"></div>
    <div class="synder-modal-footer">
      <button class="btn btn-text" id="dlg-cancel" onclick="closeConfirm(false)">Cancel</button>
      <button class="btn" id="dlg-ok" onclick="closeConfirm(true)">Change</button>
    </div>
  </div>
</div>

<script>
/* Copy provenance — every string is one of:
   captured   live strings, Per Transaction settings, demo org, 2 Sep 2026
              (.synder-state/pt-settings-2026-09-02/live/capture.json) and the
              sync details page (reports/sync-details-rethink, demo.synderapp.com)
   FDD        setting and value names from FDD: [Stripe] Invoice date setting
   proposed   mine, for the thing being designed — Invoice date help, lock note,
              confirmation text, "Payment posting date", "Issued date"/"Date in books" rows
   uncaptured shown as [live copy not captured]                                   */

var MARK = '[live copy not captured]';
var screen = 1, state = 'pro', example = 'issued';
var v = {};   // per-state values, reset on state change

var STATES = {
  pro:   'Pro+ · existing connection', new: 'Pro+ · new connection', below: 'Below Pro',
  rrinv: 'RevRec · invoice date', rrpay: 'RevRec · payment date'
};
var VALID = {                     // which org states change anything on a screen
  1: ['pro','new','below','rrinv','rrpay'],
  2: [],
  3: ['pro','new','below'],
  4: ['rrinv','rrpay'],
  5: []
};

function resetValues(){
  v.sync     = (state === 'new') ? 'issued' : 'created';
  v.summary  = (state === 'new') ? 'issued' : 'created';
  v.schedule = (state === 'rrpay') ? 'payment' : 'created';
  v.built    = [];
}

/* schedules built after a Schedule start change — they use the value in effect when built */
var NEW_INVOICES = [
  { inv: 'in_1QD9wTE4pygkgelb', cust: 'Contoso Ltd', created: 'Sep 29, 2026', issued: 'Oct 5, 2026', paid: 'Oct 12, 2026', amt: '$18,000.00' },
  { inv: 'in_1QDb3uE4pygkgelb', cust: 'Fabrikam Inc', created: 'Sep 30, 2026', issued: 'Oct 6, 2026', paid: 'Oct 14, 2026', amt: '$7,200.00' },
  { inv: 'in_1QDcQ1E4pygkgelb', cust: 'Tailspin Toys', created: 'Oct 1, 2026', issued: 'Oct 2, 2026', paid: 'Oct 9, 2026', amt: '$2,400.00' }
];
function buildAfterChange(){
  var src = NEW_INVOICES[v.built.length % NEW_INVOICES.length];
  var start = { created: src.created, issued: src.issued, payment: src.paid }[v.schedule];
  v.built.push({ inv: src.inv, cust: src.cust, created: src.created, issued: src.issued, start: start, amt: src.amt, built: true });
}

/* ---- shared bits -------------------------------------------------------- */
var CTX = '<p class="ctx">mzkt.by (Stripe) · Sandbox Company_US_1 (QuickBooks Online)</p>';

function toggle(on, label){
  return '<div class="toggle' + (on ? ' on' : '') + '" role="switch" aria-checked="' + on
       + '" aria-label="' + label.replace(/"/g,'&quot;') + '"></div>';
}
function row(r){
  return '<div class="row' + (r.isNew ? ' is-new' : '') + '"' + (r.id ? ' id="' + r.id + '"' : '') + '>'
       +   '<div class="row-main"><div class="row-label">' + r.label + (r.chip || '') + '</div>'
       +     (r.help ? '<div class="row-help"' + (r.helpId ? ' id="' + r.helpId + '"' : '') + '>' + r.help + '</div>' : '')
       +     (r.extra || '')
       +   '</div>'
       +   '<div class="row-ctl">' + r.ctl + '</div>'
       + '</div>';
}
function select(id, opts, value, disabled, label){
  return '<select class="select" id="' + id + '" aria-label="' + label + '"'
       + (disabled ? ' disabled' : '') + '>'
       + opts.map(function(o){
           return '<option value="' + o.v + '"' + (o.v === value ? ' selected' : '')
                + (o.disabled ? ' disabled' : '') + '>' + o.t + '</option>'; }).join('')
       + '</select>';
}
var UPGRADE = ' <span class="status status-grey" id="chip-upgrade">Upgrade to use</span>';

function tabs(active){
  var all = ['General','Sales','Invoices','Products/Services','Product mapping','Taxes','Fees',
             'Application Fees','Expenses','Payouts','Multicurrency'];
  return '<div class="set-tabs" role="tablist">' + all.map(function(t){
    var link = (t === 'Sales' || t === 'Invoices');
    return '<button class="set-tab' + (t === active ? ' on' : '') + (link ? ' link' : '') + '"'
         + ' role="tab" aria-selected="' + (t === active) + '"'
         + (link ? ' onclick="setScreen(' + (t === 'Sales' ? 2 : 1) + ')"' : ' tabindex="-1"')
         + ' id="tab-' + t.replace(/\W+/g,'') + '">' + t + '</button>';
  }).join('') + '</div>';
}

/* ---- 1 · Stripe settings → Invoices ------------------------------------ */
function rrLock(){ return (state === 'rrinv' || state === 'rrpay') && v.schedule !== 'payment'; }

function screen1(){
  var gated = state === 'below', locked = rrLock();
  var value = gated ? 'created' : v.sync;
  var extra = '';
  if (gated) extra = '<div class="lock-note" id="inv-gate">This feature is available on higher plans. '
      + '<a class="text-link" href="#">Upgrade plan</a></div>';
  if (locked) extra = '<div class="lock-note" id="inv-lock">Locked while Revenue Recognition starts '
      + 'schedules from the invoice date. To change it, change '
      + '<a class="text-link" href="#" id="go-schedule" onclick="setScreen(4);return false">Schedule start date</a>.</div>';

  var rows = [
    { isNew: true, id: 'inv-row', label: '<label for="inv-date">Invoice date</label>',
      chip: gated ? UPGRADE : '', helpId: 'inv-help',
      help: 'The date Synder puts on Stripe invoices in your books: when the invoice was created, '
          + 'or when it was issued to your customer. Applies to invoices synced from now on. '
          + '<a class="text-link" href="#">Learn more →</a>',
      extra: extra,
      ctl: select('inv-date', [{v:'created',t:'Created date'},{v:'issued',t:'Issued date'}],
                  value, gated || locked, 'Invoice date') },
    { label: 'Apply payments to unpaid Invoice transactions', ctl: toggle(false, 'Apply payments to unpaid Invoice transactions'),
      help: 'Payment will be applied to the matching unpaid Invoice transaction.' },
    { label: 'Cancel sync if there is no matching open invoice found for a payment',
      ctl: toggle(false, 'Cancel sync if there is no matching open invoice found for a payment'),
      help: 'If you enable this setting, Synder will search across the existing invoices in your books '
          + 'and if the matching invoice doesn’t exist, it will cancel synchronization.' },
    { label: 'Sync unpaid (open) invoices', ctl: toggle(false, 'Sync unpaid (open) invoices'),
      help: 'This setting allows you to sync open invoices with your accounting system. Once received, '
          + 'the payment will be automatically attached to the corresponding invoice and the invoice '
          + 'will be marked as paid. <a class="text-link" href="#">Learn more &gt;&gt;</a>' },
    { label: 'Sync zero invoices', ctl: toggle(false, 'Sync zero invoices'),
      help: 'Enable this setting to import and sync invoices where all line amounts are 0 and the '
          + 'totals are 0. <a class="text-link" href="#">Learn more &gt;&gt;</a>' }
  ];
  return CTX + '<div class="set-card">' + tabs('Invoices')
       + '<div class="set-body">' + rows.map(row).join('') + '</div></div>';
}

/* ---- 2 · Stripe settings → Sales (rename only) -------------------------- */
function screen2(){
  var rows = [
    { label: 'Clearing account', ctl: select('s-clear', [{v:'a',t:'Stripe mzkt.by (required for Synder)'}], 'a', false, 'Clearing account'),
      help: 'Clearing account represents the payment processor in your books. All synced transactions '
          + 'will be deposited here. <a class="text-link" href="#">Learn more &gt;&gt;</a>' },
    { label: 'Payment Method', ctl: select('s-pm', [{v:'a',t:'Stripe'}], 'a', false, 'Payment Method'),
      help: 'This Payment Method will be set for QuickBooks Sales Receipts, Refund Receipts, Payments and Expenses.' },
    { isNew: true, id: 'post-row', label: '<label for="post-date" id="post-label">Payment posting date</label>',
      helpId: 'post-help',
      help: 'The date Synder uses for payments, refunds and other Stripe balance transactions: '
          + 'Balance date, when the money reaches your Stripe balance, or Created date, when Stripe created '
          + 'the transaction. Invoices follow the Invoice date setting on the Invoices tab. '
          + '<a class="text-link" href="#">Learn more →</a>',
      ctl: select('post-date', [{v:'created',t:'Created date'},{v:'balance',t:'Balance date (recommended)'}],
                  'balance', false, 'Payment posting date') },
    { label: 'Enable QuickBooks Doc Numbers', ctl: toggle(false, 'Enable QuickBooks Doc Numbers'),
      help: 'By enabling this configuration your transactions will follow the standard QuickBooks Doc Number sequence.' },
    { label: 'Apply generic customer', ctl: toggle(false, 'Apply generic customer'),
      help: 'It is an option to assign a generic customer instead of sending over each customer on sales transaction individually.' },
    { label: 'Applied Balance Account', ctl: select('s-ab', [{v:'a',t:'Stripe sales'}], 'a', false, 'Applied Balance Account'),
      help: 'Used to record Stripe customer applied balances when they reduce an invoice or payment total. '
          + 'Synder uses this account to create and map the \'Stripe applied balance\' item.' },
    { label: 'Sync discounts as products', chip: ' <span class="status status-grey">Upgrade to use</span>',
      ctl: toggle(false, 'Sync discounts as products'),
      help: 'Any discount will be synced as an additional product with default “Stripe discount” name '
          + 'or discount name from the integration (if any).' }
  ];
  return CTX + '<div class="set-card">' + tabs('Sales')
       + '<div class="set-body">' + rows.map(row).join('') + '</div></div>';
}

/* ---- 3 · Summary Sync → Sales recording date ---------------------------- */
function screen3(){
  var gated = state === 'below';
  var value = (gated && v.summary === 'issued') ? 'created' : v.summary;
  return '<p class="marker" id="sum-marker">' + MARK + ' Summary Sync settings screen — '
       +   'surrounding settings and this setting’s existing description are not shown.</p>'
       + '<div class="set-card"><div class="set-body">'
       + row({ isNew: true, id: 'sum-row', label: '<label for="sum-date">Sales recording date</label>',
               help: '<span class="marker" style="margin:0">' + MARK + '</span>',
               ctl: select('sum-date', [
                 {v:'created', t:'Invoice created date'},
                 {v:'issued',  t:'Invoice issued date' + (gated ? ' — Upgrade to use' : ''), disabled: gated},
                 {v:'payment', t:'Payment date'}], value, false, 'Sales recording date') })
       + '</div></div>';
}

/* ---- 4 · RevRec → Schedule start date + schedule details ---------------- */
var SCHED_LABEL = { created: 'Invoice created date', issued: 'Invoice issued date', payment: 'Payment date' };

function screen4(){
  var rowsData = [
    { inv: 'in_1QBa7FE4pygkgelb', cust: 'Northwind Labs', created: 'Dec 28, 2025', issued: 'Jan 6, 2026',  start: 'Dec 28, 2025', amt: '$60,000.00' },
    { inv: 'in_1QC2kLE4pygkgelb', cust: 'Pamela Andersen', created: 'Jan 30, 2026', issued: 'Feb 2, 2026', start: 'Jan 30, 2026', amt: '$1,200.00' },
    { inv: 'in_1PzX0aE4pygkgelb', cust: 'Acme Corp', created: 'Sep 3, 2025', issued: '', start: 'Sep 3, 2025', amt: '$4,800.00' }
  ];
  return '<p class="marker" id="rr-marker">' + MARK + ' Revenue recognition configuration screen — '
       +   'surrounding settings and this setting’s existing description are not shown.</p>'
       + '<div class="set-card"><div class="set-body">'
       + row({ isNew: true, id: 'sched-row', label: '<label for="sched-date">Schedule start date</label>',
               help: '<span class="marker" style="margin:0">' + MARK + '</span>',
               ctl: select('sched-date', [
                 {v:'created', t:'Invoice created date'},
                 {v:'issued',  t:'Invoice issued date'},
                 {v:'payment', t:'Payment date'}], v.schedule, false, 'Schedule start date') })
       + '</div></div>'
       + '<div class="table-block">'
       +   '<div class="set-title" style="padding-top:0">Schedule details</div>'
       +   '<p class="marker" id="tbl-marker">' + MARK + ' Existing columns are placeholders — '
       +     'only Invoice issued date is new.</p>'
       +   '<div class="table-wrap"><table class="synder-table" id="sched-table"><thead><tr>'
       +     '<th>Invoice</th><th>Customer</th><th>Invoice created date</th>'
       +     '<th class="is-new">Invoice issued date</th><th>Schedule start</th><th class="col-amount">Amount</th>'
       +   '</tr></thead><tbody>'
       +   rowsData.concat(v.built).map(function(r){
             return '<tr' + (r.built ? ' class="row-built"' : '') + '><td>' + r.inv + '</td><td>' + r.cust + '</td><td>' + r.created + '</td>'
                  + '<td class="is-new">' + r.issued + '</td><td>' + r.start + '</td>'
                  + '<td class="col-amount">' + r.amt + '</td></tr>'; }).join('')
       +   '</tbody></table></div>'
       + '</div>';
}

/* ---- 5 · Sync details --------------------------------------------------- */
function screen5(){
  var issuedEx = example === 'issued';
  var kv = [
    ['Sync ID', '604112'],
    ['From integration', 'mzkt.by (Stripe)'],
    ['To accounting company', 'Sandbox Company_US_1 (QuickBooks Online)'],
    ['Status', '<span class="status status-green">Synced</span>'],
    ['Sync started', 'Oct 6, 2026 · 14:20 UTC'],
    ['Sync completed', 'Oct 6, 2026 · 14:20 UTC'],
    ['Transaction date', 'Dec 28, 2025 · 10:12 (Europe/Minsk)'],
    ['Issued date', 'Jan 6, 2026 · 09:40 (Europe/Minsk)', 'new', 'kv-issued']
  ];
  if (issuedEx) kv.push(['Date in books', 'Jan 6, 2026 <span class="v-note">· issued date, per '
      + '<a class="text-link" href="#" onclick="setScreen(1);return false">Invoice date</a> setting</span>',
      'new', 'kv-books']);
  kv.push(['Amount', '$60,000.00 USD'], ['Transaction ID', 'in_1QBa7FE4pygkgelb ↗']);

  return '<a class="text-link back" href="#">← Platform transactions</a>'
       + '<div class="set-card"><div class="set-body" style="padding:20px">'
       +   '<div class="sd-head"><span class="sd-title">Sync #604112</span>'
       +     '<span class="status status-green">Synced</span></div>'
       +   '<div class="sd-sub">Stripe · mzkt.by · Northwind Labs · $60,000.00 USD</div>'
       +   '<div class="set-title">Sync details</div>'
       +   '<div class="kv" id="kv">' + kv.map(function(p){
             var n = p[2] === 'new' ? ' is-new' : '';
             return '<div class="k' + n + '"' + (p[3] ? ' id="' + p[3] + '-k"' : '') + '>' + p[0] + '</div>'
                  + '<div class="v' + n + '"' + (p[3] ? ' id="' + p[3] + '"' : '') + '>' + p[1] + '</div>';
           }).join('') + '</div>'
       + '</div></div>';
}

/* ---- render ------------------------------------------------------------- */
function render(){
  var el = document.getElementById('screen');
  el.innerHTML = [null, screen1, screen2, screen3, screen4, screen5][screen]();
  for (var i = 1; i <= 5; i++) document.getElementById('sc-' + i).classList.toggle('on', i === screen);

  var valid = VALID[screen];
  Object.keys(STATES).forEach(function(k){
    var b = document.getElementById('st-' + k);
    b.classList.toggle('on', state === k && valid.indexOf(k) > -1);
    b.disabled = valid.indexOf(k) === -1;
  });
  document.getElementById('grp-org').hidden = screen === 5;
  document.getElementById('grp-ex').hidden = screen !== 5;
  document.getElementById('grp-label').textContent = screen === 5 ? 'Example' : 'Org';
  document.getElementById('ex-issued').classList.toggle('on', example === 'issued');
  document.getElementById('ex-created').classList.toggle('on', example === 'created');
  wire();
}

function wire(){
  var inv = document.getElementById('inv-date');
  if (inv) inv.onchange = function(){ v.sync = inv.value; render(); focusSoon('inv-date'); };
  var sum = document.getElementById('sum-date');
  if (sum) sum.onchange = function(){ v.summary = sum.value; render(); focusSoon('sum-date'); };
  var sch = document.getElementById('sched-date');
  if (sch) sch.onchange = function(){
    var next = sch.value;
    sch.value = v.schedule;               // nothing changes until confirmed
    openConfirm(next);
  };
}
function focusSoon(id){ var e = document.getElementById(id); if (e) e.focus(); }

function setScreen(n){
  screen = n;
  var valid = VALID[n];
  if (valid.length && valid.indexOf(state) === -1) { state = valid[0]; resetValues(); }
  render();
}
function setState(s){ state = s; resetValues(); render(); }
function setExample(e){ example = e; render(); }

/* ---- confirmation (RevRec only — Stripe settings save immediately) ------ */
var pending = null;
function openConfirm(next){
  pending = next;
  document.getElementById('dlg-body').innerHTML =
      'New schedules will start from the <strong>' + SCHED_LABEL[next].toLowerCase() + '</strong>. '
    + 'Existing schedules keep their current dates until they’re rebuilt — contact support to rebuild them.';
  document.getElementById('confirm').classList.add('show');
  document.getElementById('dlg-cancel').focus();
}
function closeConfirm(apply){
  var m = document.getElementById('confirm');
  if (!m.classList.contains('show')) return;
  m.classList.remove('show');
  if (apply && pending) { v.schedule = pending; buildAfterChange(); }
  pending = null;
  render();
  focusSoon('sched-date');
}
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeConfirm(false); });

resetValues();
render();
</script>
</body>
</html>
