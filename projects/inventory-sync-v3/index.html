<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventory sync — Activity · Sync · Stores</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link rel="stylesheet" href="../../ui-kit/synder-ui-kit.css">
<style>
  body{margin:0;background:var(--color-white);font-family:var(--font-family)}
  .content{max-width:none}   /* Ignat 2026-10-01: all tabs full width */

  /* switcher — canonical, deliberately not product chrome */
  .variant-switch{display:flex;align-items:center;gap:12px;background:var(--color-grey);
    color:var(--color-white);padding:8px 20px;flex-shrink:0;font-size:13px}
  .variant-switch .vs-label{font-weight:500;letter-spacing:.01em;opacity:.75;font-size:12px;text-transform:uppercase}
  .variant-switch .vs-opts{display:flex;gap:4px;background:rgba(255,255,255,.1);border-radius:6px;padding:3px}
  .variant-switch button{background:none;border:none;color:rgba(255,255,255,.7);font-family:inherit;font-size:13px;
    padding:5px 12px;border-radius:4px;cursor:pointer;white-space:nowrap}
  .variant-switch button:hover{color:var(--color-white)}
  .variant-switch button.on{background:var(--color-white);color:var(--text-primary);font-weight:500}
  .variant-switch .vs-note{margin-left:auto;opacity:.6;font-size:12px}
  .variant-switch .vs-sep{width:1px;height:22px;background:rgba(255,255,255,.2)}

  /* layout 2: activity as a top line with big numbers (Ignat's sketch 3) */
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;background:var(--color-grey-5);border-radius:var(--radius-sm);padding:12px;margin-bottom:16px}
  .tile{border-radius:var(--radius-sm);padding:12px 16px;background:var(--color-white);border:1px solid var(--border-default)}
  .tile .tl{font-size:14px;font-weight:600;color:var(--text-primary);display:flex;align-items:center;gap:6px}
  .tile .tv{font-size:24px;line-height:32px;font-weight:400;margin:4px 0 0}
  .tile .tv a{display:inline-flex;align-items:center}
  .tile .td{font-size:12px;line-height:16px;color:var(--text-secondary)}
  .tile.t-held{background:var(--color-yellow-light);border-color:var(--color-status-yellow-bg)}
  .tile.t-failed{background:var(--color-red-light);border-color:var(--color-status-red-bg)}
  .tile.t-diff{background:var(--color-status-purple-bg);border-color:var(--color-status-purple-bg)}
  .cols2{display:grid;grid-template-columns:1fr 2fr;gap:16px;align-items:start}
  /* wide stores column: action sits to the right of the text, so each open row is one line shorter */
  .cols2 .fix .grow{display:grid;grid-template-columns:1fr auto;column-gap:16px;align-items:center}
  .cols2 .fix .grow .muted{grid-column:1}
  .cols2 .fix .grow .row-actions{grid-column:2;grid-row:1 / span 2;margin:0 !important;flex-wrap:nowrap}

  /* shell */
  .org{display:flex;align-items:center;gap:12px}
  .org-av{width:32px;height:32px;border-radius:var(--radius-full);background:var(--color-primary-10);color:var(--color-primary);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500}
  .org-name{font-size:14px;font-weight:500;color:var(--text-primary)}
  .org-sub{font-size:12px;color:var(--text-secondary)}
  .sidebar .material-icons{font-size:20px;color:var(--color-grey-50)}
  .sb-beta{margin-left:auto;font-size:12px;height:18px;padding:0 5px;border-radius:var(--radius-sm);
    background:var(--color-status-purple-bg);color:var(--color-purple);display:inline-flex;align-items:center}
  .sidebar-item.active .sb-beta{background:rgba(255,255,255,.2);color:var(--color-white)}
  .tabs{padding:0;margin-bottom:16px}
  button.tab{background:none;border:none;border-bottom:2px solid transparent;border-radius:0;font-family:inherit;margin:0 0 -1px;
    -webkit-appearance:none;appearance:none}
  button.tab:hover{background:var(--color-primary-5)}
  button.tab.active{border-bottom-color:var(--color-primary)}

  /* blocks — as in Ignat's sketch: grey block, white inner boxes */
  .block{background:var(--color-grey-5);border-radius:var(--radius-sm);padding:16px}
  .block-t{font-size:16px;font-weight:600;color:var(--text-primary);display:flex;align-items:center;gap:6px;margin-bottom:12px}
  .help{font-size:16px;color:var(--color-grey-30);cursor:help}
  .box{background:var(--color-white);border:1px solid var(--border-default);border-radius:var(--radius-sm);padding:12px 16px}
  .box + .box{margin-top:12px}
  .cols{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:16px;align-items:start}
  .line{font-size:14px;line-height:20px;color:var(--text-primary);padding:6px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .line .k{font-weight:500}
  .muted{color:var(--text-secondary)}
  .small{font-size:13px;line-height:18px}
  p{margin:0 0 12px;font-size:14px;line-height:20px}
  .row-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
  a.text-link{color:var(--text-link);text-decoration:none;cursor:pointer}
  a.text-link:hover{text-decoration:underline}
  .i16{font-size:16px;vertical-align:-3px}

  /* activity rows */
  .act{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--border-light);font-size:14px}
  .act:first-child{border-top:none}
  .act a{display:inline-flex;align-items:center;gap:2px}
  .headline{font-size:20px;font-weight:400;line-height:28px;color:var(--text-primary);margin:0 0 12px}

  /* store card */
  .store-h{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .store-h b{font-weight:500;font-size:14px;flex:1}
  .shop-ic{width:20px;height:20px;border-radius:4px;background:#95BF47;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
  .fix{display:flex;align-items:center;gap:12px;background:var(--color-yellow-light);border-radius:var(--radius-sm);padding:8px 12px;margin:4px 0;font-size:14px;line-height:20px}
  .fix .n{width:20px;height:20px;border-radius:var(--radius-full);background:var(--color-yellow);color:var(--color-white);font-size:12px;font-weight:700;
    display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .fix .grow{flex:1;min-width:0;color:var(--text-primary)}
  .fix .grow .muted{display:block;font-size:13px}
  .okrow .material-icons{font-size:18px;color:var(--color-green)}

  /* empty state */
  .empty-wrap{display:flex;justify-content:center;padding:48px 0}
  .empty-card{background:var(--color-grey-5);border-radius:var(--radius-sm);padding:24px;width:640px}
  .empty-card h2{font-size:28px;font-weight:400;margin:0 0 8px;color:var(--text-primary)}
  .empty-card .select{max-width:420px}
  .steps-hint{font-size:13px;color:var(--text-secondary);line-height:18px;margin:12px 0 0}
  .spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:synder-spin .8s linear infinite;display:inline-block;vertical-align:-3px;margin-right:6px}

  .banner{display:flex;align-items:center;gap:12px;background:var(--color-yellow-light);color:var(--text-primary);border-radius:var(--radius-sm);padding:12px 16px;margin-bottom:16px;font-size:14px}
  .banner .material-icons{color:var(--color-yellow)}
  .modal{border-radius:8px}
  .toast{position:fixed;right:24px;bottom:24px;width:320px;background:var(--color-grey);color:var(--color-white);font-size:14px;
    padding:12px 16px;border-radius:var(--radius-sm);display:none;z-index:2000}
  .toast.show{display:block}
  .toolbar{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
  .toolbar .grow{flex:1}
  .toolbar .select{height:36px;min-width:240px}
  td select.select{height:32px;min-width:220px}
  td.num,th.num{text-align:right}
  .diff-pos{color:var(--color-green)} .diff-neg{color:var(--color-red)}
  .empty{padding:32px;text-align:center;color:var(--text-secondary);font-size:14px}
</style>
</head>
<body>
<div class="variant-switch">
  <span class="vs-label">Layout</span>
  <div class="vs-opts">
    <button id="ly-1" class="on" onclick="setLayout(1)">1 · Activity block</button>
    <button id="ly-2" onclick="setLayout(2)">2 · Activity top line</button>
  </div>
  <span class="vs-sep"></span>
  <span class="vs-label">State</span>
  <div class="vs-opts">
    <button id="vs-1" class="on" onclick="setVariant(1)">1 · First setup</button>
    <button id="vs-2" onclick="setVariant(2)">2 · Store needs fixes</button>
    <button id="vs-3" onclick="setVariant(3)">3 · All connected</button>
  </div>
  <span class="vs-note">Built on Ignat's sketches · sample data</span>
</div>
<div class="app-shell">
  <header class="topbar">
    <div class="org"><div class="org-av">Ac</div><div><div class="org-name">Acme Home Goods</div><div class="org-sub">Syncs left: 1000</div></div></div>
    <div class="topbar-actions"><a class="text-link" style="font-size:14px">How it works?</a></div>
  </header>
  <div class="app-main">
    <nav class="sidebar" aria-label="Main">
      <a class="sidebar-item"><span class="material-icons">dashboard</span>Dashboard</a>
      <a class="sidebar-item"><span class="material-icons">receipt_long</span>Transactions<span class="sidebar-badge">New</span></a>
      <a class="sidebar-item active" aria-current="page"><span class="material-icons">inventory_2</span>Inventory sync<span class="sb-beta">Beta</span></a>
      <a class="sidebar-item"><span class="material-icons">bolt</span>Smart rules</a>
      <a class="sidebar-item"><span class="material-icons">description</span>Invoicing</a>
      <a class="sidebar-item"><span class="material-icons">bar_chart</span>Analytics</a>
      <a class="sidebar-item"><span class="material-icons">settings</span>Settings</a>
      <a class="sidebar-item"><span class="material-icons">smart_toy</span>AI Agents</a>
    </nav>
    <main class="content" id="main"></main>
  </div>
</div>

<div class="modal-bg" id="m-dlg">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-dlg-t">
    <div class="modal-header" id="m-dlg-t"></div>
    <div class="modal-body" id="m-dlg-b"></div>
    <div class="modal-footer" id="m-dlg-f"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------------------------------------------------------------------------
   Layout = Ignat's sketches (2026-10-01): empty screen with store picker, then
   Overview with three blocks Activity · Sync · Shopify stores. Store problems
   live on the store card, in setup order, one action each (yellow, not red).
   Agreed behaviour: Connect is automated (redirect to Shopify and back, or a
   loader and a toast — simulated here as the loader); no separate approval.
   Enable works once at least one store has a location and "Created product
   should be: Inventory". Sync semantics from the CSM Guide (SET/4297555974):
   checks every 5 minutes, sends only changes, Pause queues, Disable drops,
   nightly comparison 02:30 UTC, held reasons + retry. SAMPLE data.
--------------------------------------------------------------------------- */
var QBO=[['1','Ceramic plate 24cm','PL-24',140],['2','Ceramic plate 18cm','PL-18',90],['3','Serving bowl','BWL-1',35],['4','Mug set','MUG-4',60],
 ['5','Tulip bouquet','FL-TU',25],['6','Rose bouquet','FL-RO',40],['7','Vase small','VS-S',30],['8','Vase large','VS-L',12],['9','Plate seconds (B-grade)','PL-SEC',9],['10','Gift wrapping paper',null,200]]
 .map(function(r){return {id:r[0],name:r[1],sku:r[2],qty:r[3]}});
function qbo(id){return QBO.filter(function(q){return q.id===id})[0]}
function INTEGRATIONS(){return [
 {id:'p',name:'My ceramic plates',domain:'my-ceramic-plates.myshopify.com',locations:['Warehouse in California'],
  products:[['Ceramic plate 24cm','PL-24',132],['Ceramic plate 18cm','PL-18',90],['Serving bowl','BWL-1',35],['Mug set','MUG-4',58],['Plate seconds',null,9]]},
 {id:'f',name:'My good flowers',domain:'my-good-flowers.myshopify.com',locations:['Warehouse in California','Flower stall, Oakland'],
  products:[['Tulip bouquet','FL-TU',25],['Rose bouquet','FL-RO',38],['Vase small','VS-S',30],['Vase large',null,12],['Gift wrap',null,200]]},
 {id:'s',name:'Seasonal pop-up',domain:'seasonal-popup.myshopify.com',locations:['Pop-up van'],
  products:[['Mug set','MUG-4',10],['Tulip bouquet','FL-TU',5]]}]}
function autoMatch(st){var m={};st.products.forEach(function(p){var q=QBO.filter(function(x){return p[1]&&x.sku===p[1]})[0];
  if(q){m[p[0]]={q:q.id,src:'SKU'};return}q=QBO.filter(function(x){return x.name.toLowerCase()===p[0].toLowerCase()})[0];m[p[0]]=q?{q:q.id,src:'Name'}:null});return m}

var S,V=1,L=1;
function base(){var ints=INTEGRATIONS().map(function(i){return Object.assign(i,{connected:false,loc:null,inv:'Non-inventory',map:null,shop:{},cmp:null,opened:false,connectedOn:null})});
  ints.forEach(function(i){i.products.forEach(function(p){i.shop[p[0]]=p[2]})});
  return {tab:'overview',ints:ints,sync:'off',enabledOn:null,lastSync:null,pauseReason:null,events:[],ignored:{},evFilter:'All',mapStore:null,unmappedOnly:false,connecting:false,sel:''}}
function connectInt(s,id,when){var i=s.ints.filter(function(x){return x.id===id})[0];i.connected=true;i.connectedOn=when||'just now';i.map=autoMatch(i);/* location stays unset until the user chooses (Ignat 2026-10-01) */compareStore(i,s);return i}
function stateFirst(){return base()}
function stateFixes(){var s=base(),p=connectInt(s,'p','Sep 24, 2026 14:20'),f=connectInt(s,'f','Sep 24, 2026 14:20');p.loc='Warehouse in California';
  p.inv='Inventory';s.sync='paused';s.enabledOn='Sep 24, 2026 14:20';s.lastSync='Oct 1, 2026 17:00';s.pauseReason='Paused on Oct 1, 2026 17:00. New changes are queued and sent when you resume.';
  s.events=sampleEvents(p,true);return s}
function stateAll(){var s=base(),p=connectInt(s,'p','Sep 24, 2026 14:20'),f=connectInt(s,'f','Sep 24, 2026 14:20');p.loc='Warehouse in California';
  p.map['Plate seconds']={q:'9',src:'Manual'};f.map['Gift wrap']={q:'10',src:'Manual'};
  [p,f].forEach(function(i){i.inv='Inventory';
    i.products.forEach(function(x){var q=qbo(i.map[x[0]].q);i.shop[x[0]]=q.qty});compareStore(i,s)});
  f.loc='Flower stall, Oakland';s.sync='on';s.enabledOn='Sep 24, 2026 14:20';s.lastSync='Oct 1, 2026 17:12';
  s.events=sampleEvents(p,false).concat([{t:'Oct 1, 2026 14:40',store:f.name,src:'Bill #1047',item:'Tulip bouquet',d:+30,status:'Applied'},{t:'Oct 1, 2026 12:15',store:f.name,src:'Invoice #2236',item:'Rose bouquet',d:-2,status:'Applied'}]);return s}
function sampleEvents(st,withHeld){var e=[
  {t:'Oct 1, 2026 16:58',store:st.name,src:'Bill #1042',item:st.products[0][0],d:+24,status:'Applied'},
  {t:'Oct 1, 2026 15:20',store:st.name,src:'Invoice #2231',item:st.products[1][0],d:-2,status:'Applied'},
  {t:'Oct 1, 2026 11:05',store:st.name,src:'Inventory qty adjustment #35',item:st.products[2][0],d:-3,status:'Applied'}];
  if(withHeld){e.unshift({t:'Oct 1, 2026 16:59',store:st.name,src:'Bill #1045',item:'Plate seconds (B-grade)',d:+12,status:'Held',reason:'Item not matched'});
    e.unshift({t:'Oct 1, 2026 17:03',store:st.name,src:'Sales receipt #90',item:st.products[3][0],d:-1,status:'Pending'})}
  return e}

/* ---- helpers ---- */
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function signed(n){return (n>0?'+':'')+n}
function plural(n,w){return n+' '+w+(n===1?'':'s')}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('show')},3000)}
function closeM(){$('m-dlg').classList.remove('show')}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeM()});
function dialog(title,body,buttons){$('m-dlg-t').textContent=title;$('m-dlg-b').innerHTML=body;
  $('m-dlg-f').innerHTML='<button class="btn btn-text" onclick="closeM()">Cancel</button>'+buttons.map(function(b,i){return '<button class="btn '+(b.cls||'')+'" id="dlg-'+i+'">'+esc(b.label)+'</button>'}).join('');
  buttons.forEach(function(b,i){$('dlg-'+i).onclick=b.fn});$('m-dlg').classList.add('show');var last=$('dlg-'+(buttons.length-1));if(last)last.focus()}
function int(id){return S.ints.filter(function(x){return x.id===id})[0]}
function conn(){return S.ints.filter(function(x){return x.connected})}
function avail(){return S.ints.filter(function(x){return !x.connected})}
function mappedN(i){return i.products.filter(function(p){return i.map&&i.map[p[0]]}).length}
function ready(i){return !!(i.loc&&i.inv==='Inventory')}       // Ignat: location + inventory setting
function compareStore(i,s){s=s||S;i.cmp=[];i.products.forEach(function(p){var m=i.map[p[0]];if(!m)return;var q=qbo(m.q),sq=i.shop[p[0]],k=i.id+'|'+p[0],ig=s.ignored[k];
  i.cmp.push({prod:p[0],item:q.name,qq:q.qty,sq:sq,res:q.qty===sq?'Same':(ig&&ig.qq===q.qty&&ig.sq===sq)?'Ignored':'Unresolved'})})}
function diffsOf(i){return (i.cmp||[]).filter(function(r){return r.res==='Unresolved'})}
function allDiffs(){return conn().filter(function(i){return i.loc}).reduce(function(n,i){return n+diffsOf(i).length},0)}

/* ---- actions ---- */
function doConnect(id,fromDialog){if(!id){toast('Choose a store first.');return}if(fromDialog)closeM();S.connecting=id;render();
  setTimeout(function(){var i=connectInt(S,id);S.connecting=false;toast(i.name+' connected.');S.tab='overview';render()},1200)}
function askConnect(){var av=avail();
  if(!av.length){dialog('Connect store','<p>All your Shopify integrations are connected to Inventory Sync.</p><p class="muted">To connect another store, add it first in Settings › Add integration › Shopify.</p>',[]);return}
  dialog('Connect store','<div class="form-field"><label class="form-label" for="dlg-store">Shopify store</label><select class="select" id="dlg-store">'+(av.length>1?'<option value="">Select…</option>':'')+av.map(function(x){return '<option value="'+x.id+'">'+esc(x.name)+' (Shopify)</option>'}).join('')+'</select></div>'
    +'<p class="muted small" style="margin-top:8px">Don\'t see your store here? Add it first in Settings › Add integration.</p>',[{label:'Connect store',fn:function(){doConnect($('dlg-store').value,true)}}])}
function askLoc(id){var i=int(id);dialog('Inventory location','<p>'+esc(i.name)+' receives stock adjustments at this location.</p><div class="form-field"><label class="form-label" for="dlg-loc">Location</label><select class="select" id="dlg-loc">'
  +(i.loc?'':'<option value="">Choose location</option>')+i.locations.map(function(l){return '<option '+(i.loc===l?'selected':'')+'>'+esc(l)+'</option>'}).join('')+'</select></div>',[{label:'Save',fn:function(){var v=$('dlg-loc').value;if(!v){toast('Choose a location first.');return}i.loc=v;closeM();toast('Inventory location updated.');render()}}])}
function openSettings(id){var i=int(id);i.opened=true;i.inv='Inventory';   // prototype: real product detects the change automatically
  toast('Settings opened in a new tab. '+i.name+': Created product should be = Inventory.');render()}
function checkInv(id){var i=int(id);if(!i.opened){toast('Created product should be is still Non-inventory for '+i.name+'.');return}i.inv='Inventory';toast(i.name+': Created product should be = Inventory.');render()}
function enable(){S.sync='on';S.enabledOn='just now';S.lastSync='just now';S.pauseReason=null;toast('Inventory sync enabled. Synder checks QuickBooks every 5 minutes.');render()}
function askDisable(){dialog('Disable inventory sync?','<p>Synder stops reading QuickBooks. Changes made while sync is disabled are never sent to Shopify, only changes after you enable it again.</p><div class="alert alert-info" style="margin:0"><div>To stop for a while without losing changes, use <b>Pause</b>: changes are queued and sent when you resume.</div></div>',
  [{label:'Pause instead',cls:'btn-outlined',fn:function(){closeM();pause()}},{label:'Disable',cls:'btn-danger',fn:function(){closeM();S.sync='off';toast('Inventory sync disabled.');render()}}])}
function pause(){S.sync='paused';S.pauseReason='Paused just now. Changes are queued and sent when you resume.';toast('Paused. Changes are queued.');render()}
function askAccept(id,prod){var i=int(id),r=i.cmp.filter(function(x){return x.prod===prod})[0];
  dialog('Accept QuickBooks quantity','<p>Shopify on hand for "'+esc(prod)+'" in '+esc(i.name)+' will be set to '+r.qq+' (change '+signed(r.qq-r.sq)+'). A sync event will be created to apply it.</p>',[{label:'Accept QuickBooks',fn:function(){closeM();
    var d=r.qq-r.sq;i.shop[prod]=r.qq;r.sq=r.qq;r.res='Accepted QuickBooks';S.events.unshift({t:'just now',store:i.name,src:'Reconcile',item:prod,d:d,status:'Pending'});toast('QuickBooks quantity accepted. Shopify will be updated.');render()}}])}
function ignoreRow(id,prod){var i=int(id),r=i.cmp.filter(function(x){return x.prod===prod})[0];S.ignored[id+'|'+prod]={qq:r.qq,sq:r.sq};r.res='Ignored';toast('Ignored until one of the quantities changes.');render()}
function setMap(id,prod,q){var i=int(id);i.map[prod]=q?{q:q,src:'Manual'}:null;compareStore(i);toast(q?'QuickBooks item mapped.':'Mapping removed.');render()}
function retry(){var n=0;S.events.forEach(function(e){if(e.status!=='Held')return;var i=S.ints.filter(function(x){return x.name===e.store})[0];
  if(i.products.some(function(p){return i.map[p[0]]&&qbo(i.map[p[0]].q).name===e.item})){e.status='Applied';delete e.reason;n++}});
  toast(n?plural(n,'held change')+' sent.':'Nothing sent: fix the hold reason first.');render()}
function go(t,opts){S.tab=t;Object.assign(S,opts||{});render()}

/* ---- empty state (sketch 1) ---- */
function vFirst(){var av=avail(),one=av.length===1;
  return '<div class="empty-wrap"><div class="empty-card" id="first"><h2>Inventory sync</h2><p class="muted">Pushes QuickBooks Online stock movements into your Shopify store.</p>'
   +'<div class="form-field"><label class="form-label" for="first-store" style="font-weight:700">Shopify store</label><select class="select" id="first-store" onchange="S.sel=this.value">'
   +(one?'':'<option value="">Select…</option>')+av.map(function(x){return '<option value="'+x.id+'" '+((one||S.sel===x.id)?'selected':'')+'>'+esc(x.name)+' (Shopify)</option>'}).join('')+'</select></div>'
   +'<p style="margin:8px 0 12px">Don\'t see your store here? Add it first in <a class="text-link">Settings › Add integration</a>.</p>'
   +'<button class="btn" id="btn-first-connect" '+(S.connecting?'disabled ':'')+'onclick="doConnect(document.getElementById(\'first-store\').value)">'+(S.connecting?'<span class="spin"></span>Connecting…':'Connect store')+'</button>'
   +'<p class="steps-hint">Next you\'ll see what the store still needs: a location, one setting in Synder and matched products. About 10 minutes.</p></div></div>'}

/* ---- overview (sketches 2 + 3) ---- */
function vOverview(){
  var cs=conn(), notReady=cs.filter(function(i){return !ready(i)}), h='';
  if(notReady.length) h+='<div class="banner" id="banner"><span class="material-icons">build</span><div style="flex:1">'+(notReady.length===1?esc(notReady[0].name)+' needs setup before it receives changes.':plural(notReady.length,'store')+' need setup before they receive changes.')+'</div><a class="text-link" onclick="document.getElementById(\'store-'+notReady[0].id+'\').scrollIntoView({block:\'center\'})">Show</a></div>';
  if(L===2) h+=tilesLine()+'<div class="cols2"><div>'+bSync()+bDiffs()+'</div>'+bStores()+'</div>';
  else h+='<div class="cols"><div>'+bActivity()+bDiffs()+'</div>'+bSync()+bStores()+'</div>';
  return h}
function bDiffs(){   // not activity: its own small block, just a message (Ignat 2026-10-01)
  var n=allDiffs(), st=conn().filter(function(i){return i.loc&&diffsOf(i).length}).map(function(i){return i.name});
  return '<div class="block" id="b-diff" style="margin-top:16px"><div class="block-t">Stock check <span class="material-icons help" title="Products where QuickBooks and Shopify show different stock. Sync sends only changes, so a difference stays until you fix it.">help</span></div>'
   +'<div class="box"><div class="act" data-act="diff"><span><span class="status status-purple">Stock differences</span><span class="muted small" style="margin-left:8px">QuickBooks ≠ Shopify</span></span>'
   +'<a class="text-link" id="act-diff" onclick="go(\'reconcile\')">'+n+'<span class="material-icons i16">chevron_right</span></a></div>'
   +'<div class="muted small" id="diff-msg">'+(n?plural(n,'product')+' in '+st.join(' and ')+' '+(n===1?'differs':'differ')+'. Compared every night at 02:30 UTC.':'No differences in the last comparison (every night at 02:30 UTC).')+'</div></div></div>'}
function tilesLine(){ // the numbers that need the user are coloured only when they are above 0
  var c=function(st){return S.events.filter(function(e){return e.status===st}).length}, d=allDiffs();
  var t=[['Held',c('Held'),'Not sent: needs you','t-held',"go('events',{evFilter:'Held'})"],['Failed',c('Failed'),'Shopify rejected it','t-failed',"go('events',{evFilter:'Failed'})"],
    ['Pending',c('Pending'),'Waiting for the next check','',"go('events',{evFilter:'Pending'})"],
    ['Applied in 24h',c('Applied'),'Stock updated in Shopify','',"go('events',{evFilter:'Applied'})"]];
  return '<div class="tiles" id="tiles">'+t.map(function(x){return '<div class="tile '+(x[1]>0?x[3]:'')+'" data-tile="'+x[0]+'"><div class="tl">'+x[0]+'</div><div class="tv"><a class="text-link" onclick="'+x[4]+'">'+x[1]+'<span class="material-icons i16">chevron_right</span></a></div></div>'}).join('')+'</div>'}
function bActivity(){
  var c=function(st){return S.events.filter(function(e){return e.status===st}).length}, applied=c('Applied'), d=allDiffs();
  var rows=[['Held','status-yellow',c('Held'),'Not sent: needs you'],['Failed','status-red',c('Failed'),'Shopify rejected it'],['Pending','status-blue',c('Pending'),'Waiting for the next check'],['Applied in 24h','status-green',applied,'Stock updated in Shopify']];
  var h='<div class="block" id="b-activity"><div class="block-t">Activity <span class="material-icons help" title="Stock changes from QuickBooks and what happened to them.">help</span></div>'
   +'<div class="headline" id="act-headline">'+(S.sync==='off'&&!S.enabledOn?'Nothing sent yet':plural(applied,'stock change')+' sent in the last 24 hours')+'</div><div class="box">';
  rows.forEach(function(r){h+='<div class="act" data-act="'+r[0]+'"><span><span class="status '+r[1]+'">'+r[0]+'</span></span><a class="text-link" onclick="go(\'events\',{evFilter:\''+(r[0]==='Applied in 24h'?'Applied':r[0])+'\'})">'+r[2]+'<span class="material-icons i16">chevron_right</span></a></div>'});
  return h+'</div></div>'}
function bSync(){
  var cs=conn(), rd=cs.filter(ready), mode=S.sync;
  var chip={off:'<span class="status status-grey">Disabled</span>',on:'<span class="status status-green">Enabled</span>',paused:'<span class="status status-yellow">Paused</span>'}[mode];
  var h='<div class="block" id="b-sync"><div class="block-t">Sync <span class="material-icons help" title="Synder reads stock changes from QuickBooks and sends them to the stores that are ready.">help</span></div><div class="box">'
   +'<div class="line"><span class="k">State:</span><span id="sync-state">'+chip+'</span></div>';
  if(S.enabledOn) h+='<div class="line"><span class="k">Last sync:</span>'+esc(S.lastSync)+'</div>';
  if(mode==='on') h+='<div class="line"><span class="k">Checks:</span>every 5 minutes · next in about 3 min</div>';
  if(mode==='paused') h+='<div class="line muted small" id="pause-reason">'+esc(S.pauseReason)+'</div>';
  if(mode==='off'){
    var unm=rd.filter(function(i){return mappedN(i)<i.products.length});
    h+=(rd.length?'<div class="line muted small">Sends to '+plural(rd.length,'ready store')+'. Only changes made after you enable are sent.</div>':'<div class="line muted small" id="enable-why">Enable works once a store has a location and Created product should be: Inventory.</div>')
     +'<div class="row-actions"><button class="btn" id="btn-enable" '+(rd.length?'':'disabled ')+'onclick="enable()">Enable</button></div>';
    unm.forEach(function(i){h+='<div class="line small" style="color:var(--color-yellow)" data-warn="'+i.id+'"><span class="material-icons i16">warning</span>'+(i.products.length-mappedN(i))+' of '+i.products.length+' products in '+esc(i.name)+' aren\'t matched and won\'t sync.</div>'});
  } else h+='<div class="row-actions">'+(mode==='on'?'<button class="btn btn-outlined" id="btn-pause" onclick="pause()">Pause</button><button class="btn btn-outlined" onclick="S.lastSync=\'just now\';toast(\'Checked QuickBooks: 0 new changes.\');render()">Run now</button>'
      :'<button class="btn" id="btn-resume" onclick="S.sync=\'on\';S.pauseReason=null;toast(\'Resumed. Queued changes are being sent.\');render()">Resume</button>')
     +'<button class="btn btn-outlined-error" id="btn-disable" onclick="askDisable()">Disable</button></div><div class="line muted small">Pause keeps changes and sends them later. Disable drops them.</div>';
  return h+'</div></div>'}
function storeBadge(i){if(!ready(i))return '<span class="status status-yellow" data-badge>Setup needed</span>';
  return {on:'<span class="status status-green" data-badge>Receiving changes</span>',paused:'<span class="status status-grey" data-badge>Paused</span>',off:'<span class="status status-blue" data-badge>Ready</span>'}[S.sync]}
function bStores(){
  var h='<div class="block" id="stores-card"><div class="block-t">Shopify stores <span class="material-icons help" title="Each store receives stock changes at one location once its setup is done.">help</span></div>';
  // stores that still need setup come first
  conn().slice().sort(function(a,b){return ready(a)===ready(b)?0:ready(a)?1:-1}).forEach(function(i){
    var m=mappedN(i), un=i.products.length-m, rows=[], q="'"+i.id+"'";
    // the same three rows for every store, always in setup order; an open row has one action
    rows.push(i.loc?['loc',true,'<span class="k">Location:</span>'+esc(i.loc)+' <a class="text-link small" onclick="askLoc('+q+')">Change</a>']
      :['loc',false,'Location: not chosen','This store receives nothing until a location is chosen.','<button class="btn btn-outlined btn-sm" onclick="askLoc('+q+')">Choose location</button>']);
    rows.push(i.inv==='Inventory'?['inv',true,'<span class="k">Created product should be:</span>Inventory']
      :['inv',false,'Created product should be: Inventory','Now it is Non-inventory. Change it in Settings › '+esc(i.name)+' (Shopify) › Products/Services and click Update. This page updates by itself.',
        '<button class="btn btn-outlined btn-sm" onclick="openSettings('+q+')">Open Settings <span class="material-icons i16">open_in_new</span></button>']);
    rows.push(!un?['map',true,'<span class="k">Mappings:</span>'+m+'/'+i.products.length]
      :['map',false,'Mappings: '+m+'/'+i.products.length,plural(un,'product')+' '+(un===1?'has':'have')+' no QuickBooks item and won\'t sync.',
        '<button class="btn btn-outlined btn-sm" onclick="go(\'mappings\',{mapStore:'+q+',unmappedOnly:true})">Match products</button>']);
    h+='<div class="box" id="store-'+i.id+'" data-store="'+i.id+'"><div class="store-h"><span class="shop-ic">S</span><b>'+esc(i.name)+' (Shopify)</b>'+storeBadge(i)+'</div>'
      +'<div class="line small muted">Connected on: '+esc(i.connectedOn)+'</div>';
    rows.forEach(function(r,ix){
      if(r[1]===false) h+='<div class="fix" data-fix="'+r[0]+'"><span class="n">'+(ix+1)+'</span><div class="grow">'+r[2]+'<span class="muted">'+r[3]+'</span><div class="row-actions" style="margin-top:6px">'+r[4]+'</div></div></div>';
      else h+='<div class="line okrow" data-ok="'+r[0]+'"><span class="material-icons"'+(r[1]?'':' style="color:var(--color-grey-30)"')+'>'+(r[1]?'check_circle':'schedule')+'</span>'+r[2]+'</div>'});
    h+='</div>'});
  h+='<div class="row-actions" style="margin-top:12px"><button class="btn" id="btn-connect" onclick="askConnect()">Connect store</button></div>';
  return h+'</div>'}

/* ---- tabs ---- */
function vMappings(){var cs=conn();var i=int(S.mapStore);if(!i||!i.connected)i=cs[0];
  var list=i.products.filter(function(p){return !S.unmappedOnly||!i.map[p[0]]});
  var h='<div class="toolbar"><select class="select" id="map-store" aria-label="Store" onchange="S.mapStore=this.value;render()">'+cs.map(function(x){return '<option value="'+x.id+'" '+(x.id===i.id?'selected':'')+'>'+esc(x.name)+'</option>'}).join('')+'</select>'
   +'<label class="checkbox-wrap"><input type="checkbox" class="checkbox" id="unmapped-only" '+(S.unmappedOnly?'checked':'')+' onchange="S.unmappedOnly=this.checked;render()">Unmapped only</label><span class="grow"></span>'
   +'<span class="muted small">'+mappedN(i)+' of '+i.products.length+' matched · by SKU, then by name</span><a class="text-link" onclick="go(\'overview\')">Back to overview</a></div>';
  h+='<div class="table-wrap"><table class="synder-table" id="map-table"><thead><tr><th>Product</th><th>SKU</th><th>QuickBooks item</th><th>Match source</th></tr></thead><tbody>'
   +(list.map(function(p){var m=i.map[p[0]];return '<tr data-prod="'+esc(p[0])+'"><td>'+esc(p[0])+'</td><td>'+(p[1]?esc(p[1]):'–')+'</td><td><select class="select" aria-label="QuickBooks item for '+esc(p[0])+'" onchange="setMap(\''+i.id+'\',\''+p[0]+'\',this.value)"><option value="">Not mapped</option>'
     +QBO.map(function(q){return '<option value="'+q.id+'" '+(m&&m.q===q.id?'selected':'')+'>'+esc(q.name)+(q.sku?' · '+q.sku:'')+'</option>'}).join('')+'</select></td><td>'+(m?m.src:'<span class="muted">Not mapped</span>')+'</td></tr>'}).join('')||'<tr><td colspan="4" class="empty">Every product is matched.</td></tr>');
  return h+'</tbody></table></div>'}
function vEvents(){var f=S.evFilter, list=S.events.filter(function(e){return f==='All'||e.status===f}), held=S.events.filter(function(e){return e.status==='Held'}).length;
  var h='<div class="toolbar"><select class="select" id="ev-filter" aria-label="Status" onchange="S.evFilter=this.value;render()">'+['All','Held','Failed','Pending','Applied'].map(function(x){return '<option '+(x===f?'selected':'')+'>'+x+'</option>'}).join('')+'</select><span class="grow"></span>'
   +'<button class="btn btn-outlined" id="btn-retry" '+(held?'':'disabled ')+'onclick="retry()">Retry held and failed</button><a class="text-link" onclick="go(\'overview\')">Back to overview</a></div>';
  if(!list.length)return h+'<div class="table-wrap"><div class="empty" id="ev-empty">'+(S.events.length?'No '+f.toLowerCase()+' changes.':'No stock changes yet. They appear here after you enable sync.')+'</div></div>';
  h+='<div class="table-wrap"><table class="synder-table" id="ev-table"><thead><tr><th>Created</th><th>Store</th><th>QuickBooks document</th><th>Product</th><th class="num">Change</th><th>Status</th><th>Reason</th></tr></thead><tbody>'
   +list.map(function(e){return '<tr><td>'+esc(e.t)+'</td><td>'+esc(e.store)+'</td><td>'+esc(e.src)+'</td><td>'+esc(e.item)+'</td><td class="num">'+(e.d?signed(e.d):'–')+'</td><td><span class="status '+({Applied:'status-green',Held:'status-yellow',Pending:'status-blue',Failed:'status-red'}[e.status])+'">'+e.status+'</span></td><td>'+(e.reason?esc(e.reason)+' · <a class="text-link" onclick="go(\'mappings\',{unmappedOnly:true,mapStore:\''+S.ints.filter(function(x){return x.name===e.store})[0].id+'\'})">Match it</a>':'–')+'</td></tr>'}).join('');
  return h+'</tbody></table></div>'}
function vReconcile(){var rows=[];conn().forEach(function(i){(i.cmp||[]).forEach(function(r){rows.push([i,r])})});
  var h='<p class="muted">Compares QuickBooks quantity with Shopify stock for every matched product. Runs every night at 02:30 UTC.</p><div class="toolbar"><span class="grow"></span><button class="btn" id="btn-compare" onclick="conn().forEach(function(i){compareStore(i)});toast(\'Comparison finished.\');render()">Compare now</button><a class="text-link" onclick="go(\'overview\')">Back to overview</a></div>';
  if(!rows.length)return h+'<div class="table-wrap"><div class="empty">No comparison yet.</div></div>';
  h+='<div class="table-wrap"><table class="synder-table" id="rec-table"><thead><tr><th>Store</th><th>Product</th><th class="num">QuickBooks</th><th class="num">Shopify</th><th class="num">Difference</th><th>Resolution</th><th>Actions</th></tr></thead><tbody>'
   +rows.map(function(x){var i=x[0],r=x[1],d=r.qq-r.sq;return '<tr data-prod="'+esc(r.prod)+'" data-st="'+i.id+'"><td>'+esc(i.name)+'</td><td>'+esc(r.prod)+'</td><td class="num">'+r.qq+'</td><td class="num">'+r.sq+'</td><td class="num '+(d>0?'diff-pos':d<0?'diff-neg':'')+'">'+(d?signed(d):'0')+'</td><td>'+esc(r.res)+'</td><td>'
     +(r.res==='Unresolved'?'<button class="btn btn-text btn-sm accept" onclick="askAccept(\''+i.id+'\',\''+r.prod+'\')">Accept QuickBooks</button><button class="btn btn-text btn-sm" onclick="ignoreRow(\''+i.id+'\',\''+r.prod+'\')">Ignore</button>':'–')+'</td></tr>'}).join('');
  return h+'</tbody></table></div>'}

/* ---- render ---- */
function render(){
  var m=$('main');
  if(!conn().length){m.innerHTML=vFirst();return}       // sketch 1: no tabs until a store is connected
  var tabs=['overview','mappings','events','reconcile'],names={overview:'Overview',mappings:'Mappings',events:'Events',reconcile:'Reconcile'};
  var v=S.tab==='overview'?vOverview():S.tab==='mappings'?vMappings():S.tab==='events'?vEvents():vReconcile();
  m.innerHTML='<div class="page-header"><div class="page-header-text"><h1 class="page-title">Inventory sync</h1><p class="page-subtitle">Pushes QuickBooks Online stock movements into your Shopify store.</p></div></div>'
   +'<div class="tabs" role="tablist">'+tabs.map(function(t){return '<button class="tab'+(S.tab===t?' active':'')+'" role="tab" id="tab-'+t+'" aria-selected="'+(S.tab===t)+'" onclick="go(\''+t+'\')">'+names[t]+'</button>'}).join('')+'</div>'+v;
}
function setVariant(n){V=n;[1,2,3].forEach(function(i){$('vs-'+i).classList.toggle('on',i===n)});S=n===1?stateFirst():n===2?stateFixes():stateAll();
  history.replaceState(null,'','?l='+L+'&s='+n);render()}
function setLayout(n){L=n;[1,2].forEach(function(i){$('ly-'+i).classList.toggle('on',i===n)});history.replaceState(null,'','?l='+L+'&s='+V);render()}   // same data, layout only
L=/l=2/.test(location.search)?2:1;[1,2].forEach(function(i){$('ly-'+i).classList.toggle('on',i===L)});
setVariant(/s=2/.test(location.search)?2:/s=3/.test(location.search)?3:1);
</script>
</body>
</html>
