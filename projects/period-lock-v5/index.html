<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Period lock v5 — Settings — Synder</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">
<link rel="stylesheet" href="../../ui-kit/synder-ui-kit.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined">
<style>
  /* Every text is >= 14px. Shell = live chrome captured in projects/stripe-invoice-date (sidebar, top bar,
     sync details); tables = kit table.synder-table; statuses = kit .status. Desktop only (min 1280). */
  html,body{height:100%}
  input,select,textarea,button{font-family:inherit;font-size:14px}
  body{display:flex;flex-direction:column;min-width:1280px;font-size:14px;color:var(--text-primary);
    background:var(--color-white);overflow:hidden}

  /* variant switcher (AGENTS.md canonical, text raised to 14px) + demo controls on the right of the same dark bar */
  .variant-switch{display:flex;align-items:center;gap:12px;background:var(--color-grey);color:var(--color-white);
    padding:8px 20px;flex-shrink:0;font-size:14px}
  .variant-switch .vs-label{font-weight:500;letter-spacing:.01em;opacity:.75;font-size:14px;text-transform:uppercase;white-space:nowrap}
  .variant-switch .vs-opts{display:flex;gap:4px;background:rgba(255,255,255,.1);border-radius:6px;padding:3px}
  .variant-switch .vs-opts button{background:none;border:none;color:rgba(255,255,255,.7);font-family:inherit;font-size:14px;
    padding:5px 12px;border-radius:4px;cursor:pointer;white-space:nowrap}
  .variant-switch .vs-opts button:hover{color:var(--color-white)}
  .variant-switch .vs-opts button.on{background:var(--color-white);color:var(--text-primary);font-weight:500}
  .variant-switch .vs-note{margin-left:auto;opacity:.6;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .demo-bar{display:flex;align-items:center;gap:10px;flex-shrink:0;font-size:14px}
  .demo-bar label{opacity:.85;font-size:14px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
  .demo-bar .db-sep{width:1px;height:20px;background:rgba(255,255,255,.25)}
  .demo-bar input[type=date]{width:150px;height:28px;padding:2px 8px;border:none;border-radius:4px;font-size:14px}
  .demo-bar .db-btn{background:rgba(255,255,255,.1);border:none;color:rgba(255,255,255,.85);font-family:inherit;
    font-size:14px;padding:4px 12px;border-radius:4px;cursor:pointer}
  .demo-bar .db-btn:hover{color:var(--color-white)}
  .demo-bar .db-right{margin-left:auto}

  /* Mixpanel demo popups (demo only, not Synder UI); never intercept clicks except their close button */
  #mp-stack{position:fixed;left:12px;bottom:12px;z-index:1800;display:flex;flex-direction:column;gap:8px;pointer-events:none}
  .mp-card{width:300px;background:var(--color-white);border:1px dashed var(--color-grey);border-radius:var(--radius-md);
    box-shadow:var(--shadow-dropdown);font-size:14px;line-height:20px;overflow:hidden}
  .mp-card .mp-h{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 4px 12px;background:var(--color-grey);color:var(--color-white)}
  .mp-card .mp-h button{pointer-events:auto;background:none;border:none;color:var(--color-white);cursor:pointer;display:flex;padding:2px}
  .mp-card .mp-b{padding:8px 12px 10px}
  .mp-card .mp-ev{font-weight:500;color:var(--color-primary);margin-bottom:2px}
  .mp-card .mp-p{display:flex;gap:6px}
  .mp-card .mp-k{color:var(--text-secondary)}
  .mp-card .mp-tag{margin-left:auto;color:var(--text-secondary);font-style:italic}

  .mi{font-family:'Material Icons Outlined';font-weight:normal;font-style:normal;font-size:20px;line-height:1;
    display:inline-block;-webkit-font-smoothing:antialiased;font-feature-settings:'liga';text-transform:none;
    letter-spacing:normal;white-space:nowrap;vertical-align:middle}

  /* live app shell */
  .app{flex:1;display:flex;min-height:0;background:var(--color-white);position:relative}
  .sb{width:208px;flex-shrink:0;border-right:1px solid var(--border-default);background:var(--color-white);
    display:flex;flex-direction:column;overflow-y:auto;position:relative}
  .sb-org{display:flex;align-items:center;gap:10px;height:56px;padding:0 14px;flex-shrink:0;width:100%;
    border:none;border-bottom:1px solid var(--border-default);background:none;font:inherit;font-size:14px;
    font-weight:500;color:var(--text-primary);cursor:pointer;text-align:left}
  .sb-org:hover{background:var(--color-grey-5)}
  .sb-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:14px;flex-shrink:0}
  .sb-av.pt{background:#F5C6CB;color:#B23B4B} .sb-av.sm{background:var(--color-status-green-bg);color:var(--color-green)}
  .sb-org .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sb-org .mi{color:var(--text-secondary)}
  .sb-item{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 14px;color:var(--text-primary);
    border-bottom:1px solid var(--border-default);font-size:14px;text-decoration:none;flex-shrink:0}
  .sb-item .mi{color:var(--color-primary);font-size:20px}
  .sb-item .chev{margin-left:auto;color:var(--text-secondary)}
  a.sb-item:hover{background:var(--color-grey-5)}
  .sb-item.on{background:var(--color-primary);color:var(--color-white)} .sb-item.on .mi{color:var(--color-white)}
  .sb-beta{color:var(--color-primary);border:1px solid var(--color-primary-50);border-radius:4px;padding:0 4px;font-size:14px;line-height:18px}
  .sb-gap{height:40px;border-bottom:1px solid var(--border-default);flex-shrink:0}
  .sb-open{background:var(--color-grey-5)}
  .sb-sub{display:flex;align-items:center;gap:10px;min-height:38px;padding:0 14px 0 34px;color:var(--text-primary);
    text-decoration:none;font-size:14px;flex-shrink:0}
  .sb-sub .mi{font-size:18px;color:var(--color-primary)}
  a.sb-sub:hover{background:var(--color-grey-5)}
  .sb-sub.on{background:var(--color-primary);color:var(--color-white)} .sb-sub.on .mi{color:var(--color-white)}
  .sb-new{background:var(--color-status-green-bg);color:var(--color-green);border-radius:4px;padding:0 4px}
  .org-menu{position:absolute;top:58px;left:8px;right:8px;z-index:50;background:var(--color-white);
    border:1px solid var(--border-default);border-radius:var(--radius-md);box-shadow:var(--shadow-dropdown);padding:4px 0}
  .org-menu button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px;border:none;background:none;
    font:inherit;font-size:14px;color:var(--text-primary);cursor:pointer;text-align:left}
  .org-menu button:hover{background:var(--bg-hover)}
  .org-menu .sub{color:var(--text-secondary)}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .top{height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:flex-end;gap:24px;padding:0 24px;
    border-bottom:1px solid var(--border-default);position:relative}
  .syncs{color:var(--text-secondary);border-bottom:3px solid var(--color-primary);padding:6px 0}
  .syncs b{color:var(--color-primary);font-weight:500;font-size:16px}
  .top .mi{color:var(--color-primary);font-size:24px}
  .top .how{color:var(--color-primary)}
  .icon-btn{background:none;border:none;padding:0;cursor:pointer;display:flex}
  .user-menu{position:absolute;right:16px;top:52px;z-index:50}
  .content{flex:1;overflow:auto;padding:16px 24px 32px;position:relative}

  /* page pieces */
  .page-header{margin-bottom:16px}
  .page-header .page-subtitle{margin-top:4px}
  .back-btn{display:inline-flex;align-items:center;gap:4px;background:var(--color-grey-5);border:1px solid var(--border-default);
    border-radius:4px;padding:6px 12px;font-family:inherit;font-size:14px;color:var(--text-primary);margin-bottom:20px;cursor:pointer}
  .back-btn .mi{font-size:18px}
  .back{display:inline-block;margin-bottom:12px}
  .narrow{max-width:960px}
  .ilogo{width:24px;height:24px;border-radius:4px;color:#fff;font-weight:700;font-size:14px;display:inline-flex;
    align-items:center;justify-content:center;flex-shrink:0}
  .integ{display:inline-flex;align-items:center;gap:8px}
  .chips{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
  .status .mi{font-size:16px;margin-right:-6px}
  .muted{color:var(--text-secondary)}
  .err{color:var(--color-red);font-size:14px;margin-top:4px}
  .table-wrap{margin-bottom:8px}
  .synder-table td.num,.synder-table th.num{text-align:right}

  /* integration Settings — live shell captured in projects/stripe-invoice-date (Settings → Invoices, 2026-10-06)
     and Ignat's screenshot of Settings → General (PT_3, 2026-10-14) */
  .set-page{max-width:1180px}
  .set-back{display:inline-flex;align-items:center;gap:4px;background:var(--color-grey-5);border:1px solid var(--border-default);
    border-radius:4px;padding:6px 12px;font-family:inherit;font-size:14px;color:var(--text-primary);margin-bottom:20px;cursor:pointer}
  .pick{margin-bottom:16px}
  .pick h3{font-size:16px;font-weight:500;margin:0 0 8px}
  .int-sel{position:relative;width:300px}
  .int-sel .ilogo{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:3px;pointer-events:none}
  .int-sel select{width:100%;padding-left:36px}
  .add-int{display:inline-block;margin-top:8px;text-decoration:none}
  .set-banner{display:flex;align-items:center;gap:8px;background:var(--color-primary-10);color:var(--color-primary);
    padding:12px 16px;border-radius:4px;line-height:22px;margin-bottom:16px}
  .set-banner .mi{font-size:20px}
  .types{display:flex;border-bottom:1px solid var(--border-default)}
  .type{display:flex;align-items:center;gap:6px;padding:9px 12px;border:1px solid var(--border-default);border-bottom:none;margin-right:-1px;
    color:var(--text-secondary);background:var(--color-grey-5);white-space:nowrap;font-family:inherit;font-size:14px;cursor:pointer}
  .type.on{background:var(--color-white);color:var(--text-primary);border-top:2px solid var(--color-primary)}
  .type .mi{font-size:18px}
  .set-frame{border:1px solid var(--border-default);border-top:none;padding:12px}
  .set-inner{display:flex;border:1px solid var(--border-default);min-height:440px}
  .vnav{width:170px;flex-shrink:0;background:var(--color-grey-5);border-right:1px solid var(--border-default)}
  .vnav .set-tab{display:block;padding:8px 12px;border-bottom:1px solid var(--border-default);color:var(--text-secondary);
    font-size:14px;text-decoration:none}
  .vnav .set-tab:hover{color:var(--color-primary)}
  .vnav .set-tab.on{background:var(--color-white);color:var(--text-primary);box-shadow:inset 3px 0 0 var(--color-primary);
    margin-right:-1px}
  .st-body{padding:4px 20px 12px;flex:1;min-width:0}
  .lrow{padding:12px 0}
  .lrow .row-label{display:flex;align-items:center;gap:8px;font-weight:500;color:var(--text-primary);flex-wrap:wrap}
  .lrow .row-help{display:flex;gap:6px;margin-top:4px;max-width:680px;color:var(--text-secondary);line-height:20px}
  .lrow .row-help .mi{font-size:16px;color:var(--text-secondary);margin-top:2px}
  .lrow .lctl{margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .lrow .lctl select{width:240px}
  .lrow .lctl input[type=date]{width:180px}
  .lrow .lctl input[type=number]{width:72px;text-align:center}
  .lrow input[aria-invalid=true]{border-color:var(--border-error)}
  .pl-line{margin-top:8px;max-width:680px;line-height:20px}
  .pl-line.ex{color:var(--text-secondary);margin-top:4px}
  .live-toggle{display:inline-flex;align-items:stretch;height:26px;border:1px solid #C9CDD3;border-radius:3px;padding:0;
    background:var(--color-white);margin-left:4px;vertical-align:middle;cursor:default;font-family:inherit;font-size:14px}
  .live-toggle::before{content:'';width:18px;border-right:1px solid #C9CDD3}
  .live-toggle span{padding:0 10px;display:flex;align-items:center;color:var(--text-secondary)}
  button.live-toggle{cursor:pointer}
  .live-toggle.on{background:var(--color-primary);border-color:var(--color-primary);flex-direction:row-reverse}
  .live-toggle.on::before{border-right:none;border-left:1px solid var(--color-primary);background:var(--color-white)}
  .live-toggle.on span{color:var(--color-white)}
  .lrow .lctl .on-day{display:inline-flex;align-items:center;gap:8px}
  /* Lock type: two-button segmented toggle built from kit .btn-outlined (the kit has no segmented control) */
  .seg{display:inline-flex}
  .seg button{border-radius:0;margin-left:-1px;color:var(--text-primary);border-color:var(--border-strong);font-weight:400;min-width:112px;justify-content:center}
  .seg button:first-child{border-radius:var(--radius-sm) 0 0 var(--radius-sm);margin-left:0}
  .seg button:last-child{border-radius:0 var(--radius-sm) var(--radius-sm) 0}
  .seg button[aria-checked=true]{background:var(--color-primary-10);border-color:var(--color-primary);color:var(--color-primary);font-weight:500;position:relative;z-index:1}
  .seg button .mi{font-size:18px}
  .seg button:focus-visible{outline:2px solid var(--color-primary);outline-offset:2px;z-index:2}
  .modal ul.m-list{margin:8px 0 0;padding-left:20px;line-height:22px}
  .modal ul.m-list li{margin-bottom:4px}
  .modal .m-check{margin-top:12px;color:var(--text-primary)}
  .modal .m-p{margin:0 0 8px;line-height:22px}
  .modal .alert{margin:12px 0 0}
  .modal .m-field{margin-bottom:12px}
  .modal .m-field label{display:block;font-weight:500;margin-bottom:4px}
  .reason{color:var(--text-secondary);line-height:20px}
  .was{display:block;color:var(--text-secondary);line-height:20px}
  .update-btn{margin-top:16px;display:inline-flex;align-items:center;gap:6px}
  .update-btn .mi{font-size:18px}
  .update-btn:disabled{background:#B9BEC6;border-color:#B9BEC6;color:var(--color-white);cursor:default}
  .marker{color:var(--text-secondary);font-style:italic}
  .chip-up{display:inline-block;background:var(--color-status-purple-bg);color:var(--color-purple);text-decoration:underline;padding:0 6px;border-radius:4px;line-height:24px;margin-left:4px;font-weight:400}
  .np{padding:24px 0;color:var(--text-secondary);font-style:italic}

  /* variant 2: Period lock as its own page (original prototype IA); the form is the same renderer as the Settings section */
  .pl-list-page{max-width:1180px}
  .pl-page{max-width:960px}
  .pl-page .page-header{margin-bottom:8px}
  .pl-page .pl-form{border-top:1px solid var(--border-default)}

  /* transactions */
  .tx-bar{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
  .tx-bar .search{width:200px}
  .tx-bar .stsel{width:200px}
  .tx-green{background:var(--color-green)} .tx-green:hover{background:var(--color-success-hover)}
  .clear-x{display:inline-flex;align-items:center;gap:4px;min-height:24px;padding:0 4px 0 8px;border-radius:12px;
    background:var(--color-grey-10);font-size:14px}
  .clear-x button{border:none;background:none;cursor:pointer;display:flex;padding:0;color:var(--text-secondary)}
  .clear-x .mi{font-size:18px}
  .fl-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .st-col{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:8px 0}
  .menu-fixed{position:fixed;z-index:900;display:block;min-width:240px}
  .menu-fixed .dropdown-item{border:none;background:none;width:100%;font-family:inherit;text-align:left}

  /* sync details (captured) */
  .stub{max-width:1100px}
  .set-card{background:var(--color-white);border-radius:var(--radius-sm);box-shadow:var(--shadow-card);overflow:hidden}
  .set-body{padding:20px}
  .set-title{font-size:16px;font-weight:500;color:var(--text-primary);padding:16px 0 4px}
  .sd-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:4px}
  .sd-title{font-size:20px;font-weight:500;color:var(--text-primary);margin:0}
  .sd-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
  .sd-sub{color:var(--text-secondary);margin-bottom:16px}
  .kv{display:grid;grid-template-columns:200px 1fr;column-gap:16px}
  .kv > div{padding:10px 0;border-bottom:1px solid var(--border-default)}
  .kv .k{color:var(--text-secondary)}
  .qb{display:inline-flex;width:20px;height:20px;border-radius:50%;background:#2CA01C;color:#fff;font-weight:700;
    align-items:center;justify-content:center;vertical-align:-4px;font-size:14px}
  .hl{background:var(--color-status-yellow-bg);padding:0 3px;border-radius:2px}
  tr.log-detail td{height:auto;padding:10px 12px 12px 52px}
  .dl-grid{display:flex;flex-wrap:wrap;gap:6px 24px}
  .notice{margin:4px 0 12px}
  .notice a{color:var(--color-primary)}
  .alert{flex-wrap:wrap}
  .alert .grow{flex:1;min-width:0}

  /* filters, tabs */
  .filters{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end;background:var(--color-grey-5);padding:16px;
    border-radius:4px;margin-bottom:16px}
  .filters .fl{font-weight:500;margin-bottom:6px}
  .filters select,.filters input{width:180px}
  .filters .dr{display:flex;gap:6px} .filters .dr input{width:150px}
  .tabs{padding:0}
  .tabs .tab{border:none;background:none;font-family:inherit;border-bottom:2px solid transparent}
  .tabs .tab.active{border-bottom-color:var(--color-primary)}
  .banner{display:flex;align-items:center;gap:16px}
  .rr-head{display:flex;align-items:center;gap:12px;margin-bottom:4px}
  .rr-head h1{font-size:20px;font-weight:500;margin:0}
  .amount-big{font-size:20px;font-weight:500}
  .sum-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px}
  .sum-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:20px}

  /* toasts — layout of the live error toast captured in projects/stripe-invoice-date */
  #toasts{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:2000;display:flex;flex-direction:column;gap:8px;width:560px}
  .toast{position:relative;display:flex;align-items:flex-start;gap:12px;color:var(--color-white);border-radius:4px;
    padding:14px 40px 16px 16px;box-shadow:var(--shadow-modal);overflow:hidden;font-size:16px;line-height:24px}
  .toast.err{background:var(--color-red)} .toast.ok{background:var(--color-green)} .toast.info{background:var(--color-primary)}
  .toast > .mi{font-size:24px}
  .toast a{color:var(--color-white);text-decoration:underline;cursor:pointer;margin-left:4px;white-space:nowrap}
  .toast-x{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--color-white);cursor:pointer;padding:2px}
  .modal-bg{z-index:1500}
  .modal .synder-modal-body{color:var(--text-primary)}
  .modal .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
  .modal .form-row label{display:block;font-weight:500;margin-bottom:4px}


  /* products and services (SM) */
  .pe-bar{display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--border-default);padding:0 0 12px;margin-bottom:24px}
  .pe-bar .t{font-weight:500;font-size:16px;margin:0}
  .pe-bar .btn{margin-left:auto}
  .pe-form{max-width:480px;margin:0 auto}
  .pe-form h2{font-size:18px;font-weight:500;margin:0 0 16px}
  .pe-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 16px}
  .pe-grid label,.pe-prices label{display:block;font-weight:500;margin-bottom:4px}
  .pe-grid input,.pe-grid select{width:100%}
  .pe-prices{display:flex;gap:16px;margin-top:16px;align-items:flex-start}
  .pe-prices > div{width:180px}
  .pe-prices input{width:100%}
  .pe-note{color:var(--text-secondary);margin-top:6px;width:240px}
  .pe-track{display:inline-flex;align-items:center;gap:8px;font-weight:500}
  .info-line{display:flex;align-items:center;gap:6px;color:var(--text-secondary);margin-bottom:16px}
  .info-line .mi{font-size:18px}
</style>
</head>
<body>

<div class="variant-switch" id="variant-switch">
  <span class="vs-label">What varies</span>
  <div class="vs-opts" role="group" aria-label="Variant">
    <button type="button" id="vs-1" class="on" aria-pressed="true" onclick="setVariant(1)">1 · In Settings</button>
    <button type="button" id="vs-2" aria-pressed="false" onclick="setVariant(2)">2 · Separate page</button>
  </div>
  <span class="vs-note" id="vs-note"></span>
  <div class="demo-bar" id="demo-bar">
    <label for="demo-today">Today (demo)</label>
    <input type="date" id="demo-today" aria-label="Today (demo)">
    <button type="button" class="db-btn" id="demo-reset">Reset</button>
    <span class="db-sep"></span>
    <label><input type="checkbox" id="mp-toggle" checked>Show Mixpanel events</label>
  </div>
</div>

<div class="app">
  <nav class="sb" aria-label="Main" id="sb"></nav>
  <div class="main">
    <div class="top" id="top"></div>
    <div class="content" id="screen"></div>

           'rollback':['Rollback in progress','status-blue'], 'inprogress':['In progress','status-blue'], 'adj':['Synced adjustment','status-green'] };
function stChip(s){ return '<span class="status ' + ST[s][1] + '" data-status>' + ST[s][0] + '</span>'; }
function canRollback(t){ return t.status === 'synced' || t.status === 'synced-warn'; }
function canResync(t){ return t.status !== 'rollback' && t.status !== 'inprogress'; }

/* ---------- navigation + unsaved guard ---------- */
/* integration Settings: #settings = General; #settings/<tab>; the lock lives at #settings/period-lock?integ=<id> */
var SET_TABS = [['general','General'],['sales','Sales'],['invoices','Invoices'],['products-services','Products/Services'],
  ['product-mapping','Product mapping'],['taxes','Taxes'],['fees','Fees'],['application-fees','Application Fees'],['expenses','Expenses'],
  ['payouts','Payouts'],['multicurrency','Multicurrency'],['period-lock','Period lock']];
var PL_ROUTE = 'settings/period-lock';
/* variant 2: #period-lock = list, #period-lock/<integ> = that integration's lock page */
var PL_LIST = 'period-lock';
function setRoute(slug){ return slug === 'general' ? 'settings' : 'settings/' + slug; }
function setHash(slug, id){ return setRoute(slug) + '?integ=' + id; }
function setSlug(r){ return r === 'settings' ? 'general' : r.slice(9); }
function isSettings(r){ return r === 'settings' || (r.indexOf('settings/') === 0 && SET_TABS.some(function(t){ return t[0] === r.slice(9) && t[0] !== 'general'; })); }
function defaultHash(){ return S.v === 2 ? PL_LIST : setHash('period-lock', 'stripe'); }
function curHash(){ return (location.hash || '').replace(/^#/, '') || defaultHash(); }
function routeOf(h){ return (h || '').split('?')[0] || PL_ROUTE; }
function param(h, k){ return new URLSearchParams((h.split('?')[1]) || '').get(k); }
function pageInteg(r){ return r.indexOf(PL_LIST + '/') === 0 ? r.slice(PL_LIST.length + 1) : null; }
/* the lock form, whichever host shows it */
function isLockForm(r){ return r === PL_ROUTE || !!pageInteg(r); }
/* anything that counts as "the Period lock page" for PeriodLockVisited */
function isPlArea(r){ return isLockForm(r) || r === PL_LIST; }
/* where a deep link to one integration's lock goes in the current variant */
function plHash(id){ return S.v === 2 ? PL_LIST + '/' + id : setHash('period-lock', id); }
/* integrations of the current org (both demo orgs have all four; with one, #period-lock skips the list) */
function orgIntegs(){ return Object.keys(INTEG); }
/* map a hash to its equivalent in variant v (settings section ↔ integration lock page; other routes unchanged) */
function mapHash(h, v){
  var r = routeOf(h);
  if (v === 2 && r === PL_ROUTE) return PL_LIST + '/' + (INTEG[param(h, 'integ')] ? param(h, 'integ') : S.selected);
  if (v === 1 && isPlArea(r) && r !== PL_ROUTE) { var id = pageInteg(r); return setHash('period-lock', INTEG[id] ? id : S.selected); }
  return h;
}
function onSettings(){ return isLockForm(S.route) && !!S.draft; }
function go(h){
  closeFloating();
  if ('#' + h === location.hash) { render(); return; }
  S.allowNav = true; location.hash = h;
}
function nav(h){
  if (onSettings() && isDirty() && h !== S.hash) { openUnsaved({ hash:h }); return; }
  go(h);
}
window.addEventListener('hashchange', function(){
  var h = curHash();
  if (S.allowNav) { S.allowNav = false; render(); return; }
  if (onSettings() && isDirty() && h !== S.hash) {
    history.pushState(null, '', '#' + S.hash);
    openUnsaved({ hash:h }); return;
  }
  render();
});
document.addEventListener('click', function(e){
  var a = e.target.closest('a[href^="#"]');
  if (a && !a.hasAttribute('data-pl-link')) {
    var h = a.getAttribute('href').slice(1);
    if (h) {
      e.preventDefault();
      /* PeriodLockVisited entry points: v1 the Settings Period lock tab, v2 the sidebar item */
      if (a.closest('.vnav') && routeOf(h) === PL_ROUTE && S.route !== PL_ROUTE) S.plEntry = 'nav';
      if (a.closest('#sb') && isPlArea(routeOf(h)) && !isPlArea(S.route)) S.plEntry = 'nav';
      nav(h);
    }
  }
}, true);
document.addEventListener('click', function(e){
  if (S.menu && !e.target.closest('.menu-fixed') && !e.target.closest('[data-menu-btn]')) { S.menu = null; renderMenu(); }
  if (S.orgMenu && !e.target.closest('.org-menu') && !e.target.closest('#org-btn')) { S.orgMenu = false; renderShell(); }
  if (S.userMenu && !e.target.closest('.user-menu') && !e.target.closest('#user-btn')) { S.userMenu = false; renderShell(); }
});
document.addEventListener('keydown', function(e){
  if (e.key !== 'Escape') return;
  if (S.modal) { modalCancel(); return; }
  if (S.menu || S.orgMenu || S.userMenu) closeFloating();
});
function closeFloating(){ var r = S.menu || S.orgMenu || S.userMenu; S.menu = null; S.orgMenu = false; S.userMenu = false; if (r) { renderMenu(); renderShell(); } }

function openSettings(id, prefill){
  if (onSettings() && isDirty() && id !== S.draft.id) { openUnsaved({ integ:id, prefill:prefill }); return; }
  if (onSettings() && isDirty() && id === S.draft.id && !prefill) return;
  S.selected = id;
  S.draft = makeDraft(id);
  if (prefill) applyPrefill(prefill);
  go(plHash(id));
}
/* integration select on any Settings tab; on Period lock the unsaved guard applies */
function switchInteg(id){
  if (S.route === PL_ROUTE) { openSettings(id); return; }
  S.selected = id; nav(setHash(setSlug(S.route), id));
}
function switchOrg(org){
  S.orgMenu = false; renderShell();
  if (org === S.org) return;
  if (onSettings() && isDirty()) { openUnsaved({ org:org }); return; }
  doSwitchOrg(org);
}
function doSwitchOrg(org){
  S.org = org;
  if (org === 'sm' && (S.route === 'transactions' || S.route === 'sync-info')) { go('summaries'); return; }
  if (org === 'pt' && (S.route === 'summaries' || S.route === 'summary-detail' || S.route === 'sync-info' || S.route === 'products' || S.route === 'product-edit')) { go('transactions'); return; }
  render();
}
function proceed(p){
  if (!p) return;
  if (p.org) { if (S.draft) S.draft = makeDraft(S.draft.id); doSwitchOrg(p.org); return; }
  if (p.integ) { S.selected = p.integ; S.draft = makeDraft(p.integ); if (p.prefill) applyPrefill(p.prefill); go(plHash(p.integ)); return; }
  if (p.hash) { S.draft = null; go(p.hash); }
}

/* ---------- draft (settings form) ---------- */
function savedView(id){
  var c = S.saved[id];
  return { on:c.on, mode:c.mode, schedule:c.schedule, lockDate:(lockThrough(id) || c.lockDate),
           earliestOpen:earliestOpenEff(id), recurringDay:String(c.recurringDay) };
}
var DFIELDS = ['on','mode','schedule','lockDate','earliestOpen','recurringDay'];
function makeDraft(id){
  var d = savedView(id); d.id = id;
  d.moveTouched = d.earliestOpen !== nextDay(d.lockDate);
  return d;
}
function isDirty(){
  if (!S.draft) return false;
  var v = savedView(S.draft.id), d = S.draft;
  if (!d.on && !v.on) return false;
  return DFIELDS.some(function(k){
    if (k === 'lockDate' && d.schedule === 'recurring' && v.schedule === 'recurring') return false;
    if (k === 'earliestOpen' && d.mode !== 'soft' && v.mode !== 'soft') return false;
    if (k === 'recurringDay' && d.schedule !== 'recurring' && v.schedule !== 'recurring') return false;
    return String(d[k]) !== String(v[k]);
  });
}
function dayValid(v){ return /^\d+$/.test(String(v).trim()) && +v >= 1 && +v <= 28; }
/* the lock date this draft would save */
function lockBasis(d){
  if (d.schedule === 'fixed') return validIso(d.lockDate) ? d.lockDate : null;
  return dayValid(d.recurringDay) ? computedRecurring(+d.recurringDay) : null;
}
function errors(d){
  var e = {};
  if (!d.on) return e;
  if (d.schedule === 'fixed') {
    if (!validIso(d.lockDate)) e.lockDate = 'Required';
    else if (d.lockDate >= S.today) e.lockDate = 'Pick a date before today (' + fmt(S.today) + ').';
  } else if (!dayValid(d.recurringDay)) e.recurringDay = 'Enter a day from 1 to 28';
  var b = lockBasis(d);
  if (d.mode === 'soft' && b) {
    if (!validIso(d.earliestOpen)) e.earliestOpen = 'Required';
    else if (d.earliestOpen <= b) e.earliestOpen = 'Pick a date after ' + fmt(b);
  }
  return e;
}
/* "Move late transactions to" (FDD) defaults to the day after the lock until the user sets it */
function follow(d){ var b = lockBasis(d); if (b && !d.moveTouched) d.earliestOpen = nextDay(b); }
function setDraft(k, v){
  var d = S.draft; d[k] = v;
  if (k === 'earliestOpen') d.moveTouched = true; else follow(d);
  render();
}
function setMode(v){ if (S.draft.mode !== v) setDraft('mode', v); var el = document.getElementById('pl-mode-' + v); if (el) el.focus(); }
function applyPrefill(p){ var d = S.draft; d.on = true; d.schedule = 'fixed'; d.lockDate = p.lockDate; follow(d); }

function plan(){
  var d = S.draft, id = d.id, c = S.saved[id], cur = c.on ? lockThrough(id) : null;
  if (!d.on) return { off:true, cur:cur };
  var newLock = d.schedule === 'fixed' ? d.lockDate : computedRecurring(+d.recurringDay);
  return { off:false, cur:cur, newLock:newLock, earlier: !!cur && newLock < cur };
}
/* the save weakens the lock: it moves back (incl. a monthly save that lands earlier) or turns Off */
function isWeaker(p){ return !!p.cur && (p.off || p.earlier); }
/* lock-canceled rows whose locked part falls in the range this save reopens */
function reopenedCanceled(id, p){
  return TXNS.filter(function(t){ return t.integ === id && lockCanceled(t) && t.blocked.date <= p.cur && (p.off || t.blocked.date > p.newLock); });
}
function attemptSave(after){
  if (!isDirty() || Object.keys(errors(S.draft)).length) return;
  var p = plan();
  if (isWeaker(p)) { openWeaker(p, after); return; }
  applySave(p); if (after) after();
}
/* ordinary saves: Update + toast, no confirmation. Weaker saves: confirmation first (openWeaker) */
function applySave(p, resync){
  var d = S.draft, id = d.id, c = S.saved[id];
  var reopen = isWeaker(p) && resync ? reopenedCanceled(id, p) : [];
  if (p.off) { c.on = false; }
  else {
    c.on = true; c.mode = d.mode; c.schedule = d.schedule; c.lockDate = p.newLock; c.recurringDay = +d.recurringDay || c.recurringDay;
    c.earliestOpen = d.mode === 'soft' ? d.earliestOpen : nextDay(p.newLock);
    c.moveEdited = d.mode === 'soft' && d.earliestOpen !== nextDay(p.newLock);
  }
  c.savedAt = S.today;
  logChange(id);
  mpSave(id);
  /* resync on the original dates: now in the open period, so they sync; for a batch only the canceled part posts */
  reopen.forEach(function(t){ resyncCanceledPart(t); t.status = 'synced'; t.blocked = null; });
  S.draft = makeDraft(id);
  toast('ok', (c.on ? 'Period lock saved' : 'Period lock disabled') + (reopen.length ? '. Resyncing ' + reopen.length + ' transaction' + (reopen.length === 1 ? '' : 's') + '.' : ''));
  render();
}
/* adds the log entry for the canceled part only; the part that already synced is not created again */
function resyncCanceledPart(t){
  var l = t.batch ? { type:'Payment', info:'py_B · Order #2109', msg:'Payment was created.' }
                  : { type:'Order', info:(t.info.split(' · ')[1] || t.id), msg:'Sales receipt created.' };
  SI[t.id].logs = SI[t.id].logs.concat([l]);
}

/* ---------- sync outcome under the current lock (resync) ---------- */
function finishSync(t){
  var part = t.blocked ? t.blocked.date : (t.redated ? t.redated[0] : t.date);
  var applied = 'none';
  if (isLocked(t.integ, part)) {
    if (S.saved[t.integ].mode === 'soft') {
      var to = earliestOpenEff(t.integ);
      t.status = 'synced-warn'; t.redated = [part, to]; applied = 'soft';
      if (t.blocked) { resyncCanceledPart(t); var lg = SI[t.id].logs[SI[t.id].logs.length - 1]; lg.msg += ' ' + moved(part, to); lg.rule = true; t.blocked = null; }
    } else {
      t.status = 'canceled'; applied = 'hard';
      if (!t.blocked) { t.blocked = { part:t.type.toLowerCase(), date:part }; SI[t.id].logs = []; }
    }
  } else {
    if (t.blocked) resyncCanceledPart(t);
    t.status = 'synced'; t.blocked = null;
    if (t.redated) { t.redated = null; SI[t.id].logs.forEach(function(l){ l.msg = l.msg.replace(/ Date changed from .*$/, ''); l.rule = false; }); }
  }
  mpSynched(applied);
}

/* ---------- modals ---------- */
function openUnsaved(p){ S.modal = { kind:'unsaved', pending:p }; renderModal(); }
function modalCancel(){ S.modal = null; renderModal(); }
var modalRendering = false, modalAgain = false;
function renderModal(){
  if (modalRendering) { modalAgain = true; return; }
  modalRendering = true;
  try { doRenderModal(); } finally { modalRendering = false; }
  if (modalAgain) { modalAgain = false; renderModal(); }
}
function doRenderModal(){
  var root = document.getElementById('modal-root'), m = S.modal;
  if (!m) { root.innerHTML = ''; return; }
  var title = '', body = '', foot = '';
  if (m.kind === 'unsaved') {
    var canSave = !Object.keys(errors(S.draft)).length;
    title = 'Save changes to ' + INTEG[S.draft.id].name + '?';
    foot = '<button class="btn btn-text" id="m-keep">Keep editing</button><button class="btn btn-outlined" id="m-discard">Discard</button>'
         + '<button class="btn" id="m-save"' + (canSave ? '' : ' disabled') + '>Save</button>';
  } else if (m.kind === 'confirm') {
    title = m.title; body = m.body || '';
    foot = '<button class="btn btn-text" id="m-cancel">Cancel</button><button class="btn' + (m.danger ? ' btn-error' : '') + '" id="m-ok">' + m.ok + '</button>';
  } else if (m.kind === 'weaker') {
    /* ported from the teammate prototype (confirmSave, weaker branch); pending-sync counts not ported */
    var p = m.plan, nm = INTEG[S.draft.id].name, aff = reopenedCanceled(S.draft.id, p), n = aff.length, part = aff.filter(function(t){ return t.batch; }).length;
    title = p.off ? 'Turn off period lock for ' + nm + '?' : 'Move the lock back to ' + fmt(p.newLock) + '?';
    body = '<p class="m-p" id="w-range">' + (p.off ? 'All dates will be open for syncs again.' : range(nextDay(p.newLock), p.cur) + ' will be open for syncs again.') + '</p>'
      + '<ul class="m-list" id="w-list">'
      + (n ? '<li>' + n + (n === 1 ? ' transaction canceled by this lock stays Canceled unless you resync it.' : ' transactions canceled by this lock stay Canceled unless you resync them.') + '</li>'
           : '<li>No transactions were canceled by this lock.</li>')
      + (part ? '<li>' + (part === 1 ? '1 of them synced in part. Only its canceled part resyncs.' : part + ' of them synced in part. Only their canceled parts resync.') + '</li>' : '')
      + '<li>Transactions moved by a soft lock keep their new dates.</li><li>Already synced transactions won\'t change.</li></ul>'
      + (n ? '<label class="synder-checkbox m-check"><input type="checkbox" id="w-resync"' + (m.resync ? ' checked' : '') + '> Resync them after saving, on their original dates</label>' : '');
    foot = '<button class="btn btn-text" id="m-cancel">Cancel</button><button class="btn" id="m-ok">' + (p.off ? 'Turn off' : 'Move lock') + '</button>';
  } else if (m.kind === 'blocked') {
    var bt = m.txn, bI = INTEG[bt.integ];
    title = 'Can\'t roll back this transaction';
    body = '<p class="m-p" id="rb-why">Its webhook date, ' + fmt(bt.wh) + ', is on or before the lock date (' + bI.src + ', ' + fmt(lockThrough(bt.integ)) + ').</p>'
      + '<p class="m-p muted" id="rb-how">To roll it back, move the lock to before ' + fmt(bt.wh) + '.</p>';
    foot = '<button class="btn btn-outlined" id="m-cancel">Close</button><a class="btn" id="m-pl" href="#' + plHash(bt.integ) + '" data-pl-link="' + bt.integ + '">Period lock settings</a>';
  } else if (m.kind === 'bulk') {
    var r = bulkCalc(), B = S.bulk;
    title = 'Roll back by date range';
    body = '<div class="m-field"><label for="b-integ">Integration</label><select id="b-integ">' + Object.keys(INTEG).map(function(k){ return '<option value="' + k + '"' + (k === B.integ ? ' selected' : '') + '>' + INTEG[k].name + '</option>'; }).join('') + '</select></div>'
         + '<div class="form-row"><div><label for="b-from">From</label><input type="date" id="b-from" value="' + B.from + '"' + (r.valid ? '' : ' aria-invalid="true" aria-describedby="b-err"') + '></div>'
         + '<div><label for="b-to">To</label><input type="date" id="b-to" value="' + B.to + '"></div></div>';
    if (!r.valid) body += '<div class="err" id="b-err">From must be on or before To.</div>';
    else {
      if (r.whole) body += '<div class="alert alert-warning" id="b-alert">The whole range is on or before the lock date (' + fmt(r.lock) + '). Nothing can be rolled back.</div>';
      else if (r.partial) body += '<div class="alert alert-warning" id="b-alert">' + range(B.from, r.lock) + ' is locked. Only ' + range(r.from, B.to) + ' can be rolled back.</div>';
      if (!r.whole) body += '<div id="b-sum" class="m-p" style="margin-top:12px">' + r.n + ' transaction' + (r.n === 1 ? '' : 's') + ' with a webhook date in ' + range(r.from, B.to) + '.</div>';
    }
    foot = '<button class="btn btn-text" id="m-cancel">Cancel</button>'
      + (r.valid && !r.whole ? '<button class="btn" id="m-ok"' + (r.n ? '' : ' disabled') + '>' + (r.partial ? 'Roll back ' + (r.from === B.to ? fmtMD(r.from) : fmtMD(r.from) + ' – ' + fmtMD(B.to)) : 'Roll back') + '</button>' : '');
  }
  root.innerHTML = '<div class="modal-bg show" id="modal-bg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">'
    + '<div class="synder-modal-header" id="m-title">' + title + '</div>'
    + (body ? '<div class="synder-modal-body">' + body + '</div>' : '')
    + '<div class="synder-modal-footer">' + foot + '</div></div></div>';
  var bg = document.getElementById('modal-bg');
  bg.onclick = function(e){ if (e.target === bg) modalCancel(); };
  function on(id, f){ var el = document.getElementById(id); if (el) el.onclick = f; }
  on('m-keep', modalCancel); on('m-cancel', modalCancel);
  on('m-discard', function(){ var p = m.pending; S.modal = null; renderModal(); S.draft = makeDraft(S.draft.id); proceed(p); if (!p.hash && !p.integ && !p.org) render(); });
  on('m-save', function(){ var p = m.pending; S.modal = null; renderModal(); attemptSave(function(){ proceed(p); }); });
  on('m-ok', function(){ var f = m.onOk, rs = document.getElementById('w-resync'); S.modal = null; renderModal(); if (f) f(rs ? rs.checked : false); });
  var wr = document.getElementById('w-resync'); if (wr) wr.onchange = function(){ m.resync = this.checked; };
  on('m-pl', function(e){ e.preventDefault(); e.stopPropagation(); var id = m.txn.integ; S.modal = null; renderModal(); openSettings(id); });
  if (m.kind === 'bulk') {
    document.getElementById('b-integ').onchange = function(){ S.bulk.integ = this.value; renderModal(); };
    document.getElementById('b-from').onchange = function(){ S.bulk.from = this.value; renderModal(); };
    document.getElementById('b-to').onchange = function(){ S.bulk.to = this.value; renderModal(); };
  }
  var first = root.querySelector('#m-keep, #m-cancel'); if (first && m.kind !== 'bulk') first.focus();
}

/* ---------- toasts (no undo action) ---------- */
var toastSeq = 0;
function toast(kind, msg, action){
  var box = document.getElementById('toasts'), el = document.createElement('div');
  el.className = 'toast ' + kind; el.id = 'toast-' + (++toastSeq); el.setAttribute('role', kind === 'err' ? 'alert' : 'status');
  el.innerHTML = '<span class="mi">' + (kind === 'err' ? 'error' : kind === 'info' ? 'info' : 'check_circle') + '</span><div class="toast-msg">' + msg
    + (action ? ' <a data-toast-act>' + action.label + '</a>' : '') + '</div>'
    + '<button class="toast-x" aria-label="Close"><span class="mi">close</span></button>';
  el.querySelector('.toast-x').onclick = function(){ el.remove(); };
  if (action) el.querySelector('[data-toast-act]').onclick = function(){ el.remove(); action.run(); };
  box.appendChild(el);
  setTimeout(function(){ if (el.parentNode) el.remove(); }, 8000);
}

/* ---------- rollback / resync: rollback looks at the webhook date only ---------- */
function blockedSingle(t){ S.modal = { kind:'blocked', txn:t }; renderModal(); }
function openWeaker(p, after){
  S.modal = { kind:'weaker', plan:p, resync:true, onOk:function(rs){ applySave(p, rs); if (after) after(); } };
  renderModal();
}
function rollbackTxn(id){
  closeFloating();
  var t = txn(id);
  if (isLocked(t.integ, t.wh)) { blockedSingle(t); return; }
  S.modal = { kind:'confirm', title:'Roll back ' + t.info + '?', ok:'Roll back',
              onOk:function(){ t.status = 'rollback'; toast('ok', 'Rollback started'); render(); } };
  renderModal();
}
function resyncTxn(id){
  closeFloating();
  var t = txn(id);
  if (canRollback(t) && isLocked(t.integ, t.wh)) { blockedSingle(t); return; }
  t.status = 'inprogress'; toast('ok', 'Resync started'); render();
  setTimeout(function(){ finishSync(t); render(); }, 1200);
}
/* bulk rollback by webhook date, one integration. Proposal for the FDD's "date-range overlap": the locked part of the
   range is skipped and only the open part (day after the lock … To) rolls back. */
function bulkCalc(){
  var B = S.bulk, f = B.from, to = B.to, valid = validIso(f) && validIso(to) && f <= to, lt = lockThrough(B.integ);
  var r = { valid:valid, lock:lt, whole:false, partial:false, from:f, ids:[], n:0 };
  if (!valid) return r;
  if (lt && to <= lt) { r.whole = true; return r; }
  if (lt && f <= lt) { r.partial = true; r.from = nextDay(lt); }
  TXNS.forEach(function(t){ if (t.integ === B.integ && canRollback(t) && t.wh >= r.from && t.wh <= to) r.ids.push(t.id); });
  r.n = r.ids.length;
  return r;
}
function openBulk(){
  closeFloating();
  S.modal = { kind:'bulk', onOk:function(){
    var r = bulkCalc();
    r.ids.forEach(function(id){ txn(id).status = 'rollback'; });
    toast('ok', 'Rollback started for ' + range(r.from, S.bulk.to)); render(); } };
  renderModal();
}
/* summaries: out of scope for the lock — rollback / resync always run */
function rollbackSum(id){
  closeFloating();
  var s = sum(id);
  S.modal = { kind:'confirm', title:'Roll back summary ' + s.range + '?', ok:'Roll back',

/* ---------- floating menus ---------- */
function openMenu(kind, id, btn){
  if (S.menu && S.menu.id === id && S.menu.kind === kind) { S.menu = null; renderMenu(); return; }
  var r = btn.getBoundingClientRect();
  S.menu = { kind:kind, id:id, x:r.right, y:r.bottom + 4 };
  renderMenu();
}
function renderMenu(){
  var root = document.getElementById('menu-root'), m = S.menu;
  if (!m || m.kind === 'actions') { if (!m) root.innerHTML = ''; return; }
  var items = '', acts = {};
  function item(id, label, f){ items += '<button class="dropdown-item" role="menuitem" data-act="' + id + '">' + label + '</button>'; acts[id] = f; }
  if (m.kind === 'txn') {
    var t = txn(m.id);
    item('info', 'Show sync info', function(){ nav('sync-info?id=' + t.id); });
    if (canRollback(t)) item('rollback', 'Rollback', function(){ rollbackTxn(t.id); });
    if (canResync(t)) item('resync', 'Resync', function(){ resyncTxn(t.id); });
    item('archive', 'Archive', function(){ toast('ok', MARK); });
  } else if (m.kind === 'sum') {
    var s = sum(m.id);
    item('open', 'Open summary', function(){ nav('summary-detail?id=' + s.id); });
    if (s.syncInfoId) item('info', 'Show sync info', function(){ nav('sync-info?id=' + s.syncInfoId); });
    if (s.status !== 'rollback' && s.status !== 'inprogress') {
      item('rollback', 'Rollback', function(){ rollbackSum(s.id); });
      item('resync', 'Resync', function(){ resyncSum(s.id); });
    }
    item('archive', 'Archive', function(){ toast('ok', MARK); });
  }
  root.innerHTML = '<div class="dropdown-menu menu-fixed" role="menu" id="row-menu">' + items + '</div>';
  var el = root.firstChild, w = el.offsetWidth, h = el.offsetHeight;
  el.style.left = Math.max(8, m.x - w) + 'px';
  el.style.top = (m.y + h > window.innerHeight - 8 ? Math.max(8, m.y - h - 40) : m.y) + 'px';
  el.querySelectorAll('[data-act]').forEach(function(b){ b.onclick = function(){ var f = acts[b.dataset.act]; S.menu = null; renderMenu(); f(); }; });
}

function postOn(d, L){ return (validIso(d.earliestOpen) && d.earliestOpen > L) ? d.earliestOpen : nextDay(L); }

   (invoice Sep 29 + payment Oct 2 under a Sep 30 lock; dates follow the lock) */
function outcomeLines(d, E){
  var L = lockBasis(d); if (!L || E.earliestOpen || E.lockDate) return '';
  var inv = addDays(L, -1), pay = addDays(L, 2);
  if (d.mode === 'soft') {
    var P = postOn(d, L);

      + '<div class="pl-line ex" id="pl-example">Example: invoice ' + fmtMD(inv) + ' + payment ' + fmtMD(pay) + ' → invoice posted ' + fmtMD(P) + ', payment ' + fmtMD(pay) + '.</div>';
  }
  return '<div class="pl-line" id="pl-outcome">If any part of a transaction is dated on or before ' + fmt(L) + ', the whole transaction is canceled. Nothing from it is posted.</div>'
    + '<div class="pl-line ex" id="pl-example">Example: invoice ' + fmtMD(inv) + ' + payment ' + fmtMD(pay) + ' → transaction canceled, nothing posted.</div>';

/* ---------- Transactions ---------- */
function txMatches(t, f){
  if (f.status !== 'All statuses' && ST[t.status][0] !== f.status) return false;
  if (f.reason && !lockCanceled(t)) return false;
  var q = f.q.trim().toLowerCase();
  if (q && (t.info + ' ' + t.type + ' ' + t.amount + ' ' + t.id).toLowerCase().indexOf(q) < 0) return false;
  if (f.integ && t.integ !== f.integ) return false;
  return true;
}

  var f = S.txFilter;
  var rows = TXNS.filter(function(t){ return txMatches(t, f); });

  document.querySelectorAll('[data-rtab]').forEach(function(b){ b.onclick = function(){ S.reconTab[which] = b.dataset.rtab; render(); }; });
  var lp = document.getElementById('lock-period'); if (lp) lp.onclick = function(){ S.plEntry = 'recon'; S.typeTab = 'default'; openSettings(RECON.sep.integ, { lockDate:RECON.sep.end }); };
}

/* ---------- Activity log ---------- */
function screenActivity(){
  var A = S.act, q = A.q.trim().toLowerCase();
  var rows = allLog().filter(function(r){
    var init = r.who === 'System' ? 'System' : r.who === 'Support' ? 'Support' : 'User';
    return (A.type === 'All' || r.type === A.type) && (A.action === 'All' || r.action === A.action)
        && (A.initiator === 'All' || init === A.initiator) && (!q || r.details.toLowerCase().indexOf(q) >= 0);
  });
  function sel(id, label, opts, v){ return '<div><div class="fl">' + label + '</div><select id="' + id + '" aria-label="' + label + '">' + opts.map(function(o){ return '<option' + (o === v ? ' selected' : '') + '>' + o + '</option>'; }).join('') + '</select></div>'; }
  return '<div class="page-header"><div class="page-header-text"><h1 class="page-title">Activity Log</h1>'
    + '<p class="page-subtitle">A log of all key actions and changes in your organization, showing who did what and when. Activity tracking started on Apr 21, 2026.</p></div></div>'
    + '<div class="filters"><div><div class="fl">Date range</div><div class="dr"><input type="date" value="2026-08-01" aria-label="From"><input type="date" value="' + S.today + '" aria-label="To"></div></div>'
    + sel('f-init', 'Initiator type', ['All','User','System','Support'], A.initiator)
    + sel('f-action', 'Action', ['All','Period lock set','Period lock disabled','Entered','Reconnected'], A.action)
    + sel('f-type', 'Type', ['All','Period lock','User management','Integration'], A.type)
    + '<div><div class="fl">Details</div><input type="text" id="f-q" placeholder="Search" aria-label="Details" value="' + esc(A.q) + '"></div>'
    + '<button class="btn btn-outlined" id="f-reset">Reset filters</button></div>'
    + '<div class="table-wrap"><table class="synder-table" id="activity"><thead><tr><th>Timestamp</th><th>Initiator</th><th>Action</th><th>Type</th><th>Details</th></tr></thead><tbody>'
    + (rows.map(function(r){ return '<tr><td>' + tsOf(r.k) + '</td><td>' + r.who + '</td><td>' + r.action + '</td><td>' + r.type + '</td><td style="white-space:normal;padding:8px 12px">' + r.details + '</td></tr>'; }).join('')
       || '<tr><td colspan="5" class="muted" style="text-align:center">No rows</td></tr>')
    + '</tbody></table></div>';
}
function wireActivity(){
  document.getElementById('f-type').onchange = function(){ S.act.type = this.value; render(); };
  document.getElementById('f-action').onchange = function(){ S.act.action = this.value; render(); };
  document.getElementById('f-init').onchange = function(){ S.act.initiator = this.value; render(); };
  document.getElementById('f-q').oninput = function(){ S.act.q = this.value; var pos = this.selectionStart; render(); var el = document.getElementById('f-q'); el.focus(); el.setSelectionRange(pos, pos); };
  document.getElementById('f-reset').onclick = function(){ S.act = { type:'All', action:'All', initiator:'All', q:'' }; render(); };
}

/* ---------- Summaries (SM): sync to accounting is out of the lock's scope ---------- */
function sumStatus(s){ return s.status === 'adj' ? '<a class="status status-green" href="#summary-detail?id=' + s.id + '" data-status>Synced adjustment</a>' : stChip(s.status); }
function screenSummaries(){
  var tabs = ['All','Synced to your books','Partially synced','Failed','Rollback failed','Ready to sync','Rolled back'];
  var sf = S.sumFilter;
  var list = SUMS.filter(function(s){
    if (sf.integ && s.integ !== sf.integ) return false;
    if (S.sumTab === 'All') return true;
    if (S.sumTab === 'Synced to your books') return s.status === 'synced' || s.status === 'adj';
    return false;
  });
  var body = list.map(function(s){
    return '<tr data-sum="' + s.id + '"><td class="col-check"><label class="synder-checkbox"><input type="checkbox" aria-label="Select ' + s.range + '"></label></td>'
      + '<td><a class="text-link" href="#summary-detail?id=' + s.id + '">' + s.range + '</a></td><td>' + integCell(s.integ) + '</td><td>' + s.amount + '</td>'
      + '<td><span class="status status-green">Fully fetched</span></td><td><span class="chips">' + sumStatus(s) + '</span></td>'
      + '<td><span class="chips"><span class="text-link">See in books ↗</span><button class="btn-icon" data-menu-btn data-sum-menu="' + s.id + '" aria-label="Actions for ' + s.range + '"><span class="mi">more_horiz</span></button></span></td></tr>';
  }).join('') || '<tr><td colspan="7"><div class="empty-state"><div class="empty-state-title">No summaries</div></div></td></tr>';
  return '<div class="page-header"><div class="page-header-text"><h1 class="page-title">Summaries list</h1><p class="page-subtitle">Last updated today at 16:03</p>'
    + '<p class="page-subtitle">View the list of summarized entries along with their sync status to your books.</p></div>'
    + '<div class="page-header-actions"><button class="btn btn-outlined">Import historical data</button><button class="btn">Generate summary</button></div></div>'
    + '<div class="filters"><div><div class="fl">Search</div><input type="text" placeholder="Search by amount or IDs" aria-label="Search"></div><div><div class="fl">Date range</div><select aria-label="Date range"><option>Custom</option></select></div>'
    + '<div><div class="fl">Integration</div><select id="sum-integ" aria-label="Integration"><option value="">All</option>' + Object.keys(INTEG).map(function(k){ return '<option value="' + k + '"' + (sf.integ === k ? ' selected' : '') + '>' + INTEG[k].name + '</option>'; }).join('') + '</select></div><div><div class="fl">Completeness</div><select aria-label="Completeness"><option>All</option></select></div>'
    + '<div><div class="fl">Sync status</div><select aria-label="Sync status"><option>All</option></select></div><button class="btn">Apply</button><button class="btn btn-outlined">Reset filters</button></div>'
    + '<div class="tabs" role="tablist">' + tabs.map(function(t){ return '<button class="tab' + (S.sumTab === t ? ' active' : '') + '" role="tab" data-stab="' + t + '">' + t + '</button>'; }).join('') + '</div>'
    + '<div class="table-wrap"><table class="synder-table" id="sum-table"><thead><tr><th class="col-check"></th><th>Date / Payout ID</th><th>Integration</th><th>Amount</th><th>Completeness status</th><th>Sync status</th><th>Actions</th></tr></thead><tbody>'
    + body + '</tbody></table></div>';
}
function wireSummaries(){
  document.querySelectorAll('[data-stab]').forEach(function(b){ b.onclick = function(){ S.sumTab = b.dataset.stab; render(); }; });
  document.querySelectorAll('[data-sum-menu]').forEach(function(b){ b.onclick = function(e){ e.stopPropagation(); openMenu('sum', b.dataset.sumMenu, b); }; });
  function clean(){ if (S.hash !== 'summaries') { history.replaceState(null, '', '#summaries'); S.hash = 'summaries'; } }
  document.getElementById('sum-integ').onchange = function(){ S.sumFilter.integ = this.value || null; clean(); render(); };
}
function screenSummaryDetail(){
  var s = sum(param(S.hash, 'id') || 'oct1') || sum('oct1'), busy = s.status === 'rollback' || s.status === 'inprogress';
  var actions = (busy ? '' : '<button class="btn btn-outlined" id="sd-rollback">Rollback</button><button class="btn btn-outlined" id="sd-resync">Resync</button>')
    + (s.syncInfoId ? '<a class="btn btn-outlined" href="#sync-info?id=' + s.syncInfoId + '">Show sync info</a>' : '') + '<button class="btn btn-outlined">See in books ↗</button>';
  var lines = s.lines.map(function(l){ return '<tr' + (l[3] ? ' data-adj' : '') + '><td>' + (l[3] ? '<b style="font-weight:500">' + l[0] + '</b>' : l[0]) + '</td><td class="num">' + (l[1] || '—') + '</td><td class="num">' + (l[2] || '—') + '</td></tr>'; }).join('');
  return '<div class="narrow"><a class="back-btn" href="#summaries" style="text-decoration:none"><span class="mi">chevron_left</span>Summaries list</a>'
    + '<div class="sum-head"><div><h1 class="page-title">Summary</h1><div style="font-size:16px;font-weight:500;margin-top:4px">' + s.range + '</div>'
    + '<div class="chips" style="margin-top:8px">' + integCell(s.integ) + '<span class="status status-green">Fully fetched</span>' + sumStatus(s) + '</div></div>'
    + '<div style="text-align:right"><div class="muted">Amount</div><div class="amount-big">' + s.amount + '</div></div></div>'
    + '<div class="sum-actions">' + actions + '</div>'
    + '<h2 style="font-size:16px;font-weight:500;margin-bottom:8px">Summary lines</h2>'
    + '<div class="table-wrap"><table class="synder-table" id="sum-lines"><thead><tr><th>Line</th><th class="num">Debit</th><th class="num">Credit</th></tr></thead><tbody>' + lines + '</tbody></table></div></div>';
}
function wireSummaryDetail(){
  var id = param(S.hash, 'id') || 'oct1';
  var rb = document.getElementById('sd-rollback'); if (rb) rb.onclick = function(){ rollbackSum(id); };
  var rs = document.getElementById('sd-resync'); if (rs) rs.onclick = function(){ resyncSum(id); };
}

/* ---------- Products and services (SM) — COGS cost updates obey the lock as a hard lock ---------- */
function screenProducts(){
  var body = PRODUCTS.map(function(p){
    return '<tr class="row-clickable" data-product="' + p.id + '"><td class="col-check"><label class="synder-checkbox"><input type="checkbox" aria-label="Select ' + esc(p.name) + '"></label></td>'
      + '<td>' + esc(p.name) + '</td><td>' + esc(p.sku) + '</td><td></td><td>' + integCell(p.integ) + '</td>'
      + '<td class="num">$' + p.price + ' USD</td><td class="num" data-cost>$' + p.cost + ' USD</td><td><span class="status status-grey">Unverified</span></td>'
      + '<td><button class="btn-icon" data-pedit="' + p.id + '" aria-label="Edit ' + esc(p.name) + '"><span class="mi">edit</span></button></td></tr>';
  }).join('');
  return '<div class="page-header"><div class="page-header-text"><h1 class="page-title">Products and services</h1></div>'
    + '<div class="page-header-actions"><button class="btn btn-outlined">Export CSV</button><button class="btn">Import</button><button class="btn">Add product</button></div></div>'
    + '<div class="info-line"><span class="mi">info</span>COGS for summaries will be calculated according to the costs of the products specified in the list below. If you want to apply costs to existing summaries use the Import option.</div>'
    + '<div class="filters"><div><div class="fl">Search</div><input type="text" placeholder="Search by name or SKU" aria-label="Search"></div>'
    + '<div><div class="fl">Product category</div><select aria-label="Product category"><option>All</option></select></div><div><div class="fl">Imported from</div><select aria-label="Imported from"><option>All</option></select></div>'
    + '<div><div class="fl">Verification status</div><select aria-label="Verification status"><option>All</option></select></div><button class="btn">Apply</button><button class="btn btn-outlined">Reset filters</button></div>'
    + '<div class="table-wrap"><table class="synder-table" id="products"><thead><tr><th class="col-check"></th><th>Name</th><th>SKU</th><th>Product category</th><th>Imported from</th><th class="num">Sales price</th><th class="num">Cost</th><th>Verification status</th><th></th></tr></thead><tbody>'
    + body + '</tbody></table></div>';
}
function wireProducts(){
  document.querySelectorAll('tr[data-product]').forEach(function(tr){ tr.onclick = function(e){ if (e.target.closest('label, input')) return; S.productDraft = null; nav('product-edit?id=' + tr.dataset.product); }; });
}
function money(v){ var n = parseFloat(String(v).replace(/[^0-9.]/g, '')); return isNaN(n) ? '0.00' : n.toFixed(2); }
function screenProductEdit(){
  var id = param(S.hash, 'id'), p = product(id) || PRODUCTS[0];
  if (!S.productDraft || S.productDraft.id !== p.id) S.productDraft = Object.assign({}, p);
  var d = S.productDraft, lt = lockThrough(d.integ);
  var prices = d.tracked ? '<div class="pe-prices"><div><label for="pe-price">Sales price</label><input type="text" id="pe-price" value="' + esc(d.price) + '"></div>'
      + '<div><label for="pe-cost">Purchase cost</label><input type="text" id="pe-cost" value="' + esc(d.cost) + '">'
      + (lt ? '<div class="pe-note" id="pe-lock-note">Period lock: records through ' + fmt(lt) + ' keep the current cost.</div>' : '') + '</div></div>' : '';
  return '<div class="pe-bar"><a class="btn-icon" href="#products" aria-label="Close"><span class="mi">close</span></a><h1 class="t">Update product or service</h1><button class="btn" id="pe-save">Save changes</button></div>'
    + '<div class="pe-form"><h2>Product/service details</h2><div class="pe-grid">'
    + '<div><label for="pe-name">Name *</label><input type="text" id="pe-name" value="' + esc(d.name) + '"></div>'
    + '<div><label for="pe-sku">SKU</label><input type="text" id="pe-sku" placeholder="Enter SKU" value="' + esc(d.sku) + '"></div>'
    + '<div><label for="pe-cat">Product category</label><select id="pe-cat"><option>Select category</option></select></div>'
    + '<div><label>Verification status</label><span class="status status-grey">Unverified</span></div></div>'
    + '<h2 style="margin-top:32px">Prices and storage</h2>'
    + '<label class="pe-track"><input type="checkbox" class="switch" id="pe-tracked"' + (d.tracked ? ' checked' : '') + '>I track this item</label>'
    + prices + '</div>';
}
function wireProductEdit(){
  var d = S.productDraft;
  function on(id, f){ var el = document.getElementById(id); if (el) el.oninput = f; }
  on('pe-name', function(){ d.name = this.value; }); on('pe-sku', function(){ d.sku = this.value; });
  on('pe-price', function(){ d.price = this.value; }); on('pe-cost', function(){ d.cost = this.value; });
  document.getElementById('pe-tracked').onchange = function(){ d.tracked = this.checked; render(); };
  document.getElementById('pe-save').onclick = function(){
    var p = product(d.id), lt = lockThrough(d.integ);
    d.price = money(d.price); d.cost = money(d.cost);
    var costChanged = p.cost !== d.cost;
    Object.assign(p, d); S.productDraft = null;
    toast('ok', (costChanged && lt) ? 'Records through ' + fmt(lt) + ' were not updated because the period is locked.' : 'Success! Product has been updated successfully!');
    nav('products');
  };
}

/* ---------- render ---------- */
var rendering = false, renderAgain = false;
function render(){
  if (rendering) { renderAgain = true; return; }
  rendering = true;
  try { doRender(); } finally { rendering = false; }
  if (renderAgain) { renderAgain = false; render(); }
}
var KNOWN = ['transactions','sync-info','dashboard','recon','recon-result-sep','recon-result-oct','activity','summaries','summary-detail','products','product-edit'];
function doRender(){
  var h = curHash();
  /* each variant has one home for the lock: map the other variant's routes (old links, ?v= switch) */
  var mh = mapHash(h, S.v), r = routeOf(mh);
  if (S.v === 2 && pageInteg(r) && !INTEG[pageInteg(r)]) { mh = PL_LIST + '/stripe'; r = mh; }
  /* one integration: the list is skipped */
  if (S.v === 2 && r === PL_LIST && orgIntegs().length === 1) { mh = PL_LIST + '/' + orgIntegs()[0]; r = mh; }
  if (KNOWN.indexOf(r) < 0 && !isSettings(r) && !(S.v === 2 && isPlArea(r))) { mh = defaultHash(); r = routeOf(mh); }
  if (mh !== h) { history.replaceState(null, '', '#' + mh); h = mh; }
  if (isLockForm(S.route) && !isLockForm(r)) S.draft = null;
  var entering = h !== S.hash, prevRoute = S.route;
  S.hash = h; S.route = r;
  if (entering && h.indexOf('?') > 0) {
    var pi = param(h, 'integ');
    if (r === 'activity') S.act = { type:param(h, 'type') || 'All', action:'All', initiator:'All', q:INTEG[pi] ? INTEG[pi].name : '' };
  }
  if (r === 'summaries' || r === 'summary-detail' || r === 'products' || r === 'product-edit') S.org = 'sm';
  if (r === 'transactions') S.org = 'pt';
  if (r === 'sync-info') S.org = param(h, 'id') === 'sum_oct1' ? 'sm' : 'pt';
  if (r !== 'product-edit') S.productDraft = null;
  if (isSettings(r)) {
    var id = param(h, 'integ') || S.selected;
    if (!INTEG[id]) { id = 'stripe'; h = setHash(setSlug(r), id); history.replaceState(null, '', '#' + h); S.hash = h; }
    S.selected = id;
    if (r === PL_ROUTE && (!S.draft || S.draft.id !== id)) S.draft = makeDraft(id);
  }
  if (pageInteg(r)) {
    S.selected = pageInteg(r);
    if (!S.draft || S.draft.id !== S.selected) S.draft = makeDraft(S.selected);
  }
  /* PeriodLockVisited: entry from the nav (v1 Settings Period lock tab, v2 sidebar item) or the recon promote */
  if (isPlArea(r) && !isPlArea(prevRoute) && S.plEntry) mpTrack('PeriodLockVisited', []);
  if (isPlArea(r) || entering) S.plEntry = null;
  renderShell();
  var el = document.getElementById('screen'), html = '', wire = null;
  if (isSettings(r)) { html = screenSettings(); wire = wireSettings; }
  else if (r === PL_LIST) { html = screenPlList(); wire = wirePlList; }
  else if (pageInteg(r)) { html = screenPlPage(); wire = wireSettings; }
  switch (r) {
    case 'transactions': html = screenTransactions(); wire = wireTransactions; break;
    case 'sync-info': html = screenSyncInfo(); wire = wireSyncInfo; break;
    case 'dashboard': html = screenDashboard(); wire = wireDashboard; break;
    case 'recon': html = screenRecon(); break;
    case 'recon-result-sep': html = screenReconSep(); wire = wireRecon; break;
    case 'recon-result-oct': html = screenReconOct(); wire = wireRecon; break;
    case 'activity': html = screenActivity(); wire = wireActivity; break;
    case 'summaries': html = screenSummaries(); wire = wireSummaries; break;
    case 'summary-detail': html = screenSummaryDetail(); wire = wireSummaryDetail; break;
    case 'products': html = screenProducts(); wire = wireProducts; break;
    case 'product-edit': html = screenProductEdit(); wire = wireProductEdit; break;
  }
  el.innerHTML = html;
  if (wire) wire();
  document.querySelectorAll('#screen [data-pl-link]').forEach(function(a){ a.onclick = function(e){ e.preventDefault(); e.stopPropagation(); openSettings(a.dataset.plLink); }; });
  if (S.menu && S.menu.kind !== 'actions') renderMenu();
  renderBar();
}

/* ---------- demo bar ---------- */
var VS_NOTE = {
  1: 'Last section of integration Settings',
  2: 'Sidebar page; 1 integration skips the list'
};
function renderBar(){
  [1, 2].forEach(function(n){ var b = document.getElementById('vs-' + n); b.classList.toggle('on', S.v === n); b.setAttribute('aria-pressed', String(S.v === n)); });
  var note = document.getElementById('vs-note'); note.textContent = VS_NOTE[S.v]; note.title = VS_NOTE[S.v];
  document.getElementById('demo-today').value = S.today;
  document.getElementById('mp-toggle').checked = S.mp;
}
/* switches in place: same page, ?v=2 in the URL, current route mapped to its equivalent; saved locks and the draft are kept */
function setVariant(n){
  if (n === S.v) return;
  closeFloating();
  var h = mapHash(curHash(), n);
  S.v = n;
  history.replaceState(null, '', location.pathname + (n === 2 ? '?v=2' : '') + '#' + h);
  render();
}
function setToday(v){
  var wasClean = S.draft && !isDirty();
  S.today = v;
  if (S.draft) { if (wasClean) S.draft = makeDraft(S.draft.id); else follow(S.draft); }
  render();
}
document.getElementById('demo-today').onchange = function(){ if (validIso(this.value)) setToday(this.value); };
document.getElementById('demo-reset').onclick = function(){ setToday(TODAY_DEFAULT); };
document.getElementById('mp-toggle').onchange = function(){ S.mp = this.checked; if (!S.mp) document.getElementById('mp-stack').innerHTML = ''; };
if (!location.hash) history.replaceState(null, '', location.pathname + location.search + '#' + defaultHash());
render();
</script>
</body>
