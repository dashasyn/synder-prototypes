<script>
/* Copy provenance
   captured   shell (sidebar PT_3 items, top bar, sync details labels + Sync log paragraph, error-toast layout)
              from projects/stripe-invoice-date; statuses "Rollback in progress"/"In progress" from the live

   teammate   screens, mock data and copy from reports/period-lock-review/prototype.html (MVP v2 · 2026-10-05).
   proposed   lock copy decided for this version (preview, modals, errors, outcome chips, toasts).
   uncaptured shown as [live copy not captured]. */
var MARK = '[live copy not captured]';
var TODAY_DEFAULT = '2026-10-06';

var INTEG = {
  stripe:  { id:'stripe',  name:'Stripe Test (sandbox)', src:'Stripe',  logo:'S',  color:'#635BFF', tz:'Europe/Belgrade' },
  shopify: { id:'shopify', name:'Changolivia (Shopify)', src:'Shopify', logo:'C',  color:'#96BF48', tz:'Europe/Belgrade' },
  paypal:  { id:'paypal',  name:'PayPal (sandbox)',      src:'PayPal',  logo:'P',  color:'#003087', tz:'Europe/Belgrade' },
  square:  { id:'square',  name:'Square Test',           src:'Square',  logo:'Sq', color:'#1A1B24', tz:'Europe/Belgrade' }
};

var S = {
  org: 'pt', route: 'period-lock', hash: 'period-lock',
  today: TODAY_DEFAULT,
  saved: {
    stripe:  { on:true,  mode:'soft', schedule:'fixed',     lockDate:'2026-09-30', earliestOpen:'2026-10-01', recurringDay:5 },
    shopify: { on:true,  mode:'hard', schedule:'recurring', lockDate:'2026-09-30', earliestOpen:'2026-10-01', recurringDay:5 },
    paypal:  { on:false, mode:'soft', schedule:'fixed',     lockDate:'2026-09-30', earliestOpen:'2026-10-01', recurringDay:5 },
    square:  { on:true,  mode:'soft', schedule:'fixed',     lockDate:'2026-08-31', earliestOpen:'2026-09-01', recurringDay:5 }
  },

  selected: 'stripe',
  draft: null,
  modal: null, menu: null, orgMenu: false, userMenu: false,

  txFilter: { status:'All statuses', q:'' },
  bulk: { from:'2026-09-15', to:'2026-10-05' },
  act: { type:'All', action:'All', initiator:'All', q:'' },
  activityExtra: [],
  logOpen: {},
  dashTab: 'sync-issues',
  reconTab: { sep:'matched', oct:'missing' },
  sumTab: 'All'
};

/* ---------- dates ---------- */
var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function pd(iso){ var p = iso.split('-').map(Number); return { y:p[0], m:p[1], d:p[2] }; }
function isoOf(t){ return t.toISOString().slice(0,10); }
function addDays(iso, n){ var p = pd(iso); return isoOf(new Date(Date.UTC(p.y, p.m-1, p.d+n))); }
function nextDay(iso){ return addDays(iso, 1); }
function lastOfNextMonth(iso){ var p = pd(iso); return isoOf(new Date(Date.UTC(p.y, p.m+1, 0))); }
function fmt(iso){ if(!iso) return ''; var p = pd(iso); return MON[p.m-1] + ' ' + p.d + ', ' + p.y; }
function fmtMD(iso){ var p = pd(iso); return MON[p.m-1] + ' ' + p.d; }
function range(a, b){ return pd(a).y === pd(b).y ? fmtMD(a) + ' – ' + fmt(b) : fmt(a) + ' – ' + fmt(b); }
function validIso(v){ return /^\d{4}-\d{2}-\d{2}$/.test(v || ''); }
function maxIso(a, b){ return !a ? b : (!b ? a : (a > b ? a : b)); }

/* recurring: run on day N each month, lock through the end of the month before the run */
function lockFromRun(run){ var p = pd(run); return isoOf(new Date(Date.UTC(p.y, p.m-1, 0))); }
function lastRun(today, day){ var t = pd(today);
  return t.d >= day ? isoOf(new Date(Date.UTC(t.y, t.m-1, day))) : isoOf(new Date(Date.UTC(t.y, t.m-2, day))); }
function nextRun(today, day){ var t = pd(today);
  return t.d < day ? isoOf(new Date(Date.UTC(t.y, t.m-1, day))) : isoOf(new Date(Date.UTC(t.y, t.m, day))); }
function addMonth(iso){ var p = pd(iso); return isoOf(new Date(Date.UTC(p.y, p.m, p.d))); }
function computedRecurring(day){ return lockFromRun(lastRun(S.today, day)); }
function nextMovingRun(curLock, day){
  var r = nextRun(S.today, day);
  for (var i = 0; i < 48; i++){ if (lockFromRun(r) > curLock) return r; r = addMonth(r); }
  return r;
}

/* ---------- single source of truth: SAVED config ---------- */
function lockThrough(id){
  var c = S.saved[id]; if (!c || !c.on) return null;
  return c.schedule === 'recurring' ? maxIso(c.lockDate, computedRecurring(c.recurringDay)) : c.lockDate;
}
function earliestOpenEff(id){
  var c = S.saved[id], lt = lockThrough(id);
  if (!lt) return c.earliestOpen;
  return lt > c.lockDate ? nextDay(lt) : c.earliestOpen;
}
function isLocked(id, iso){ var lt = lockThrough(id); return !!lt && iso <= lt; }
function lockMsg(id){ return INTEG[id].name + ' is locked through ' + fmt(lockThrough(id)) + '.'; }
function modeName(m){ return m === 'soft' ? 'Soft lock' : 'Hard lock'; }

/* ---------- mock data (teammate's, plus two Sep rows taken from the teammate's Sep 1–30 reconciliation) ---------- */
var TXNS = [
  { id:'po_1U9E', info:'po_1U9E2I7QSI16uhjVmN5b1ly2', type:'Payout', amount:'304.02 USD', date:'2026-10-04', time:'00:00', status:'synced', integ:'stripe' },
  { id:'buddy_ch', info:'Buddy QA Customer', type:'Invoice payment', amount:'128.00 USD', date:'2026-10-03', time:'14:22', status:'synced', integ:'stripe' },
  { id:'re_3P8mXy9kL2', info:'Refund · re_3P8mXy9kL2', type:'Refund', amount:'-42.50 USD', date:'2026-10-01', time:'00:00', status:'synced-warn', integ:'stripe', redated:['2026-09-29','2026-10-01'] },
  { id:'je_rr_104', info:'RevRec JE · Deferred → Revenue', type:'Journal entry', amount:'480.00 USD', date:'2026-10-01', time:'00:00', status:'synced-warn', integ:'stripe', redated:['2026-09-30','2026-10-01'] },
  { id:'order_2108', info:'Changolivia · Order #2108', type:'Order', amount:'86.40 USD', date:'2026-09-30', time:'18:05', status:'canceled', integ:'shopify', blocked:{ part:'fee', verb:'is dated' } },
  { id:'pay_2088', info:'Payment · py_3QxPayment2088', type:'Payment', amount:'64.00 USD', date:'2026-09-30', time:'14:12', status:'canceled', integ:'stripe', blocked:{ part:'payment', verb:'is dated' } },
  { id:'inv_2099', info:'Invoice · in_1QxInvoice2099', type:'Invoice', amount:'210.00 USD', date:'2026-09-29', time:'09:00', status:'canceled', integ:'stripe', blocked:{ part:'invoice date', verb:'is' } },
  { id:'order_1043', info:'Changolivia · Order #1043', type:'Order', amount:'72.00 USD', date:'2026-09-28', time:'10:02', status:'synced-warn', integ:'shopify', sourceEdited:'2026-10-02' },
  { id:'ch_3Q8k', info:'Payment · ch_3Q8kWp2Lm', type:'Payment', amount:'128.00 USD', date:'2026-09-28', time:'09:40', status:'synced', integ:'stripe' },
  { id:'po_1U8V', info:'po_1U8V3Kq7QSl16uhjVxR2a', type:'Payout', amount:'161.26 USD', date:'2026-09-15', time:'00:00', status:'synced', integ:'stripe' }
];
function txn(id){ for (var i = 0; i < TXNS.length; i++) if (TXNS[i].id === id) return TXNS[i]; return null; }

var QB = '<span class="text-link" style="text-decoration:none">Show in <span class="qb">qb</span></span>';
var SI = {
  po_1U9E:      { syncId:'812700', start:'Oct 4, 2026 00:05', srcId:'po_1U9E2I7QSI16uhjVmN5b1ly2', logs:[{ type:'Transfer', info:'po_1U9E…', msg:'Transfer was created.' }] },

/* ---------- draft (settings form) ---------- */
function savedView(id){
  var c = S.saved[id];
  return { on:c.on, mode:c.mode, schedule:c.schedule, lockDate:(lockThrough(id) || c.lockDate),
           earliestOpen:earliestOpenEff(id), recurringDay:String(c.recurringDay) };
}
var DFIELDS = ['on','mode','schedule','lockDate','earliestOpen','recurringDay'];
function makeDraft(id){ var d = savedView(id); d.id = id; d._basis = lockBasis(d); return d; }
function isDirty(){
  if (!S.draft) return false;
  var v = savedView(S.draft.id), d = S.draft;
  if (!d.on && !v.on) return false;
  return DFIELDS.some(function(k){
    if (k === 'lockDate' && d.schedule === 'recurring' && v.schedule === 'recurring') return false;
    if (k === 'earliestOpen' && d.mode !== 'soft' && v.mode !== 'soft') return false;
    if (k === 'recurringDay' && d.schedule !== 'recurring' && v.schedule !== 'recurring') return false;
    return String(d[k]) !== String(v[k]);
  });
}
function dayValid(v){ return /^\d+$/.test(String(v).trim()) && +v >= 1 && +v <= 28; }
function lockBasis(d){
  if (d.schedule === 'fixed') return (validIso(d.lockDate) && d.lockDate <= S.today) ? d.lockDate : null;
  if (!dayValid(d.recurringDay)) return null;
  var cur = S.saved[d.id].on ? lockThrough(d.id) : null;
  return maxIso(cur, computedRecurring(+d.recurringDay));
}
function errors(d){
  var e = {};
  if (!d.on) return e;
  if (d.schedule === 'fixed') {
    if (!validIso(d.lockDate)) e.lockDate = 'Required';
    else if (d.lockDate > S.today) e.lockDate = "Can't lock a future date";
  } else if (!dayValid(d.recurringDay)) e.recurringDay = 'Enter a day from 1 to 28';
  var b = lockBasis(d);
  if (d.mode === 'soft' && b) {
    var mn = nextDay(b), mx = lastOfNextMonth(b);
    if (!validIso(d.earliestOpen)) e.earliestOpen = 'Required';
    else if (d.earliestOpen < mn || d.earliestOpen > mx) e.earliestOpen = 'Pick a date from ' + (pd(mn).y === pd(mx).y ? fmtMD(mn) + ' to ' + fmt(mx) : fmt(mn) + ' to ' + fmt(mx));
  }
  return e;
}
function setDraft(k, v){
  var d = S.draft; d[k] = v;
  var b = lockBasis(d);
  if (b && b !== d._basis) { d.earliestOpen = nextDay(b); d._basis = b; }
  render();
}
function applyPrefill(p){
  var d = S.draft; d.on = true; d.schedule = 'fixed'; d.lockDate = p.lockDate;
  var b = lockBasis(d); if (b && b !== d._basis) { d.earliestOpen = nextDay(b); d._basis = b; }
}

/* save: the lock never moves backwards silently */
function plan(){
  var d = S.draft, id = d.id, c = S.saved[id], cur = c.on ? lockThrough(id) : null;
  if (!d.on) return { off:true, cur:cur };
  var newLock = d.schedule === 'fixed' ? d.lockDate : maxIso(cur, computedRecurring(+d.recurringDay));
  return { off:false, cur:cur, newLock:newLock, earlier: !!cur && newLock < cur };
}
function attemptSave(after){
  if (!isDirty() || Object.keys(errors(S.draft)).length) return;
  var p = plan(), name = INTEG[S.draft.id].name;
  if (p.off && p.cur) {
    S.modal = { kind:'confirm', title:'Turn off period lock for ' + name + '?', body:'Everything through ' + fmt(p.cur) + ' opens for syncs.',
                ok:'Turn off', danger:true, onOk:function(){ applySave(p); if (after) after(); } };
    renderModal(); return;
  }
  if (p.earlier) {
    S.modal = { kind:'confirm', title:'Unlock ' + range(nextDay(p.newLock), p.cur) + '?', body:name + ' will sync into these dates again.',
                ok:'Unlock', danger:true, onOk:function(){ applySave(p); if (after) after(); } };
    renderModal(); return;
  }
  applySave(p); if (after) after();
}
function applySave(p){
  var d = S.draft, id = d.id, c = S.saved[id];
  if (p.off) { c.on = false; }
  else {
    c.on = true; c.mode = d.mode; c.schedule = d.schedule; c.lockDate = p.newLock; c.recurringDay = +d.recurringDay || c.recurringDay;
    c.earliestOpen = d.mode === 'soft' ? d.earliestOpen : nextDay(p.newLock);
  }
  S.lockAdded[id] = fmt(S.today);

                 + (c.mode === 'soft' ? ', Move late transactions to ' + fmt(c.earliestOpen) : '');
  S.activityExtra.unshift({ ts:ts, who:'Viacheslav Tarabarov', action:c.on ? 'Period lock set' : 'Period lock disabled', type:'Period lock', details:det });

var rendering = false, renderAgain = false;
function render(){
  if (rendering) { renderAgain = true; return; }
  rendering = true;
  try { doRender(); } finally { rendering = false; }
  if (renderAgain) { renderAgain = false; render(); }
}
function doRender(){
  var h = curHash(), r = routeOf(h);
  var known = ['period-lock','period-lock-settings','transactions','sync-info','dashboard','recon','recon-result-sep','recon-result-oct','activity','summaries','summary-detail'];
  if (known.indexOf(r) < 0) { history.replaceState(null, '', '#period-lock'); h = 'period-lock'; r = 'period-lock'; }
  if (S.route === 'period-lock-settings' && r !== 'period-lock-settings') S.draft = null;
  S.hash = h; S.route = r;
  if (r === 'summaries' || r === 'summary-detail') S.org = 'sm';
  if (r === 'transactions') S.org = 'pt';
  if (r === 'sync-info') S.org = param(h, 'id') === 'sum_oct1' ? 'sm' : 'pt';
  if (r === 'period-lock-settings') {
    var id = param(h, 'integ') || S.selected;
    if (!INTEG[id]) id = 'stripe';
    S.selected = id;
    if (!S.draft || S.draft.id !== id) S.draft = makeDraft(id);
  }
  renderShell();
  var el = document.getElementById('screen'), html = '', wire = null;
  switch (r) {
    case 'period-lock': html = screenList(); wire = wireList; break;
    case 'period-lock-settings': html = screenSettings(); wire = wireSettings; break;
    case 'transactions': html = screenTransactions(); wire = wireTransactions; break;
    case 'sync-info': html = screenSyncInfo(); wire = wireSyncInfo; break;
    case 'dashboard': html = screenDashboard(); wire = wireDashboard; break;
    case 'recon': html = screenRecon(); break;
    case 'recon-result-sep': html = screenReconSep(); wire = wireRecon; break;
    case 'recon-result-oct': html = screenReconOct(); wire = wireRecon; break;
    case 'activity': html = screenActivity(); wire = wireActivity; break;
    case 'summaries': html = screenSummaries(); wire = wireSummaries; break;
    case 'summary-detail': html = screenSummaryDetail(); wire = wireSummaryDetail; break;
  }
  el.innerHTML = html;
  if (wire) wire();
  document.querySelectorAll('#screen [data-pl-link]').forEach(function(a){ a.onclick = function(e){ e.preventDefault(); e.stopPropagation(); openSettings(a.dataset.plLink); }; });
  if (S.menu && S.menu.kind !== 'actions') renderMenu();
  document.getElementById('demo-today').value = S.today;
}

function setToday(v){
  var wasClean = S.draft && !isDirty();
  S.today = v;
  if (S.draft) {
    if (wasClean) S.draft = makeDraft(S.draft.id);
    else { var b = lockBasis(S.draft); if (b && b !== S.draft._basis) { S.draft.earliestOpen = nextDay(b); S.draft._basis = b; } }
  }
  render();
}
document.getElementById('demo-today').onchange = function(){ if (validIso(this.value)) setToday(this.value); };
document.getElementById('demo-reset').onclick = function(){ setToday(TODAY_DEFAULT); };
if (!location.hash) history.replaceState(null, '', '#period-lock');
render();
</script>
