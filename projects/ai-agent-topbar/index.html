<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Top bar — Connect AI assistant button</title>
<link rel="stylesheet" href="../../ui-kit/synder-ui-kit.css">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
/* Live top bar (Ignat's screenshot 2026-10-28) + the new "Connect AI assistant" button as the first item.
   The button is a dummy: no action. Logos are simplified drawings, not official brand assets. */
body{margin:0;min-height:100vh;background:var(--color-white);font-family:var(--font-family);font-size:14px;color:var(--text-primary)}
.topbar-x{height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:flex-end;gap:16px;
  padding:0 24px;border-bottom:1px solid var(--border-default)}
/* live top bar (Ignat's screenshot 2026-10-28): Balance with blue underline, How it works?, blue bell, ? and user with chevrons */
.topbar-x{gap:24px}
.tb-bal{display:inline-flex;align-items:baseline;gap:6px;padding:6px 0;border-bottom:3px solid #3B82F6;border-radius:2px;
  text-decoration:none;font-size:16px}
.tb-bal .lbl{color:#6B778C}
.tb-bal .num{color:#1E73E8;font-weight:500;font-size:18px}
.tb-link{color:#1E73E8;text-decoration:none;font-size:16px}
.tb-link:hover{text-decoration:underline}
.tb-ic{color:#1E73E8;font-size:26px;cursor:pointer}
.tb-help{font-size:28px}
.tb-dd{display:inline-flex;align-items:center;gap:2px;cursor:pointer}
.tb-chev{color:#1E73E8;font-size:20px}
/* AI agents entry — dummy button (Ignat, 2026-10-27): text + logos of popular tools, no action */
.ai-btn{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px 0 6px;border:1px solid var(--border-default);
  border-radius:16px;background:var(--color-white);font-family:inherit;font-size:14px;color:var(--text-primary);cursor:pointer}
.ai-btn:hover{border-color:var(--color-primary);background:var(--color-primary-5)}
.ai-btn:focus-visible{outline:2px solid var(--border-focus);outline-offset:2px}
.ai-logos{display:flex}
.ai-logos svg{width:22px;height:22px;border-radius:50%;border:2px solid var(--color-white);box-sizing:content-box;display:block}
.ai-logos svg + svg{margin-left:-7px}
.tb-bal,.tb-link{cursor:pointer}
</style>
</head>
<body>
<header class="topbar-x">
      <button type="button" class="ai-btn" id="ai-btn" aria-label="Connect AI assistant: Claude, ChatGPT, Cursor and others">
        <span class="ai-logos" aria-hidden="true">
          <!-- Claude: orange burst -->
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#F4E9E1"/><g stroke="#D97757" stroke-width="2.2" stroke-linecap="round">
            <path d="M12 4.5v15M4.5 12h15M6.7 6.7l10.6 10.6M17.3 6.7L6.7 17.3M8.2 5.2l7.6 13.6M15.8 5.2L8.2 18.8"/></g></svg>
          <!-- ChatGPT: black disc, knot -->
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#111"/><g fill="none" stroke="#fff" stroke-width="1.6">
            <ellipse cx="12" cy="12" rx="6.5" ry="3.2"/><ellipse cx="12" cy="12" rx="6.5" ry="3.2" transform="rotate(60 12 12)"/>
            <ellipse cx="12" cy="12" rx="6.5" ry="3.2" transform="rotate(120 12 12)"/></g></svg>
          <!-- Cursor: dark disc, cube -->
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#2B2B2B"/><g fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="round">
            <path d="M12 5.5l6 3.5v6l-6 3.5-6-3.5V9z"/><path d="M6 9l6 3.5 6-3.5M12 12.5v6"/></g></svg>
        </span>
        Connect AI assistant
      </button>
      <a class="tb-bal" href="#"><span class="lbl">Balance :</span> <span class="num">1000</span></a>
      <a class="tb-link" href="#">How it works?</a>
      <span class="material-icons tb-ic tb-bell">notifications</span>
      <span class="tb-dd"><span class="material-icons tb-ic tb-help">help_outline</span><span class="material-icons tb-chev">expand_more</span></span>
      <span class="tb-dd"><span class="material-icons tb-ic">person</span><span class="material-icons tb-chev">expand_more</span></span></header>
</body>
</html>
