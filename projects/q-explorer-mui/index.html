<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q-Explorer — real React + MUI</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  html, body, #root { height: 100%; margin: 0; }
  /* Deliberately almost empty. Everything below is MUI's own output --
     that is the point of the spike. The only rules here are for the
     variant-switcher bar, which is not product chrome. */
  .spike-bar {
    display: flex; align-items: center; gap: 12px;
    height: 36px; box-sizing: border-box; padding: 0 20px;
    background: #141D36; color: #fff; font: 400 13px Roboto, sans-serif;
  }
  .spike-bar b { font-weight: 500; font-size: 12px; text-transform: uppercase; opacity: .75; }
  .spike-bar span { opacity: .75; font-size: 12px; }
</style>
</head>
<body>
<div class="spike-bar">
  <b>Spike</b>
  <span>Real React 18 + MUI v5 from CDN. Full port in progress — Evaluations, Scheduled reports and New evaluation are live; report views are still on the vanilla prototype.</span>
</div>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@mui/material@5/umd/material-ui.production.min.js" crossorigin></script>
<script src="https://unpkg.com/htm@3/dist/htm.umd.js" crossorigin></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
