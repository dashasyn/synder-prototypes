<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q-Explorer — real React + MUI</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  html, body, #root { height: 100%; margin: 0; }
  /* Deliberately almost empty. Everything below is MUI's own output --
     that is the point of the spike. The only rules here are for the
     variant-switcher bar, which is not product chrome. */
  .spike-bar {
    display: flex; align-items: center; gap: 12px;
    height: 36px; box-sizing: border-box; padding: 0 20px;
    background: #141D36; color: #fff; font: 400 13px Roboto, sans-serif;
  }
  .spike-bar b { font-weight: 500; font-size: 12px; text-transform: uppercase; opacity: .75; }
  .spike-bar span { opacity: .75; font-size: 12px; }
</style>
</head>
<body>
<div class="spike-bar">
  <b>Spike</b>
  <span>Real React 18 + MUI v5 from CDN — no hand-written component CSS. Same two screens as the vanilla prototype.</span>
</div>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@mui/material@5/umd/material-ui.production.min.js" crossorigin></script>
<script src="https://unpkg.com/htm@3/dist/htm.umd.js" crossorigin></script>
<script>
const { useState, useMemo } = React;
const html = htm.bind(React.createElement);
const M = MaterialUI;
const {
  ThemeProvider, createTheme, CssBaseline, AppBar, Toolbar, Box, Button, IconButton,
  Typography, Menu, MenuItem, Breadcrumbs, Link, Card, CardContent, TextField,
  Table, TableBody, TableCell, TableContainer, TableHead, TableRow, Paper, Chip,
  Stack, Divider, FormControl, InputLabel, Select, InputAdornment, Collapse,
} = M;

const Icon = ({ children, sx }) =>
  html`<span className="material-icons" style=${{ fontSize: 20, ...(sx || {}) }}>${children}</span>`;

/* ── Theme ───────────────────────────────────────────────────────────
   MUI v5 defaults, with exactly the four deviations measured off ETC's
   own product (scripts/sample-etc-screenshots.cjs), plus Ignat's spec:
   everything size="small", buttons without elevation.
   Nothing here is a guess -- each value has a measurement behind it. */
const theme = createTheme({
  palette: {
    primary: { main: '#2196F3', dark: '#1769AA', light: '#64B5F6' },
    background: { default: '#FAFAFA' },
  },
  shape: { borderRadius: 4 },
  components: {
    MuiButton:     { defaultProps: { size: 'small', disableElevation: true } },
    MuiIconButton: { defaultProps: { size: 'small' } },
    MuiTextField:  { defaultProps: { size: 'small', variant: 'filled' } },
    MuiFormControl:{ defaultProps: { size: 'small', variant: 'filled' } },
    MuiTable:      { defaultProps: { size: 'small' } },
    MuiCard:       { defaultProps: { variant: 'outlined' } },
    MuiAppBar:     { defaultProps: { elevation: 0 } },
    MuiToolbar:    { defaultProps: { variant: 'dense' } },
    // measured: their TableHead carries a light band; MUI's own is transparent
    MuiTableHead:  { styleOverrides: { root: { backgroundColor: '#F4F4F4' } } },
    // measured: cards are a 1px #E7E7E7 hairline with no shadow
    MuiCard:       { defaultProps: { variant: 'outlined' },
                     styleOverrides: { root: { borderColor: '#E7E7E7' } } },
    // measured: the selected menu row is primary at 12%, not action.selected grey
    MuiMenuItem:   { styleOverrides: { root: {
                       '&.Mui-selected': { backgroundColor: 'rgba(33,150,243,0.12)' },
                       '&.Mui-selected:hover': { backgroundColor: 'rgba(33,150,243,0.12)' },
                     } } },
  },
});

const NAVY = '#1C2848';

const TYPES = [
  { key: 'punctuality',   label: 'Punctuality' },
  { key: 'raw_data',      label: 'Raw Data Export DPM' },
  { key: 'data_quality',  label: 'Data Quality Index DPM' },
  { key: 'connection',    label: 'Connection Punctuality' },
  { key: 'trip_failures', label: 'Trip Failures DPM' },
  { key: 'line_analysis', label: 'Line Analysis DPM' },
];

const ROWS = [
  { group: 'Punctuality DPM', name: 'Pünktlichkeit – Letzte 7 Tage, Solothurn', period: '19.05–25.05.2026', created: '25.05.2026', status: 'In progress' },
  { group: 'Punctuality DPM', name: 'Pünktlichkeit – Letzter Monat, alle TU',   period: '01.04–30.04.2026', created: '03.05.2026', status: 'Done' },
  { group: 'Punctuality DPM', name: 'Pünktlichkeit – Letzte 30 Tage, Bern',     period: '26.04–25.05.2026', created: '26.05.2026', status: 'Done' },
  { group: 'Punctuality DPM', name: 'Pünktlichkeit – Aktuelles Jahr, Zürich',   period: '01.01–26.05.2026', created: '24.05.2026', status: 'Failed', note: 'Data source was unreachable' },
  { group: 'Raw Data Export DPM', name: 'Rohdaten Export – Gestern',            period: '24.05.2026',      created: '25.05.2026', status: 'Done' },
  { group: 'Raw Data Export DPM', name: 'Rohdaten Export – SBB Vollexport',     period: '01.05–23.05.2026', created: '25.05.2026', status: 'In progress' },
  { group: 'Raw Data Export DPM', name: 'Rohdaten Export – Letzte Woche',       period: '11.05–17.05.2026', created: '20.05.2026', status: 'Done' },
];

const STATUS_COLOUR = { 'Done': 'success', 'In progress': 'warning', 'Failed': 'error' };

/* ── App bar with the expandable Q-Explorer menu ─────────────────── */
function TopBar({ onGo }) {
  const [anchor, setAnchor] = useState(null);
  return html`
    <${AppBar} position="static" sx=${{ bgcolor: '${NAVY}'.replace(/\$\{|\}/g, '') || NAVY }}>
      <${Toolbar} sx=${{ gap: 0.5 }}>
        <${Box} sx=${{ width: 24, height: 24, bgcolor: '#E30613', color: '#fff',
                        display: 'grid', placeItems: 'center', mr: 3, borderRadius: '2px',
                        fontWeight: 700, fontSize: 16, lineHeight: 1 }}>+<//>
        <${Button} color="inherit" sx=${{ opacity: .75 }}>Startseite<//>
        <${Button} color="inherit" onClick=${e => setAnchor(e.currentTarget)}
                   endIcon=${html`<${Icon}>expand_more<//>`}
                   aria-haspopup="menu" id="qx-nav-trigger"
                   sx=${{ borderBottom: '2px solid #fff', borderRadius: 0 }}>Q-Explorer<//>
        <${Menu} anchorEl=${anchor} open=${!!anchor} onClose=${() => setAnchor(null)}
                 anchorOrigin=${{ vertical: 'bottom', horizontal: 'left' }}
                 transformOrigin=${{ vertical: 'top', horizontal: 'left' }}>
          <${MenuItem} onClick=${() => { setAnchor(null); onGo('list'); }}>Evaluations<//>
          <${MenuItem} onClick=${() => { setAnchor(null); onGo('list'); }}>Scheduled reports<//>
        <//>
        <${Button} color="inherit" sx=${{ opacity: .75 }}>Q.Reports<//>
        <${Button} color="inherit" sx=${{ opacity: .75 }}>Fotoalbum<//>
        <${Button} color="inherit" sx=${{ opacity: .75 }}>Q-Messungen<//>
        <${Box} sx=${{ flex: 1 }} />
        <${Button} color="inherit" variant="outlined" sx=${{ borderColor: 'rgba(255,255,255,.4)' }}>EN<//>
        <${Button} color="inherit" startIcon=${html`<${Icon}>logout<//>`}>Log out<//>
      <//>
    <//>`;
}

/* ── Screen 1: the evaluations list ──────────────────────────────── */
function EvaluationsList({ onNew }) {
  const [status, setStatus] = useState('');
  const [period, setPeriod] = useState('');
  const [q, setQ] = useState('');

  const rows = useMemo(() => ROWS.filter(r =>
    (!status || r.status === status) &&
    (!q || r.name.toLowerCase().includes(q.toLowerCase()))), [status, q]);

  const groups = [...new Set(rows.map(r => r.group))];

  // An empty value IS "all" -- there is no All option in any menu, and the
  // label rests in the field to say what it filters. Ignat, 2026-09-15.
  const filter = (label, value, setValue, options, id) => html`
    <${FormControl} sx=${{ minWidth: 180 }} id=${id}>
      <${InputLabel}>${label}<//>
      <${Select} value=${value} label=${label} onChange=${e => setValue(e.target.value)}
        endAdornment=${value ? html`
          <${InputAdornment} position="end" sx=${{ mr: 3 }}>
            <${IconButton} aria-label=${'Clear ' + label} onClick=${() => setValue('')}>
              <${Icon} sx=${{ fontSize: 18 }}>close<//>
            <//>
          <//>` : null}>
        ${options.map(o => html`<${MenuItem} key=${o} value=${o}>${o}<//>`)}
      <//>
    <//>`;

  return html`
    <${Box}>
      <${Box} sx=${{ display: 'flex', alignItems: 'center', justifyContent: 'space-between',
                      px: 3, py: 2.5, bgcolor: '#fff', borderBottom: '1px solid #E7E7E7' }}>
        <${Box}>
          <${Typography} variant="h5">Evaluations<//>
          <${Typography} variant="body2" color="text.secondary">${rows.length} evaluations<//>
        <//>
        <${Button} variant="contained" id="new-eval-btn"
                   startIcon=${html`<${Icon} sx=${{ fontSize: 18 }}>add<//>`}
                   onClick=${onNew}>New evaluation<//>
      <//>

      <${Box} sx=${{ p: 3 }}>
        <${Stack} direction="row" spacing=${2} sx=${{ mb: 3 }}>
          <${TextField} label="Search evaluations" value=${q}
            onChange=${e => setQ(e.target.value)} sx=${{ minWidth: 280 }} />
          ${filter('Status', status, setStatus, ['Done', 'In progress', 'Failed'], 'f-status')}
          ${filter('Period', period, setPeriod, ['Last 7 days', 'Current month', 'Last month', 'Last year'], 'f-period')}
        <//>

        ${groups.map(g => html`
          <${Box} key=${g} sx=${{ mb: 4 }}>
            <${Typography} variant="subtitle2" sx=${{ mb: 1, textTransform: 'uppercase',
                             color: 'text.secondary', letterSpacing: '.08em' }}>
              ${g} · ${rows.filter(r => r.group === g).length} evaluations
            <//>
            <${TableContainer} component=${Paper} variant="outlined" sx=${{ borderColor: '#E7E7E7' }}>
              <${Table}>
                <${TableHead}>
                  <${TableRow}>
                    <${TableCell}>Name<//><${TableCell}>Period<//>
                    <${TableCell}>Created<//><${TableCell}>Status<//>
                    <${TableCell} align="right">Actions<//>
                  <//>
                <//>
                <${TableBody}>
                  ${rows.filter(r => r.group === g).map(r => html`
                    <${TableRow} key=${r.name} hover>
                      <${TableCell}>
                        <${Link} href="#" underline="hover" onClick=${e => e.preventDefault()}>${r.name}<//>
                        ${r.note && html`<${Typography} variant="caption" color="error" display="block">${r.note}<//>`}
                      <//>
                      <${TableCell}>${r.period}<//>
                      <${TableCell}>${r.created}<//>
                      <${TableCell}>
                        <${Chip} size="small" label=${r.status} color=${STATUS_COLOUR[r.status]} variant="outlined" />
                      <//>
                      <${TableCell} align="right">
                        <${IconButton} aria-label="View"><${Icon}>visibility<//><//>
                        <${IconButton} aria-label="Delete"><${Icon}>delete_outline<//><//>
                      <//>
                    <//>`)}
                <//>
              <//>
            <//>
          <//>`)}
      <//>
    <//>`;
}

/* ── Screen 2: New evaluation ────────────────────────────────────── */
function NewEvaluation({ onBack }) {
  const [type, setType] = useState('');
  const [name, setName] = useState('');
  const [touched, setTouched] = useState(false);
  const locked = !type;
  const nameError = touched && !name.trim();

  return html`
    <${Box}>
      <${Box} sx=${{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between',
                      px: 3, py: 2.5, bgcolor: '#fff', borderBottom: '1px solid #E7E7E7' }}>
        <${Box}>
          <${Breadcrumbs} separator=${html`<${Icon} sx=${{ fontSize: 16 }}>chevron_right<//>`}
                          sx=${{ mb: .5 }}>
            <${Link} underline="hover" color="text.secondary" href="#"
                     id="bc-back" onClick=${e => { e.preventDefault(); onBack(); }}>Evaluations<//>
            <${Typography} color="text.primary" variant="body2">New evaluation<//>
          <//>
          <${Typography} variant="h5">New evaluation<//>
        <//>
        <${Button} variant="contained" id="run-btn" disabled=${locked}
                   startIcon=${html`<${Icon} sx=${{ fontSize: 18 }}>play_arrow<//>`}
                   onClick=${() => setTouched(true)}>Run now<//>
      <//>

      <${Box} sx=${{ p: 3, maxWidth: 1100 }}>
        <${Card} sx=${{ mb: 3 }}>
          <${CardContent}>
            <${Stack} direction="row" spacing=${2}>
              <${TextField} required label="Evaluation name" sx=${{ flex: 1 }}
                id="eval-name" value=${name} error=${nameError}
                helperText=${nameError ? 'Evaluation name is required' : ' '}
                onChange=${e => setName(e.target.value)} />
              <${FormControl} required sx=${{ flex: 1 }}>
                <${InputLabel}>Evaluation type<//>
                <${Select} id="eval-type" value=${type} label="Evaluation type"
                           onChange=${e => setType(e.target.value)}>
                  ${TYPES.map(t => html`<${MenuItem} key=${t.key} value=${t.key}>${t.label}<//>`)}
                <//>
              <//>
            <//>
          <//>
        <//>

        <${Box} id="needs-type" sx=${{ opacity: locked ? .5 : 1, pointerEvents: locked ? 'none' : 'auto' }}>
          <${Card} sx=${{ mb: 3 }}>
            <${CardContent}>
              <${Typography} variant="h6" gutterBottom>Time period<//>
              <${Typography} variant="body2" color="text.secondary" sx=${{ mb: 2 }}>
                ${locked ? 'Select an evaluation type above to configure the period.'
                         : 'Choose the evaluation time period.'}
              <//>
              <${Stack} direction="row" spacing=${1} sx=${{ mb: 2 }}>
                ${['Last 7 days', 'Current month', 'Last month', 'Last year', 'Custom'].map((p, i) =>
                  html`<${Chip} key=${p} label=${p} clickable color=${i === 1 ? 'primary' : 'default'}
                                variant=${i === 1 ? 'filled' : 'outlined'} />`)}
              <//>
              <${Stack} direction="row" spacing=${2}>
                <${TextField} label="From" type="date" InputLabelProps=${{ shrink: true }} />
                <${TextField} label="To"   type="date" InputLabelProps=${{ shrink: true }} />
              <//>
            <//>
          <//>

          <${Card}>
            <${CardContent}>
              <${Typography} variant="h6" gutterBottom>Scope<//>
              <${Typography} variant="body2" color="text.secondary" sx=${{ mb: 2 }}>
                All filters are optional. Without restrictions the evaluation covers everything.
              <//>
              <${Stack} direction="row" spacing=${2} flexWrap="wrap" useFlexGap>
                ${['Transport association', 'Transport company', 'Canton', 'Line', 'Stop'].map(l => html`
                  <${FormControl} key=${l} sx=${{ minWidth: 200 }}>
                    <${InputLabel}>${l}<//>
                    <${Select} label=${l} value="">
                      <${MenuItem} value="a">Example A<//>
                      <${MenuItem} value="b">Example B<//>
                    <//>
                  <//>`)}
              <//>
            <//>
          <//>
        <//>
      <//>
    <//>`;
}

/* ── Shell ───────────────────────────────────────────────────────── */
function App() {
  const [screen, setScreen] = useState('list');
  return html`
    <${ThemeProvider} theme=${theme}>
      <${CssBaseline} />
      <${Box} sx=${{ display: 'flex', flexDirection: 'column', minHeight: 'calc(100vh - 36px)' }}>
        <${TopBar} onGo=${setScreen} />
        <${Box} sx=${{ flex: 1 }}>
          ${screen === 'list'
            ? html`<${EvaluationsList} onNew=${() => setScreen('new')} />`
            : html`<${NewEvaluation} onBack=${() => setScreen('list')} />`}
        <//>
        <${Box} component="footer" sx=${{ display: 'flex', justifyContent: 'flex-end', gap: 1,
                 px: 3, py: .5, bgcolor: '#fff', borderTop: '1px solid #E7E7E7' }}>
          ${['Imprint', 'Documents', 'Support', 'Contact'].map(l =>
            html`<${Button} key=${l} size="small" color="inherit"
                            sx=${{ color: 'text.secondary', fontSize: 12 }}>${l}<//>`)}
        <//>
      <//>
    <//>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
