<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14532d">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Žodžiai — Lithuanian cards</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f6f7f4;--card:#fff;--ink:#1c2420;--mute:#66706a;--line:#e3e6e1;--green:#15803d;--green-bg:#dcfce7;--red:#b91c1c;--red-bg:#fee2e2;--accent:#14532d;--chip:#eef3ee}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:12px 16px calc(16px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:10px;padding:4px 0 12px}
.tabs{display:flex;flex:1;background:var(--line);border-radius:10px;padding:3px;gap:3px}
.tabs button{flex:1;border:none;background:none;border-radius:8px;padding:8px;font:inherit;font-size:15px;font-weight:600;color:var(--mute)}
.tabs button.on{background:var(--card);color:var(--ink)}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font:inherit;font-size:15px;color:var(--ink)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--green);width:0;transition:width .2s}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 18px 20px;text-align:center;margin-bottom:14px}
.meta{font-size:14px;color:var(--mute);margin-bottom:10px}
.word{font-size:34px;font-weight:700;line-height:1.2;word-break:break-word}
.word.small{font-size:26px}
.sent{font-size:26px;font-weight:700;line-height:1.3;word-break:break-word}
.blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--line);color:var(--mute)}
.blank.right{color:var(--green);border-color:var(--green)}
.blank.wrong{color:var(--red);border-color:var(--red)}
.base{font-size:16px;color:var(--mute);margin-top:8px}
.sub{font-size:15px;color:var(--mute);margin-top:10px;min-height:21px}
.rule{display:inline-flex;gap:6px;align-items:center;background:var(--chip);color:var(--accent);border-radius:999px;padding:5px 12px;font-size:15px;font-weight:600;margin-bottom:12px}
.hintbtn{border:none;background:none;color:var(--accent);font:inherit;font-size:15px;text-decoration:underline;padding:8px 0 0}
.hint{text-align:left;background:var(--chip);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:15px}
.hint div{padding:2px 0}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:15px 16px;font:inherit;font-size:17px;color:var(--ink);min-height:56px}
.opt:active{background:#f0f2ee}
.opt.right{border-color:var(--green);background:var(--green-bg)}
.opt.wrong{border-color:var(--red);background:var(--red-bg)}
.opt:disabled{color:var(--ink);opacity:1}
.next{margin-top:14px;width:100%;border:none;background:var(--accent);color:#fff;border-radius:12px;padding:16px;font:inherit;font-size:17px;font-weight:600}
.hidden{display:none!important}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.panel h2{font-size:16px;margin:0 0 10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-size:24px}
.stats span{font-size:14px;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 13px;font:inherit;font-size:15px;color:var(--ink)}
.chip.on{border-color:var(--accent);background:var(--accent);color:#fff}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;font-size:15px}
.row select{font:inherit;font-size:15px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:#fff}
.lvl{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;font:inherit;color:var(--ink);margin-bottom:8px}
.lvl.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.lvl .n{width:30px;height:30px;border-radius:50%;background:var(--chip);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.lvl.done .n{background:var(--green);color:#fff}
.lvl .t{flex:1}
.lvl .t b{display:block;font-size:16px}
.lvl .t span{font-size:14px;color:var(--mute)}
.lvl .s{font-size:15px;color:var(--mute)}
.miss{font-size:15px;padding:8px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
.miss:last-child{border:none}
.miss b{font-weight:600}
.note{font-size:14px;color:var(--mute)}
.danger{border:none;background:none;color:var(--red);font:inherit;font-size:15px;padding:8px 0}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="tabs" id="tabs"><button data-t="w">Words</button><button data-t="c">Cases</button></div>
    <button class="iconbtn hidden" id="btnHome">Home</button>
  </header>

  <!-- WORDS HOME -->
  <section id="home">
    <div class="panel">
      <div class="stats">
        <div><b id="sDue">0</b><span>due now</span></div>
        <div><b id="sLearn">0</b><span>learning</span></div>
        <div><b id="sKnown">0</b><span>known</span></div>
      </div>
    </div>
    <button class="next" id="btnStart" style="margin:0 0 14px">Start</button>
    <div class="panel">
      <h2>Level</h2>
      <div class="chips" id="levels"></div>
    </div>
    <div class="panel">
      <h2>Topics</h2>
      <div class="chips" id="topics"></div>
    </div>
    <div class="panel">
      <h2>Settings</h2>
      <div class="row"><span>Direction</span>
        <select id="dir"><option value="lt">Lithuanian → answer</option><option value="rev">Answer → Lithuanian</option><option value="mix">Mixed</option></select></div>
      <div class="row"><span>Answer language</span>
        <select id="lang"><option value="en">English</option><option value="ru">Русский</option></select></div>
      <div class="row"><span>Cards per round</span>
        <select id="size"><option>10</option><option selected>20</option><option>30</option><option>50</option></select></div>
      <div class="row"><span>New words per round</span>
        <select id="newPer"><option>0</option><option>5</option><option selected>10</option><option>20</option></select></div>
      <button class="danger" id="btnReset">Reset word progress</button>
    </div>
    <p class="note" id="srcNote"></p>
  </section>

  <!-- WORDS QUIZ -->
  <section id="quiz" class="hidden">
    <div class="bar"><i id="prog"></i></div>
    <div class="card">
      <div class="meta" id="qMeta"></div>
      <div class="word" id="qWord"></div>
      <div class="sub" id="qSub"></div>
    </div>
    <div class="opts" id="opts"></div>
    <button class="next hidden" id="btnNext">Next</button>
  </section>

  <!-- WORDS DONE -->
  <section id="done" class="hidden">
    <div class="panel">
      <div class="stats">
        <div><b id="dRight">0</b><span>correct</span></div>
        <div><b id="dWrong">0</b><span>missed</span></div>
        <div><b id="dDue">0</b><span>still due</span></div>
      </div>
    </div>
    <div class="panel" id="missPanel">
      <h2>Missed — say each one out loud</h2>
      <div id="missList"></div>
    </div>
    <button class="next" id="btnAgain">Next round</button>
  </section>

  <!-- CASES HOME -->
  <section id="chome" class="hidden">
    <div id="clevels"></div>
    <button class="next" id="cStart" style="margin:6px 0 14px">Start</button>
    <div class="panel">
      <div class="row"><span>Sentences per round</span>
        <select id="csize"><option>10</option><option selected>15</option><option>25</option></select></div>
      <div class="row"><span>Translation language</span>
        <select id="clang"><option value="en">English</option><option value="ru">Русский</option></select></div>
      <button class="danger" id="cReset">Reset case progress</button>
    </div>
    <p class="note" id="cNote"></p>
  </section>

  <!-- CASES QUIZ -->
  <section id="cquiz" class="hidden">
    <div class="bar"><i id="cprog"></i></div>
    <div class="card">
      <div class="rule" id="cRule"></div>
      <div class="sent" id="cSent"></div>
      <div class="base" id="cBase"></div>
      <div class="sub" id="cSub"></div>
      <button class="hintbtn" id="cHintBtn">Show endings</button>
      <div class="hint hidden" id="cHint"></div>
    </div>
    <div class="opts" id="copts"></div>
    <button class="next hidden" id="cNext">Next</button>
  </section>

  <!-- CASES DONE -->
  <section id="cdone" class="hidden">
    <div class="panel">
      <div class="stats">
        <div><b id="cdPct">0</b><span>score</span></div>
        <div><b id="cdRight">0</b><span>correct</span></div>
        <div><b id="cdWrong">0</b><span>missed</span></div>
      </div>
      <p class="note" id="cdMsg" style="margin:12px 0 0;text-align:center"></p>
    </div>
    <div class="panel" id="cmissPanel">
      <h2>Missed</h2>
      <div id="cmissList"></div>
    </div>
    <button class="next" id="cAgain">Next round</button>
  </section>
</div>

function pool(){return W.filter(w=>S.levels.includes(w.level)&&(!S.topics.length||w.topics.some(t=>S.topics.includes(t))))}
function isDue(w){const p=S.p[w.i];return p&&p.due<=now()}
function counts(){const P=pool();let due=0,learn=0,known=0;for(const w of P){const p=S.p[w.i];if(!p)continue;if(p.due<=now())due++;if(p.box>=4)known++;else learn++}return{due,learn,known,total:P.length}}

let Q=[],qi=0,right=0,missed=[],cur=null;
function buildRound(){
  const P=pool(),size=+S.size;
  const due=shuffle(P.filter(isDue)).sort((a,b)=>S.p[a.i].box-S.p[b.i].box);
  let q=due.slice(0,size);
  const fresh=shuffle(P.filter(w=>!S.p[w.i])).sort((a,b)=>"A1A2B1B2".indexOf(a.level)-"A1A2B1B2".indexOf(b.level));
  q=q.concat(fresh.slice(0,Math.min(+S.newPer,size-q.length)));
  if(q.length<size){
    const rest=P.filter(w=>S.p[w.i]&&!q.includes(w)).sort((a,b)=>S.p[a.i].box-S.p[b.i].box||S.p[a.i].due-S.p[b.i].due);
    q=q.concat(rest.slice(0,size-q.length));
  }
  if(q.length<size)q=q.concat(fresh.slice(+S.newPer,+S.newPer+size-q.length));
  return shuffle(q);
}
function start(){
  Q=buildRound();qi=0;right=0;missed=[];
  if(!Q.length){alert("No words in this selection.");return}
  show("quiz");ask();
}
function distractors(w,rev){
  const key=rev?(x=>x.lt):ans;
  const seen=new Set([key(w).toLowerCase()]);
  const same=shuffle(W.filter(x=>x.pos===w.pos&&x!==w&&x.topics.some(t=>w.topics.includes(t))));
  const pos=shuffle(W.filter(x=>x.pos===w.pos&&x!==w));
  const any=shuffle(W.slice());
  const out=[];
  for(const src of [same,pos,any])for(const x of src){if(out.length>=3)break;const k=key(x).toLowerCase();if(seen.has(k))continue;seen.add(k);out.push(x)}
  return out;
}
function ask(){
  cur=Q[qi];const w=cur;
  const rev=S.dir==="rev"||(S.dir==="mix"&&Math.random()<.5);
  cur.rev=rev;
  $("prog").style.width=(qi/Q.length*100)+"%";
  const p=S.p[w.i];
  $("qMeta").textContent=`${POS[w.pos]||w.pos} · ${w.level}${p?"":" · new"}`;
  const q=rev?ans(w):w.lt;
  $("qWord").textContent=q;$("qWord").className="word"+(q.length>18?" small":"");
  $("qSub").textContent="";
  const opts=shuffle([w,...distractors(w,rev)]);
  const box=$("opts");box.innerHTML="";
  for(const o of opts){
    const b=document.createElement("button");b.className="opt";b.textContent=rev?o.lt:ans(o);
    b.onclick=()=>pick(o,b);box.appendChild(b);
  }
  $("btnNext").classList.add("hidden");
}
function pick(o,btn){
  const w=cur,ok=o===w;
  for(const b of $("opts").children){b.disabled=true;if(b.textContent===(w.rev?w.lt:ans(w)))b.classList.add("right")}
  if(!ok)btn.classList.add("wrong");
  const p=S.p[w.i]||{box:0,due:0,seen:0,miss:0};p.seen++;
  if(ok){p.box=Math.min(p.box+1,INTERVAL.length-1);p.due=now()+INTERVAL[p.box]*DAY;right++}
  else{p.box=0;p.due=now()+10*60e3;p.miss++;missed.push(w);Q.push(w)}
  S.p[w.i]=p;save();
  $("qSub").textContent=w.rev?w.lt:ans(w);
  if(ok)setTimeout(next,700);else $("btnNext").classList.remove("hidden");
}
function next(){qi++;if(qi>=Q.length)finish();else ask()}
function finish(){
  $("prog").style.width="100%";
  const uniq=[...new Set(missed)];
  $("dRight").textContent=right;$("dWrong").textContent=uniq.length;$("dDue").textContent=counts().due;
  $("missPanel").classList.toggle("hidden",!uniq.length);
  $("missList").innerHTML=uniq.map(w=>`<div class="miss"><b>${esc(w.lt)}</b><span>${esc(ans(w))}</span></div>`).join("");
  show("done");
}

    b.className="lvl"+(S.clevel===lv?" on":"")+(best>=80?" done":"");
    b.innerHTML=`<span class="n">${best>=80?"✓":lv}</span><span class="t"><b>${esc(L.t)}</b><span>${esc(L.d)}</span></span><span class="s">${best!=null?best+"%":""}</span>`;
    b.onclick=()=>{S.clevel=lv;save();renderCHome()};
    box.appendChild(b);
  });
  $("cStart").textContent=`Start level ${S.clevel} · ${LEVELS[S.clevel-1].t}`;
  $("csize").value=S.csize;$("clang").value=S.clang;
  $("cNote").textContent=`${NOUN.length} nouns. Case forms are checked against Wiktionary declension tables. Pass a level at 80%.`;
}
$("cReset").onclick=()=>{if(confirm("Reset case progress?")){S.cl={};S.cmiss=[];save();renderCHome()}};

let CQ=[],ci=0,cright=0,cmissed=[],ccur=null,cstartLevel=1;
function cBuild(){
  const frames=FR.filter(LEVELS[S.clevel-1].f),size=+S.csize,out=[],seen=new Set();
  const lvMiss=S.cmiss.filter(m=>m.lv===S.clevel&&FR[m.f]);
  for(const m of shuffle(lvMiss).slice(0,Math.round(size*.3))){out.push({f:FR[m.f],n:m.n});seen.add(m.f+":"+m.n)}
  let guard=0;
  while(out.length<size&&guard++<500){
    const f=frames[Math.random()*frames.length|0],n=f.ids[Math.random()*f.ids.length|0],k=f.i+":"+n;
    if(seen.has(k))continue;
    if(out.some(o=>o.n===n)&&guard<300)continue; // prefer different nouns in a round
    seen.add(k);out.push({f,n});
  }
  return shuffle(out);
}
function cStart(){CQ=cBuild();ci=0;cright=0;cmissed=[];cstartLevel=S.clevel;show("cquiz");cAsk()}
function sentenceHTML(f,fill,cls){
  const parts=f.lt.split("___");
  return esc(parts[0])+`<span class="blank ${cls||""}">${fill?esc(fill):"&nbsp;"}</span>`+esc(parts[1]);
}
function cAsk(){
  const it=CQ[ci];ccur=it;const f=it.f,n=NOUN[it.n],forms=formsOf(n,f.n),correct=forms[f.c];
  $("cprog").style.width=(ci/CQ.length*100)+"%";
  $("cRule").textContent=`${f.g} → ${QW[f.c]}`;
  $("cSent").innerHTML=sentenceHTML(f);
  const base=n.po?n.pl[0]:n.sg[0];
  $("cBase").textContent=`(${base}${f.n==="p"&&!n.po?" → plural":n.po?", plural only":""})`;
  $("cSub").textContent="";
  $("cHint").classList.add("hidden");$("cHintBtn").classList.remove("hidden");
  $("cHint").innerHTML=`<div><b>${CASE[f.c]}</b> · ${QW[f.c]}</div><div>${f.n==="p"||n.po?"Plural":"Singular"}: ${END[f.c][f.n==="p"||n.po?"p":"s"]}</div>`;
  // options: correct + 3 other forms of the same word
  const uniq=[...new Set(forms)].filter(x=>x!==correct);
  const other=formsOf(n,f.n==="p"?"s":"p")||[];
  let pool=shuffle(uniq);
  if(pool.length<3)pool=pool.concat(shuffle([...new Set(other)].filter(x=>x!==correct&&!pool.includes(x))));
  const opts=shuffle([correct,...pool.slice(0,3)]);
  const box=$("copts");box.innerHTML="";
  for(const o of opts){const b=document.createElement("button");b.className="opt";b.textContent=o;b.onclick=()=>cPick(o,b);box.appendChild(b)}
  $("cNext").classList.add("hidden");
}
$("cHintBtn").onclick=()=>{$("cHint").classList.remove("hidden");$("cHintBtn").classList.add("hidden")};
function cPick(o,btn){
  const it=ccur,f=it.f,n=NOUN[it.n],correct=formsOf(n,f.n)[f.c],ok=o===correct;
  for(const b of $("copts").children){b.disabled=true;if(b.textContent===correct)b.classList.add("right")}
  if(!ok)btn.classList.add("wrong");
  $("cSent").innerHTML=sentenceHTML(f,correct,ok?"right":"wrong");
  const base=n.po?n.pl[0]:n.sg[0];
  $("cSub").innerHTML=`${esc(S.clang==="ru"?"":f.en)}${S.clang==="ru"?"":" · "}${esc(base)} = ${esc(cAns(n))}<br>${esc(f.g)} + ${QW[f.c]} → ${CASE[f.c].toLowerCase()}`;
  const key=m=>m.f===f.i&&m.n===it.n&&m.lv===cstartLevel;
  if(ok){cright++;S.cmiss=S.cmiss.filter(m=>!key(m))}
  else{cmissed.push(it);if(!S.cmiss.some(key))S.cmiss.push({f:f.i,n:it.n,lv:cstartLevel});if(S.cmiss.length>300)S.cmiss.shift()}
  save();
  $("cNext").classList.remove("hidden");
  if(ok){clearTimeout(cAuto);cAuto=setTimeout(cNext,1400)}
}
let cAuto=null;
function cNext(){clearTimeout(cAuto);if(!$("cquiz").classList.contains("hidden")){ci++;if(ci>=CQ.length)cFinish();else cAsk()}}
$("cNext").onclick=cNext;
function cFinish(){
  $("cprog").style.width="100%";
  const pct=Math.round(cright/CQ.length*100),lv=cstartLevel;
  S.cl[lv]=Math.max(S.cl[lv]||0,pct);
  let msg=pct>=80?`Level ${lv} passed.`:`80% passes the level. Missed sentences come back next round.`;
  if(pct>=80&&lv<LEVELS.length&&S.clevel===lv){S.clevel=lv+1;msg+=` Next: level ${lv+1} · ${LEVELS[lv].t}.`}
  save();
  $("cdPct").textContent=pct+"%";$("cdRight").textContent=cright;$("cdWrong").textContent=cmissed.length;$("cdMsg").textContent=msg;
  $("cmissPanel").classList.toggle("hidden",!cmissed.length);
  $("cmissList").innerHTML=cmissed.map(it=>{const n=NOUN[it.n];return `<div class="miss"><span>${esc(it.f.lt.replace("___",formsOf(n,it.f.n)[it.f.c]))}</span><b>${QW[it.f.c]}</b></div>`}).join("");
  show("cdone");
}
$("cStart").onclick=cStart;$("cAgain").onclick=cStart;

// ================= NAV =================
const SECTIONS=["home","quiz","done","chome","cquiz","cdone"];
function show(id){
  for(const s of SECTIONS)$(s).classList.toggle("hidden",s!==id);
  const isHome=id==="home"||id==="chome";
  $("btnHome").classList.toggle("hidden",isHome);
  for(const b of $("tabs").children)b.classList.toggle("on",b.dataset.t===S.tab);
  if(id==="home")renderHome();if(id==="chome")renderCHome();
  window.scrollTo(0,0);
}
for(const b of $("tabs").children)b.onclick=()=>{clearTimeout(cAuto);S.tab=b.dataset.t;save();show(S.tab==="w"?"home":"chome")};
$("btnStart").onclick=start;$("btnAgain").onclick=start;$("btnNext").onclick=next;
$("btnHome").onclick=()=>{clearTimeout(cAuto);show(S.tab==="w"?"home":"chome")};
show(S.tab==="c"?"chome":"home");
</script>
</body>
