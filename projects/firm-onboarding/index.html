<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synder — Firm onboarding for accountants</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../ui-kit/synder-ui-kit.css">
<link rel="stylesheet" href="../../ui-kit/proposed.css">   <!-- sketch components: not approved, not in the kit -->
<style>
  /* prototype chrome: demo controls in the dark bar */
  #vbar{position:relative;z-index:1200}
  .demo-ctrls{margin-left:auto;display:flex;align-items:center;gap:12px}
  .demo-ctrls select,.demo-ctrls button{font:inherit;font-size:14px;background:rgba(255,255,255,.1);color:var(--color-white);border:1px solid rgba(255,255,255,.25);border-radius:4px;padding:4px 8px;cursor:pointer}
  .demo-ctrls select option{color:var(--text-primary)}
  .demo-ctrls label{display:flex;align-items:center;gap:6px;cursor:pointer}
  html,body{height:100%}
  body{display:flex;flex-direction:column;min-width:1280px}
  .screen{display:none;flex:1;min-height:0}
  .screen.on{display:flex;flex-direction:column}
  .onb-body{flex:1;overflow:auto;background:var(--bg-page)}
  .onb-col{width:640px;margin:56px auto 48px}
  .onb-col.narrow{width:440px}
  .onb-sub{font-size:16px;line-height:24px;color:var(--text-secondary);margin:0 0 24px}
  /* synder.com marketing site — not product UI, not the kit. Values from synder.com CSS 2026-11-11:
     .section gradient #002658→#1c1f23, h1 Poppins 600 60/72 white, Book a demo #00feb2 on #01204f r8, Sign up free white outline */
  #s-onb.is-home > .topbar{display:none}
  #s-onb.is-home .onb-body{background:linear-gradient(#002658 75%,#1c1f23)}
  .site{color:#fff;font-family:Inter,Roboto,sans-serif;min-height:100%}
  .site-nav{display:flex;align-items:center;gap:40px;max-width:1180px;margin:0 auto;padding:24px 32px}
  .site-logo{display:flex;align-items:center;gap:6px;font-family:Poppins,sans-serif;font-size:24px;font-weight:600}
  .site-nav nav{display:flex;gap:32px;margin-left:auto}
  .site-nav nav a{color:#fff;text-decoration:none;font-size:16px}
  .site-ctas{display:flex;gap:16px;justify-content:center}
  .site-btn{font:500 16px/20px Inter,Roboto,sans-serif;border-radius:8px;padding:11px 20px;cursor:pointer;border:1px solid transparent}
  .site-btn--mint{background:#00feb2;color:#01204f}
  .site-btn--ghost{background:transparent;color:#fff;border-color:#fff}
  .site-btn--lg{padding:16px 32px;font-size:18px}
  .site-hero{max-width:960px;margin:0 auto;padding:96px 32px 120px;text-align:center}
  .site-hero h1{font-family:Poppins,sans-serif;font-size:60px;line-height:72px;font-weight:600;margin:0 0 32px}
  .site-hero ul{list-style:none;padding:0;margin:0 0 40px;display:flex;justify-content:center;gap:32px;font-size:18px}
  .site-hero li{display:flex;align-items:center;gap:8px}
  .site-hero li .material-icons{color:#00feb2}
  .site-hero p{margin:20px 0 0;font-size:16px}
  .site-muted{opacity:.7;margin-top:48px!important}
  #onb-exit{gap:24px}
  .empty-hero{max-width:1000px;margin:48px auto 0;text-align:center}
  .empty-hero-icon{font-size:64px;color:var(--color-primary)}
  .empty-hero h2{font-size:32px;line-height:40px;font-weight:400;margin:16px 0 12px}
  .empty-hero-sub{font-size:18px;line-height:28px;color:var(--text-secondary);max-width:680px;margin:0 auto 40px}
  .add-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;align-items:stretch}
  .add-card{display:flex;flex-direction:column;align-items:center;gap:12px;padding:32px 24px 24px;background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--radius-md);box-shadow:var(--shadow-card);cursor:pointer}
  .add-card:hover{border-color:var(--color-primary)}
  .add-card:focus-visible{outline:2px solid var(--border-focus);outline-offset:2px}
  .add-card > .material-icons{font-size:40px;color:var(--color-primary)}
  .add-card h3{font-size:20px;line-height:28px;font-weight:500;margin:0}
  .add-card p{font-size:16px;line-height:24px;color:var(--text-secondary);margin:0;flex:1}
  .add-btn{width:100%;display:inline-flex;align-items:center;justify-content:center;margin-top:8px}
  .empty-steps{list-style:none;padding:0;margin:40px 0 0;display:flex;justify-content:center;gap:40px;font-size:16px;color:var(--text-secondary)}
  .empty-steps li{display:flex;align-items:center;gap:8px}
  .empty-steps b{display:inline-flex;width:28px;height:28px;border-radius:50%;align-items:center;justify-content:center;background:var(--color-primary-10);color:var(--color-primary);font-weight:500}
  .role-col{width:960px;margin-top:80px}
  .role-title{font-size:36px;line-height:44px;font-weight:400;text-align:center;margin:0 0 48px}
  .role-grid{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:stretch}
  .role-card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;padding:48px 40px 40px;background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--radius-md);box-shadow:var(--shadow-card);cursor:pointer}
  .role-card:hover{border-color:var(--color-primary)}
  .role-card:focus-visible{outline:2px solid var(--border-focus);outline-offset:2px}
  .role-card > .material-icons{font-size:56px;color:var(--color-primary)}
  .role-card h2{font-size:24px;line-height:32px;font-weight:500;margin:0}
  .role-card p{font-size:18px;line-height:28px;color:var(--text-secondary);margin:0;flex:1}
  .role-btn{width:100%;justify-content:center;display:inline-flex;align-items:center;margin-top:16px}
  .onb-step{color:var(--text-secondary);margin-bottom:8px}
  .onb-title{font-size:24px;line-height:32px;font-weight:400;margin:0 0 24px}
  .onb-actions{display:flex;justify-content:space-between;align-items:center;margin-top:32px}
  .onb-panel{background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--radius-md);padding:24px}
  .or-line{display:flex;align-items:center;gap:12px;color:var(--text-secondary);margin:20px 0}
  .or-line::before,.or-line::after{content:'';flex:1;height:1px;background:var(--border-default)}
  .sso{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .app-main{flex:1;overflow:auto;display:block}
  .grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
  .setup-card{display:flex;align-items:center;gap:24px}
  .setup-card .progress{flex:1;max-width:360px}
  .bulk-bar{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--bg-active);border-radius:var(--radius-sm);margin:8px 0}
  .bill-plans{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:24px;max-width:880px}
  .bill-plan{padding:24px;display:flex;flex-direction:column;gap:12px}
  .bill-plan h2{font-size:24px;line-height:32px;font-weight:400;margin:0}
  .bill-plan p{margin:0}
  .bill-price{color:var(--text-secondary)} .bill-price span{font-size:32px;line-height:40px;color:var(--text-primary);margin-right:4px}
  .bill-plan ul{list-style:none;padding:0;margin:0;border-top:1px solid var(--border-default)}
  .bill-plan li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-default)}
  .bill-summary{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px}
  .bill-big{font-size:24px;line-height:32px;margin:4px 0}
  .bill-tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}
  .bill-tier{padding:16px}
  .qty{display:flex;align-items:center;gap:12px}
  .qty-n{min-width:24px;text-align:center;font-size:16px}
  .buy-sum{margin-top:24px;display:flex;flex-direction:column;gap:8px}
  .buy-sum > div{display:flex;justify-content:space-between}
  .buy-total{font-size:18px;line-height:28px;border-top:1px solid var(--border-default);padding-top:8px}
  .name-cell{max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .integ-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border-default)}
  .integ-row:last-child{border-bottom:0}
  .integ-row .grow{flex:1}
  .dropzone{border:1px dashed var(--border-strong);border-radius:var(--radius-md);padding:16px;display:flex;align-items:center;gap:12px}
  .dropzone.has-file{border-style:solid;border-color:var(--color-green);background:var(--color-green-light)}
  .dropzone .grow{flex:1;min-width:0}
  .modal-scroll{max-height:380px;overflow:auto}
  .sec-title{font-size:16px;line-height:24px;font-weight:500;margin:0 0 12px}
  .row-gap{display:flex;align-items:center;gap:8px}
  .inline-spin{display:inline-block;width:16px;height:16px;vertical-align:middle}
  .proto-note{color:var(--text-secondary);border:1px dashed var(--border-strong);border-radius:var(--radius-md);padding:16px}
  tr.row-disabled td{color:var(--text-disabled)}
  /* org switcher with the firm pinned on top */
  .topbar-org{position:relative}
  .org-menu{position:absolute;left:8px;right:8px;top:100%;z-index:50;display:none;max-height:420px;overflow:auto;cursor:default}
  .org-menu.show{display:block}
  .org-menu .dropdown-item{display:flex;align-items:center;gap:8px}
  .org-menu .pinned{font-weight:500}
  .sidebar-item.stub{color:var(--text-disabled);pointer-events:none}
  .sidebar-item.stub .material-icons{color:var(--text-disabled)}
</style>
</head>
<body>
<div class="variant-switch" id="vbar">
  <span class="vs-label">Demo</span>
  <div class="demo-ctrls">
    <label for="jump">Jump to</label>
    <select id="jump" onchange="jumpTo(this.value);this.value=''">
      <option value="">…</option>
      <option value="home">synder.com home</option>
      <option value="start">Sign-up start</option>
      <option value="signup">Practice sign-up form</option>
      <option value="empty">Clients · empty</option>
      <option value="imported">Clients · 37 imported, 4 connected</option>
      <option value="dashboard">Dashboard</option>
      <option value="bill-new">Billing · no subscription yet</option>
      <option value="bill-sub">Billing · Core, 13 licences</option>
    </select>
    <button onclick="nextLogin()">Simulate next login</button>
    <button id="reset" onclick="resetDemo()">Reset</button>
  </div>
</div>

<div class="synder-toast-stack" id="toasts" aria-live="polite"></div>

<!-- ========== FULL-PAGE FLOWS: sign-up, client setup ========== -->
<section class="screen on" id="s-onb">
  <div class="topbar">
    <a class="topbar-title"><span class="material-icons">sync_alt</span> Synder</a>
    <div class="topbar-actions" id="onb-exit"></div>
  </div>
  <div class="onb-body"><div class="onb-col" id="onb"></div></div>
</section>

<!-- ========== FIRM APP ========== -->
<section class="screen" id="s-app">
  <header class="topbar topbar--app">
    <div class="topbar-org" id="org-btn" role="button" tabindex="0" aria-haspopup="menu" onclick="toggleOrgMenu(event)"><span class="sidebar-org-avatar" id="org-av">JA</span><span class="topbar-org-name" id="org-name">Firm</span><span class="material-icons">expand_more</span>
      <div class="dropdown-menu org-menu" id="org-menu" role="menu"></div></div>
    <div class="topbar-right">
      <div class="topbar-balance" id="org-balance" hidden><span>Balance:</span> <b>10000</b><span class="topbar-meter"><span style="width:96%"></span></span></div>
      <a class="topbar-link">How it works?</a>
      <button class="topbar-icon" aria-label="Notifications"><span class="material-icons">notifications</span></button>
      <button class="topbar-icon" aria-label="Help"><span class="material-icons">help_outline</span><span class="material-icons topbar-caret">expand_more</span></button>
      <button class="topbar-icon" aria-label="Account"><span class="material-icons">person</span><span class="material-icons topbar-caret">expand_more</span></button>
    </div>
  </header>
  <div class="synder-layout" style="flex:1;min-height:0">
    <nav class="sidebar sidebar--notch" aria-label="Main">
      <div id="side-items"></div>
    </nav>
    <main class="synder-page app-main" id="page"></main>
  </div>
</section>

<div id="modal-root"></div>

<script>
/* ---------- data ---------- */
// [name, last transaction in the firm's QuickBooks]; older than 12 months = unticked on import
const QBO = [["Bluebird Bakery LLC","Nov 2026"],["Cedar & Pine Outfitters","Nov 2026"],["Harbor Light Coffee Co.","Nov 2026"],["Maple Street Dental","Oct 2026"],["Northwind Home & Garden Supply Co. — East Coast Wholesale Division LLC","Nov 2026"],["Sunrise Yoga Studio","Nov 2026"],["Atlas Freight Partners","Oct 2026"],["Golden Gate Pet Supply","Mar 2023"],["Riverbend Ceramics","Nov 2026"],["Copper Kettle Catering","Nov 2026"],["Evergreen Landscaping Inc.","Sep 2026"],["Summit Bike Works","Nov 2026"],["Lakeside Florals","Jun 2022"],["Oak & Iron Furniture","Nov 2026"],["Pacific Surf Shop","Oct 2026"],["Redwood Realty Group","Nov 2026"],["Silverline Electronics","Nov 2026"],["Twin Pines Vineyard","Aug 2026"],["Urban Thread Apparel","Nov 2026"],["Valley Fresh Produce","Nov 2026"],["Willow Creek Candles","Jan 2024"],["Brightside Tutoring","Nov 2026"],["Crescent Moon Teas","Oct 2026"],["Driftwood Gallery","Nov 2026"],["Elm Street Books","Nov 2026"],["Fox & Hound Pub","Nov 2026"],["Granite Peak Gear","Nov 2026"],["Hilltop Veterinary","Oct 2026"],["Ironclad Fitness","Nov 2026"],["Juniper Skin Care","Nov 2026"],["Kestrel Drone Supply","Nov 2026"],["Lighthouse Charters","Jul 2026"],["Meadowlark Toys","Nov 2026"],["Nightingale Audio","Nov 2026"],["Orchard Lane Cider","Nov 2026"],["Pebble Beach Swimwear","Oct 2026"],["Quarry Stone Masonry","Nov 2026"],["Rosewood Interiors","Nov 2026"],["Sparrow Coffee Cart","Feb 2023"],["Thistle & Thyme Apothecary","Nov 2026"],["Upland Hardware","Nov 2026"]];
const XERO = [["Alder Coffee Roasters","Nov 2026"],["Birchwood Studio","Nov 2026"],["Coastal Kayak Rentals","Oct 2026"],["Dune Leather Goods","Nov 2026"],["Ember Hot Sauce","Apr 2024"],["Fjord Outdoor Ltd","Nov 2026"],["Glasshouse Plants","Nov 2026"],["Hearth Bakery","Nov 2026"]];
const STALE = d => /20(22|23|24)/.test(d);
const PLATFORMS = ["Stripe","Shopify","PayPal","Amazon","Square","WooCommerce"];
let S, nextId = 1;
function fresh(){ return { firm:"Doe & Partners CPA", me:"Jane Doe", clients:[], tab:"all", q:"", page:1, role:null, firstConnectedShown:false }; }
S = fresh();
function mk(name, source){ return { id:nextId++, name, source, state:'none', step:1, platforms:[], connected:[], pa:{state:'none'} }; }
function status(c){
  if(c.state==='done') return ['Connected','status-green'];
  if(c.state==='progress') return ['Setup in progress','status-yellow'];
  return ['Not set up','status-grey'];
}
const isConn = c => c.state==='done';
const connectedCount = () => S.clients.filter(isConn).length;
function paResult(seed){ const r = [[212,4,1240,2,18.4],[148,0,0,0,0],[96,7,3315.5,1,4.2],[301,2,86,0,0]][seed%4]; return {state:'done', platform:'Stripe', period:'Oct 1 – Oct 31, 2026', matched:r[0], missing:r[1], missingAmt:r[2], diff:r[3], diffAmt:r[4]}; }
function presetImported(){
  nextId = 1;
  S.clients = QBO.filter(x=>!STALE(x[1])).map(x=>mk(x[0],'qbo'));
  [[0,['Stripe']],[1,['Shopify','Stripe']],[2,['Square']],[3,['Stripe']]].forEach(([i,ints])=>{const c=S.clients[i];c.state='done';c.platforms=ints;c.connected=['QuickBooks Online',...ints];});
  [[5,2],[6,3]].forEach(([i,st])=>{const c=S.clients[i];c.state='progress';c.step=st;c.platforms=['Shopify'];});
  S.clients[0].pa = paResult(1); S.clients[8].pa = paResult(0); S.clients[9].pa = paResult(1); S.clients[10].pa = paResult(2);
  S.firstConnectedShown = true;
}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const initials = s => s.split(/\s+/).filter(w=>/[A-Za-z]/.test(w)).slice(0,2).map(w=>w[0].toUpperCase()).join('');
function toast(msg, kind='success'){
  const el = document.createElement('div');
  el.className = 'synder-toast synder-toast-'+kind; el.setAttribute('role','status');
  el.innerHTML = `<span class="material-icons">${kind==='error'?'error':kind==='info'?'info':'check_circle'}</span><span>${esc(msg)}</span><button class="synder-toast-close" aria-label="Close"><span class="material-icons">close</span></button>`;
  el.querySelector('button').onclick = ()=>el.remove();
  $('#toasts').appendChild(el); setTimeout(()=>el.remove(), 5000);
}
function modal(html, cls=''){
  $('#modal-root').innerHTML = `<div class="synder-overlay" id="ov"><div class="synder-modal ${cls}" role="dialog" aria-modal="true">${html}</div></div>`;
  $('#ov').addEventListener('mousedown', e=>{ if(e.target.id==='ov') closeModal(); });
  const f = $('#ov input:not([type=checkbox])'); if(f) f.focus();
}
function sheet(html){ $('#modal-root').innerHTML = `<div class="synder-side-sheet-bg" id="ov" onclick="closeModal()"></div><aside class="synder-side-sheet synder-side-sheet--wide" role="dialog" aria-modal="true" id="sheet">${html}</aside>`; }
function closeModal(){ $('#modal-root').innerHTML=''; }
function closeMenus(){ document.querySelectorAll('.dropdown-menu.show').forEach(m=>m.classList.remove('show')); }
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ if($('#modal-root').innerHTML) closeModal(); closeMenus(); } });
document.addEventListener('click', closeMenus);
const wait = ms => new Promise(r=>setTimeout(r,ms));
const spin = '<span class="spinner inline-spin"></span>';
const CARD = (id,icon,title,desc,sel,fn) => `<button class="choice-card" data-id="${id}" aria-pressed="${sel===id}" onclick="${fn}"><span class="material-icons">${icon}</span><span><span class="choice-card-title">${title}</span>${desc?`<span class="choice-card-desc">${desc}</span>`:''}</span></button>`;
function fieldErr(id, msg){ $('#'+id).classList.add('error'); const e=$('#'+id+'-err'); e.textContent=msg; e.hidden=false; }
function fieldOk(id){ $('#'+id).classList.remove('error'); $('#'+id+'-err').hidden=true; }

/* ---------- synder.com home (very simple; copy captured from synder.com 2026-11-11) ---------- */
function renderHome(){
  const o=$('#onb'); o.className='site';
  const stub="toast('Not part of this prototype','info');return false";
  o.innerHTML = `<header class="site-nav"><span class="site-logo"><span class="material-icons">sync_alt</span> synder</span>
      <nav><a href="#" onclick="${stub}">Why Synder</a><a href="#" onclick="${stub}">Customer Stories</a><a href="#" onclick="${stub}">Log in</a></nav>
      <span class="site-ctas"><button class="site-btn site-btn--ghost" id="home-signup" onclick="go('#start')">Sign up free</button><button class="site-btn site-btn--mint" onclick="${stub}">Book a demo</button></span></header>
    <section class="site-hero">
      <h1>Accounting Automation Software<br>for Retail, Ecommerce and SaaS</h1>
      <ul><li><span class="material-icons">check_circle</span>One platform for all channels</li><li><span class="material-icons">check_circle</span>Fast month-end close without manual work</li><li><span class="material-icons">check_circle</span>AI insights for strategic analysis</li></ul>
      <div class="site-ctas"><button class="site-btn site-btn--mint site-btn--lg" onclick="${stub}">Book a demo</button><button class="site-btn site-btn--ghost site-btn--lg" id="home-cta" onclick="go('#start')">Sign up free</button></div>
      <p>15-day free trial</p>
      <p class="site-muted">Top-rated on Intuit QuickBooks App Store, Xero Marketplace, and Capterra</p>
    </section>`;
}

/* ---------- sign-up ---------- */
function joinInfo(){
  modal(`<div class="synder-modal-header">Join your firm in Synder<button class="modal-close" aria-label="Close" onclick="closeModal()"><span class="material-icons">close</span></button></div>
    <div class="synder-modal-body"><p style="margin:0 0 16px">Ask your firm's admin to send you an invitation. It comes by email and adds you to the firm as a colleague.</p>
      <div class="form-field"><label class="form-label" for="join-mail">Your email</label><div class="row-gap"><input class="input" style="flex:1" id="join-mail" value="jane.doe@example.com" readonly><button class="btn-outlined" onclick="toast('Email copied')">Copy</button></div></div></div>
    <div class="synder-modal-footer"><button class="btn" onclick="closeModal()">OK</button></div>`, 'modal-md');
}
function renderOnb(){
  const h = location.hash; const o = $('#onb'); o.className = 'onb-col';
  $('#onb-exit').innerHTML = h==='#start' ? '<a class="text-link" href="#" onclick="return false">Log in</a>' : '';
  if(h==='#home'){ renderHome(); return; }
  if(h==='#start'){
    o.className = 'onb-col role-col';
    const card=(id,icon,t,d,btn,to)=>`<div class="role-card" id="${id}" role="button" tabindex="0" onclick="go('${to}')" onkeydown="if(event.key==='Enter')go('${to}')"><span class="material-icons">${icon}</span><h2>${t}</h2><p>${d}</p><span class="btn-outlined btn-lg role-btn">${btn}</span></div>`;
    o.innerHTML = `<h1 class="role-title">Who are you setting Synder up for?</h1>
      <div class="role-grid">
        ${card('go-practice','business_center','For practices','Accountants and bookkeepers who look after several clients.','Start as a practice','#signup')}
        ${card('go-business','storefront','For businesses','Owners and in-house finance teams running one business.','Start as a business','#business')}
      </div>`;
  } else if(h==='#signup'){
    o.className = 'onb-col narrow';
    o.innerHTML = `<h1 class="onb-title" style="margin-bottom:8px">Set up your practice</h1>
      <p class="onb-sub">This creates your firm in Synder. You'll be its admin: you add clients and invite colleagues.</p>
      <div class="onb-panel">

/* ---------- Billing and licences (proposal; prices + discount tiers from accounting-firm code 2026-11-13) ---------- */
const PLANS = {
  core: { name:'Synder Core', tiers:[['ess','Essential',100],['pro','Pro',250]], disc:[[11,15,5],[16,20,10],[21,1e9,15]], credits:'up to 3,000 sync credits per client' },
  adv:  { name:'Synder Advanced', tiers:[['ess','Essential',90],['pro','Pro',230],['max','Pro Max',480]], disc:[[8,10,5],[11,15,10],[16,1e9,15]], credits:'up to 20,000 sync credits per client' }
};
const MIN_LIC = 5, NEXT_CHARGE = 'Dec 1, 2026', DAYS_LEFT = 18;
const TIER_NAME = k => ({ess:'Essential',pro:'Pro',max:'Pro Max'})[k];
function freshBill(){ return { plan:null, period:'month', owned:{ess:0,pro:0,max:0}, tab:'all', sel:new Set() }; }
function presetBilling(subscribed){
  if(S.clients.length<12) presetImported();
  S.bill = freshBill();
  S.clients.forEach(c=>{ c.lic=null; c.own=null; c.moving=null; });
  [11,12,13].forEach((i,k)=>{ S.clients[i].own = [{plan:'Pro, yearly',renews:'Mar 3, 2027'},{plan:'Essential, monthly',renews:'Dec 9, 2026'},{plan:'Pro Max, yearly',renews:'Jun 20, 2027'}][k]; });
  if(subscribed){
    S.bill.plan='core'; S.bill.owned={ess:10,pro:3,max:0};
    for(let i=0;i<7;i++) S.clients[i].lic='ess';
    for(let i=7;i<10;i++) S.clients[i].lic='pro';
  }
}
const used = k => S.clients.filter(c=>c.lic===k).length;
const totalLic = o => Object.values(o).reduce((a,b)=>a+b,0);
function discPct(plan,n){ const t=PLANS[plan].disc.find(([a,b])=>n>=a&&n<=b); return t?t[2]:0; }
function nextTier(plan,n){ const t=PLANS[plan].disc.find(([a])=>a>n); return t?{need:t[0]-n,pct:t[2]}:null; }
function monthly(plan,owned,period){
  const sub = PLANS[plan].tiers.reduce((s,[k,,p])=>s+(owned[k]||0)*p,0);
  const pct = discPct(plan,totalLic(owned));
  const afterDisc = sub*(1-pct/100);
  return { sub, pct, disc:sub-afterDisc, total: period==='year'? afterDisc*0.8 : afterDisc };
}
const usd = n => '$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});

      </div>
      <div class="bill-tiers" id="bill-tiers">${P.tiers.map(([k,name])=>{const own=B.owned[k],u=used(k),left=own-u;return `

function billingClients(){
  const B=S.bill;
  if(!S.clients.length) return `<div class="card" style="margin-top:24px"><div class="empty-state"><div class="empty-state-title">No clients yet</div><button class="btn" onclick="go('#clients')">Bring in clients</button></div></div>`;
  const f = {all:()=>true, none:c=>!c.lic&&!c.moving, own:c=>!!c.own&&!c.moving, firm:c=>!!c.lic};

  const selN=B.sel.size;
  return `<div class="synder-page-section"><h2 class="sec-title">Clients</h2>
    <div class="tabs" role="tablist">${[['all','All'],['firm','Firm pays'],['none','No licence'],['own','Pays on its own']].map(([k,l])=>`<div class="tab ${B.tab===k?'active':''}" role="tab" aria-selected="${B.tab===k}" onclick="S.bill.tab='${k}';S.bill.sel.clear();renderBilling()">${l} <span class="tab-count">${cnt(k)}</span></div>`).join('')}</div>
    ${selN&&B.plan?`<div class="bulk-bar" id="bill-bulk"><b>${selN} selected</b><span class="synder-toolbar-divider"></span>${PLANS[B.plan].tiers.map(([k,n])=>`<button class="btn-outlined btn-sm" onclick="bulkLic('${k}')">Give ${n}</button>`).join('')}<button class="btn-outlined btn-sm" onclick="bulkLic('')">Remove licence</button><button class="btn-text btn-sm" style="margin-left:auto" onclick="S.bill.sel.clear();renderBilling()">Clear selection</button></div>`:''}
    ${selN&&!B.plan?`<div class="bulk-bar" id="bill-bulk"><b>${selN} selected</b><span class="synder-toolbar-divider"></span><button class="btn btn-sm" onclick="openBuy('core',{ess:Math.max(${MIN_LIC},${selN})})">Buy ${Math.max(MIN_LIC,selN)} licences for them</button><button class="btn-text btn-sm" style="margin-left:auto" onclick="S.bill.sel.clear();renderBilling()">Clear selection</button></div>`:''}
    <div class="table-wrap"><table class="synder-table table--lg" id="bill-table"><thead><tr><th class="col-check"><input class="checkbox" type="checkbox" aria-label="Select all" ${rows.length&&rows.every(c=>B.sel.has(c.id))?'checked':''} onchange="billAll(this.checked,[${rows.map(c=>c.id)}])"></th><th>Client</th><th>Licence</th><th>Who pays</th><th><span class="sr-only">Action</span></th></tr></thead>
    <tbody>${rows.length?rows.map(billingRow).join(''):`<tr><td colspan="5"><div class="empty-state"><div class="empty-state-title">No clients here</div></div></td></tr>`}</tbody></table></div></div>`;
}
function billAll(on,ids){ ids.forEach(id=>on?S.bill.sel.add(id):S.bill.sel.delete(id)); renderBilling(); }
function setLic(id,k,el){
  const c=byId(id), B=S.bill; el.value=c.lic||'';
  if(k && B.owned[k]-used(k)<=0){ shortfall(k,1,[id]); return; }
  if(k && c.own && !c.moving){ moveToFirm(id,k); return; }
  if(!k){ confirmLic(`Remove ${esc(c.name)}'s licence?`, `${TIER_NAME(c.lic)} goes back to your licences. ${esc(c.name)} has no plan until you give it one.`, 'Remove licence', ()=>{c.lic=null;c.moving=null;}, `${c.name}: licence removed`, true); return; }
  const left=B.owned[k]-used(k);
  confirmLic(`Give ${esc(c.name)} ${TIER_NAME(k)}?`, `${c.lic?`${TIER_NAME(c.lic)} → ${TIER_NAME(k)}. `:''}Uses 1 of ${left} ${TIER_NAME(k)} left. Your bill doesn't change.`, `Give ${TIER_NAME(k)}`, ()=>{c.lic=k;}, `${c.name}: ${TIER_NAME(k)} licence`);
}
function confirmLic(title,body,btn,fn,msg,danger){
  window._lic={fn,msg};
  modal(`<div class="synder-modal-header">${title}</div><div class="synder-modal-body">${body}</div>
    <div class="synder-modal-footer"><button class="btn-outlined" onclick="closeModal()">Cancel</button><button class="${danger?'btn-error':'btn'}" id="lic-go" onclick="window._lic.fn();closeModal();renderBilling();toast(window._lic.msg)">${btn}</button></div>`,'modal-confirm');
}
function switchPlan(){
  modal(`<div class="synder-modal-header">Big move ahead - we've got you</div>
    <div class="synder-modal-body">Moving between Core and Advanced isn't a one-click switch - it's a chance to reshape how Synder works for your firm. Your Synder Specialist will help you map your plans, clients, and features so you walk away with the best possible setup.</div>
    <div class="synder-modal-footer"><button class="btn-outlined" onclick="closeModal()">Close</button><button class="btn" onclick="closeModal();toast('Opens the HubSpot booking page — not part of this prototype','info')">Schedule time with my Synder Specialist</button></div>`,'modal-md');
}
function bulkLic(k){
  const B=S.bill, ids=[...B.sel];
  if(!k){ confirmLic(`Remove licences from ${ids.length} clients?`, `Their licences go back to your pool.`, 'Remove licences', ()=>{ids.forEach(id=>{const c=byId(id);c.lic=null;c.moving=null;}); B.sel.clear();}, `Licences removed from ${ids.length} clients`, true); return; }
  const need = ids.filter(id=>byId(id).lic!==k).length, left = B.owned[k]-used(k);
  if(need>left){ shortfall(k,need-left,ids); return; }
  confirmLic(`Give ${TIER_NAME(k)} to ${ids.length} clients?`, `Uses ${need} of ${left} ${TIER_NAME(k)} left. Your bill doesn't change.`, `Give ${TIER_NAME(k)}`, ()=>{ids.forEach(id=>{const c=byId(id); c.lic=k; if(c.own&&!c.moving) c.moving=c.own.renews;}); B.sel.clear();}, `${TIER_NAME(k)} given to ${ids.length} clients`);
}
function shortfall(k,n,ids){
  modal(`<div class="synder-modal-header">Not enough ${TIER_NAME(k)} licences</div>
    <div class="synder-modal-body">${used(k)} of ${S.bill.owned[k]} are in use. You need ${n} more.</div>
    <div class="synder-modal-footer"><button class="btn-outlined" onclick="closeModal()">Cancel</button><button class="btn" id="short-buy" onclick="closeModal();openBuy(null,{${k}:${n}},[${ids}],'${k}')">Buy ${n} more</button></div>`,'modal-confirm');
}
function moveToFirm(id,k){
  const c=byId(id), B=S.bill;
  if(!B.plan){ openBuy('core',{ess:MIN_LIC}); return; }
  const tiers=PLANS[B.plan].tiers;
  const opts=tiers.map(([t,n])=>{const left=B.owned[t]-used(t);return `<option value="${t}" ${t===(k||'ess')?'selected':''} ${left<=0?'disabled':''}>${n}${left<=0?' · none left':` · ${left} left`}</option>`}).join('');
  modal(`<div class="synder-modal-header">Move ${esc(c.name)} to a firm licence</div>
    <div class="synder-modal-body"><p style="margin:0 0 16px">${esc(c.name)} pays for <b>${c.own.plan}</b> itself. Its plan stays active until <b>${c.own.renews}</b>, then the firm licence takes over and its own plan is cancelled. Nobody is charged twice.</p>
      <div class="form-field"><label class="form-label" for="mv-tier">Firm licence</label><select class="select w-full" id="mv-tier">${opts}</select></div></div>
    <div class="synder-modal-footer"><button class="btn-outlined" onclick="closeModal()">Cancel</button><button class="btn" id="mv-go" onclick="doMove(${id})">Move on ${c.own.renews}</button></div>`,'modal-md');
}
function doMove(id){
  const c=byId(id), k=$('#mv-tier').value;
  if(S.bill.owned[k]-used(k)<=0){ closeModal(); shortfall(k,1,[id]); return; }
  c.lic=k; c.moving=c.own.renews; closeModal(); renderBilling(); toast(`${c.name} moves to the firm licence on ${c.own.renews}`);
}

/* buy / change licences side sheet */
function openBuy(plan,add,assignIds,assignTier){
  const B=S.bill, subscribed=!!B.plan;
  const draft = { plan: plan||B.plan||'core', period:B.period, owned:{...B.owned}, assignIds:assignIds||[], assignTier:assignTier||null };
  if(!subscribed && !totalLic(draft.owned)) draft.owned.ess=MIN_LIC;
  Object.entries(add||{}).forEach(([k,n])=>{ draft.owned[k]=subscribed? B.owned[k]+n : Math.max(draft.owned[k],n); });
  window._buy=draft; drawBuy();
}
function drawBuy(){
  const B=S.bill, D=window._buy, subscribed=!!B.plan, P=PLANS[D.plan];
  const m=monthly(D.plan,D.owned,D.period), cur=subscribed?monthly(B.plan,B.owned,B.period):null, n=totalLic(D.owned), nt=nextTier(D.plan,n);
  const delta = subscribed ? Math.max(0,(m.total-cur.total)*(DAYS_LEFT/30)) : (D.period==='year'?m.total*12:m.total);
  const changed = !subscribed || JSON.stringify(D.owned)!==JSON.stringify(B.owned) || D.period!==B.period;
  const html = `<div class="synder-side-sheet-header">${subscribed?'Buy licences':'Choose your licences'}<button class="btn-icon" aria-label="Close" onclick="closeModal()"><span class="material-icons">close</span></button></div>
    <div class="synder-side-sheet-body" id="buy-body">
      <div class="d-flex gap-16 mb-16">
        <div class="form-field flex-1"><label class="form-label" for="buy-plan">Plan</label>${subscribed?`<div style="line-height:32px">${P.name} · <a class="text-link" href="#" onclick="switchPlan();return false">Switch plan</a></div>`:`<select class="select w-full" id="buy-plan" onchange="window._buy.plan=this.value;window._buy.owned={ess:${MIN_LIC},pro:0,max:0};drawBuy()">${Object.entries(PLANS).map(([k,p])=>`<option value="${k}" ${k===D.plan?'selected':''}>${p.name}</option>`).join('')}</select>`}</div>
        <div class="form-field flex-1"><label class="form-label" for="buy-period">Billing</label><select class="select w-full" id="buy-period" onchange="if(${subscribed&&B.period==='year'}&&this.value==='month'){this.value='year';document.getElementById('period-err').hidden=false;return;}window._buy.period=this.value;drawBuy()"><option value="month" ${D.period==='month'?'selected':''}>Monthly</option><option value="year" ${D.period==='year'?'selected':''}>Yearly · 20% off</option></select><div class="form-error-msg" id="period-err" hidden>A yearly plan can't move to monthly here. Book a call.</div></div>
      </div>
      <table class="synder-table" id="buy-table"><thead><tr><th>Licence</th><th>Per client / month</th><th>In use</th><th>Quantity</th></tr></thead><tbody>
      ${P.tiers.map(([k,name,price])=>`<tr><td>${name}</td><td>${usd(D.period==='year'?price*0.8:price)}</td><td>${used(k)}</td><td><div class="qty"><button class="btn-icon btn-icon--bordered" aria-label="Fewer ${name}" onclick="stepQty('${k}',-1)"><span class="material-icons">remove</span></button><span class="qty-n" id="qty-${k}">${D.owned[k]||0}</span><button class="btn-icon btn-icon--bordered" aria-label="More ${name}" onclick="stepQty('${k}',1)"><span class="material-icons">add</span></button></div><div class="form-error-msg" id="qty-err-${k}" hidden></div></td></tr>`).join('')}
      </tbody></table>
      <div class="buy-sum">
        <div><span>${n} licences</span><span>${usd(D.period==='year'?m.sub*0.8:m.sub)}</span></div>
        ${m.pct?`<div class="text-success"><span>Volume discount ${m.pct}%</span><span>−${usd(D.period==='year'?m.disc*0.8:m.disc)}</span></div>`:''}
        ${nt?`<div class="text-secondary"><span>Add ${nt.need} more licence${nt.need>1?'s':''} for ${nt.pct}% off</span><span></span></div>`:''}
        <div class="buy-total"><span>Per month${D.period==='year'?', billed yearly':''}</span><span id="buy-month">${usd(m.total)}</span></div>
        ${subscribed?`<div class="text-secondary"><span>Today, for the ${DAYS_LEFT} days left in this period</span><span id="buy-today">${usd(delta)}</span></div>`:''}
      </div>
      ${D.assignTier?`<div class="alert alert-info" style="margin-top:16px"><span class="material-icons">info</span>After payment, ${D.assignIds.length} selected client${D.assignIds.length>1?'s get':' gets'} ${TIER_NAME(D.assignTier)}.</div>`:''}
    </div>
    <div class="synder-side-sheet-footer"><button class="btn-outlined" onclick="closeModal()">Cancel</button><button class="btn" id="buy-pay" onclick="payBuy()">${subscribed?(changed?`Pay ${usd(delta)}`:'Pay'):`Pay ${usd(delta)}`}</button></div>`;
  if($('#sheet')) $('#sheet').innerHTML=html; else sheet(html);
}
function stepQty(k,d){
  const D=window._buy, u=used(k), next=(D.owned[k]||0)+d, e=$('#qty-err-'+k);
  if(next<u){ e.textContent=`${u} in use. Remove the licence from clients first.`; e.hidden=false; return; }
  if(d<0 && totalLic(D.owned)-1<MIN_LIC){ e.textContent=`Minimum ${MIN_LIC} licences in total.`; e.hidden=false; return; }
  D.owned[k]=next; drawBuy();
}
async function payBuy(){
  const B=S.bill, D=window._buy, subscribed=!!B.plan;
  if(subscribed && JSON.stringify(D.owned)===JSON.stringify(B.owned) && D.period===B.period){ toast('Change a quantity or the billing period first','info'); return; }
  const b=$('#buy-pay'); b.disabled=true; b.innerHTML=spin+' Paying…'; await wait(subscribed?800:1200);
  B.plan=D.plan; B.period=D.period; B.owned={...D.owned};
  if(D.assignTier) D.assignIds.forEach(id=>{const c=byId(id); c.lic=D.assignTier; if(c.own&&!c.moving) c.moving=c.own.renews;});
  B.sel.clear(); closeModal(); renderBilling();
  toast(subscribed?'Licences updated':`${PLANS[B.plan].name} is active · ${totalLic(B.owned)} licences`);
}

/* ---------- routing ---------- */
const ONB = ['#home','#start','#signup','#name','#business'];
function go(h){ closeMenus(); const pg=document.getElementById('page'); if(pg) pg.scrollTop=0; if(location.hash===h) route(); else location.hash=h; }
function route(){
  if(!location.hash) history.replaceState(null,'',location.pathname+location.search+'#home');
  const h=location.hash, setup=h.startsWith('#setup-'), full=setup||ONB.includes(h);
  $('#s-onb').classList.toggle('on',full); $('#s-app').classList.toggle('on',!full); $('#s-onb').classList.toggle('is-home', h==='#home');
  closeModal();
  if(setup) renderSetup(); else if(full) renderOnb(); else renderShell();
}
window.addEventListener('hashchange', route);
function jumpTo(k){
  if(k==='bill-new'||k==='bill-sub'){ presetBilling(k==='bill-sub'); go('#billing'); return; }
  if(k==='home'){ S=fresh(); go('#home'); }
  else if(k==='start'){ S=fresh(); go('#start'); }
  else if(k==='signup'){ go('#signup'); }
  else if(k==='empty'){ S.clients=[]; S.firstConnectedShown=false; S.tab='all'; go('#clients'); }
  else if(k==='imported'){ presetImported(); S.tab='all'; S.page=1; S.q=''; go('#clients'); }
  else if(k==='dashboard'){ if(!connectedCount()) presetImported(); go('#dashboard'); }
}
function resetDemo(){ closeModal(); closeMenus(); S=fresh(); nextId=1; $('#toasts').innerHTML=''; go('#home'); }
function nextLogin(){
  if(ONB.includes(location.hash)){ toast('Create the firm first','info'); return; }
  go(connectedCount()?'#dashboard':'#clients');
  toast(connectedCount()?'Signed in · opened Dashboard (a client is connected)':'Signed in · opened Clients (no connected clients yet)','info');
}
route();
</script>
</body>
</html>
