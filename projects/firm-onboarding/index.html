<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synder — Firm onboarding for accountants</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../ui-kit/synder-ui-kit.css">
<link rel="stylesheet" href="../../ui-kit/proposed.css">   <!-- sketch components: not approved, not in the kit -->
<style>
  /* prototype chrome: demo controls in the dark bar */
  #vbar{position:relative;z-index:1200}
  .demo-ctrls{margin-left:auto;display:flex;align-items:center;gap:12px}
  .demo-ctrls select,.demo-ctrls button{font:inherit;font-size:14px;background:rgba(255,255,255,.1);color:var(--color-white);border:1px solid rgba(255,255,255,.25);border-radius:4px;padding:4px 8px;cursor:pointer}
  .demo-ctrls select option{color:var(--text-primary)}
  .demo-ctrls label{display:flex;align-items:center;gap:6px;cursor:pointer}
  html,body{height:100%}
  body{display:flex;flex-direction:column;min-width:1280px}
  .screen{display:none;flex:1;min-height:0}
  .screen.on{display:flex;flex-direction:column}
  .onb-body{flex:1;overflow:auto;background:var(--bg-page)}
  .onb-col{width:640px;margin:56px auto 48px}
  .onb-col.narrow{width:440px}
  .onb-sub{font-size:16px;line-height:24px;color:var(--text-secondary);margin:0 0 24px}
  /* synder.com marketing site — not product UI, not the kit. Values from synder.com CSS 2026-11-11:
     .section gradient #002658→#1c1f23, h1 Poppins 600 60/72 white, Book a demo #00feb2 on #01204f r8, Sign up free white outline */
  #s-onb.is-home > .topbar{display:none}
  #s-onb.is-home .onb-body{background:linear-gradient(#002658 75%,#1c1f23)}
  .site{color:#fff;font-family:Inter,Roboto,sans-serif;min-height:100%}
  .site-nav{display:flex;align-items:center;gap:40px;max-width:1180px;margin:0 auto;padding:24px 32px}
  .site-logo{display:flex;align-items:center;gap:6px;font-family:Poppins,sans-serif;font-size:24px;font-weight:600}
  .site-nav nav{display:flex;gap:32px;margin-left:auto}
  .site-nav nav a{color:#fff;text-decoration:none;font-size:16px}
  .site-ctas{display:flex;gap:16px;justify-content:center}
  .site-btn{font:500 16px/20px Inter,Roboto,sans-serif;border-radius:8px;padding:11px 20px;cursor:pointer;border:1px solid transparent}
  .site-btn--mint{background:#00feb2;color:#01204f}
  .site-btn--ghost{background:transparent;color:#fff;border-color:#fff}
  .site-btn--lg{padding:16px 32px;font-size:18px}
  .site-hero{max-width:960px;margin:0 auto;padding:96px 32px 120px;text-align:center}
  .site-hero h1{font-family:Poppins,sans-serif;font-size:60px;line-height:72px;font-weight:600;margin:0 0 32px}
  .site-hero ul{list-style:none;padding:0;margin:0 0 40px;display:flex;justify-content:center;gap:32px;font-size:18px}
  .site-hero li{display:flex;align-items:center;gap:8px}
  .site-hero li .material-icons{color:#00feb2}
  .site-hero p{margin:20px 0 0;font-size:16px}
  .site-muted{opacity:.7;margin-top:48px!important}
  #onb-exit{gap:24px}
  .role-col{width:960px;margin-top:80px}
  .role-title{font-size:36px;line-height:44px;font-weight:400;text-align:center;margin:0 0 48px}
  .role-grid{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:stretch}
  .role-card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;padding:48px 40px 40px;background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--radius-md);box-shadow:var(--shadow-card);cursor:pointer}
  .role-card:hover{border-color:var(--color-primary)}
  .role-card:focus-visible{outline:2px solid var(--border-focus);outline-offset:2px}
  .role-card > .material-icons{font-size:56px;color:var(--color-primary)}
  .role-card h2{font-size:24px;line-height:32px;font-weight:500;margin:0}
  .role-card p{font-size:18px;line-height:28px;color:var(--text-secondary);margin:0;flex:1}
  .role-btn{width:100%;justify-content:center;display:inline-flex;align-items:center;margin-top:16px}
  .onb-step{color:var(--text-secondary);margin-bottom:8px}
  .onb-title{font-size:24px;line-height:32px;font-weight:400;margin:0 0 24px}
  .onb-actions{display:flex;justify-content:space-between;align-items:center;margin-top:32px}
  .onb-panel{background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--radius-md);padding:24px}
  .or-line{display:flex;align-items:center;gap:12px;color:var(--text-secondary);margin:20px 0}
  .or-line::before,.or-line::after{content:'';flex:1;height:1px;background:var(--border-default)}
  .sso{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .app-main{flex:1;overflow:auto;display:block}
  .grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
  .setup-card{display:flex;align-items:center;gap:24px}
  .setup-card .progress{flex:1;max-width:360px}
  .name-cell{max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .integ-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border-default)}
  .integ-row:last-child{border-bottom:0}
  .integ-row .grow{flex:1}
  .dropzone{border:1px dashed var(--border-strong);border-radius:var(--radius-md);padding:16px;display:flex;align-items:center;gap:12px}
  .dropzone.has-file{border-style:solid;border-color:var(--color-green);background:var(--color-green-light)}
  .dropzone .grow{flex:1;min-width:0}
  .modal-scroll{max-height:380px;overflow:auto}
  .sec-title{font-size:16px;line-height:24px;font-weight:500;margin:0 0 12px}
  .row-gap{display:flex;align-items:center;gap:8px}
  .inline-spin{display:inline-block;width:16px;height:16px;vertical-align:middle}
  .proto-note{color:var(--text-secondary);border:1px dashed var(--border-strong);border-radius:var(--radius-md);padding:16px}
  tr.row-disabled td{color:var(--text-disabled)}
  /* org switcher with the firm pinned on top */
  .topbar-org{position:relative}
  .org-menu{position:absolute;left:8px;right:8px;top:100%;z-index:50;display:none;max-height:420px;overflow:auto;cursor:default}
  .org-menu.show{display:block}
  .org-menu .dropdown-item{display:flex;align-items:center;gap:8px}
  .org-menu .pinned{font-weight:500}
  .sidebar-item.stub{color:var(--text-disabled);pointer-events:none}
  .sidebar-item.stub .material-icons{color:var(--text-disabled)}
</style>
</head>
<body>
<div class="variant-switch" id="vbar">
  <span class="vs-label">Demo</span>
  <div class="demo-ctrls">
    <label for="jump">Jump to</label>
    <select id="jump" onchange="jumpTo(this.value);this.value=''">
      <option value="">…</option>
      <option value="home">synder.com home</option>
      <option value="start">Sign-up start</option>
      <option value="signup">Practice sign-up form</option>
      <option value="empty">Clients · empty</option>
      <option value="imported">Clients · 37 imported, 4 connected</option>
      <option value="dashboard">Dashboard</option>
    </select>
    <button onclick="nextLogin()">Simulate next login</button>
    <button id="reset" onclick="resetDemo()">Reset</button>
  </div>
</div>

<div class="synder-toast-stack" id="toasts" aria-live="polite"></div>

<!-- ========== FULL-PAGE FLOWS: sign-up, client setup ========== -->
<section class="screen on" id="s-onb">
  <div class="topbar">
    <a class="topbar-title"><span class="material-icons">sync_alt</span> Synder</a>
    <div class="topbar-actions" id="onb-exit"></div>
  </div>
  <div class="onb-body"><div class="onb-col" id="onb"></div></div>
</section>

<!-- ========== FIRM APP ========== -->
<section class="screen" id="s-app">
  <header class="topbar topbar--app">
    <div class="topbar-org" id="org-btn" role="button" tabindex="0" aria-haspopup="menu" onclick="toggleOrgMenu(event)"><span class="sidebar-org-avatar" id="org-av">JA</span><span class="topbar-org-name" id="org-name">Firm</span><span class="material-icons">expand_more</span>
      <div class="dropdown-menu org-menu" id="org-menu" role="menu"></div></div>
    <div class="topbar-right">
      <div class="topbar-balance" id="org-balance" hidden><span>Balance:</span> <b>10000</b><span class="topbar-meter"><span style="width:96%"></span></span></div>
      <a class="topbar-link">How it works?</a>
      <button class="topbar-icon" aria-label="Notifications"><span class="material-icons">notifications</span></button>
      <button class="topbar-icon" aria-label="Help"><span class="material-icons">help_outline</span><span class="material-icons topbar-caret">expand_more</span></button>
      <button class="topbar-icon" aria-label="Account"><span class="material-icons">person</span><span class="material-icons topbar-caret">expand_more</span></button>
    </div>
  </header>
  <div class="synder-layout" style="flex:1;min-height:0">
    <nav class="sidebar sidebar--notch" aria-label="Main">
      <div id="side-items"></div>
    </nav>
    <main class="synder-page app-main" id="page"></main>
  </div>
</section>

<div id="modal-root"></div>

<script>
/* ---------- data ---------- */
// [name, last transaction in the firm's QuickBooks]; older than 12 months = unticked on import
const QBO = [["Bluebird Bakery LLC","Nov 2026"],["Cedar & Pine Outfitters","Nov 2026"],["Harbor Light Coffee Co.","Nov 2026"],["Maple Street Dental","Oct 2026"],["Northwind Home & Garden Supply Co. — East Coast Wholesale Division LLC","Nov 2026"],["Sunrise Yoga Studio","Nov 2026"],["Atlas Freight Partners","Oct 2026"],["Golden Gate Pet Supply","Mar 2023"],["Riverbend Ceramics","Nov 2026"],["Copper Kettle Catering","Nov 2026"],["Evergreen Landscaping Inc.","Sep 2026"],["Summit Bike Works","Nov 2026"],["Lakeside Florals","Jun 2022"],["Oak & Iron Furniture","Nov 2026"],["Pacific Surf Shop","Oct 2026"],["Redwood Realty Group","Nov 2026"],["Silverline Electronics","Nov 2026"],["Twin Pines Vineyard","Aug 2026"],["Urban Thread Apparel","Nov 2026"],["Valley Fresh Produce","Nov 2026"],["Willow Creek Candles","Jan 2024"],["Brightside Tutoring","Nov 2026"],["Crescent Moon Teas","Oct 2026"],["Driftwood Gallery","Nov 2026"],["Elm Street Books","Nov 2026"],["Fox & Hound Pub","Nov 2026"],["Granite Peak Gear","Nov 2026"],["Hilltop Veterinary","Oct 2026"],["Ironclad Fitness","Nov 2026"],["Juniper Skin Care","Nov 2026"],["Kestrel Drone Supply","Nov 2026"],["Lighthouse Charters","Jul 2026"],["Meadowlark Toys","Nov 2026"],["Nightingale Audio","Nov 2026"],["Orchard Lane Cider","Nov 2026"],["Pebble Beach Swimwear","Oct 2026"],["Quarry Stone Masonry","Nov 2026"],["Rosewood Interiors","Nov 2026"],["Sparrow Coffee Cart","Feb 2023"],["Thistle & Thyme Apothecary","Nov 2026"],["Upland Hardware","Nov 2026"]];
const XERO = [["Alder Coffee Roasters","Nov 2026"],["Birchwood Studio","Nov 2026"],["Coastal Kayak Rentals","Oct 2026"],["Dune Leather Goods","Nov 2026"],["Ember Hot Sauce","Apr 2024"],["Fjord Outdoor Ltd","Nov 2026"],["Glasshouse Plants","Nov 2026"],["Hearth Bakery","Nov 2026"]];
const STALE = d => /20(22|23|24)/.test(d);
const PLATFORMS = ["Stripe","Shopify","PayPal","Amazon","Square","WooCommerce"];
let S, nextId = 1;
function fresh(){ return { firm:"Doe & Partners CPA", me:"Jane Doe", clients:[], tab:"all", q:"", page:1, role:null, firstConnectedShown:false }; }
S = fresh();
function mk(name, source){ return { id:nextId++, name, source, state:'none', step:1, platforms:[], connected:[], pa:{state:'none'} }; }
function status(c){
  if(c.state==='done') return ['Connected','status-green'];
  if(c.state==='progress') return ['Setup in progress','status-yellow'];
  return ['Not set up','status-grey'];
}
const isConn = c => c.state==='done';
const connectedCount = () => S.clients.filter(isConn).length;
function paResult(seed){ const r = [[212,4,1240,2,18.4],[148,0,0,0,0],[96,7,3315.5,1,4.2],[301,2,86,0,0]][seed%4]; return {state:'done', platform:'Stripe', period:'Oct 1 – Oct 31, 2026', matched:r[0], missing:r[1], missingAmt:r[2], diff:r[3], diffAmt:r[4]}; }
function presetImported(){
  nextId = 1;
  S.clients = QBO.filter(x=>!STALE(x[1])).map(x=>mk(x[0],'qbo'));
  [[0,['Stripe']],[1,['Shopify','Stripe']],[2,['Square']],[3,['Stripe']]].forEach(([i,ints])=>{const c=S.clients[i];c.state='done';c.platforms=ints;c.connected=['QuickBooks Online',...ints];});
  [[5,2],[6,3]].forEach(([i,st])=>{const c=S.clients[i];c.state='progress';c.step=st;c.platforms=['Shopify'];});
  S.clients[0].pa = paResult(1); S.clients[8].pa = paResult(0); S.clients[9].pa = paResult(1); S.clients[10].pa = paResult(2);
  S.firstConnectedShown = true;
}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const initials = s => s.split(/\s+/).filter(w=>/[A-Za-z]/.test(w)).slice(0,2).map(w=>w[0].toUpperCase()).join('');
function toast(msg, kind='success'){
  const el = document.createElement('div');
  el.className = 'synder-toast synder-toast-'+kind; el.setAttribute('role','status');
  el.innerHTML = `<span class="material-icons">${kind==='error'?'error':kind==='info'?'info':'check_circle'}</span><span>${esc(msg)}</span><button class="synder-toast-close" aria-label="Close"><span class="material-icons">close</span></button>`;
  el.querySelector('button').onclick = ()=>el.remove();
  $('#toasts').appendChild(el); setTimeout(()=>el.remove(), 5000);
}
function modal(html, cls=''){
  $('#modal-root').innerHTML = `<div class="synder-overlay" id="ov"><div class="synder-modal ${cls}" role="dialog" aria-modal="true">${html}</div></div>`;
  $('#ov').addEventListener('mousedown', e=>{ if(e.target.id==='ov') closeModal(); });
  const f = $('#ov input:not([type=checkbox])'); if(f) f.focus();
}
function sheet(html){ $('#modal-root').innerHTML = `<div class="synder-side-sheet-bg" id="ov" onclick="closeModal()"></div><aside class="synder-side-sheet synder-side-sheet--wide" role="dialog" aria-modal="true" id="sheet">${html}</aside>`; }
function closeModal(){ $('#modal-root').innerHTML=''; }
function closeMenus(){ document.querySelectorAll('.dropdown-menu.show').forEach(m=>m.classList.remove('show')); }
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ if($('#modal-root').innerHTML) closeModal(); closeMenus(); } });
document.addEventListener('click', closeMenus);
const wait = ms => new Promise(r=>setTimeout(r,ms));
const spin = '<span class="spinner inline-spin"></span>';
const CARD = (id,icon,title,desc,sel,fn) => `<button class="choice-card" data-id="${id}" aria-pressed="${sel===id}" onclick="${fn}"><span class="material-icons">${icon}</span><span><span class="choice-card-title">${title}</span>${desc?`<span class="choice-card-desc">${desc}</span>`:''}</span></button>`;
function fieldErr(id, msg){ $('#'+id).classList.add('error'); const e=$('#'+id+'-err'); e.textContent=msg; e.hidden=false; }
function fieldOk(id){ $('#'+id).classList.remove('error'); $('#'+id+'-err').hidden=true; }

/* ---------- synder.com home (very simple; copy captured from synder.com 2026-11-11) ---------- */
function renderHome(){
  const o=$('#onb'); o.className='site';
  const stub="toast('Not part of this prototype','info');return false";
  o.innerHTML = `<header class="site-nav"><span class="site-logo"><span class="material-icons">sync_alt</span> synder</span>
      <nav><a href="#" onclick="${stub}">Why Synder</a><a href="#" onclick="${stub}">Customer Stories</a><a href="#" onclick="${stub}">Log in</a></nav>
      <span class="site-ctas"><button class="site-btn site-btn--ghost" id="home-signup" onclick="go('#start')">Sign up free</button><button class="site-btn site-btn--mint" onclick="${stub}">Book a demo</button></span></header>
    <section class="site-hero">
      <h1>Accounting Automation Software<br>for Retail, Ecommerce and SaaS</h1>
      <ul><li><span class="material-icons">check_circle</span>One platform for all channels</li><li><span class="material-icons">check_circle</span>Fast month-end close without manual work</li><li><span class="material-icons">check_circle</span>AI insights for strategic analysis</li></ul>
      <div class="site-ctas"><button class="site-btn site-btn--mint site-btn--lg" onclick="${stub}">Book a demo</button><button class="site-btn site-btn--ghost site-btn--lg" id="home-cta" onclick="go('#start')">Sign up free</button></div>
      <p>15-day free trial</p>
      <p class="site-muted">Top-rated on Intuit QuickBooks App Store, Xero Marketplace, and Capterra</p>
    </section>`;
}

/* ---------- sign-up ---------- */
function joinInfo(){
  modal(`<div class="synder-modal-header">Join your firm in Synder<button class="modal-close" aria-label="Close" onclick="closeModal()"><span class="material-icons">close</span></button></div>
    <div class="synder-modal-body"><p style="margin:0 0 16px">Ask your firm's admin to send you an invitation. It comes by email and adds you to the firm as a colleague.</p>
      <div class="form-field"><label class="form-label" for="join-mail">Your email</label><div class="row-gap"><input class="input" style="flex:1" id="join-mail" value="jane.doe@example.com" readonly><button class="btn-outlined" onclick="toast('Email copied')">Copy</button></div></div></div>
    <div class="synder-modal-footer"><button class="btn" onclick="closeModal()">OK</button></div>`, 'modal-md');
}
function renderOnb(){
  const h = location.hash; const o = $('#onb'); o.className = 'onb-col';
  $('#onb-exit').innerHTML = h==='#start' ? '<a class="text-link" href="#" onclick="return false">Log in</a>' : '';
  if(h==='#home'){ renderHome(); return; }
  if(h==='#start'){
    o.className = 'onb-col role-col';
    const card=(id,icon,t,d,btn,to)=>`<div class="role-card" id="${id}" role="button" tabindex="0" onclick="go('${to}')" onkeydown="if(event.key==='Enter')go('${to}')"><span class="material-icons">${icon}</span><h2>${t}</h2><p>${d}</p><span class="btn-outlined btn-lg role-btn">${btn}</span></div>`;
    o.innerHTML = `<h1 class="role-title">Who are you setting Synder up for?</h1>
      <div class="role-grid">
        ${card('go-practice','business_center','For practices','Accountants and bookkeepers who look after several clients.','Start as a practice','#signup')}
        ${card('go-business','storefront','For businesses','Owners and in-house finance teams running one business.','Start as a business','#business')}
      </div>`;
  } else if(h==='#signup'){
    o.className = 'onb-col narrow';
    o.innerHTML = `<h1 class="onb-title" style="margin-bottom:8px">Set up your practice</h1>
      <p class="onb-sub">This creates your firm in Synder. You'll be its admin: you add clients and invite colleagues.</p>
      <div class="onb-panel">
        ${[['su-name','Your name','text','Jane Doe'],['su-mail','Work email','email','jane.doe@example.com'],['su-pass','Password','password','demo-password'],['su-firm','Firm name','text','Doe & Partners CPA']].map(([id,l,t,v])=>`<div class="form-field mb-16"><label class="form-label form-label-required" for="${id}">${l}</label><input class="input w-full" id="${id}" type="${t}" value="${esc(v)}" onkeydown="if(event.key==='Enter')signUp()"><div class="form-error-msg" id="${id}-err" hidden></div></div>`).join('')}
        <button class="btn w-full" id="su-go" onclick="signUp()">Create account</button>
        <div class="or-line">or sign up with</div>
        <div class="sso"><button class="btn-outlined" onclick="sso('Intuit')">Intuit</button><button class="btn-outlined" onclick="sso('Xero')">Xero</button><button class="btn-outlined" onclick="sso('Google')">Google</button></div>
      </div>
      <div class="onb-actions"><button class="btn-outlined" onclick="go('#start')">Back</button><button class="btn-text" id="join-firm" onclick="joinInfo()">My firm already uses Synder</button></div>`;
  } else if(h==='#name'){
    o.className = 'onb-col narrow';
    o.innerHTML = `<h1 class="onb-title">Name your firm</h1>
      <div class="onb-panel"><div class="form-field"><label class="form-label form-label-required" for="nf-firm">Firm name</label><input class="input w-full" id="nf-firm" placeholder="Doe & Partners CPA" onkeydown="if(event.key==='Enter')nameFirm()"><div class="form-error-msg" id="nf-firm-err" hidden></div></div></div>
      <div class="onb-actions"><button class="btn-outlined" onclick="go('#signup')">Back</button><button class="btn" id="nf-go" onclick="nameFirm()">Create firm</button></div>`;
    setTimeout(()=>$('#nf-firm')&&$('#nf-firm').focus(),0);
  } else if(h==='#business'){
    o.innerHTML = `<h1 class="onb-title">Business sign-up</h1><div class="proto-note">Today's sign-up and onboarding, unchanged in this prototype.</div>
      <div class="onb-actions"><button class="btn-outlined" onclick="go('#start')">Back</button><span></span></div>`;
  }
}
async function signUp(){
  const v = id => $('#'+id).value.trim(); let bad = false;
  ['su-name','su-mail','su-pass','su-firm'].forEach(fieldOk);
  if(!v('su-name')){ fieldErr('su-name','Required'); bad=true; }
  if(!v('su-mail')){ fieldErr('su-mail','Required'); bad=true; } else if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v('su-mail'))){ fieldErr('su-mail','Enter an email address'); bad=true; }
  if(!v('su-pass')){ fieldErr('su-pass','Required'); bad=true; } else if(v('su-pass').length<8){ fieldErr('su-pass','At least 8 characters'); bad=true; }
  if(!v('su-firm')){ fieldErr('su-firm','Required'); bad=true; }
  if(bad) return;
  S.me = v('su-name'); S.firm = v('su-firm');
  const b=$('#su-go'); b.disabled=true; b.innerHTML=spin+' Creating…'; await wait(900);
  enterFirm();
}
function sso(p){ go('#name'); }
async function nameFirm(){
  const v=$('#nf-firm').value.trim(); fieldOk('nf-firm');
  if(!v){ fieldErr('nf-firm','Required'); return; }
  S.firm=v; const b=$('#nf-go'); b.disabled=true; b.innerHTML=spin+' Creating…'; await wait(700);
  enterFirm();
}
function enterFirm(){ S.clients=[]; go('#clients'); toast('Firm created'); }

/* ---------- firm shell ---------- */
const FIRM_NAV = [['dashboard','dashboard','Dashboard'],['clients','groups','Clients'],['colleagues','badge','Colleagues'],['billing','receipt_long','Billing and licences'],['monitoring','monitor_heart','Monitoring'],['monthclose','event_available','Month close'],['settings','settings','Firm settings']];
const byId = id => S.clients.find(c=>c.id===id);
function renderShell(){
  const r = location.hash.slice(1);
  const client = r.startsWith('client-') ? byId(+r.split('-')[1]) : null;
  if(r.startsWith('client-') && !client){ go('#clients'); return; }
  $('#org-name').textContent = client ? client.name : S.firm;
  $('#org-av').textContent = initials(client ? client.name : S.firm) || 'C';
  $('#org-balance').hidden = !client;
  $('#side-items').innerHTML = client
    ? [['dashboard','Dashboard'],['receipt_long','Transactions'],['compare_arrows','Reconciliation'],['settings','Settings']].map(([ic,l])=>`<a class="sidebar-item stub"><span class="material-icons">${ic}</span><span class="sidebar-item-label">${l}</span></a>`).join('')
    : FIRM_NAV.map(([k,ic,l])=>`<a class="sidebar-item ${r===k?'active':''}" data-nav="${k}" href="#${k}"><span class="material-icons">${ic}</span><span class="sidebar-item-label">${l}</span></a>`).join('');
  if(client) renderClientWorkspace(client);
  else if(r==='clients') renderClients();
  else if(r==='dashboard') renderDashboard();
  else { const n=FIRM_NAV.find(x=>x[0]===r); if(!n){ go('#clients'); return; } $('#page').innerHTML = `<div class="synder-page-header"><div class="synder-page-header-text"><h1 class="synder-page-title">${n[2]}</h1></div></div><div class="proto-note" style="margin-top:16px">The existing firm page, unchanged in this prototype.</div>`; }
}
function toggleOrgMenu(e){
  e.stopPropagation(); const m=$('#org-menu'); const open=!m.classList.contains('show'); closeMenus(); if(!open) return;
  const list = S.clients.slice(0,8);
  m.innerHTML = `<div class="dropdown-item pinned" role="menuitem" id="org-firm" onclick="go('#clients')"><span class="material-icons">business_center</span>${esc(S.firm)}</div>
    ${S.clients.length?'<div class="dropdown-divider"></div>':''}
    ${list.map(c=>`<div class="dropdown-item" role="menuitem" onclick="go('#client-${c.id}')"><span class="name-cell" style="max-width:170px">${esc(c.name)}</span></div>`).join('')}
    ${S.clients.length>8?`<div class="dropdown-item text-link" role="menuitem" onclick="go('#clients')">All ${S.clients.length} clients</div>`:''}`;
  m.classList.add('show');
}

/* ---------- clients ---------- */
const ADD_CARDS = () => `<div class="choice-grid" style="grid-template-columns:repeat(3,minmax(0,1fr))">
    <button class="choice-card" id="imp-qbo" onclick="openImport('qbo')"><span class="material-icons">cloud_download</span><span><span class="choice-card-title">Import from QuickBooks or Xero</span></span></button>
    <button class="choice-card" id="imp-csv" onclick="importCsv()"><span class="material-icons">upload_file</span><span><span class="choice-card-title">Import a CSV file</span></span></button>
    <button class="choice-card" id="imp-manual" onclick="addManual()"><span class="material-icons">person_add</span><span><span class="choice-card-title">Add a client</span></span></button>
  </div>`;
function addMenu(){
  return `<div class="dropdown" id="add-dd"><button class="btn" onclick="const m=document.querySelector('#add-dd .dropdown-menu');const o=m.classList.contains('show');closeMenus();if(!o)m.classList.add('show');event.stopPropagation()">Add clients <span class="material-icons" style="font-size:20px;vertical-align:middle">expand_more</span></button>
    <div class="dropdown-menu" style="right:0;left:auto;min-width:260px">
      <div class="dropdown-item" onclick="openImport('qbo')">Import from QuickBooks</div>
      <div class="dropdown-item" onclick="openImport('xero')">Import from Xero</div>
      <div class="dropdown-item" onclick="importCsv()">Import a CSV file</div>
      <div class="dropdown-divider"></div>
      <div class="dropdown-item" onclick="addManual()">Add a client</div>
    </div></div>`;
}
function filtered(){ const q=S.q.toLowerCase(); return S.clients.filter(c=>(S.tab==='all'||c.state===S.tab) && (!q||c.name.toLowerCase().includes(q))); }
function paCell(c){
  const p=c.pa;
  if(p.state==='running') return `${spin} Running…`;
  if(p.state==='error') return `<span class="status status-red">Failed</span><span class="cell-subtext"><a class="text-link" href="#" onclick="openPA(${c.id});return false">Try again</a></span>`;
  if(p.state==='done'){
    const gap = p.missing+p.diff;
    return `<a class="text-link" href="#" data-act="view" onclick="viewPA(${c.id});return false">${gap?(p.missing?`${p.missing} missing in books`:`${p.diff} amount differences`):'Matches'}</a><span class="cell-subtext">${gap?money(p.missingAmt+p.diffAmt):p.platform+' · Oct 2026'}</span>`;
  }
  return `<button class="btn-text btn-sm" data-act="pa" onclick="openPA(${c.id})">Run pre-assessment</button>`;
}
function renderClients(){
  const p = $('#page');
  if(!S.clients.length){
    p.innerHTML = `<div class="synder-page-header"><div class="synder-page-header-text"><h1 class="synder-page-title">Clients</h1></div></div>
      <div class="card" style="padding:24px;max-width:880px;margin-top:24px" id="empty-clients">
        <h2 class="sec-title">Bring in your clients</h2>
        <p style="margin:-4px 0 16px">See how each client reconciles before you connect anything.</p>
        ${ADD_CARDS()}
      </div>`;
    return;
  }
  const total=S.clients.length, conn=connectedCount();
  const cnt = k => k==='all'?total:S.clients.filter(c=>c.state===k).length;
  const rows=filtered(), per=25, pages=Math.max(1,Math.ceil(rows.length/per)); if(S.page>pages) S.page=pages;
  const shown=rows.slice((S.page-1)*per, S.page*per);
  const nextUp = S.clients.find(c=>c.state==='progress') || S.clients.find(c=>c.state==='none');
  const paDone = S.clients.filter(c=>c.pa.state==='done').length;
  p.innerHTML = `<div class="synder-page-header"><div class="synder-page-header-text"><h1 class="synder-page-title">Clients</h1></div><div class="synder-page-actions">${addMenu()}</div></div>
    <div class="card setup-card" style="margin:24px 0 16px" id="setup-card">
      <div><div class="stat-value" id="conn-count">${conn} of ${total}</div><div class="stat-label" style="margin-top:0">clients connected</div></div>
      <div class="progress"><div class="progress-fill success" style="width:${Math.round(conn/total*100)}%"></div></div>
      <span class="text-secondary" id="pa-count">${paDone} pre-assessed</span>
      ${nextUp?`<button class="btn" id="setup-next" style="margin-left:auto" onclick="startSetup(${nextUp.id})">${nextUp.state==='progress'?'Continue':'Set up'} ${esc(nextUp.name.length>26?nextUp.name.slice(0,24)+'…':nextUp.name)}</button>`:''}
    </div>
    <div class="synder-list-block">
      <div class="tabs" role="tablist">
        ${[['all','All'],['none','Not set up'],['progress','Setup in progress'],['done','Connected']].map(([k,l])=>`<div class="tab ${S.tab===k?'active':''}" role="tab" aria-selected="${S.tab===k}" onclick="S.tab='${k}';S.page=1;renderClients()">${l} <span class="tab-count">${cnt(k)}</span></div>`).join('')}
      </div>
      <div class="synder-filter-bar"><div class="synder-filter-bar-fields"><div class="form-field" style="width:280px"><label class="form-label" for="cq">Search</label><input class="input input-search" id="cq" placeholder="Search by client name" value="${esc(S.q)}" oninput="S.q=this.value;S.page=1;renderClients();const e=document.getElementById('cq');e.focus();e.setSelectionRange(e.value.length,e.value.length)"></div></div></div>
      <div class="table-wrap"><table class="synder-table table--lg" id="ctable">
        <thead><tr><th>Client</th><th>Setup</th><th>Pre-assessment</th><th><span class="sr-only">Next step</span></th><th class="col-actions"><span class="sr-only">Actions</span></th></tr></thead>
        <tbody>${shown.length?shown.map(rowHtml).join(''):`<tr><td colspan="5"><div class="empty-state"><div class="empty-state-title">No clients match</div><button class="btn-outlined" onclick="S.q='';S.tab='all';renderClients()">Clear search</button></div></td></tr>`}</tbody>
      </table></div>
      <div class="synder-pagination"><span class="synder-pagination-range">${rows.length?(S.page-1)*per+1:0}–${Math.min(S.page*per,rows.length)} of ${rows.length}</span><span class="synder-pagination-pages">
        <button aria-label="Previous page" ${S.page<=1?'disabled':''} onclick="S.page--;renderClients()"><span class="material-icons">chevron_left</span></button>
        ${Array.from({length:pages},(_,i)=>`<button ${i+1===S.page?'aria-current="page"':''} onclick="S.page=${i+1};renderClients()">${i+1}</button>`).join('')}
        <button aria-label="Next page" ${S.page>=pages?'disabled':''} onclick="S.page++;renderClients()"><span class="material-icons">chevron_right</span></button></span></div>
    </div>`;
}
function rowHtml(c){
  const [st,cls]=status(c);
  const act = c.state==='done' ? `<button class="btn-outlined btn-sm" data-act="open" onclick="go('#client-${c.id}')">Open</button>`
    : `<button class="${c.state==='progress'?'btn-outlined':'btn'} btn-sm" data-act="setup" onclick="startSetup(${c.id})">${c.state==='progress'?'Continue':'Set up'}</button>`;
  return `<tr data-id="${c.id}">
    <td><div class="name-cell" title="${esc(c.name)}">${esc(c.name)}</div><span class="cell-subtext">${{qbo:'From QuickBooks',xero:'From Xero',csv:'From CSV',manual:'Added by name'}[c.source]}</span></td>
    <td><span class="status ${cls}">${st}</span>${c.state==='progress'?`<span class="cell-subtext">Step ${c.step} of 3</span>`:c.state==='done'?`<span class="cell-subtext">${esc(c.connected.filter(x=>PLATFORMS.includes(x)).join(', '))}</span>`:''}</td>
    <td>${paCell(c)}</td><td>${act}</td>
    <td class="col-actions"><div class="dropdown"><button class="btn-icon" aria-label="Actions for ${esc(c.name)}" onclick="const m=this.nextElementSibling;const o=m.classList.contains('show');closeMenus();if(!o)m.classList.add('show');event.stopPropagation()"><span class="material-icons">more_horiz</span></button>
      <div class="dropdown-menu" style="right:0;left:auto;min-width:220px">
        ${c.pa.state==='done'?`<div class="dropdown-item" onclick="openPA(${c.id})">Run pre-assessment again</div>`:''}
        <div class="dropdown-item danger" onclick="confirmRemove(${c.id})">Remove client</div>
      </div></div></td></tr>`;
}

/* ---------- add clients ---------- */
function addManual(){
  modal(`<div class="synder-modal-header">Add a client<button class="modal-close" aria-label="Close" onclick="closeModal()"><span class="material-icons">close</span></button></div>
    <div class="synder-modal-body"><div class="form-field"><label class="form-label form-label-required" for="m-name">Client name</label><input class="input w-full" id="m-name" onkeydown="if(event.key==='Enter')doManual()"><div class="form-error-msg" id="m-name-err" hidden></div></div></div>
    <div class="synder-modal-footer"><button class="btn-outlined" onclick="closeModal()">Cancel</button><button class="btn" id="m-add" onclick="doManual()">Add client</button></div>`, 'modal-md');
}
function doManual(){
  const n=$('#m-name').value.trim(); fieldOk('m-name');
  if(!n) return fieldErr('m-name','Required');
  if(S.clients.some(c=>c.name.toLowerCase()===n.toLowerCase())) return fieldErr('m-name','This client is already in your firm');
  S.clients.push(mk(n,'manual')); closeModal(); S.tab='all'; go('#clients'); renderClients(); toast(`${n} added`);
}
function openImport(kind){
  const name = kind==='qbo'?'QuickBooks':'Xero';
  modal(`<div class="synder-modal-header">Import from ${name}<button class="modal-close" aria-label="Close" onclick="closeModal()"><span class="material-icons">close</span></button></div>
    <div class="synder-modal-body" id="imp-body">
      <div class="tabs" role="tablist" style="margin-bottom:16px">${[['qbo','QuickBooks'],['xero','Xero']].map(([k,l])=>`<div class="tab ${k===kind?'active':''}" role="tab" aria-selected="${k===kind}" onclick="openImport('${k}')">${l}</div>`).join('')}</div>
      Sign in to your firm's ${name}. Synder reads your client list.</div>
    <div class="synder-modal-footer" id="imp-foot"><button class="btn-outlined" onclick="closeModal()">Cancel</button><button class="btn" id="imp-go" onclick="runImport('${kind}')">Sign in to ${name}</button></div>`, 'modal-md');
}
async function runImport(kind){
  const name = kind==='qbo'?'QuickBooks':'Xero';
  $('#imp-foot').innerHTML=''; $('#imp-body').innerHTML=`<div class="row-gap">${spin} Getting your client list from ${name}…</div>`;
  await wait(1100);
  if(false){
    $('#imp-body').innerHTML=`<div class="alert alert-error">${name} didn't return a client list. Sign in with your firm's login, not a client's company.</div>`;
    $('#imp-foot').innerHTML=`<button class="btn-outlined" onclick="closeModal()">Cancel</button><button class="btn" onclick="runImport('${kind}')">Try again</button>`; return;
  }
  const have=new Set(S.clients.map(c=>c.name)); const list = kind==='qbo'?QBO:XERO;
  window._imp={kind,list,q:'',sel:new Set(list.filter(x=>!have.has(x[0])&&!STALE(x[1])).map(x=>x[0]))};
  $('#ov .synder-modal').className='synder-modal modal-lg'; drawPicker();
}
function drawPicker(){
  const I=window._imp, have=new Set(S.clients.map(c=>c.name)), name=I.kind==='qbo'?'QuickBooks':'Xero';
  const vis=I.list.filter(x=>!I.q||x[0].toLowerCase().includes(I.q.toLowerCase())); const avail=vis.filter(x=>!have.has(x[0])).map(x=>x[0]);
  const allOn = avail.length && avail.every(n=>I.sel.has(n));
  $('#ov .synder-modal').innerHTML = `<div class="synder-modal-header">Pick clients to bring in · ${I.list.length} in ${name}<button class="modal-close" aria-label="Close" onclick="closeModal()"><span class="material-icons">close</span></button></div>
    <div class="synder-modal-body">
      <div class="form-field mb-16" style="width:280px"><label class="form-label" for="pick-q">Search</label><input class="input input-search" id="pick-q" placeholder="Search by client name" value="${esc(I.q)}" oninput="window._imp.q=this.value;drawPicker();const e=document.getElementById('pick-q');e.focus();e.setSelectionRange(e.value.length,e.value.length)"></div>
      <div class="modal-scroll"><table class="synder-table" id="pick-table"><thead><tr><th class="col-check"><input class="checkbox" type="checkbox" id="pick-all" aria-label="Select all" ${allOn?'checked':''} onchange="pickAll(this.checked)"></th><th>Client</th><th>Last transaction in ${name}</th><th></th></tr></thead><tbody>
      ${vis.map(([n,d])=>{const dup=have.has(n);return `<tr class="${dup?'row-disabled':''}"><td class="col-check"><input class="checkbox" type="checkbox" data-n="${esc(n)}" aria-label="Select ${esc(n)}" ${dup?'disabled':''} ${I.sel.has(n)?'checked':''} onchange="this.checked?window._imp.sel.add(this.dataset.n):window._imp.sel.delete(this.dataset.n);drawPicker()"></td><td><div class="name-cell" title="${esc(n)}">${esc(n)}</div></td><td class="${STALE(d)?'text-secondary':''}">${d}</td><td>${dup?'<span class="text-secondary">Already in your firm</span>':''}</td></tr>`}).join('')}
      </tbody></table></div></div>
    <div class="synder-modal-footer" style="align-items:center">${I.sel.size?'':'<span class="text-secondary" id="pick-reason" style="margin-right:auto">Select at least one client</span>'}<button class="btn-outlined" onclick="closeModal()">Cancel</button><button class="btn" id="pick-add" ${I.sel.size?'':'disabled'} onclick="finishImport()">Import ${I.sel.size} client${I.sel.size===1?'':'s'}</button></div>`;
  const pa=$('#pick-all'); if(pa) pa.indeterminate = !allOn && avail.some(n=>I.sel.has(n));
}
function pickAll(on){ const I=window._imp, have=new Set(S.clients.map(c=>c.name)); I.list.filter(x=>!have.has(x[0])&&(!I.q||x[0].toLowerCase().includes(I.q.toLowerCase()))).forEach(x=>on?I.sel.add(x[0]):I.sel.delete(x[0])); drawPicker(); }
function finishImport(){ const I=window._imp; [...I.sel].forEach(n=>S.clients.push(mk(n,I.kind))); closeModal(); S.tab='all'; S.page=1; go('#clients'); renderClients(); toast(`${I.sel.size} client${I.sel.size===1?'':'s'} imported`); }
const CSV_ROWS=[["Alpine Ski Rentals"],["Beacon Hardware"],[""],["Cobalt Pottery"],["Daisy Chain Florist"],["Echo Recording Studio"],["Falcon Courier"],["Bluebird Bakery LLC"],["Horizon Travel"],["Ivy League Prep"],["Jasper Kitchenware"],["Kite & Kayak"]];
function importCsv(){
  modal(`<div class="synder-modal-header">Import a CSV file<button class="modal-close" aria-label="Close" onclick="closeModal()"><span class="material-icons">close</span></button></div>
    <div class="synder-modal-body" id="csv-body"><div class="dropzone"><span class="material-icons text-secondary">upload_file</span><span class="grow">Any client export from your practice tool. Only the client name is needed.</span><button class="btn-outlined" id="csv-pick" onclick="parseCsv()">Choose file</button></div></div>
    <div class="synder-modal-footer" id="csv-foot"><button class="btn-outlined" onclick="closeModal()">Cancel</button><button class="btn" disabled>Import clients</button></div>`, 'modal-lg');
}
async function parseCsv(){
  $('#csv-body').innerHTML=`<div class="row-gap">${spin} Reading clients_export.csv…</div>`; await wait(700);
  const have=new Set(S.clients.map(c=>c.name));
  const rows=CSV_ROWS.map((r,i)=>({line:i+2,name:r[0],err:!r[0]?'No client name':have.has(r[0])?'Already in your firm':''}));
  window._csv=rows.filter(r=>!r.err);
  $('#csv-body').innerHTML=`<div class="d-flex gap-16 mb-16" style="align-items:flex-end"><div class="form-field" style="width:240px"><label class="form-label" for="csv-col">Column with client names</label><select class="select w-full" id="csv-col"><option>Company</option><option>Email</option><option>Billing cycle</option></select></div><span class="text-secondary" style="padding-bottom:6px">clients_export.csv · ${window._csv.length} ready · ${rows.length-window._csv.length} skipped · other columns ignored</span></div>
    <div class="modal-scroll"><table class="synder-table" id="csv-table"><thead><tr><th>Row</th><th>Client name</th><th>Result</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${r.line}</td><td>${esc(r.name)||'—'}</td><td>${r.err?`<span class="text-error">${r.err}</span>`:'<span class="status status-green">Ready</span>'}</td></tr>`).join('')}</tbody></table></div>`;
  $('#csv-foot').innerHTML=`<button class="btn-outlined" onclick="importCsv()">Choose another file</button><button class="btn" id="csv-add" onclick="finishCsv()">Import ${window._csv.length} clients</button>`;
}
function finishCsv(){ window._csv.forEach(r=>S.clients.push(mk(r.name,'csv'))); closeModal(); S.tab='all'; go('#clients'); renderClients(); toast(`${window._csv.length} clients imported`); }
function confirmRemove(id){
  const c=byId(id);
  modal(`<div class="synder-modal-header">Remove ${esc(c.name)}?</div><div class="synder-modal-body">The client leaves your firm's list.</div>
    <div class="synder-modal-footer"><button class="btn-outlined" onclick="closeModal()">Cancel</button><button class="btn-error" id="rm-go" onclick="S.clients=S.clients.filter(x=>x.id!==${id});closeModal();renderClients();toast('Client removed')">Remove client</button></div>`, 'modal-confirm');
}

/* ---------- pre-assessment ---------- */
const PA_SRC = { Stripe:['Stripe Balance report','Stripe → Reports → Balance → Download'], PayPal:['PayPal Activity download','PayPal → Activity → Download'] };
function openPA(id){
  const c=byId(id); window._pa={id,platform:'Stripe',src:null,led:null};
  modal(`<div class="synder-modal-header">Pre-assessment · ${esc(c.name.length>34?c.name.slice(0,32)+'…':c.name)}<button class="modal-close" aria-label="Close" onclick="closeModal()"><span class="material-icons">close</span></button></div>
    <div class="synder-modal-body" id="pa-body"></div>
    <div class="synder-modal-footer" id="pa-foot" style="align-items:center"></div>`, 'modal-md');
  drawPA();
}
function drawPA(){
  const P=window._pa, [srcLabel,srcHint]=PA_SRC[P.platform];
  const drop=(k,label,hint,file)=>`<div class="form-field mb-16"><span class="form-label">${label}</span><div class="dropzone ${file?'has-file':''}" id="dz-${k}"><span class="material-icons ${file?'text-success':'text-secondary'}">${file?'check_circle':'description'}</span><span class="grow text-truncate">${file?esc(file):'CSV file'}</span><button class="btn-outlined btn-sm" id="pick-${k}" onclick="pickFile('${k}')">${file?'Replace':'Choose file'}</button></div><div class="form-hint">${hint}</div></div>`;
  $('#pa-body').innerHTML = `<div class="form-field mb-16" style="width:200px"><label class="form-label" for="pa-plat">Payment platform</label><select class="select w-full" id="pa-plat" onchange="window._pa.platform=this.value;window._pa.src=null;drawPA()">${Object.keys(PA_SRC).map(k=>`<option ${k===P.platform?'selected':''}>${k}</option>`).join('')}</select></div>
    ${drop('src',srcLabel,srcHint,P.src)}
    ${drop('led',`${P.platform} clearing account from the books`,'QuickBooks or Xero → the account → Export, same period',P.led)}`;
  const ready=P.src&&P.led;
  $('#pa-foot').innerHTML = `${ready?'':'<span class="text-secondary" id="pa-reason" style="margin-right:auto">Add both files</span>'}<button class="btn-outlined" onclick="closeModal()">Cancel</button><button class="btn" id="pa-run" ${ready?'':'disabled'} onclick="runPA()">Run</button>`;
}
function pickFile(k){ const P=window._pa; P[k] = k==='src' ? (P.platform==='Stripe'?'balance_2026-10.csv':'paypal_activity_2026-10.csv') : 'clearing_account_2026-10.csv'; drawPA(); }
async function runPA(){
  const P=window._pa, c=byId(P.id); closeModal();
  c.pa={state:'running'}; renderClients(); toast(`Pre-assessment started: ${c.name}`,'info');
  await wait(1500);
  c.pa = {...paResult(c.id), platform:P.platform};
  if(location.hash==='#clients') renderClients();
  toast(c.pa.state==='error'?`Pre-assessment failed: ${c.name}`:`Pre-assessment ready: ${c.name}`, c.pa.state==='error'?'error':'success');
}
function viewPA(id){
  const c=byId(id), p=c.pa;
  const items=[['Oct 4, 2026','Charge ch_3Q8…a21','420.00'],['Oct 11, 2026','Charge ch_3Q9…f07','310.00'],['Oct 18, 2026','Refund re_3QA…c12','-90.00'],['Oct 29, 2026','Charge ch_3QC…b88','600.00']].slice(0,Math.min(4,p.missing));
  sheet(`<div class="synder-side-sheet-header">Pre-assessment · ${esc(c.name)}<button class="modal-close" aria-label="Close" onclick="closeModal()"><span class="material-icons">close</span></button></div>
    <div class="synder-side-sheet-body">
      <p class="text-secondary" style="margin:0 0 16px">${p.platform} · ${p.period}</p>
      <div class="grid4 mb-16">
        <div class="card stat-card"><div class="stat-value">${p.matched}</div><div class="stat-label">Matched</div></div>
        <div class="card stat-card"><div class="stat-value">${p.missing}</div><div class="stat-label">Missing in books${p.missing?` · ${money(p.missingAmt)}`:''}</div></div>
        <div class="card stat-card"><div class="stat-value">0</div><div class="stat-label">Missing in ${p.platform}</div></div>
        <div class="card stat-card"><div class="stat-value">${p.diff}</div><div class="stat-label">Amount differences${p.diff?` · ${money(p.diffAmt)}`:''}</div></div>
      </div>
      ${items.length?`<h2 class="sec-title">Missing in books</h2><table class="synder-table" id="pa-missing"><thead><tr><th>Date</th><th>${p.platform} transaction</th><th class="col-amount">Amount</th></tr></thead><tbody>${items.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td class="col-amount">${r[2]}</td></tr>`).join('')}</tbody></table>${p.missing>4?`<p class="text-secondary">and ${p.missing-4} more</p>`:''}`:''}
    </div>
    <div class="synder-side-sheet-footer"><button class="btn-outlined" onclick="closeModal()">Close</button>${c.state==='done'?`<button class="btn" onclick="go('#client-${c.id}')">Open client</button>`:`<button class="btn" id="pa-setup" onclick="startSetup(${c.id})">Set up to reconcile automatically</button>`}</div>`);
}

/* ---------- client setup = existing onboarding ---------- */
const UNC = '<span class="text-secondary">[live copy not captured]</span>';
function startSetup(id){ const c=byId(id); if(c.state==='none'){ c.state='progress'; c.step=1; } go('#setup-'+id); }
function setStep(id,n){ byId(id).step=n; renderSetup(); }
function renderSetup(){
  const id=+location.hash.split('-')[1], c=byId(id), o=$('#onb'); o.className='onb-col';
  if(!c){ go('#clients'); return; }
  $('#onb-exit').innerHTML=`<a class="text-link" id="back-clients" href="#clients">Back to clients</a>`;
  const tabs=['Provide Client details','Select integrations','Connect integrations'];
  const head=`<div class="onb-step">${esc(c.name)} · step ${c.step} of 3</div>
    <div class="tabs" role="tablist" style="margin-bottom:24px">${tabs.map((t,i)=>`<div class="tab ${c.step===i+1?'active':''}" role="tab" aria-selected="${c.step===i+1}" style="${i+1>c.step?'color:var(--text-disabled);cursor:default':''}" ${i+1<c.step?`onclick="setStep(${id},${i+1})"`:''}>${t}</div>`).join('')}</div>`;
  if(c.step===1){
    o.innerHTML=head+`<h1 class="onb-title">Provide your Client’s basic info</h1>
      <div class="onb-panel">
        <div class="form-field mb-16"><label class="form-label form-label-required" for="sc-name">Client name</label><input class="input w-full" id="sc-name" value="${esc(c.name)}"><div class="form-error-msg" id="sc-name-err" hidden></div></div>
        <div class="form-field mb-16"><label class="form-label" for="sc-web">What’s your business website?</label><input class="input w-full" id="sc-web"></div>
        <div class="d-flex gap-16 mb-16"><div class="form-field flex-1"><label class="form-label form-label-required" for="sc-tz">Time zone</label><select class="select w-full" id="sc-tz"><option>UTC</option></select></div>
        <div class="form-field flex-1"><label class="form-label form-label-required" for="sc-country">Country</label><select class="select w-full" id="sc-country"><option>United States</option></select></div></div>
        <div class="form-field mb-16"><label class="form-label form-label-required" for="sc-ind">Industry</label><select class="select w-full" id="sc-ind"><option>[live copy not captured]</option></select></div>
        <div class="form-field"><label class="form-label form-label-required" for="sc-age">How long has your Client been in business?</label><select class="select w-full" id="sc-age"><option>[live copy not captured]</option></select></div>
      </div>
      <div class="onb-actions"><button class="btn-outlined" onclick="go('#clients')">Back</button><button class="btn" id="sc-next" onclick="step1Next(${id})">Next step</button></div>`;
  } else if(c.step===2){
    o.innerHTML=head+`<h1 class="onb-title">Select integrations</h1><p style="margin:-16px 0 16px">${UNC}</p>
      <div class="choice-grid">${PLATFORMS.map(pl=>`<button class="choice-card" aria-pressed="${c.platforms.includes(pl)}" onclick="togglePl(${id},'${pl}')"><span class="material-icons">storefront</span><span><span class="choice-card-title">${pl}</span></span></button>`).join('')}</div>
      <div class="onb-actions"><button class="btn-outlined" onclick="setStep(${id},1)">Back</button><span class="row-gap">${c.platforms.length?'':'<span class="text-secondary" id="pl-reason">Select at least one integration</span>'}<button class="btn" id="sc-next" ${c.platforms.length?'':'disabled'} onclick="setStep(${id},3)">Next step</button></span></div>`;
  } else {
    const items=['QuickBooks Online',...c.platforms], done=items.every(x=>c.connected.includes(x));
    o.innerHTML=head+`<h1 class="onb-title">Connect integrations</h1><p style="margin:-16px 0 16px">${UNC}</p>
      <div class="onb-panel">${items.map((x,i)=>`<div class="integ-row"><span class="material-icons text-secondary">${i===0?'menu_book':'storefront'}</span><span class="grow">${esc(x)}${i===0?'<span class="cell-subtext">Books</span>':''}</span>${c.connected.includes(x)?'<span class="status status-green">Connected</span>':`<button class="btn-outlined btn-sm" data-p="${esc(x)}" onclick="connectIt(${id},'${esc(x)}',this)">Connect</button>`}</div>`).join('')}</div>
      <div class="onb-actions"><button class="btn-outlined" onclick="setStep(${id},2)">Back</button><span class="row-gap">${done?'':'<span class="text-secondary" id="fin-reason">Connect everything to finish</span>'}<button class="btn" id="sc-finish" ${done?'':'disabled'} onclick="finishSetup(${id})">Finish</button></span></div>`;
  }
}
function step1Next(id){ const v=$('#sc-name').value.trim(); fieldOk('sc-name'); if(!v) return fieldErr('sc-name','Required'); byId(id).name=v; setStep(id,2); }
function togglePl(id,pl){ const c=byId(id); c.platforms=c.platforms.includes(pl)?c.platforms.filter(x=>x!==pl):[...c.platforms,pl]; renderSetup(); }
async function connectIt(id,x,btn){ btn.disabled=true; btn.innerHTML=spin+' Connecting…'; await wait(800); const c=byId(id); if(!c.connected.includes(x)) c.connected.push(x); renderSetup(); }
function finishSetup(id){
  const c=byId(id); c.state='done'; c.connected=c.connected.filter(x=>x==='QuickBooks Online'||c.platforms.includes(x));
  go('#clients'); toast(`${c.name} is connected`);
  if(!S.firstConnectedShown){ S.firstConnectedShown=true; setTimeout(()=>toast('First client connected. From your next login, Synder opens on the Dashboard.'),400); }
}

/* ---------- client workspace (as today) ---------- */
function renderClientWorkspace(c){
  $('#page').innerHTML = `<p style="margin:0 0 16px"><a class="text-link" id="back-firm" href="#clients">← Back to ${esc(S.firm)}</a></p>
    <div class="synder-page-header"><div class="synder-page-header-text"><h1 class="synder-page-title">${esc(c.name)}</h1></div></div>
    ${c.state!=='done'?`<div class="alert alert-warning" id="ws-callout" style="margin:16px 0;align-items:center"><span class="material-icons">warning</span><span style="flex:1">Nothing syncs until this client is set up</span><button class="btn btn-sm" onclick="startSetup(${c.id})">${c.state==='progress'?'Continue setup':'Set up'}</button></div>`:''}
    <div class="proto-note" style="margin-top:16px">The client workspace as it is today, unchanged.</div>`;
}

/* ---------- dashboard ---------- */
const ISSUE_TYPES=[['Connection lost','QuickBooks Online','Reconnect'],['12 failed syncs','Stripe','Review'],['3 products not mapped','Shopify','Map products'],["Payout doesn't match deposit",'Square','Review']];
async function renderDashboard(){
  const p=$('#page'), conn=S.clients.filter(isConn), total=S.clients.length;
  if(!conn.length){
    p.innerHTML=`<div class="synder-page-header"><div class="synder-page-header-text"><h1 class="synder-page-title">Dashboard</h1></div></div>
      <div class="card" style="margin-top:24px"><div class="empty-state"><span class="material-icons empty-state-icon">insights</span><div class="empty-state-title">No connected clients yet</div><button class="btn" onclick="go('#clients')">Go to Clients</button></div></div>`;
    return;
  }
  p.innerHTML=`<div class="synder-page-header"><div class="synder-page-header-text"><h1 class="synder-page-title">Dashboard</h1></div></div><div class="grid4" style="margin-top:24px">${'<div class="card skeleton" style="height:96px"></div>'.repeat(4)}</div><div class="card skeleton" style="height:240px;margin-top:16px"></div>`;
  await wait(500); if(location.hash!=='#dashboard') return;
  const issues=conn.slice(0,4).map((c,i)=>({c,t:ISSUE_TYPES[i%4],since:['Nov 2, 2026','Nov 5, 2026','Nov 7, 2026','Nov 8, 2026'][i%4]})).slice(0,Math.max(1,conn.length-1));
  const setup=total-conn.length, gaps=S.clients.filter(c=>c.state!=='done'&&c.pa.state==='done'&&c.pa.missing+c.pa.diff>0).length;
  p.innerHTML=`<div class="synder-page-header"><div class="synder-page-header-text"><h1 class="synder-page-title">Dashboard</h1></div></div>
    ${setup?`<div class="alert alert-info" id="dash-setup" style="margin:24px 0 16px;align-items:center"><span class="material-icons">info</span><span style="flex:1">${setup} of ${total} clients aren't set up${gaps?` · ${gaps} of them have gaps in the pre-assessment`:''}</span><button class="btn btn-sm" onclick="S.tab='none';S.page=1;go('#clients')">Set up clients</button></div>`:''}
    <div class="grid4">
      <div class="card stat-card"><div class="stat-value">${conn.length} / ${total}</div><div class="stat-label">Clients connected</div></div>
      <div class="card stat-card"><div class="stat-value">${issues.length}</div><div class="stat-label">Clients with issues</div></div>
      <div class="card stat-card"><div class="stat-value">${S.clients.filter(c=>c.state==='progress').length}</div><div class="stat-label">Setup in progress</div></div>
      <div class="card stat-card"><div class="stat-value">${conn.length-issues.length}</div><div class="stat-label">Clients without issues</div></div>
    </div>
    <div class="synder-page-section"><h2 class="sec-title">Issues</h2>
    <div class="table-wrap"><table class="synder-table table--lg" id="issues"><thead><tr><th>Client</th><th>Issue</th><th>Where</th><th>Since</th><th class="col-actions"><span class="sr-only">Action</span></th></tr></thead><tbody>
      ${issues.map(x=>`<tr><td><div class="name-cell">${esc(x.c.name)}</div></td><td><span class="status ${x.t[0]==='Connection lost'?'status-red':'status-yellow'}">${x.t[0]}</span></td><td>${x.t[1]}</td><td>${x.since}</td><td class="col-actions"><button class="btn-outlined btn-sm" onclick="go('#client-${x.c.id}')">${x.t[2]}</button></td></tr>`).join('')}
    </tbody></table></div></div>`;
}

/* ---------- routing ---------- */
const ONB = ['#home','#start','#signup','#name','#business'];
function go(h){ closeMenus(); if(location.hash===h) route(); else location.hash=h; }
function route(){
  if(!location.hash) history.replaceState(null,'',location.pathname+location.search+'#home');
  const h=location.hash, setup=h.startsWith('#setup-'), full=setup||ONB.includes(h);
  $('#s-onb').classList.toggle('on',full); $('#s-app').classList.toggle('on',!full); $('#s-onb').classList.toggle('is-home', h==='#home');
  closeModal();
  if(setup) renderSetup(); else if(full) renderOnb(); else renderShell();
}
window.addEventListener('hashchange', route);
function jumpTo(k){
  if(k==='home'){ S=fresh(); go('#home'); }
  else if(k==='start'){ S=fresh(); go('#start'); }
  else if(k==='signup'){ go('#signup'); }
  else if(k==='empty'){ S.clients=[]; S.firstConnectedShown=false; S.tab='all'; go('#clients'); }
  else if(k==='imported'){ presetImported(); S.tab='all'; S.page=1; S.q=''; go('#clients'); }
  else if(k==='dashboard'){ if(!connectedCount()) presetImported(); go('#dashboard'); }
}
function resetDemo(){ closeModal(); closeMenus(); S=fresh(); nextId=1; $('#toasts').innerHTML=''; go('#home'); }
function nextLogin(){
  if(ONB.includes(location.hash)){ toast('Create the firm first','info'); return; }
  go(connectedCount()?'#dashboard':'#clients');
  toast(connectedCount()?'Signed in · opened Dashboard (a client is connected)':'Signed in · opened Clients (no connected clients yet)','info');
}
route();
</script>
</body>
</html>
