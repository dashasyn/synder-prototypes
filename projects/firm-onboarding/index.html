<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synder — Firm onboarding for accountants</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link rel="stylesheet" href="../../ui-kit/synder-ui-kit.css">
<link rel="stylesheet" href="../../ui-kit/proposed.css">   <!-- sketch components: not approved, not in the kit -->
<style>
  /* prototype chrome: demo controls in the dark bar */
  .demo-ctrls{margin-left:auto;display:flex;align-items:center;gap:12px}
  .demo-ctrls select,.demo-ctrls button{font:inherit;font-size:14px;background:rgba(255,255,255,.1);color:var(--color-white);border:1px solid rgba(255,255,255,.25);border-radius:4px;padding:4px 8px;cursor:pointer}
  .demo-ctrls select option{color:var(--text-primary)}
  .demo-ctrls label{display:flex;align-items:center;gap:6px;cursor:pointer}
  #vbar{position:relative;z-index:1200}
  html,body{height:100%}
  body{display:flex;flex-direction:column;min-width:1280px}
  .screen{display:none;flex:1;min-height:0}
  .screen.on{display:flex;flex-direction:column}
  /* onboarding layout */
  .onb-body{flex:1;overflow:auto;background:var(--bg-page)}
  .onb-col{width:640px;margin:56px auto 48px}
  .onb-step{color:var(--text-secondary);margin-bottom:8px}
  .onb-title{font-size:24px;line-height:32px;font-weight:400;margin:0 0 24px}
  .onb-actions{display:flex;justify-content:space-between;align-items:center;margin-top:32px}
  .onb-panel{background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--radius-md);padding:24px}
  /* firm app */
  .app-main{flex:1;overflow:auto;display:block}
  .grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
  .setup-card{display:flex;align-items:center;gap:24px}
  .setup-card .progress{flex:1;max-width:360px}
  .bulk-bar{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--bg-active);border-radius:var(--radius-sm);margin-bottom:8px}
  .name-cell{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .integ-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border-default)}
  .integ-row:last-child{border-bottom:0}
  .integ-row .grow{flex:1}
  .dropzone{border:1px dashed var(--border-strong);border-radius:var(--radius-md);padding:32px;text-align:center;color:var(--text-secondary)}
  .modal-scroll{max-height:420px;overflow:auto}
  .sec-title{font-size:16px;line-height:24px;font-weight:500;margin:0 0 12px}
  .row-gap{display:flex;align-items:center;gap:8px}
  .inline-spin{display:inline-block;width:16px;height:16px;vertical-align:middle}
  .proto-note{color:var(--text-secondary);border:1px dashed var(--border-strong);border-radius:var(--radius-md);padding:16px}
  tr.row-disabled td{color:var(--text-disabled)}
</style>
</head>
<body>
<div class="variant-switch" id="vbar">
  <span class="vs-label">Role question</span>
  <div class="vs-opts">
    <button id="vs-1" class="on" onclick="setVariant(1)">1 · One screen, 4 cards</button>
    <button id="vs-2" onclick="setVariant(2)">2 · Two screens</button>
  </div>
  <div class="demo-ctrls">
    <label for="jump">Jump to</label>
    <select id="jump" onchange="jumpTo(this.value);this.value=''">
      <option value="">…</option>
      <option value="start">Onboarding start</option>
      <option value="name">Firm name</option>
      <option value="empty">Clients · empty</option>
      <option value="imported">Clients · 37 imported, 4 connected</option>
      <option value="dashboard">Dashboard</option>
    </select>
    <label><input type="checkbox" id="qbo-err"> Import fails</label>
    <button onclick="nextLogin()">Simulate next login</button>
  </div>
</div>

<div class="synder-toast-stack" id="toasts" aria-live="polite"></div>

<!-- ========== ONBOARDING ========== -->
<section class="screen on" id="s-onb">
  <div class="topbar">
    <a class="topbar-title"><span class="material-icons">sync_alt</span> Synder</a>
    <div class="topbar-actions" id="onb-exit"><a class="text-link" href="#" onclick="return false">Log out</a></div>
  </div>
  <div class="onb-body"><div class="onb-col" id="onb"></div></div>
</section>

<!-- ========== FIRM APP ========== -->
<section class="screen" id="s-app">
  <div class="topbar">
    <a class="topbar-title"><span class="material-icons">sync_alt</span> Synder</a>
    <div class="topbar-actions"><button class="btn-icon" aria-label="Notifications"><span class="material-icons">notifications</span></button><div class="avatar">JD</div></div>
  </div>
  <div class="synder-layout" style="flex:1;min-height:0">
    <nav class="sidebar sidebar--notch" aria-label="Main">
      <div class="sidebar-org"><div class="sidebar-org-select"><span class="sidebar-org-avatar" id="firm-av">JA</span><span class="sidebar-org-name" id="firm-side-name">Firm</span><span class="material-icons">expand_more</span></div></div>
      <a class="sidebar-item" data-nav="dashboard" href="#dashboard"><span class="material-icons">dashboard</span><span class="sidebar-item-label">Dashboard</span></a>
      <a class="sidebar-item" data-nav="clients" href="#clients"><span class="material-icons">groups</span><span class="sidebar-item-label">Clients</span></a>
      <a class="sidebar-item" data-nav="colleagues" href="#colleagues"><span class="material-icons">badge</span><span class="sidebar-item-label">Colleagues</span></a>
      <a class="sidebar-item" data-nav="billing" href="#billing"><span class="material-icons">receipt_long</span><span class="sidebar-item-label">Billing</span></a>
    </nav>
    <main class="synder-page app-main" id="page"></main>
  </div>
</section>

<div id="modal-root"></div>

<script>
/* ---------- data ---------- */
const QBO_NAMES = ["Bluebird Bakery LLC","Cedar & Pine Outfitters","Harbor Light Coffee Co.","Maple Street Dental","Northwind Home & Garden Supply Co. — East Coast Wholesale Division LLC","Sunrise Yoga Studio","Atlas Freight Partners","Golden Gate Pet Supply","Riverbend Ceramics","Copper Kettle Catering","Evergreen Landscaping Inc.","Summit Bike Works","Lakeside Florals","Oak & Iron Furniture","Pacific Surf Shop","Redwood Realty Group","Silverline Electronics","Twin Pines Vineyard","Urban Thread Apparel","Valley Fresh Produce","Willow Creek Candles","Brightside Tutoring","Crescent Moon Teas","Driftwood Gallery","Elm Street Books","Fox & Hound Pub","Granite Peak Gear","Hilltop Veterinary","Ironclad Fitness","Juniper Skin Care","Kestrel Drone Supply","Lighthouse Charters","Meadowlark Toys","Nightingale Audio","Orchard Lane Cider","Pebble Beach Swimwear","Quarry Stone Masonry"];
const XERO_NAMES = ["Alder Coffee Roasters","Birchwood Studio","Coastal Kayak Rentals","Dune Leather Goods","Ember Hot Sauce","Fjord Outdoor Ltd","Glasshouse Plants","Hearth Bakery","Indigo Print Shop","Jade Garden Restaurant","Kiln & Clay","Linen Lane Home"];
const PLATFORMS = ["Stripe","Shopify","PayPal","Amazon","Square","WooCommerce"];
let S; // state
function fresh(){ return { variant:S?S.variant:1, firm:"Jane Doe Accounting", clients:[], tab:"all", q:"", page:1, sel:new Set(), onbPath:[], role:null, acct:null, firstConnectedShown:false }; }
S = fresh();
let nextId = 1;
function mk(name, source){ return { id:nextId++, name, source, ledger: source==='qbo'?'QuickBooks Online':source==='xero'?'Xero':null, state:'none', step:1, platforms:[], connected:[] }; }
// state: none = Not set up · progress = left onboarding mid-way · done = Connected (books + ≥1 integration)
function status(c){
  if(c.state==='done') return ['Connected','status-green'];
  if(c.state==='progress') return ['Setup in progress','status-yellow'];
  return ['Not set up','status-grey'];
}
const isConn = c => c.state==='done';
const connectedCount = () => S.clients.filter(isConn).length;
function presetImported(){
  S.clients = QBO_NAMES.map(n=>mk(n,'qbo'));
  [[0,['Stripe']],[1,['Shopify','Stripe']],[2,['Square']],[3,['Stripe']]].forEach(([i,ints])=>{const c=S.clients[i];c.state='done';c.platforms=ints;c.connected=[c.ledger,...ints];});
  [[5,2],[6,3]].forEach(([i,st])=>{const c=S.clients[i];c.state='progress';c.step=st;c.platforms=['Shopify'];});
  S.firstConnectedShown = true;
}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(msg, kind='success'){
  const el = document.createElement('div');
  el.className = 'synder-toast synder-toast-'+kind; el.setAttribute('role','status');
  el.innerHTML = `<span class="material-icons">${kind==='error'?'error':'check_circle'}</span><span>${esc(msg)}</span><button class="synder-toast-close" aria-label="Close"><span class="material-icons">close</span></button>`;
  el.querySelector('button').onclick = ()=>el.remove();
  $('#toasts').appendChild(el); setTimeout(()=>el.remove(), 5000);
}
function modal(html, cls=''){
  $('#modal-root').innerHTML = `<div class="synder-overlay" id="ov"><div class="synder-modal ${cls}" role="dialog" aria-modal="true">${html}</div></div>`;
  $('#ov').addEventListener('mousedown', e=>{ if(e.target.id==='ov') closeModal(); });
  const f = $('#ov').querySelector('input:not([type=checkbox]),button.btn'); if(f) f.focus();
}
function sheet(html){
  $('#modal-root').innerHTML = `<div class="synder-side-sheet-bg" id="ov" onclick="closeModal()"></div><aside class="synder-side-sheet" role="dialog" aria-modal="true">${html}</aside>`;
}
function closeModal(){ $('#modal-root').innerHTML=''; }
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && $('#modal-root').innerHTML) closeModal(); });
const wait = ms => new Promise(r=>setTimeout(r,ms));
const spin = '<span class="spinner inline-spin"></span>';

/* ---------- variant ---------- */
function setVariant(v){
  S.variant = v; document.querySelectorAll('.vs-opts button').forEach(b=>b.classList.toggle('on', b.id==='vs-'+v));
  const u = new URL(location); u.searchParams.set('v', v); history.replaceState(null,'',u);
  if(location.hash.startsWith('#onb') || !location.hash) go('#onb-role');
}

/* ---------- onboarding ---------- */
const CARD = (id,icon,title,desc,sel) => `<button class="choice-card" data-id="${id}" aria-pressed="${sel===id}" onclick="pick('${id}')"><span class="material-icons">${icon}</span><span><span class="choice-card-title">${title}</span><span class="choice-card-desc">${desc}</span></span></button>`;
function stepLabel(n){ const total = S.variant===1 ? 2 : 3; return `<div class="onb-step">Step ${n} of ${total}</div>`; }
function pick(id){ S.role = id; renderOnb(); }
function renderOnb(){
  const h = location.hash; const o = $('#onb');
  if(h==='#onb-role' && S.variant===1){
    o.innerHTML = stepLabel(1)+`<h1 class="onb-title">What describes you best?</h1>
      <div class="choice-grid">
        ${CARD('own','business_center','I run an accounting firm','Bookkeeping or accounting practice',S.role)}
        ${CARD('staff','badge','I work at an accounting firm','My firm already uses Synder',S.role)}
        ${CARD('inhouse','apartment','Accountant at a company','I keep the books for my employer',S.role)}
        ${CARD('biz','storefront','Business owner or team','I sell online',S.role)}
      </div>
      <div class="onb-actions"><span></span><button class="btn" id="next" ${S.role?'':'disabled'} onclick="roleNext()">Next step</button></div>`;
  } else if(h==='#onb-role' && S.variant===2){
    const sel = S.acct===true?'yes':S.acct===false?'no':null;
    o.innerHTML = stepLabel(1)+`<h1 class="onb-title">Are you an accountant or bookkeeper?</h1>
      <div class="choice-grid">
        <button class="choice-card" aria-pressed="${sel==='yes'}" onclick="S.acct=true;renderOnb()"><span class="material-icons">calculate</span><span><span class="choice-card-title">Yes, I'm an accountant</span><span class="choice-card-desc">Or a bookkeeper</span></span></button>
        <button class="choice-card" aria-pressed="${sel==='no'}" onclick="S.acct=false;renderOnb()"><span class="material-icons">storefront</span><span><span class="choice-card-title">No, I run a business</span><span class="choice-card-desc">Or work on its team</span></span></button>
      </div>
      <div class="onb-actions"><span></span><button class="btn" id="next" ${S.acct===null?'disabled':''} onclick="S.acct?go('#onb-where'):go('#onb-business')">Next step</button></div>`;
  } else if(h==='#onb-where'){
    if(S.role==='biz') S.role=null;
    o.innerHTML = stepLabel(2)+`<h1 class="onb-title">Where do you work?</h1>
      <div class="choice-grid">
        ${CARD('own','business_center','I run an accounting firm','Bookkeeping or accounting practice',S.role)}
        ${CARD('staff','badge','I work at an accounting firm','My firm already uses Synder',S.role)}
        ${CARD('inhouse','apartment','At a company','I keep the books for my employer',S.role)}
      </div>
      <div class="onb-actions"><button class="btn-outlined" onclick="go('#onb-role')">Back</button><button class="btn" id="next" ${S.role?'':'disabled'} onclick="roleNext()">Next step</button></div>`;
  } else if(h==='#onb-name'){
    const n = S.variant===1?2:3;
    o.innerHTML = stepLabel(n)+`<h1 class="onb-title">Name your firm</h1>
      <div class="onb-panel">
        <div class="form-field"><label class="form-label form-label-required" for="firm-name">Firm name</label>
        <input class="input w-full" id="firm-name" value="" placeholder="e.g. Doe & Partners CPA" onkeydown="if(event.key==='Enter')createFirm()">
        <div class="form-error-msg" id="firm-err" hidden>Required</div></div>
      </div>
      <div class="onb-actions"><button class="btn-outlined" onclick="history.back()">Back</button><button class="btn" id="create" onclick="createFirm()">Create firm</button></div>`;
    setTimeout(()=>$('#firm-name')&&$('#firm-name').focus(),0);
  } else if(h==='#onb-join'){
    o.innerHTML = `<h1 class="onb-title">Ask your firm's admin to add you</h1>
      <div class="onb-panel">
        <p class="text-body" style="margin:0 0 16px">The admin adds you in Synder → Colleagues. Send them the email you signed up with:</p>
        <div class="row-gap"><input class="input" style="flex:1" value="jane.doe@example.com" readonly aria-label="Your email"><button class="btn-outlined" onclick="toast('Email copied')">Copy</button></div>
        <p style="margin:16px 0 0">You'll get an invitation email when they add you.</p>
      </div>
      <div class="onb-actions"><button class="btn-outlined" onclick="history.back()">Back</button><button class="btn-text" id="no-firm" onclick="S.role='own';go('#onb-name')">My firm isn't in Synder yet</button></div>`;
  } else if(h==='#onb-business'){
    o.innerHTML = `<h1 class="onb-title">Business onboarding</h1>
      <div class="proto-note">Existing onboarding, unchanged in this prototype: Provide your business details → Select integrations → Connect integrations.</div>
      <div class="onb-actions"><button class="btn-outlined" onclick="history.back()">Back</button><span></span></div>`;
  }
}
function roleNext(){
  if(S.role==='own') go('#onb-name');
  else if(S.role==='staff') go('#onb-join');
  else go('#onb-business');
}
async function createFirm(){
  const inp = $('#firm-name'); const v = inp.value.trim();
  if(!v){ inp.classList.add('error'); $('#firm-err').hidden=false; inp.focus(); return; }
  S.firm = v; const b = $('#create'); b.disabled = true; b.innerHTML = spin+' Creating…';
  await wait(900);
  go('#clients'); toast('Firm created');
}

/* ---------- firm app pages ---------- */
function renderApp(){
  const r = location.hash.slice(1);
  $('#firm-side-name').textContent = S.firm;
  $('#firm-av').textContent = S.firm.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');
  document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('active', a.dataset.nav===r));
  if(r==='clients') renderClients();
  else if(r==='dashboard') renderDashboard();
  else $('#page').innerHTML = `<div class="synder-page-header"><div class="synder-page-header-text"><h1 class="synder-page-title">${r==='billing'?'Billing':'Colleagues'}</h1></div></div><div class="proto-note">Not part of this prototype.</div>`;
}

const IMPORT_CARDS = () => `
  <div class="choice-grid">
    <button class="choice-card" id="imp-qbo" onclick="importLedger('qbo')"><span class="material-icons">cloud_sync</span><span><span class="choice-card-title">Import from QuickBooks Online Accountant</span><span class="choice-card-desc">Your client list from QuickBooks</span></span></button>
    <button class="choice-card" id="imp-xero" onclick="importLedger('xero')"><span class="material-icons">cloud_sync</span><span><span class="choice-card-title">Import from Xero</span><span class="choice-card-desc">Your client list from Xero HQ</span></span></button>
    <button class="choice-card" id="imp-csv" onclick="importCsv()"><span class="material-icons">upload_file</span><span><span class="choice-card-title">Upload a CSV file</span><span class="choice-card-desc">One client per row</span></span></button>
    <button class="choice-card" id="imp-manual" onclick="addManual()"><span class="material-icons">person_add</span><span><span class="choice-card-title">Add a client</span><span class="choice-card-desc">One at a time</span></span></button>
  </div>`;

function addMenu(){
  return `<div class="dropdown" id="add-dd"><button class="btn" onclick="document.querySelector('#add-dd .dropdown-menu').classList.toggle('show');event.stopPropagation()">Add clients <span class="material-icons" style="font-size:20px;vertical-align:middle">expand_more</span></button>
    <div class="dropdown-menu" style="right:0;left:auto;min-width:280px">
      <div class="dropdown-item" onclick="importLedger('qbo')">Import from QuickBooks Online Accountant</div>
      <div class="dropdown-item" onclick="importLedger('xero')">Import from Xero</div>
      <div class="dropdown-item" onclick="importCsv()">Upload a CSV file</div>
      <div class="dropdown-divider"></div>
      <div class="dropdown-item" onclick="addManual()">Add a client</div>
    </div></div>`;
}
document.addEventListener('click', ()=>document.querySelectorAll('.dropdown-menu.show').forEach(m=>m.classList.remove('show')));

function filtered(){
  const q = S.q.toLowerCase();
  return S.clients.filter(c=>{
    if(S.tab!=='all' && c.state!==S.tab) return false;
    return !q || c.name.toLowerCase().includes(q);
  });
}
function renderClients(){
  const p = $('#page');
  if(!S.clients.length){
    p.innerHTML = `<div class="synder-page-header"><div class="synder-page-header-text"><h1 class="synder-page-title">Clients</h1></div></div>
      <div class="card" style="padding:24px;max-width:880px">
        <h2 class="sec-title">Bring in your client list</h2>
        ${IMPORT_CARDS()}
      </div>`;
    return;
  }
  const total = S.clients.length, conn = connectedCount();
  const cnt = k => k==='all' ? total : S.clients.filter(c=>c.state===k).length;
  const rows = filtered(); const per = 25; const pages = Math.max(1, Math.ceil(rows.length/per)); if(S.page>pages) S.page=pages;
  const shown = rows.slice((S.page-1)*per, S.page*per);
  const selN = S.sel.size;
  const nextUp = S.clients.find(c=>c.state==='progress') || S.clients.find(c=>c.state==='none');
  p.innerHTML = `<div class="synder-page-header"><div class="synder-page-header-text"><h1 class="synder-page-title">Clients</h1></div><div class="synder-page-actions">${addMenu()}</div></div>
    <div class="card setup-card" style="margin-bottom:16px" id="setup-card">
      <div><div class="stat-value" id="conn-count">${conn} of ${total}</div><div class="stat-label" style="margin-top:0">clients connected</div></div>
      <div class="progress"><div class="progress-fill success" style="width:${total?Math.round(conn/total*100):0}%"></div></div>
      ${nextUp?`<button class="btn" id="setup-next" style="margin-left:auto" onclick="startSetup(${nextUp.id})">${nextUp.state==='progress'?'Continue':'Set up'} ${esc(nextUp.name.length>28?nextUp.name.slice(0,26)+'…':nextUp.name)}</button>`:''}
    </div>
    <div class="synder-list-block">
      <div class="tabs" role="tablist">
        ${[['all','All'],['none','Not set up'],['progress','Setup in progress'],['done','Connected']].map(([k,l])=>`<div class="tab ${S.tab===k?'active':''}" role="tab" aria-selected="${S.tab===k}" onclick="S.tab='${k}';S.page=1;S.sel.clear();renderClients()">${l} <span class="tab-count">${cnt(k)}</span></div>`).join('')}
      </div>
      <div class="synder-filter-bar"><div class="synder-filter-bar-fields"><div class="form-field" style="width:280px"><label class="form-label" for="cq">Search</label><input class="input input-search" id="cq" placeholder="Search by client name" value="${esc(S.q)}" oninput="S.q=this.value;S.page=1;renderClients();const e=document.getElementById('cq');e.focus();e.setSelectionRange(e.value.length,e.value.length)"></div></div></div>
      ${selN?`<div class="bulk-bar" id="bulk"><b>${selN} selected</b><span class="synder-toolbar-divider"></span>
        <button class="btn-outlined-error btn-sm" onclick="confirmRemove([...S.sel])">Remove</button>
        <button class="btn-text btn-sm" style="margin-left:auto" onclick="S.sel.clear();renderClients()">Clear selection</button></div>`:''}
      <div class="table-wrap"><table class="synder-table table--lg" id="ctable">
        <thead><tr><th class="col-check"><input class="checkbox" type="checkbox" aria-label="Select all on page" ${shown.length&&shown.every(c=>S.sel.has(c.id))?'checked':''} onchange="shown_toggle(this.checked)"></th><th>Client</th><th>Books</th><th>Integrations</th><th>Status</th><th><span class="sr-only">Setup</span></th><th class="col-actions"><span class="sr-only">Actions</span></th></tr></thead>
        <tbody>${shown.length? shown.map(rowHtml).join('') : `<tr><td colspan="7"><div class="empty-state"><div class="empty-state-title">No clients match</div><button class="btn-outlined" onclick="S.q='';S.tab='all';renderClients()">Clear search</button></div></td></tr>`}</tbody>
      </table></div>
      <div class="synder-pagination"><span class="synder-pagination-range">${rows.length?(S.page-1)*per+1:0}–${Math.min(S.page*per,rows.length)} of ${rows.length}</span><span class="synder-pagination-pages">
        <button aria-label="Previous page" ${S.page<=1?'disabled':''} onclick="S.page--;renderClients()"><span class="material-icons">chevron_left</span></button>
        ${Array.from({length:pages},(_,i)=>`<button ${i+1===S.page?'aria-current="page"':''} onclick="S.page=${i+1};renderClients()">${i+1}</button>`).join('')}
        <button aria-label="Next page" ${S.page>=pages?'disabled':''} onclick="S.page++;renderClients()"><span class="material-icons">chevron_right</span></button></span></div>
    </div>`;
  window._shown = shown.map(c=>c.id);
}
function shown_toggle(on){ window._shown.forEach(id=> on?S.sel.add(id):S.sel.delete(id)); renderClients(); }
function rowHtml(c){
  const [st, cls] = status(c);
  const books = c.state==='done' ? esc(c.ledger||'QuickBooks Online') : (c.ledger?`<span class="text-secondary">${esc(c.ledger)}</span>`:'<span class="text-secondary">—</span>');
  const integ = c.state==='done' ? esc(c.connected.filter(x=>PLATFORMS.includes(x)).join(', ')) : '<span class="text-secondary">—</span>';
  const act = c.state==='done' ? '' : `<button class="${c.state==='progress'?'btn-outlined':'btn'} btn-sm" data-act="setup" onclick="startSetup(${c.id})">${c.state==='progress'?'Continue':'Set up'}</button>`;
  return `<tr data-id="${c.id}"><td class="col-check"><input class="checkbox" type="checkbox" aria-label="Select ${esc(c.name)}" ${S.sel.has(c.id)?'checked':''} onchange="this.checked?S.sel.add(${c.id}):S.sel.delete(${c.id});renderClients()"></td>
    <td><div class="name-cell" title="${esc(c.name)}">${esc(c.name)}</div><span class="cell-subtext">${{qbo:'From QuickBooks',xero:'From Xero',csv:'From CSV',manual:'Added manually'}[c.source]}</span></td>
    <td>${books}</td><td>${integ}</td><td><span class="status ${cls}">${st}</span>${c.state==='progress'?`<span class="cell-subtext">Step ${c.step} of 3</span>`:''}</td><td>${act}</td>
    <td class="col-actions"><div class="dropdown"><button class="btn-icon" aria-label="Actions for ${esc(c.name)}" onclick="const m=this.nextElementSibling;document.querySelectorAll('.dropdown-menu.show').forEach(x=>x!==m&&x.classList.remove('show'));m.classList.toggle('show');event.stopPropagation()"><span class="material-icons">more_horiz</span></button>
      <div class="dropdown-menu" style="right:0;left:auto;min-width:200px">
        <div class="dropdown-item" onclick="toast('Client details are not part of this prototype','info')">Open client</div>
        <div class="dropdown-divider"></div>
        <div class="dropdown-item danger" onclick="confirmRemove([${c.id}])">Remove client</div>
      </div></div></td></tr>`;
}
const byId = id => S.clients.find(c=>c.id===id);

/* ---------- setup = existing onboarding, per client ---------- */
const UNC = '<span class="text-secondary">[live copy not captured]</span>';
function startSetup(id){ const c=byId(id); if(c.state==='none'){ c.state='progress'; c.step=1; } go('#setup-'+id); }
function leaveSetup(){ go('#clients'); }
function setStep(id,n){ byId(id).step=n; renderSetup(); }
function renderSetup(){
  const id = +location.hash.split('-')[1]; const c = byId(id); const o = $('#onb');
  if(!c){ go('#clients'); return; }
  $('#onb-exit').innerHTML = `<a class="text-link" id="back-clients" href="#clients">Back to clients</a>`;
  const tabs = ['Provide Client details','Select integrations','Connect integrations'];
  const head = `<div class="onb-step">${esc(c.name)} · step ${c.step} of 3</div>
    <div class="tabs" role="tablist" style="margin-bottom:24px">${tabs.map((t,i)=>`<div class="tab ${c.step===i+1?'active':''}" role="tab" aria-selected="${c.step===i+1}" aria-disabled="${i+1>c.step}" style="${i+1>c.step?'color:var(--text-disabled);cursor:default':''}" ${i+1<c.step?`onclick="setStep(${id},${i+1})"`:''}>${t}</div>`).join('')}</div>`;
  if(c.step===1){
    o.innerHTML = head+`<h1 class="onb-title">Provide your Client’s basic info</h1>
      <div class="onb-panel">
        <div class="form-field mb-16"><label class="form-label form-label-required" for="sc-name">Client name</label><input class="input w-full" id="sc-name" value="${esc(c.name)}"><div class="form-error-msg" id="sc-err" hidden>Required</div></div>
        <div class="form-field mb-16"><label class="form-label" for="sc-web">What’s your business website?</label><input class="input w-full" id="sc-web"></div>
        <div class="d-flex gap-16 mb-16"><div class="form-field flex-1"><label class="form-label form-label-required" for="sc-tz">Time zone</label><select class="select w-full" id="sc-tz"><option>UTC</option></select></div>
        <div class="form-field flex-1"><label class="form-label form-label-required" for="sc-country">Country</label><select class="select w-full" id="sc-country"><option>United States</option></select></div></div>
        <div class="form-field mb-16"><label class="form-label form-label-required" for="sc-ind">Industry</label><select class="select w-full" id="sc-ind"><option>[live copy not captured]</option></select></div>
        <div class="form-field"><label class="form-label form-label-required" for="sc-age">How long has your Client been in business?</label><select class="select w-full" id="sc-age"><option>[live copy not captured]</option></select></div>
      </div>
      <div class="onb-actions"><button class="btn-outlined" onclick="leaveSetup()">Back</button><button class="btn" id="sc-next" onclick="step1Next(${id})">Next step</button></div>`;
  } else if(c.step===2){
    o.innerHTML = head+`<h1 class="onb-title">Select integrations</h1><p style="margin:-16px 0 16px">${UNC}</p>
      <div class="choice-grid">${PLATFORMS.map(pl=>`<button class="choice-card" aria-pressed="${c.platforms.includes(pl)}" onclick="togglePl(${id},'${pl}')"><span class="material-icons">storefront</span><span><span class="choice-card-title">${pl}</span></span></button>`).join('')}</div>
      <div class="onb-actions"><button class="btn-outlined" onclick="setStep(${id},1)">Back</button><span class="row-gap">${c.platforms.length?'':'<span class="text-secondary" id="pl-reason">Select at least one integration</span>'}<button class="btn" id="sc-next" ${c.platforms.length?'':'disabled'} onclick="setStep(${id},3)">Next step</button></span></div>`;
  } else {
    const items = [c.ledger||'QuickBooks Online', ...c.platforms];
    const done = items.every(x=>c.connected.includes(x));
    o.innerHTML = head+`<h1 class="onb-title">Connect integrations</h1><p style="margin:-16px 0 16px">${UNC}</p>
      <div class="onb-panel">${items.map((x,i)=>`<div class="integ-row"><span class="material-icons text-secondary">${i===0?'menu_book':'storefront'}</span><span class="grow">${esc(x)}${i===0?'<span class="cell-subtext">Books</span>':''}</span>${c.connected.includes(x)?'<span class="status status-green">Connected</span>':`<button class="btn-outlined btn-sm" data-p="${esc(x)}" onclick="connectIt(${id},'${esc(x)}',this)">Connect</button>`}</div>`).join('')}</div>
      <div class="onb-actions"><button class="btn-outlined" onclick="setStep(${id},2)">Back</button><span class="row-gap">${done?'':'<span class="text-secondary" id="fin-reason">Connect everything to finish</span>'}<button class="btn" id="sc-finish" ${done?'':'disabled'} onclick="finishSetup(${id})">Finish</button></span></div>`;
  }
}
function step1Next(id){
  const v=$('#sc-name').value.trim(); if(!v){ $('#sc-name').classList.add('error'); $('#sc-err').hidden=false; return; }
  byId(id).name=v; setStep(id,2);
}
function togglePl(id,pl){ const c=byId(id); c.platforms = c.platforms.includes(pl)?c.platforms.filter(x=>x!==pl):[...c.platforms,pl]; renderSetup(); }
async function connectIt(id,x,btn){
  btn.disabled=true; btn.innerHTML=spin+' Connecting…'; await wait(800);
  const c=byId(id); if(!c.connected.includes(x)) c.connected.push(x); if(!c.ledger && !PLATFORMS.includes(x)) c.ledger=x; renderSetup();
}
function finishSetup(id){
  const c=byId(id); c.state='done'; c.connected=c.connected.filter(x=>x===(c.ledger||'QuickBooks Online')||c.platforms.includes(x)); if(!c.ledger) c.ledger='QuickBooks Online';
  go('#clients'); toast(`${c.name} is connected`); firstConnected();
}
function firstConnected(){
  if(S.firstConnectedShown) return; S.firstConnectedShown = true;
  setTimeout(()=>toast('First client connected. From your next login, Synder opens on the Dashboard.'), 400);
}

/* ---------- imports ---------- */
function importLedger(kind){
  const name = kind==='qbo'?'QuickBooks Online Accountant':'Xero';
  modal(`<div class="synder-modal-header">Import from ${name}<button class="modal-close" aria-label="Close" onclick="closeModal()"><span class="material-icons">close</span></button></div>
    <div class="synder-modal-body" id="imp-body">Sign in with your ${kind==='qbo'?'QuickBooks Online Accountant':'Xero HQ'} login. Synder reads your client list. Nothing changes in your clients' books.</div>
    <div class="synder-modal-footer" id="imp-foot"><button class="btn-outlined" onclick="closeModal()">Cancel</button><button class="btn" id="imp-go" onclick="runImport('${kind}')">Sign in to ${kind==='qbo'?'QuickBooks':'Xero'}</button></div>`, 'modal-md');
}
async function runImport(kind){
  $('#imp-foot').innerHTML=''; $('#imp-body').innerHTML = `<div class="row-gap">${spin} Getting your client list from ${kind==='qbo'?'QuickBooks':'Xero'}…</div>`;
  await wait(1100);
  if($('#qbo-err').checked){
    $('#imp-body').innerHTML = `<div class="alert alert-error">${kind==='qbo'?'QuickBooks':'Xero'} didn't return a client list. Sign in with an accountant login, not a client's company login.</div>`;
    $('#imp-foot').innerHTML = `<button class="btn-outlined" onclick="closeModal()">Cancel</button><button class="btn" onclick="runImport('${kind}')">Try again</button>`;
    return;
  }
  const names = kind==='qbo'?QBO_NAMES:XERO_NAMES;
  const have = new Set(S.clients.map(c=>c.name));
  window._imp = { kind, names, sel:new Set(names.filter(n=>!have.has(n))) };
  const m = $('#ov .synder-modal'); m.className = 'synder-modal modal-lg';
  drawPicker();
}
function drawPicker(){
  const {kind, names, sel} = window._imp; const have = new Set(S.clients.map(c=>c.name));
  const avail = names.filter(n=>!have.has(n));
  $('#ov .synder-modal').innerHTML = `<div class="synder-modal-header">Select clients · ${names.length} found in ${kind==='qbo'?'QuickBooks':'Xero'}<button class="modal-close" aria-label="Close" onclick="closeModal()"><span class="material-icons">close</span></button></div>
    <div class="synder-modal-body"><div class="modal-scroll"><table class="synder-table" id="pick-table"><thead><tr><th class="col-check"><input class="checkbox" type="checkbox" aria-label="Select all" ${avail.length&&avail.every(n=>sel.has(n))?'checked':''} onchange="window._imp.sel=new Set(this.checked?${JSON.stringify(avail).replace(/"/g,'&quot;')}:[]);drawPicker()"></th><th>Client</th><th></th></tr></thead><tbody>
      ${names.map(n=>{const dup=have.has(n);return `<tr class="${dup?'row-disabled':''}"><td class="col-check"><input class="checkbox" type="checkbox" aria-label="Select ${esc(n)}" ${dup?'disabled':''} ${sel.has(n)?'checked':''} onchange="this.checked?window._imp.sel.add(this.dataset.n):window._imp.sel.delete(this.dataset.n);drawPicker()" data-n="${esc(n)}"></td><td><div class="name-cell" title="${esc(n)}">${esc(n)}</div></td><td>${dup?'<span class="text-secondary">Already in your firm</span>':''}</td></tr>`}).join('')}
    </tbody></table></div></div>
    <div class="synder-modal-footer" style="align-items:center">${sel.size?'':'<span class="text-secondary" id="pick-reason" style="margin-right:auto">Select at least one client</span>'}<button class="btn-outlined" onclick="closeModal()">Cancel</button><button class="btn" id="pick-add" ${sel.size?'':'disabled'} onclick="finishImport()">Add ${sel.size} client${sel.size===1?'':'s'}</button></div>`;
}
function finishImport(){
  const {kind, sel} = window._imp; [...sel].forEach(n=>S.clients.push(mk(n,kind)));
  closeModal(); S.tab='all'; S.page=1; go('#clients'); renderClients(); toast(`${sel.size} client${sel.size===1?'':'s'} added`);
}
const CSV_ROWS = [["Alpine Ski Rentals","QuickBooks Online"],["Beacon Hardware","Xero"],["","QuickBooks Online"],["Cobalt Pottery","QuickBooks Online"],["Daisy Chain Florist",""],["Echo Recording Studio","Xero"],["Falcon Courier","QuickBooks Online"],["Garnet Jewelry","Sage"],["Horizon Travel","QuickBooks Online"],["Ivy League Prep","Xero"],["Jasper Kitchenware","QuickBooks Online"],["Kite & Kayak","QuickBooks Online"],["Lumen Lighting",""],["Mosaic Tile Co.","QuickBooks Online"]];
function importCsv(){
  modal(`<div class="synder-modal-header">Upload a CSV file<button class="modal-close" aria-label="Close" onclick="closeModal()"><span class="material-icons">close</span></button></div>
    <div class="synder-modal-body" id="csv-body"><div class="dropzone"><p style="margin:0 0 12px">Columns: Client name (required), Books (QuickBooks Online or Xero), Contact email</p><button class="btn-outlined" id="csv-pick" onclick="parseCsv()">Choose file</button></div>
    <p style="margin:12px 0 0"><a class="text-link" href="#" onclick="toast('Template downloaded');return false">Download template</a></p></div>
    <div class="synder-modal-footer" id="csv-foot"><button class="btn-outlined" onclick="closeModal()">Cancel</button><button class="btn" disabled>Add clients</button></div>`, 'modal-lg');
}
async function parseCsv(){
  $('#csv-body').innerHTML = `<div class="row-gap">${spin} Reading clients.csv…</div>`; await wait(700);
  const have = new Set(S.clients.map(c=>c.name));
  const rows = CSV_ROWS.map((r,i)=>{ let err=''; if(!r[0]) err='Client name is empty'; else if(r[1]==='Sage') err='Books must be QuickBooks Online or Xero'; else if(have.has(r[0])) err='Already in your firm'; return {line:i+2,name:r[0],books:r[1],err}; });
  const ok = rows.filter(r=>!r.err);
  window._csv = ok;
  $('#csv-body').innerHTML = `<div class="row-gap" style="margin-bottom:12px"><b>clients.csv</b><span class="text-secondary">${ok.length} ready · ${rows.length-ok.length} skipped</span></div>
    <div class="modal-scroll"><table class="synder-table" id="csv-table"><thead><tr><th>Row</th><th>Client name</th><th>Books</th><th>Result</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${r.line}</td><td>${esc(r.name)||'—'}</td><td>${esc(r.books)||'Not set'}</td><td>${r.err?`<span class="text-error">${r.err}</span>`:'<span class="status status-green">Ready</span>'}</td></tr>`).join('')}
    </tbody></table></div>`;
  $('#csv-foot').innerHTML = `<button class="btn-outlined" onclick="importCsv()">Choose another file</button><button class="btn" id="csv-add" onclick="finishCsv()">Add ${ok.length} clients</button>`;
}
function finishCsv(){
  window._csv.forEach(r=>{ const c=mk(r.name,'csv'); c.ledger=r.books||null; S.clients.push(c); });
  closeModal(); S.tab='all'; go('#clients'); renderClients(); toast(`${window._csv.length} clients added`);
}
function addManual(){
  modal(`<div class="synder-modal-header">Add a client<button class="modal-close" aria-label="Close" onclick="closeModal()"><span class="material-icons">close</span></button></div>
    <div class="synder-modal-body">
      <div class="form-field mb-16"><label class="form-label form-label-required" for="m-name">Client name</label><input class="input w-full" id="m-name"><div class="form-error-msg" id="m-err" hidden></div></div>
      <div class="form-field mb-16"><label class="form-label" for="m-books">Books</label><select class="select w-full" id="m-books"><option value="QuickBooks Online">QuickBooks Online</option><option value="Xero">Xero</option><option value="">Not decided yet</option></select></div>
      <div class="form-field"><label class="form-label" for="m-mail">Contact email</label><input class="input w-full" id="m-mail" placeholder="owner@example.com"></div>
    </div>
    <div class="synder-modal-footer"><button class="btn-outlined" onclick="closeModal()">Cancel</button><button class="btn" id="m-add" onclick="doManual()">Add client</button></div>`, 'modal-md');
}
function doManual(){
  const n = $('#m-name').value.trim(); const e = $('#m-err');
  const err = !n ? 'Required' : S.clients.some(c=>c.name.toLowerCase()===n.toLowerCase()) ? 'This client is already in your firm' : '';
  if(err){ e.textContent=err; e.hidden=false; $('#m-name').classList.add('error'); return; }
  const c = mk(n,'manual'); c.ledger = $('#m-books').value || null; S.clients.push(c);
  closeModal(); S.tab='all'; go('#clients'); renderClients(); toast(`${n} added`);
}

/* ---------- remove ---------- */
function confirmRemove(ids){
  const one = ids.length===1 ? byId(ids[0]).name : null;
  modal(`<div class="synder-modal-header">Remove ${one?esc(one):ids.length+' clients'}?</div>
    <div class="synder-modal-body">${one?'The client':'They'} leave${one?'s':''} your firm's list. Connected books and integrations stay in Synder.</div>
    <div class="synder-modal-footer"><button class="btn-outlined" onclick="closeModal()">Cancel</button><button class="btn-error" id="rm-go" onclick="doRemove([${ids}])">Remove ${one?'client':ids.length+' clients'}</button></div>`, 'modal-confirm');
}
function doRemove(ids){ S.clients = S.clients.filter(c=>!ids.includes(c.id)); ids.forEach(id=>S.sel.delete(id)); closeModal(); renderClients(); toast(ids.length===1?'Client removed':`${ids.length} clients removed`); }

/* ---------- dashboard ---------- */
const ISSUE_TYPES = [['Connection lost','QuickBooks Online','Reconnect'],['12 failed syncs','Stripe','Review'],['3 products not mapped','Shopify','Map products'],['Payout doesn\'t match deposit','Square','Review']];
async function renderDashboard(){
  const p = $('#page'); const conn = S.clients.filter(isConn); const total = S.clients.length;
  if(!conn.length){
    p.innerHTML = `<div class="synder-page-header"><div class="synder-page-header-text"><h1 class="synder-page-title">Dashboard</h1></div></div>
      <div class="card"><div class="empty-state"><span class="material-icons empty-state-icon">insights</span><div class="empty-state-title">No connected clients yet</div><button class="btn" onclick="go('#clients')">Go to Clients</button></div></div>`;
    return;
  }
  p.innerHTML = `<div class="synder-page-header"><div class="synder-page-header-text"><h1 class="synder-page-title">Dashboard</h1></div></div><div class="grid4">${'<div class="card skeleton" style="height:96px"></div>'.repeat(4)}</div><div class="card skeleton" style="height:240px;margin-top:16px"></div>`;
  await wait(500); if(location.hash!=='#dashboard') return;
  const issues = conn.slice(0,4).map((c,i)=>({c,t:ISSUE_TYPES[i%4],since:['Nov 2, 2026','Nov 5, 2026','Nov 7, 2026','Nov 8, 2026'][i%4]})).slice(0, Math.max(1, conn.length-1));
  const setup = total - conn.length;
  const waiting = S.clients.filter(c=>c.state==='progress').length;
  p.innerHTML = `<div class="synder-page-header"><div class="synder-page-header-text"><h1 class="synder-page-title">Dashboard</h1></div></div>
    ${setup?`<div class="alert alert-info" id="dash-setup" style="margin-bottom:16px;align-items:center"><span class="material-icons">info</span><span style="flex:1">${setup} of ${total} clients aren't connected yet</span><button class="btn btn-sm" onclick="S.tab='none';S.page=1;go('#clients')">Set up clients</button></div>`:''}
    <div class="grid4">
      <div class="card stat-card"><div class="stat-value">${conn.length} / ${total}</div><div class="stat-label">Clients connected</div></div>
      <div class="card stat-card"><div class="stat-value">${issues.length}</div><div class="stat-label">Clients with issues</div></div>
      <div class="card stat-card"><div class="stat-value">${waiting}</div><div class="stat-label">Setup in progress</div></div>
      <div class="card stat-card"><div class="stat-value">${conn.length-issues.length}</div><div class="stat-label">Clients without issues</div></div>
    </div>
    <div class="synder-page-section"><h2 class="sec-title">Issues</h2>
    <div class="table-wrap"><table class="synder-table table--lg" id="issues"><thead><tr><th>Client</th><th>Issue</th><th>Where</th><th>Since</th><th class="col-actions"><span class="sr-only">Action</span></th></tr></thead><tbody>
      ${issues.map(x=>`<tr><td><div class="name-cell">${esc(x.c.name)}</div></td><td><span class="status ${x.t[0]==='Connection lost'?'status-red':'status-yellow'}">${x.t[0]}</span></td><td>${x.t[1]}</td><td>${x.since}</td><td class="col-actions"><button class="btn-outlined btn-sm" onclick="toast('Opens the client in Synder — not part of this prototype','info')">${x.t[2]}</button></td></tr>`).join('')}
    </tbody></table></div></div>`;
}

/* ---------- routing ---------- */
function go(h){ if(location.hash===h) route(); else location.hash = h; }
function route(){
  if(!location.hash) history.replaceState(null,'',location.pathname+location.search+'#onb-role');
  const h = location.hash;
  const setup = h.startsWith('#setup-'); const onb = h.startsWith('#onb') || setup;
  $('#s-onb').classList.toggle('on', onb); $('#s-app').classList.toggle('on', !onb);
  closeModal();
  if(setup) renderSetup(); else if(onb){ $('#onb-exit').innerHTML='<a class="text-link" href="#" onclick="return false">Log out</a>'; renderOnb(); } else renderApp();
}
window.addEventListener('hashchange', route);
function jumpTo(k){
  if(k==='start'){ S = fresh(); go('#onb-role'); }
  else if(k==='name'){ S.role='own'; go('#onb-name'); }
  else if(k==='empty'){ S.clients=[]; S.firstConnectedShown=false; S.tab='all'; go('#clients'); }
  else if(k==='imported'){ presetImported(); S.tab='all'; S.page=1; S.sel.clear(); go('#clients'); }
  else if(k==='dashboard'){ if(!connectedCount()) presetImported(); go('#dashboard'); }
}
function nextLogin(){
  if(location.hash.startsWith('#onb')){ toast('Create the firm first','info'); return; }
  go(connectedCount() ? '#dashboard' : '#clients');
  toast(connectedCount() ? 'Signed in · opened Dashboard (a client is connected)' : 'Signed in · opened Clients (no connected clients yet)', 'info');
}
const v = +new URLSearchParams(location.search).get('v'); if(v===2){ S.variant=2; document.querySelectorAll('.vs-opts button').forEach(b=>b.classList.toggle('on', b.id==='vs-2')); }
if(['#clients','#dashboard'].includes(location.hash) && location.search.includes('demo=imported')) presetImported();
route();
</script>
