<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sync details — three layouts</title>
<link rel="stylesheet" href="https://dashasyn.github.io/synder-prototypes/ui-kit/synder-ui-kit.css">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:var(--color-grey-5);font-family:var(--font-family);color:var(--color-grey)}

  /* ---------- switcher bar (prototype chrome, not part of the design) ---------- */
  .sw{background:#1E2430;color:var(--color-white);padding:var(--sp-12) var(--sp-24);
      display:flex;flex-wrap:wrap;gap:var(--sp-24);align-items:center}
  .sw-group{display:flex;align-items:center;gap:var(--sp-8)}
  .sw-label{font-size:var(--font-overline);line-height:var(--font-overline-line-height);
      font-weight:var(--font-overline-weight);letter-spacing:var(--font-overline-letter-spacing);
      text-transform:uppercase;opacity:.65}
  .sw button{font-family:inherit;font-size:var(--font-body2);line-height:1;padding:7px 12px;
      border-radius:var(--radius-pill);border:1px solid rgba(255,255,255,.28);
      background:transparent;color:var(--color-white);cursor:pointer}
  .sw button:hover{background:rgba(255,255,255,.12)}
  .sw button[aria-pressed="true"]{background:var(--color-white);color:#1E2430;border-color:var(--color-white);font-weight:500}
  .sw a{color:var(--color-white);opacity:.75;font-size:var(--font-body2);margin-left:auto}

  /* ---------- app shell (own namespace — never reuse the kit's sticky .sidebar/.topbar) ---------- */
  .shell{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 52px)}
  .nav{background:var(--color-white);border-right:1px solid var(--color-grey-20);padding:var(--sp-16) 0}
  .nav-brand{font-size:var(--font-subtitle1);font-weight:var(--font-subtitle1-bold-weight);
      padding:0 var(--sp-16) var(--sp-16);color:var(--color-primary)}
  .nav-row{padding:var(--sp-8) var(--sp-16);font-size:var(--font-body2-app);color:var(--color-grey-50)}
  .nav-row.on{background:var(--color-primary-5);color:var(--color-primary);font-weight:500;
      box-shadow:inset 3px 0 0 var(--color-primary)}
  .main{padding:var(--sp-24) var(--sp-32) 64px;max-width:1180px}

  /* ---------- page header (shared by all three layouts) ---------- */
  .crumbs{display:flex;align-items:center;gap:var(--sp-16);margin-bottom:var(--sp-16);flex-wrap:wrap}
  .crumbs a{color:var(--color-primary);font-size:var(--font-body2);text-decoration:none}
  .crumbs .spacer{margin-left:auto}
  .btn{font-family:inherit;font-size:var(--font-button);font-weight:var(--font-button-weight);
      letter-spacing:var(--font-button-letter-spacing);border-radius:var(--radius-md);
      padding:8px 16px;cursor:pointer;border:1px solid transparent}
  .btn-primary{background:var(--color-primary);color:var(--color-white)}
  .btn-outline{background:var(--color-white);color:var(--color-primary);border-color:var(--color-primary)}
  .btn-text{background:transparent;color:var(--color-primary);padding:8px 8px}
  .hd-title{font-size:var(--font-h2);line-height:var(--font-h2-line-height);
      font-weight:var(--font-h2-weight);letter-spacing:var(--font-h2-letter-spacing);margin:0}
  .hd-sub{font-size:var(--font-body1);color:var(--color-grey-50);margin:var(--sp-4) 0 0}
  .hd-status{display:flex;align-items:center;gap:var(--sp-12);margin-top:var(--sp-12);flex-wrap:wrap}

  .badge{display:inline-block;padding:2px 10px;border-radius:var(--radius-pill);
      font-size:var(--font-chip);line-height:var(--font-chip-line-height);
      font-weight:var(--font-chip-weight);letter-spacing:var(--font-chip-letter-spacing);
      background:var(--color-status-grey-bg);color:var(--color-grey)}
  .badge.green{background:var(--color-status-green-bg)}
  .badge.yellow{background:var(--color-status-yellow-bg)}
  .badge.red{background:var(--color-status-red-bg)}
  .badge.blue{background:var(--color-status-blue-bg)}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:var(--font-body2);color:var(--color-grey-50)}
  .live .dot{width:8px;height:8px;border-radius:var(--radius-full);background:var(--color-primary);
      animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}

  /* ---------- alert lifted out of the log ---------- */
  .alert{border-radius:var(--radius-md);padding:var(--sp-16) var(--sp-20);margin:var(--sp-20) 0;
      background:var(--color-status-yellow-bg);border:1px solid var(--color-yellow);
      display:flex;gap:var(--sp-16);align-items:flex-start}
  .alert .ico{font-size:18px;line-height:1.2}
  .alert h4{margin:0 0 var(--sp-4);font-size:var(--font-subtitle2);
      font-weight:var(--font-subtitle2-bold-weight);color:var(--color-grey)}
  .alert p{margin:0;font-size:var(--font-body2);line-height:var(--font-body2-line-height);color:var(--color-grey)}
  .alert .acts{margin-top:var(--sp-12);display:flex;gap:var(--sp-8);flex-wrap:wrap}

  /* ---------- section card ---------- */
  .card{background:var(--color-white);border:1px solid var(--color-grey-20);
      border-radius:var(--radius-md);margin:var(--sp-16) 0;overflow:hidden}
  .card-hd{display:flex;align-items:baseline;gap:var(--sp-12);padding:var(--sp-16) var(--sp-20);
      border-bottom:1px solid var(--color-grey-20);flex-wrap:wrap}
  .card-hd h3{margin:0;font-size:var(--font-overline);line-height:var(--font-overline-line-height);
      font-weight:var(--font-overline-weight);letter-spacing:var(--font-overline-letter-spacing);
      text-transform:uppercase;color:var(--color-grey-50)}
  .card-hd .tally{margin-left:auto;font-size:var(--font-body2);color:var(--color-grey-50)}

  /* ---------- log table (layout 1) ---------- */
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:var(--sp-12) var(--sp-20);font-size:var(--font-body2);
      line-height:var(--font-body2-line-height);border-bottom:1px solid var(--color-grey-20);vertical-align:top}
  th{font-weight:500;color:var(--color-grey-50);background:var(--color-grey-5)}
  tr:last-child td{border-bottom:none}
  tr.child td{background:var(--color-primary-5)}
  tr.child td:first-child{padding-left:var(--sp-40)}
  tr.warnrow td{background:var(--color-status-yellow-bg)}
  .otype{font-weight:500;color:var(--color-grey)}
  .oid{color:var(--color-primary);text-decoration:none}
  /* NOT line-through — a struck-out id on a row that says "still in your books"
     is the same self-contradiction this prototype exists to remove. */
  .oid.dead{color:var(--color-grey-50);border-bottom:1px dotted var(--color-grey-30);cursor:help}
  .rw{border-bottom:1px dotted var(--color-grey-30);cursor:help;white-space:nowrap}
  .tw{display:inline-block;width:14px;color:var(--color-grey-50)}

  /* ---------- object cards (layout 2) ---------- */
  .obj{border:1px solid var(--color-grey-20);border-radius:var(--radius-md);
      background:var(--color-white);padding:var(--sp-16) var(--sp-20);margin-bottom:var(--sp-12)}
  .obj.warn{background:var(--color-status-yellow-bg);border-color:var(--color-yellow)}
  .obj-hd{display:flex;align-items:baseline;gap:var(--sp-12);flex-wrap:wrap}
  .obj-hd .t{font-size:var(--font-subtitle2);font-weight:var(--font-subtitle2-bold-weight)}
  .obj-hd .id{margin-left:auto;font-size:var(--font-body2)}
  .obj-msg{margin:var(--sp-8) 0 0;font-size:var(--font-body2);
      line-height:var(--font-body2-line-height);color:var(--color-grey-50)}
  .facts{margin:var(--sp-12) 0 0;display:grid;grid-template-columns:170px 1fr;gap:var(--sp-4) var(--sp-16)}
  .facts dt{font-size:var(--font-body2);color:var(--color-grey-50)}
  .facts dd{margin:0;font-size:var(--font-body2);color:var(--color-grey)}

  /* ---------- two column (layout 3) ---------- */
  .cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:var(--sp-24);align-items:start}
  .rail{position:sticky;top:var(--sp-16)}
  @media (max-width:1080px){.cols{grid-template-columns:1fr}.rail{position:static}}

  /* ---------- disclosures ---------- */
  details.disc{background:var(--color-white);border:1px solid var(--color-grey-20);
      border-radius:var(--radius-md);margin:var(--sp-12) 0;padding:0}
  details.disc>summary{cursor:pointer;padding:var(--sp-12) var(--sp-20);
      font-size:var(--font-body1);font-weight:500;list-style:none}
  details.disc>summary::-webkit-details-marker{display:none}
  details.disc>summary::before{content:"›";display:inline-block;width:16px;color:var(--color-grey-50)}
  details.disc[open]>summary::before{content:"⌄"}
  details.disc .body{padding:0 var(--sp-20) var(--sp-16)}
  .kv{display:grid;grid-template-columns:190px 1fr;gap:var(--sp-6) var(--sp-16)}
  .kv dt{font-size:var(--font-body2);color:var(--color-grey-50)}
  .kv dd{margin:0;font-size:var(--font-body2);color:var(--color-grey)}
  .proc{display:grid;grid-template-columns:1fr auto auto;gap:var(--sp-4) var(--sp-12);
      font-size:var(--font-body2)}
  .proc .n{color:var(--color-grey)}
  .proc .d,.proc .p{color:var(--color-grey-50);text-align:right;font-variant-numeric:tabular-nums}
  .rail .card-hd{padding:var(--sp-12) var(--sp-16)}
  .rail .rbody{padding:var(--sp-12) var(--sp-16)}

  /* ---------- notes ---------- */
  .notes{max-width:1180px;padding:var(--sp-32) var(--sp-32) 64px;margin:0}
  .notes h2{font-size:var(--font-h6);font-weight:var(--font-h6-weight);margin:var(--sp-24) 0 var(--sp-8);
      padding-bottom:var(--sp-4);border-bottom:1px solid var(--color-grey-20)}
  .notes p,.notes li{font-size:var(--font-body2);line-height:var(--font-body2-line-height);color:var(--color-grey-50)}
  .notes strong{color:var(--color-grey)}
  .notes code{background:var(--color-grey-10);padding:1px 5px;border-radius:var(--radius-sm);
      font-family:ui-monospace,monospace;font-size:.9em}
</style>
</head>
<body>

<div class="sw">
  <div class="sw-group">
    <span class="sw-label">Layout</span>
    <button type="button" data-layout="1" aria-pressed="true">1 · Fix the frame</button>
    <button type="button" data-layout="2" aria-pressed="false">2 · Object cards</button>
    <button type="button" data-layout="3" aria-pressed="false">3 · Two columns</button>
  </div>
  <div class="sw-group">
    <span class="sw-label">Sync state</span>
    <button type="button" data-state="synced" aria-pressed="false">Synced</button>
    <button type="button" data-state="warnings" aria-pressed="false">Synced with warnings</button>
    <button type="button" data-state="deleted" aria-pressed="true">Deleted with warnings</button>
    <button type="button" data-state="rollback" aria-pressed="false">Rollback in progress</button>
  </div>
  <a href="https://dashasyn.github.io/synder-prototypes/reports/sync-details-rethink/">Research &amp; rationale ↗</a>
</div>

<div class="shell">
  <nav class="nav">
    <div class="nav-brand">Synder</div>
    <div class="nav-row">Dashboard</div>
    <div class="nav-row on">Platform transactions</div>
    <div class="nav-row">Reconciliation</div>
    <div class="nav-row">Reports</div>
    <div class="nav-row">Smart rules</div>
    <div class="nav-row">Settings</div>
  </nav>
  <main class="main" id="page"></main>
</div>

<div class="notes" id="notes"></div>

<script>
/* ============================================================================
   One sync, four states. The Deleted-with-warnings state is transcribed from
   Ignat's 2026-09-04 screenshot; the Synced state is the same sync before the
   rollback attempt. Synced-with-warnings is a different sync (Shopify refund,
   set-890 / 747262) because that is the only warning log observed.
   ==========================================================================*/

var QBO = 'QuickBooks Online';

/* per-object rows. rw = rewritten copy, prod = the string production shows */
function row(o){ return Object.assign({level:0, kind:'object', link:true, tone:'normal'}, o); }

var OBJECTS_SALE = [
  row({type:'Invoice',            info:'26EC8A01-0209',        msg:'Invoice was created.'}),
  row({type:'Product or Service', info:'EUR_lamp',             msg:'This product is part of your sale.', level:1}),
  row({type:'Account',            info:'Stripe sales',         msg:'Your sale was mapped to this income account.', level:1}),
  row({type:'Payment',            info:'4Z1E4pygkgelb19f9ZuKC', msg:'Payment was created.'}),
  row({type:'Expense',            info:'4Z1E4pygkgelb19f9ZuKC', msg:'Expense was created.'})
];

function withRollback(rows, map){
  return rows.map(function(r){
    var m = map[r.type];
    return Object.assign({}, r, {rb: m.rw, rbProd: m.prod, rbMsg: m.msg});
  });
}

/* The reason lives in the alert, once. Rows state the outcome only — repeating
   "the rollback was stopped before Synder could remove it" five times is the
   receipt-not-explanation problem in a new costume. */
var ROLLBACK_CANCELED = {
  'Invoice':            {rw:'Rollback canceled', prod:'Canceled', msg:'Still in your books.'},
  'Product or Service': {rw:'Nothing to remove',  prod:'Skipped',  msg:'Not created by this sync.'},
  'Account':            {rw:'Nothing to remove',  prod:'Skipped',  msg:'Not created by this sync.'},
  'Payment':            {rw:'Rollback canceled', prod:'Canceled', msg:'Still in your books.'},
  'Expense':            {rw:'Rollback canceled', prod:'Canceled', msg:'Still in your books.'}
};
var ROLLBACK_RUNNING = {
  'Invoice':            {rw:'Removing…',         prod:'In progress', msg:'Being removed.'},
  'Product or Service': {rw:'Nothing to remove',  prod:'Skipped',     msg:'Not created by this sync.'},
  'Account':            {rw:'Nothing to remove',  prod:'Skipped',     msg:'Not created by this sync.'},
  'Payment':            {rw:'Removing…',         prod:'In progress', msg:'Being removed.'},
  'Expense':            {rw:'Removing…',         prod:'In progress', msg:'Being removed.'}
};
var ROLLBACK_DONE = {
  'Invoice':            {rw:'Removed',           prod:'Deleted', msg:'No longer in your books.'},
  'Product or Service': {rw:'Nothing to remove',  prod:'Skipped', msg:'Not created by this sync.'},
  'Account':            {rw:'Nothing to remove',  prod:'Skipped', msg:'Not created by this sync.'},
  'Payment':            {rw:'Removed',           prod:'Deleted', msg:'No longer in your books.'},
  'Expense':            {rw:'Removed',           prod:'Deleted', msg:'No longer in your books.'}
};

var INFO_SALE = [
  ['Sync ID', '603447'],
  ['Stripe company', 'mzkt.by'],
  [QBO + ' company', 'Sandbox Company_US_1'],
  ['Sync start date', 'Aug 12, 2026, 14:02'],
  ['Sync date finished', 'Aug 12, 2026, 14:02'],
  ['Amount', '20.85 USD'],
  ['Transaction date', 'Aug 12, 2026'],
  ['Transaction ID', '26EC8A01-0209']
];

var PROCESSES = [
  ['Get Invoice details (Stripe)', '0.6s', '5%'],
  ['Get Charge details (Stripe)', '0.5s', '4%'],
  ['Get Invoice Payment (Stripe)', '0.4s', '3%'],
  ['Get Price (Stripe)', '0.3s', '3%'],
  ['Get Customer (Stripe)', '0.1s', '1%'],
  [QBO + ' query', '4.9s', '42%'],
  [QBO + ' posting', '4.8s', '42%'],
  ['Finalize', '0.0s', '0%']
];

var STATES = {
  synced: {
    label:'Synced',
    title:'Invoice payment · 20.85 USD',
    sub:'Stripe · mzkt.by → ' + QBO + ' · Sandbox Company_US_1',
    badge:{t:'Synced', tone:'green'},
    actions:[{l:'Rollback sync', k:'outline'}],
    rows: OBJECTS_SALE,
    info: INFO_SALE,
    hasRollbackCol:false,
    alerts:[],
    tally:'5 steps · nothing needs your attention',
    summary:'Recorded in your books as Invoice 26EC8A01-0209 for 20.85 USD, income to Stripe sales.'
  },

  warnings: {
    label:'Synced with warnings',
    title:'Refund · −103.29 USD',
    sub:'Shopify · set-890 → ' + QBO,
    badge:{t:'Synced with warnings', tone:'yellow'},
    countSuffix:' · 1 warning',
    actions:[{l:'Rollback sync', k:'outline'}],
    rows:[
      row({type:'Refund Receipt', info:'(not captured)', msg:'Refund receipt was created.', inferred:true}),
      row({type:'Adjust Inventory', info:'Linen Wrap Dress; CHV-LWD-001', link:false, tone:'warn',
           msg:"Inventory adjustment synchronization for the product 'Linen Wrap Dress' is skipped as this product is not tracked as an inventory one. Convert the product to inventory in your sales channel for successful synchronization."})
    ],
    info:[
      ['Sync ID','747262'],
      ['Shopify company','set-890 (2121)'],
      [QBO + ' company','(not captured)'],
      ['Sync start date','(not captured)'],
      ['Sync date finished','(not captured)'],
      ['Amount','−103.29 USD'],
      ['Transaction date','(not captured)'],
      ['Transaction ID','(not captured)']
    ],
    hasRollbackCol:false,
    alerts:[{
      icon:'⚠',
      title:'Inventory was not adjusted for Linen Wrap Dress',
      body:"The product isn't tracked as an inventory item in Shopify, so Synder could not adjust its stock. Everything else in this refund was recorded.",
      acts:[{l:'How to convert it to inventory ↗', k:'outline'}]
    }],
    tally:'2 steps · 1 warning',
    summary:'Recorded in your books as a refund receipt — but inventory was not adjusted for Linen Wrap Dress.'
  },

  deleted: {
    label:'Deleted with warnings',
    title:'Invoice payment · 20.85 USD',
    sub:'Stripe · mzkt.by → ' + QBO + ' · Sandbox Company_US_1',
    badge:{t:'Deleted with warnings', tone:'yellow'},
    countSuffix:' · 1 problem',
    actions:[{l:'Sync again', k:'outline'}],
    rows: withRollback(OBJECTS_SALE, ROLLBACK_CANCELED),
    info: INFO_SALE,
    hasRollbackCol:true,
    alerts:[{
      icon:'⚠',
      title:'Synder is disconnected from ' + QBO,
      body:'The rollback was stopped before Synder could finish it, so Invoice 26EC8A01-0209, the payment and the expense are still in your books. Reconnect ' + QBO + ', then run the rollback again.',
      raw:'Authorization fail: Synder is unable to get response from a ' + QBO + ' company as Synder has been disconnected from ' + QBO + ' by a user.',
      acts:[{l:'Reconnect ' + QBO, k:'primary'},{l:'Try rollback again', k:'outline'}]
    }],
    tally:'5 steps · 3 rollbacks canceled · 1 problem',
    summary:'Nothing was removed. The rollback stopped because Synder lost access to ' + QBO + '.',
    linksDead:true
  },

  rollback: {
    label:'Rollback in progress',
    title:'Invoice payment · 20.85 USD',
    sub:'Stripe · mzkt.by → ' + QBO + ' · Sandbox Company_US_1',
    badge:{t:'Rollback in progress', tone:'blue'},
    actions:[{l:'Cancel sync', k:'outline'}],
    rows: withRollback(OBJECTS_SALE, ROLLBACK_RUNNING),
    info: INFO_SALE.map(function(p){
      return (p[0]==='Sync start date'||p[0]==='Sync date finished') ? [p[0],'—'] : p;
    }),
    hasRollbackCol:true,
    alerts:[],
    live:'Updating automatically — no need to reload',
    tally:'5 steps · 3 being removed',
    summary:'Removing this transaction from your books.',
    resolvesTo:'rollbackDone'
  },

  rollbackDone: {
    label:'Deleted',
    title:'Invoice payment · 20.85 USD',
    sub:'Stripe · mzkt.by → ' + QBO + ' · Sandbox Company_US_1',
    badge:{t:'Deleted', tone:'grey'},
    actions:[{l:'Sync again', k:'outline'}],
    rows: withRollback(OBJECTS_SALE, ROLLBACK_DONE),
    info: INFO_SALE,
    hasRollbackCol:true,
    alerts:[],
    justUpdated:'Status updated just now',
    tally:'5 steps · 3 removed from your books',
    summary:'Invoice 26EC8A01-0209, the payment and the expense were removed from your books.'
  }
};

/* ------------------------------- helpers --------------------------------- */
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function objectCell(r, dead){
  if (!r.link) return '<span style="color:var(--color-grey-50)">—</span>';
  /* a placeholder is not a destination */
  if (/^\(/.test(r.info)) return '<span style="color:var(--color-grey-50)">' + esc(r.info) + '</span>';
  if (dead) return '<span class="oid dead" title="Synder is disconnected from ' + QBO +
    ' — this link cannot open right now">' + esc(r.info) + '</span>';
  return '<a class="oid" href="#" onclick="return false">' + esc(r.info) + ' ↗</a>';
}

function rbCell(r){
  if (!r.rb) return '';
  return '<span class="rw" title="Production copy: &quot;' + esc(r.rbProd) + '&quot;">' +
    esc(r.rb) + '</span>';
}

function actionsHtml(st){
  var out = '<a href="#" onclick="return false">← Transactions list</a>' +
            '<a href="#" onclick="return false">Syncs history</a><span class="spacer"></span>';
  st.actions.forEach(function(a){
    out += '<button type="button" class="btn btn-' + a.k + '">' + esc(a.l) + '</button>';
  });
  return out;
}

function headerHtml(st){
  var h = '<div class="crumbs">' + actionsHtml(st) + '</div>';
  h += '<h1 class="hd-title">' + esc(st.title) + '</h1>';
  h += '<p class="hd-sub">' + esc(st.sub) + '</p>';
  h += '<div class="hd-status"><span class="badge ' + st.badge.tone + '">' +
       esc(st.badge.t) + esc(st.countSuffix || '') + '</span>';
  if (st.live) h += '<span class="live" id="livepill"><span class="dot"></span>' + esc(st.live) + '</span>';
  if (st.justUpdated) h += '<span class="live" id="livepill">✓ ' + esc(st.justUpdated) + '</span>';
  h += '</div>';
  return h;
}

function alertsHtml(st){
  return st.alerts.map(function(a){
    var acts = a.acts.map(function(x){
      return '<button type="button" class="btn btn-' + x.k + '">' + esc(x.l) + '</button>';
    }).join('');
    var raw = a.raw ? '<p style="margin-top:var(--sp-8)"><span class="rw" title="Production copy: &quot;' +
      esc(a.raw) + '&quot;">what production says instead</span></p>' : '';
    return '<div class="alert"><span class="ico">' + a.icon + '</span><div><h4>' + esc(a.title) +
      '</h4><p>' + esc(a.body) + '</p>' + raw + '<div class="acts">' + acts + '</div></div></div>';
  }).join('');
}

function infoHtml(st){
  return '<dl class="kv">' + st.info.map(function(p){
    return '<dt>' + esc(p[0]) + '</dt><dd>' + esc(p[1]) + '</dd>';
  }).join('') + '</dl>';
}

function timeHtml(){
  return '<div class="proc">' + PROCESSES.map(function(p){
    return '<span class="n">' + esc(p[0]) + '</span><span class="d">' + esc(p[1]) +
           '</span><span class="p">' + esc(p[2]) + '</span>';
  }).join('') + '</div><p style="font-size:var(--font-caption);color:var(--color-grey-50);margin:var(--sp-12) 0 0">' +
  '8 processes · 11.6s total</p>';
}

function rulesHtml(){
  return '<p style="font-size:var(--font-body2);color:var(--color-grey-50);margin:0 0 var(--sp-12)">' +
    'No rules ran on this sync.</p><button type="button" class="btn btn-outline">Create a rule</button>';
}

function discsHtml(){
  return '<details class="disc"><summary>Sync info</summary><div class="body">' + infoHtml(CUR) +
         '</div></details>' +
         '<details class="disc"><summary>Sync time</summary><div class="body">' + timeHtml() +
         '</div></details>' +
         '<details class="disc"><summary>Rules that ran on this sync (0)</summary><div class="body">' +
         rulesHtml() + '</div></details>';
}

/* ------------------------------- layout 1 -------------------------------- */
function layout1(st){
  var cols = '<tr><th>Object type</th><th>Object</th>' +
    (st.hasRollbackCol ? '<th>Rollback status</th>' : '') + '<th>What happened</th></tr>';
  var body = st.rows.map(function(r){
    var cls = (r.level ? 'child ' : '') + (r.tone === 'warn' ? 'warnrow' : '');
    var tw = r.level ? '' : '<span class="tw">' + (st.rows.some(function(x){return x.level;}) &&
             r.type === 'Invoice' ? '⌄' : '') + '</span>';
    return '<tr class="' + cls.trim() + '"><td>' + tw + '<span class="otype">' + esc(r.type) +
      '</span></td><td>' + objectCell(r, st.linksDead) + '</td>' +
      (st.hasRollbackCol ? '<td>' + rbCell(r) + '</td>' : '') +
      '<td>' + esc(r.rbMsg || r.msg) + '</td></tr>';
  }).join('');

  return headerHtml(st) + alertsHtml(st) +
    '<div class="card"><div class="card-hd"><h3>What\'s in your books</h3>' +
    '<span class="tally">' + esc(st.tally) + '</span></div>' +
    '<table><thead>' + cols + '</thead><tbody>' + body + '</tbody></table></div>' +
    discsHtml();
}

/* ------------------------------- layout 2 -------------------------------- */
function layout2(st){
  var cards = '', open = null;
  st.rows.forEach(function(r){
    if (r.level === 0){
      if (open) cards += closeObj(open);
      open = {r:r, children:[]};
    } else if (open) {
      open.children.push(r);
    }
  });
  if (open) cards += closeObj(open);

  function closeObj(o){
    var r = o.r;
    var warn = r.tone === 'warn';
    var head = '<div class="obj-hd"><span class="t">' + esc(r.type) + '</span>' +
      (r.rb ? '<span class="badge ' + (r.rb === 'Removed' ? 'grey' : warn ? 'yellow' : 'blue') + '">' +
        rbCell(r) + '</span>' : '') +
      '<span class="id">' + objectCell(r, st.linksDead) + '</span></div>';
    var msg = '<p class="obj-msg">' + esc(r.rbMsg || r.msg) + '</p>';
    var facts = o.children.length ? '<dl class="facts">' + o.children.map(function(c){
      return '<dt>' + esc(c.type === 'Account' ? 'Income account' : c.type) + '</dt><dd>' +
        esc(c.info) + (c.rb ? ' <span class="badge">' + esc(c.rb) + '</span>' : '') + '</dd>';
    }).join('') + '</dl>' : '';
    /* Only when the warning was NOT already promoted into the alert — otherwise the
       same fix button renders twice on one screen. */
    var fix = (warn && !st.alerts.length) ? '<div class="acts" style="margin-top:var(--sp-12)">' +
      '<button type="button" class="btn btn-outline">How to convert it to inventory ↗</button></div>' : '';
    return '<div class="obj' + (warn ? ' warn' : '') + '">' + head + msg + facts + fix + '</div>';
  }

  return headerHtml(st) + alertsHtml(st) +
    '<div class="card-hd" style="padding-left:0;border:none"><h3>What\'s in your books</h3>' +
    '<span class="tally">' + esc(st.tally) + '</span></div>' + cards + discsHtml();
}

/* ------------------------------- layout 3 -------------------------------- */
function layout3(st){
  var list = st.rows.map(function(r){
    var warn = r.tone === 'warn';
    var pad = r.level ? 'padding-left:var(--sp-24);' : '';
    return '<div style="' + pad + 'padding-top:var(--sp-8);padding-bottom:var(--sp-8);' +
      'border-bottom:1px solid var(--color-grey-20);' +
      (warn ? 'background:var(--color-status-yellow-bg);' : '') + '">' +
      '<div style="display:flex;gap:var(--sp-12);align-items:baseline;flex-wrap:wrap">' +
      '<span class="otype">' + esc(r.level ? (r.type === 'Account' ? 'Income account' : r.type) : r.type) + '</span>' +
      '<span>' + objectCell(r, st.linksDead) + '</span>' +
      (r.rb ? '<span class="badge" style="margin-left:auto">' + rbCell(r) + '</span>' : '') +
      '</div><p class="obj-msg">' + esc(r.rbMsg || r.msg) + '</p></div>';
  }).join('');

  var rail =
    '<div class="card"><div class="card-hd"><h3>Sync info</h3></div>' +
      '<div class="rbody"><dl class="kv" style="grid-template-columns:1fr 1fr">' +
      st.info.map(function(p){ return '<dt>' + esc(p[0]) + '</dt><dd>' + esc(p[1]) + '</dd>'; }).join('') +
      '</dl></div></div>' +
    '<div class="card"><div class="card-hd"><h3>Sync time</h3></div>' +
      '<div class="rbody">' + timeHtml() + '</div></div>' +
    '<div class="card"><div class="card-hd"><h3>Rules</h3></div>' +
      '<div class="rbody">' + rulesHtml() + '</div></div>';

  return headerHtml(st) +
    '<div class="cols"><div>' + alertsHtml(st) +
      '<div class="card"><div class="card-hd"><h3>What\'s in your books</h3>' +
      '<span class="tally">' + esc(st.tally) + '</span></div>' +
      '<div style="padding:0 var(--sp-20)">' + list + '</div></div>' +
    '</div><aside class="rail">' + rail + '</aside></div>';
}

/* ------------------------------- driver ---------------------------------- */
var LAYOUTS = {'1':layout1, '2':layout2, '3':layout3};
var curLayout = '1', curState = 'deleted', CUR = STATES.deleted, timer = null;

function render(){
  CUR = STATES[curState];
  document.getElementById('page').innerHTML = LAYOUTS[curLayout](CUR);
  if (timer) { clearTimeout(timer); timer = null; }
  if (CUR.resolvesTo){
    timer = setTimeout(function(){
      curState = CUR.resolvesTo;
      render();
    }, 6000);
  }
}

document.querySelectorAll('[data-layout]').forEach(function(b){
  b.addEventListener('click', function(){
    curLayout = b.dataset.layout;
    document.querySelectorAll('[data-layout]').forEach(function(x){
      x.setAttribute('aria-pressed', String(x === b));
    });
    render();
  });
});
document.querySelectorAll('[data-state]').forEach(function(b){
  b.addEventListener('click', function(){
    curState = b.dataset.state;
    document.querySelectorAll('[data-state]').forEach(function(x){
      x.setAttribute('aria-pressed', String(x === b));
    });
    render();
  });
});

render();
